<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Learning Quest</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', cursive, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #E0F2FE 0%, #EDE9FE 50%, #FEF3C7 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    .bg-bubble {
      position: fixed;
      font-size: 2.2rem;
      pointer-events: none;
      z-index: 0;
      opacity: 0.3;
      animation: floatUp 15s infinite linear;
    }
    @keyframes floatUp {
      0% { transform: translateY(105vh) rotate(0deg); }
      100% { transform: translateY(-15vh) rotate(360deg); }
    }

    .view-container {
      position: relative;
      z-index: 10;
      max-width: 860px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    header { text-align: center; }
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: #0F172A;
      text-shadow: 0 2px 0 #FFF;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 1.2rem;
      font-weight: 600;
      color: #475569;
    }

    /* Screen 1: Names Grid */
    .names-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 28px;
      width: 100%;
      max-width: 720px;
    }

    .name-card {
      background: #FFFFFF;
      border-radius: 36px;
      padding: 36px 24px;
      border: 5px solid #E2E8F0;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .name-card:active { transform: translateY(3px) scale(0.98); }

    .card-humayun { border-color: #38BDF8; }
    .card-humayun:hover { border-color: #0284C7; }

    .card-zaina { border-color: #C084FC; }
    .card-zaina:hover { border-color: #9333EA; }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      border: 4px solid #FFF;
      box-shadow: 0 8px 18px rgba(0,0,0,0.1);
    }
    .card-humayun .avatar { background: #BAE6FD; }
    .card-zaina .avatar { background: #E9D5FF; }

    .name-title {
      font-size: 2.1rem;
      font-weight: 800;
      color: #0F172A;
    }
    .tap-tag {
      background: #F1F5F9;
      color: #475569;
      font-size: 1rem;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 999px;
    }

    /* Screen 2: Inside Student View */
    .inside-view {
      display: none;
      width: 100%;
      max-width: 650px;
      flex-direction: column;
      gap: 18px;
      position: relative;
      z-index: 10;
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .back-btn {
      background: #FFFFFF;
      border: 2px solid #CBD5E1;
      padding: 10px 20px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 800;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .back-btn:active { transform: translateY(2px); }

    .current-student-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0F172A;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lessons-deck {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .lesson-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-radius: 24px;
      text-decoration: none;
      color: #FFFFFF;
      font-weight: 800;
      font-size: 1.3rem;
      box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 10px 20px rgba(0,0,0,0.08);
      transition: transform 0.1s ease;
    }
    .lesson-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.18);
    }

    .btn-green  { background: linear-gradient(135deg, #10B981 0%, #059669 100%); }
    .btn-blue   { background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%); }
    .btn-purple { background: linear-gradient(135deg, #A855F7 0%, #7E22CE 100%); }
    .btn-amber  { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); }
    .btn-rose   { background: linear-gradient(135deg, #F43F5E 0%, #E11D48 100%); }

    .arrow-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .status-msg {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      color: #64748B;
      font-weight: 700;
      border: 2px dashed #CBD5E1;
    }
  </style>
</head>
<body>

  <div class="bg-bubble" style="left: 10%; animation-delay: 0s;">🚀</div>
  <div class="bg-bubble" style="left: 30%; animation-delay: 4s;">⭐</div>
  <div class="bg-bubble" style="left: 65%; animation-delay: 8s;">🌱</div>
  <div class="bg-bubble" style="left: 85%; animation-delay: 2s;">📚</div>

  <!-- SCREEN 1: CHOOSE NAME -->
  <div class="view-container" id="nameSelectView">
    <header>
      <h1>Who is learning today?</h1>
      <p class="subtitle">Tap your card to open your subjects:</p>
    </header>

    <div class="names-grid">
      <div class="name-card card-humayun" onclick="openStudentView('humayun')">
        <div class="avatar">👦</div>
        <div class="name-title">Humayun</div>
        <span class="tap-tag">Tap to Open ➔</span>
      </div>

      <div class="name-card card-zaina" onclick="openStudentView('zaina')">
        <div class="avatar">👧</div>
        <div class="name-title">Zaina</div>
        <span class="tap-tag">Tap to Open ➔</span>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: INSIDE STUDENT VIEW -->
  <div class="inside-view" id="studentView">
    <div class="top-nav">
      <button type="button" class="back-btn" onclick="showNameSelect()">⬅ Back</button>
      <div class="current-student-title" id="activeStudentLabel"><span>👦</span> Humayun</div>
      <div style="width: 80px;"></div>
    </div>

    <!-- Automatically Populated Deck -->
    <div class="lessons-deck" id="lessonsDeck">
      <div class="status-msg">Finding active lessons... 🔍</div>
    </div>
  </div>

  <script>
    const GITHUB_REPO = "nimrafarheen1995-ui/practice-app";
    let lessonsCache = null;

    // Subject styling palette & icons
    const SUBJECT_CONFIG = {
      science: { icon: "🌱", colorClass: "btn-green", label: "Science" },
      evs:     { icon: "🌍", colorClass: "btn-green", label: "EVS" },
      math:    { icon: "🔢", colorClass: "btn-amber", label: "Math" },
      english: { icon: "📖", colorClass: "btn-blue",  label: "English" },
      default: { icon: "📝", colorClass: "btn-purple",label: "Lesson" }
    };

    function parseFileName(fileName) {
      // Remove .html
      let base = fileName.replace(/\.html$/i, "");
      
      // Determine student prefix
      let student = "";
      if (base.toLowerCase().startsWith("humayun")) student = "humayun";
      else if (base.toLowerCase().startsWith("zaina")) student = "zaina";
      else return null;

      // Extract subject remainder
      let remainder = base.replace(new RegExp(`^${student}[-_]?`, "i"), "");
      if (!remainder) remainder = "english";

      let matchedConfig = SUBJECT_CONFIG.default;
      for (const key of Object.keys(SUBJECT_CONFIG)) {
        if (remainder.toLowerCase().includes(key)) {
          matchedConfig = SUBJECT_CONFIG[key];
          break;
        }
      }

      // Format label: e.g. "math-oct07" -> "Math Oct07"
      let formattedTitle = remainder.replace(/[-_]/g, " ").trim();
      formattedTitle = formattedTitle.charAt(0).toUpperCase() + formattedTitle.slice(1);

      return {
        student: student,
        fileName: fileName,
        title: `${matchedConfig.icon} ${formattedTitle}`,
        colorClass: matchedConfig.colorClass
      };
    }

    async function loadRepositoryFiles() {
      if (lessonsCache) return lessonsCache;

      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/`);
        if (!res.ok) throw new Error("API call limit or network error");
        const files = await res.json();
        
        lessonsCache = files
          .filter(f => f.name.endsWith(".html") && f.name !== "index.html")
          .map(f => parseFileName(f.name))
          .filter(Boolean);

        return lessonsCache;
      } catch (err) {
        // Fallback default list if GitHub API is offline
        return [
          { student: "humayun", fileName: "humayun.html", title: "📖 English Word Quest", colorClass: "btn-blue" },
          { student: "zaina", fileName: "zaina.html", title: "🏔️ English Trail", colorClass: "btn-purple" }
        ];
      }
    }

    async function openStudentView(name) {
      document.getElementById('nameSelectView').style.display = 'none';
      const studentView = document.getElementById('studentView');
      studentView.style.display = 'flex';

      const label = document.getElementById('activeStudentLabel');
      label.innerHTML = name === 'humayun' ? '<span>👦</span> Humayun' : '<span>👧</span> Zaina';

      const deck = document.getElementById('lessonsDeck');
      deck.innerHTML = '<div class="status-msg">Finding active lessons... 🔍</div>';

      const allFiles = await loadRepositoryFiles();
      const studentFiles = allFiles.filter(item => item.student === name);

      deck.innerHTML = "";

      if (studentFiles.length === 0) {
        deck.innerHTML = '<div class="status-msg">No lessons uploaded yet for today! ✨</div>';
        return;
      }

      studentFiles.forEach(item => {
        const btn = document.createElement("a");
        btn.href = item.fileName;
        btn.className = `lesson-btn ${item.colorClass}`;
        btn.innerHTML = `<span>${item.title}</span><div class="arrow-circle">➔</div>`;
        deck.appendChild(btn);
      });
    }

    function showNameSelect() {
      document.getElementById('studentView').style.display = 'none';
      document.getElementById('nameSelectView').style.display = 'flex';
    }

    // Pre-fetch files on background load
    loadRepositoryFiles();
  </script>
</body>
</html>
