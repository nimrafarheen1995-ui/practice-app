<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Zaina's Magical Maths Workbook: Chapter 5 Decimals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg-gradient: linear-gradient(135deg, #FDF2F8 0%, #EDE9FE 45%, #E0F2FE 100%);
  --twilight: #8B5CF6;
  --twilight-dark: #6D28D9;
  --pinkie: #EC4899;
  --pinkie-dark: #BE185D;
  --rainbow: #0EA5E9;
  --rainbow-dark: #0284C7;
  --flutter: #EAB308;
  --rarity: #9333EA;
  --text-dark: #1E1B4B;
  --text-soft: #475569;
  --chalkboard-bg: #1B4332;
  --chalkboard-frame: #854D0E;
  --math-blue: #BFDBFE;
  --math-red: #F87171;
  --shadow: 0 14px 34px rgba(139, 92, 246, 0.16);
  --font-main: 'Quicksand', -apple-system, sans-serif;
  --font-display: 'Fredoka', cursive, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  font-family: var(--font-main);
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-gradient);
  color: var(--text-dark);
}

body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  padding: 8px 12px;
}

/* SCREEN DIM / WARM EYE-COMFORT TINT OVERLAY */
#screenDimOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(30, 27, 75, 0.45);
  pointer-events: none;
  z-index: 99998;
}

/* PIXIE DUST CANVAS */
#particleCanvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 99999;
}

/* ASANA-STYLE SOARING CELEBRATION OVERLAY */
#celebrationOverlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 100000;
  display: none;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.flying-pony-hero {
  position: absolute;
  width: 260px;
  height: auto;
  filter: drop-shadow(0 16px 30px rgba(0,0,0,0.35));
  transform: translate(-150vw, 120vh) rotate(-12deg);
  will-change: transform;
}
.celebration-ribbon {
  background: linear-gradient(135deg, #EC4899, #8B5CF6);
  color: #FFF;
  font-family: var(--font-display);
  font-size: 2.1rem;
  font-weight: 800;
  padding: 14px 38px;
  border-radius: 999px;
  box-shadow: 0 16px 40px rgba(236, 72, 153, 0.45);
  border: 4px solid #FDF2F8;
  opacity: 0;
  transform: scale(0.6);
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  text-align: center;
}

.app-wrapper {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 1440px;
  margin: 0 auto;
  width: 100%;
  gap: 8px;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 48px;
  flex-shrink: 0;
  padding: 0 4px;
}
.brand-group {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-title {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--twilight-dark);
  display: flex;
  align-items: center;
  gap: 8px;
  text-shadow: 0 2px 4px rgba(255,255,255,0.9);
}
.badge-ch {
  background: #FDF2F8;
  color: var(--pinkie-dark);
  font-size: 0.78rem;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1.5px solid #FBCFE8;
}

.mode-pills-bar {
  display: flex;
  background: rgba(255, 255, 255, 0.95);
  padding: 3px;
  border-radius: 16px;
  border: 2px solid #DDD6FE;
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.1);
}
.mode-pill {
  border: none;
  background: transparent;
  padding: 6px 14px;
  font-size: 0.86rem;
  font-weight: 800;
  color: #64748B;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.mode-pill.active-study {
  background: var(--twilight);
  color: #FFF;
  box-shadow: 0 3px 0 var(--twilight-dark);
}
.mode-pill.active-write {
  background: var(--pinkie);
  color: #FFF;
  box-shadow: 0 3px 0 var(--pinkie-dark);
}
.mode-pill.active-parent {
  background: #0284C7;
  color: #FFF;
  box-shadow: 0 3px 0 #0369A1;
}

.header-tools {
  display: flex;
  align-items: center;
  gap: 8px;
}
.head-btn {
  background: #FFFFFF;
  border: 2px solid #CBD5E1;
  color: var(--text-dark);
  font-size: 0.84rem;
  font-weight: 800;
  padding: 6px 12px;
  border-radius: 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  box-shadow: 0 2px 0 #94A3B8;
  text-decoration: none;
}
.head-btn:active { transform: translateY(2px); box-shadow: none; }
.head-btn.rough-btn {
  background: #FEF3C7;
  border-color: #FCD34D;
  color: #92400E;
}

/* HORIZONTAL QUEST SELECTOR DECK (REPLACING VERTICAL SIDEBAR) */
.quest-nav-strip {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px;
  flex-shrink: 0;
  scrollbar-width: thin;
}
.quest-tab-btn {
  flex: 0 0 auto;
  background: #FFFFFF;
  border: 2px solid #E2E8F0;
  border-radius: 16px;
  padding: 6px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 3px 0 #CBD5E1;
}
.quest-tab-btn:hover {
  transform: translateY(-2px);
}
.quest-tab-btn.active {
  background: #EDE9FE;
  border-color: var(--twilight);
  box-shadow: 0 3px 0 var(--twilight-dark);
  transform: translateY(-2px) scale(1.02);
}
body.write-mode .quest-tab-btn.active {
  background: #FCE7F3;
  border-color: var(--pinkie);
  box-shadow: 0 3px 0 var(--pinkie-dark);
}
.quest-avatar-sm {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #DDD6FE;
  background: #FFF;
}
.quest-tab-title {
  font-weight: 800;
  font-size: 0.85rem;
  color: var(--text-dark);
}

/* MAIN STAGE (STORYBOOK WINDOW CARD) */
.stage-card-window {
  flex: 1;
  background: rgba(255, 255, 255, 0.96);
  border: 3.5px solid #DDD6FE;
  border-radius: 28px;
  padding: 14px 18px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  min-height: 0;
  position: relative;
  overflow: hidden;
  animation: cardSwooshIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes cardSwooshIn {
  0% { transform: scale(0.97) translateY(8px); opacity: 0; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}

.window-banner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px dashed #E2E8F0;
  padding-bottom: 8px;
  flex-shrink: 0;
}
.window-pony-header {
  display: flex;
  align-items: center;
  gap: 12px;
}
.window-hero-pony {
  width: 68px;
  height: 68px;
  object-fit: contain;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.14));
  flex-shrink: 0;
  animation: gentleFloat 3s ease-in-out infinite alternate;
}
@keyframes gentleFloat {
  0% { transform: translateY(0px) rotate(-1deg); }
  100% { transform: translateY(-5px) rotate(2deg); }
}
.window-heading {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--twilight-dark);
}
body.write-mode .window-heading { color: var(--pinkie-dark); }
body.parent-mode .window-heading { color: #0284C7; }
.window-sub {
  font-size: 0.84rem;
  font-weight: 700;
  color: var(--text-soft);
}

.exercise-scroll-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 10px;
  min-height: 0;
  overflow-y: auto;
}

.problem-card {
  background: #FFFFFF;
  border: 2px solid #E2E8F0;
  border-radius: 18px;
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}
.problem-q-text {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--text-dark);
  line-height: 1.45;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

/* INTERACTIVE TEACHER NOTEBOOK PEEK CARD (SPRING SLIDE MORPH) */
.peek-toggle-pill {
  background: #EDE9FE;
  border: 2px solid #C4B5FD;
  color: #6D28D9;
  font-size: 0.84rem;
  font-weight: 800;
  padding: 6px 14px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 0 #A78BFA;
  transition: all 0.15s;
}
.peek-toggle-pill:active { transform: translateY(1px); }
body.write-mode .peek-toggle-pill { display: none !important; }

.peek-notebook-card {
  display: none;
  background: #FFFBEB;
  border: 2.5px solid #FCD34D;
  border-radius: 18px;
  padding: 14px 18px;
  box-shadow: 0 8px 24px rgba(245, 158, 11, 0.14);
  margin: 6px 0;
  position: relative;
  overflow: hidden;
  animation: notebookMorph 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes notebookMorph {
  0% { transform: scale(0.95); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.peek-notebook-card.open { display: flex; flex-direction: column; gap: 8px; }
.peek-header-title {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 800;
  color: #92400E;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* INTERACTIVE PONY AUDIO CHEER BUBBLE (REPLACING TEACHER APPROVAL) */
.pony-cheer-corner {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 6px;
}
.pony-bubble-speech {
  background: #FFFFFF;
  border: 2px solid #38BDF8;
  color: #0369A1;
  font-size: 0.86rem;
  font-weight: 800;
  padding: 6px 14px;
  border-radius: 16px 16px 2px 16px;
  box-shadow: 0 4px 12px rgba(14, 165, 233, 0.15);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
  animation: pulseSpeech 2s infinite ease-in-out;
}
.pony-bubble-speech:active { transform: scale(0.95); }
@keyframes pulseSpeech {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
.corner-pony-avatar {
  width: 50px;
  height: 50px;
  object-fit: contain;
  cursor: pointer;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
  transition: transform 0.15s;
}
.corner-pony-avatar:active { transform: scale(1.15) rotate(5deg); }

/* VIRTUAL INPUT BLANK */
.pony-input-blank {
  min-width: 95px;
  height: 40px;
  background: #F1F5F9;
  border: 2px solid #CBD5E1;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 12px;
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--twilight-dark);
  cursor: pointer;
  transition: all 0.15s;
}
.pony-input-blank.active-focus {
  background: #FFFFFF;
  border-color: var(--pinkie);
  box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.25);
}
.pony-input-blank:empty::before {
  content: 'tap here';
  color: #94A3B8;
  font-size: 0.82rem;
  font-weight: 700;
}

/* SPIRAL NOTEBOOK CARD (EX 5.1 Q5) */
.spiral-book-container {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  background: #FFF;
  border: 3px solid #CBD5E1;
  border-radius: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}
.spiral-rings-track {
  height: 28px;
  background: #F1F5F9;
  border-bottom: 2px solid #E2E8F0;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 14px;
}
.spiral-ring {
  width: 14px;
  height: 22px;
  border-radius: 6px;
  background: #94A3B8;
  border: 2px solid #64748B;
  box-shadow: inset 0 2px 2px rgba(255,255,255,0.7);
}

/* WOODEN CHALKBOARD (EX 5.1 Q6) */
.chalkboard-container {
  background: var(--chalkboard-bg);
  border: 12px solid var(--chalkboard-frame);
  border-radius: 20px;
  box-shadow: inset 0 0 24px rgba(0,0,0,0.6), 0 8px 24px rgba(0,0,0,0.15);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  color: #FEF08A;
}
.chalkboard-title {
  font-family: var(--font-display);
  font-size: 1.25rem;
  color: #FFF;
  border-bottom: 2px dashed rgba(255,255,255,0.3);
  padding-bottom: 6px;
}

/* 25px BLUE MATH GRAPH CANVAS PAPER */
.math-graph-wrapper {
  position: relative;
  flex: 1;
  width: 100%;
  min-height: 280px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid #CBD5E1;
  background: #FFFFFF;
}
.graph-25-texture {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-color: #FFFFFF;
  background-image:
    linear-gradient(to right, var(--math-blue) 1px, transparent 1px),
    linear-gradient(to bottom, var(--math-blue) 1px, transparent 1px);
  background-size: 25px 25px;
  opacity: 0.75;
}
.graph-25-texture::after {
  content: '';
  position: absolute;
  top: 0;
  left: 45px;
  width: 2px;
  height: 100%;
  background: var(--math-red);
}
.graph-canvas {
  position: absolute;
  inset: 0;
  cursor: crosshair;
  touch-action: none;
  z-index: 2;
}

.canvas-tools-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 10px;
  background: #F8FAFC;
  border-bottom: 2px solid #E2E8F0;
  flex-shrink: 0;
}
.canvas-tool-btn {
  background: #FFF;
  border: 2px solid #CBD5E1;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 0.84rem;
  font-weight: 800;
  cursor: pointer;
}
.canvas-tool-btn.active {
  background: var(--twilight);
  color: #FFF;
  border-color: var(--twilight);
}

/* STRIP TABLE (EX 5.2 Q1) */
.strip-table {
  width: 100%;
  border-collapse: collapse;
}
.strip-table th {
  background: #F8FAFC;
  padding: 8px;
  font-size: 0.9rem;
  font-weight: 800;
  color: var(--text-soft);
  border: 1px solid #E2E8F0;
}
.strip-table td {
  padding: 8px;
  border: 1px solid #E2E8F0;
  vertical-align: middle;
  text-align: center;
}
.strip-bar-visual {
  display: inline-flex;
  border: 2px solid #334155;
  border-radius: 5px;
  overflow: hidden;
  height: 26px;
  width: 230px;
}
.strip-cell {
  flex: 1;
  border-right: 1px solid #94A3B8;
  background: #FFF;
}
.strip-cell:last-child { border-right: none; }
.strip-cell.shaded { background: #C084FC; }

/* PARENT REVIEW BAR */
.parent-review-strip {
  display: none;
  background: #F0F9FF;
  border: 2px solid #BAE6FD;
  padding: 8px 14px;
  border-radius: 12px;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  margin-top: 6px;
}
body.parent-mode .parent-review-strip { display: flex; }
.grade-btn {
  border: none;
  padding: 6px 14px;
  border-radius: 10px;
  font-weight: 800;
  font-size: 0.85rem;
  cursor: pointer;
}
.grade-btn.pass { background: #22C55E; color: #FFF; }
.grade-btn.retry { background: #F97316; color: #FFF; }

/* ON-SCREEN KEYPAD */
.pony-keypad-dock {
  background: rgba(255, 255, 255, 0.98);
  border: 2px solid #DDD6FE;
  border-radius: 16px;
  padding: 6px 10px;
  box-shadow: 0 4px 16px rgba(139, 92, 246, 0.12);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-shrink: 0;
}
.keypad-keys {
  display: flex;
  gap: 6px;
  flex: 1;
  overflow-x: auto;
}
.k-btn {
  flex: 1;
  min-width: 44px;
  height: 42px;
  background: #F8FAFC;
  border: 2px solid #CBD5E1;
  border-radius: 10px;
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--text-dark);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.1s;
}
.k-btn:active { transform: scale(0.94); background: #FEF08A; }
.k-btn.action-k { background: #FDF2F8; border-color: #FBCFE8; color: var(--pinkie-dark); }
.k-btn.submit-k { background: #DCFCE7; border-color: #86EFAC; color: #166534; min-width: 90px; }

/* DRAGGABLE ROUGH WORK PAD */
.floating-rough-pad {
  position: fixed;
  top: 70px;
  right: 20px;
  width: 320px;
  height: 380px;
  background: #FFFFFF;
  border: 3px solid #F59E0B;
  border-radius: 18px;
  box-shadow: 0 14px 40px rgba(0,0,0,0.25);
  display: none;
  flex-direction: column;
  z-index: 9999;
  overflow: hidden;
  resize: both;
}
.rough-header {
  height: 40px;
  background: #FEF3C7;
  border-bottom: 2px solid #FDE68A;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  cursor: move;
  flex-shrink: 0;
}
.rough-title { font-size: 0.9rem; font-weight: 800; color: #92400E; }
.rough-body { position: relative; flex: 1; width: 100%; height: 100%; overflow: hidden; background: #FFF; }

/* PIN MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100000;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: #FFF;
  border-radius: 20px;
  padding: 22px;
  width: 90%;
  max-width: 320px;
  text-align: center;
  box-shadow: 0 16px 36px rgba(0,0,0,0.25);
}
.pin-dots {
  font-size: 1.8rem;
  letter-spacing: 6px;
  background: #F1F5F9;
  padding: 10px;
  border-radius: 12px;
  margin: 14px 0;
  font-weight: 900;
}
.keypad-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.pin-key-btn {
  padding: 12px;
  font-size: 1.25rem;
  font-weight: 800;
  border-radius: 12px;
  border: 2px solid #E2E8F0;
  background: #F8FAFC;
  cursor: pointer;
}
</style>
</head>
<body>

<div id="screenDimOverlay"></div>
<canvas id="particleCanvas"></canvas>

<!-- ASANA-STYLE SOARING CELEBRATION OVERLAY -->
<div id="celebrationOverlay">
  <img src="rainbow.png" class="flying-pony-hero" id="flyingPonyImg" alt="Soaring Pony"/>
  <div class="celebration-ribbon" id="celebrationRibbon">🌟 Super Job, Zaina! 🌟</div>
</div>

<div class="app-wrapper">
  <header>
    <div class="brand-group">
      <a href="javascript:void(0)" onclick="goToHub()" class="head-btn">🏰 Hub</a>
      <div class="brand-title">
        ✨ Zaina's Magical Maths <span class="badge-ch">Grade 5 • Decimals</span>
      </div>
    </div>

    <div class="mode-pills-bar">
      <button class="mode-pill active-study" id="pillStudy" onclick="setAppMode('study')">
        🦄 Practice Mode
      </button>
      <button class="mode-pill" id="pillWrite" onclick="setAppMode('write')">
        ✏️ Write (Test) Mode
      </button>
      <button class="mode-pill" id="pillParent" onclick="openPinModal()">
        👑 Parent Review
      </button>
    </div>

/* WEB AUDIO ARPEGGIOS & CHIMES */
let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playPonyChime() {
  try {
    const ctx = getAudioContext();
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
      gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.08);
      osc.stop(ctx.currentTime + idx * 0.08 + 0.4);
    });
  } catch (e) {}
}

function playAsanaSwooshSound() {
  try {
    const ctx = getAudioContext();
    // Fast rising soaring chord arpeggio
    const harpNotes = [440, 554.37, 659.25, 880, 1108.73, 1318.51, 1760];
    harpNotes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.06);
      gain.gain.setValueAtTime(0.18, ctx.currentTime + i * 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.06);
      osc.stop(ctx.currentTime + i * 0.06 + 0.45);
    });
  } catch(e) {}
}

function playBubbleTap() {
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(380, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(700, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.09);
  } catch(e) {}
}

  u.rate = 1.02;
  window.speechSynthesis.speak(u);
}

/* PIXIE DUST CANVAS ENGINE */
const pCanvas = document.getElementById("particleCanvas");
const pCtx = pCanvas.getContext("2d");
let particles = [];

function resizeParticleCanvas() {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeParticleCanvas);
resizeParticleCanvas();

function triggerPixieDust(x, y) {
  const originX = x || window.innerWidth / 2;
  const originY = y || window.innerHeight / 2;
  const colors = ['#F472B6', '#C084FC', '#38BDF8', '#FDE047', '#4ADE80'];
  for (let i = 0; i < 55; i++) {
    particles.push({
      x: originX,
      y: originY,
      vx: (Math.random() - 0.5) * 16,
      vy: (Math.random() - 0.7) * 18,
      size: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1,
      rotation: Math.random() * 360,
      vRot: (Math.random() - 0.5) * 10
    });
  }
}

function updateParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.38;
    p.alpha -= 0.022;
    p.rotation += p.vRot;

    if (p.alpha <= 0) {
      particles.splice(i, 1);
      continue;
    }

    pCtx.save();
    pCtx.globalAlpha = p.alpha;
    pCtx.translate(p.x, p.y);
    pCtx.rotate((p.rotation * Math.PI) / 180);
    pCtx.fillStyle = p.color;

    pCtx.beginPath();
    pCtx.moveTo(0, -p.size);
    pCtx.quadraticCurveTo(0, 0, p.size, 0);
    pCtx.quadraticCurveTo(0, 0, 0, p.size);
    pCtx.quadraticCurveTo(0, 0, -p.size, 0);
    pCtx.quadraticCurveTo(0, 0, 0, -p.size);
    pCtx.fill();
    pCtx.restore();
  }
  requestAnimationFrame(updateParticles);
}
requestAnimationFrame(updateParticles);

}

function inputBlankHtml(id) {

  return `<span class="pony-input-blank ${activeFocusedInputId === id ? 'active-focus' : ''}" id="input_${id}" onclick="focusInput('${id}')">${savedVal}</span>`;
}

function focusInput(id) {
  playBubbleTap();
  activeFocusedInputId = id;
  document.querySelectorAll(".pony-input-blank").forEach(el => el.classList.remove("active-focus"));
  const target = document.getElementById(`input_${id}`);
  if (target) target.classList.add("active-focus");
}

function pressKey(char) {
  playBubbleTap();
  if (!activeFocusedInputId) return;
  const target = document.getElementById(`input_${activeFocusedInputId}`);
  if (!target) return;
  let curr = localStorage.getItem(storageKeyForId(activeFocusedInputId)) || "";

  if (char === 'CLEAR') {
    curr = "";
  } else if (char === 'BACK') {
    curr = curr.slice(0, -1);
  } else {
    curr += char;
  }
  localStorage.setItem(storageKeyForId(activeFocusedInputId), curr);
  target.textContent = curr;
}

/* SPIRAL CANVAS ENGINE (Q5) */
let q5Canvas = null, q5Ctx = null, q5IsDrawing = false, q5Tool = "pen", q5LineWidth = 4;
let q5LastX = 0, q5LastY = 0, q5ActivePointerId = null;

function q5StorageKey() {
  const ids = ["e51_q5_c", "e51_q5_d", "e51_q5_a", "e51_q5_b", "e51_q5_e"];
  const targetSlot = (appMode === "parent") ? "write" : appMode;
  return `v2_isolated_ink::zaina::maths_oct08::${targetSlot}::${ids[currentQ5SubIdx]}`;
}

function initQ5Canvas() {
  q5Canvas = document.getElementById("q5ActiveCanvas");
  if (!q5Canvas) return;
  q5Ctx = q5Canvas.getContext("2d");

  const r = q5Canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  q5Canvas.width = Math.floor(r.width * dpr);
  q5Canvas.height = Math.floor(r.height * dpr);
  q5Canvas.style.width = r.width + "px";
  q5Canvas.style.height = r.height + "px";
  q5Ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  q5Ctx.clearRect(0, 0, q5Canvas.width, q5Canvas.height);
  const saved = localStorage.getItem(q5StorageKey());
  if (saved) {
    const img = new Image();
    img.onload = () => {
      q5Ctx.save();
      q5Ctx.setTransform(1, 0, 0, 1, 0, 0);
      q5Ctx.drawImage(img, 0, 0, q5Canvas.width, q5Canvas.height);
      q5Ctx.restore();
    };
    img.src = saved;
  }

  q5Canvas.onpointerdown = (e) => {
    if (appMode === "parent") return;
    if (e.pointerType !== "pen" && e.pointerType !== "mouse") return;
    q5ActivePointerId = e.pointerId;
    q5IsDrawing = true;
    try { q5Canvas.setPointerCapture(e.pointerId); } catch(_) {}
    const rect = q5Canvas.getBoundingClientRect();
    q5LastX = e.clientX - rect.left;
    q5LastY = e.clientY - rect.top;
    e.preventDefault();
  };

  q5Canvas.onpointermove = (e) => {
    if (!q5IsDrawing || e.pointerId !== q5ActivePointerId || appMode === "parent") return;
    const rect = q5Canvas.getBoundingClientRect();
    const currX = e.clientX - rect.left;
    const currY = e.clientY - rect.top;
    q5Ctx.beginPath();
    q5Ctx.moveTo(q5LastX, q5LastY);
    q5Ctx.lineTo(currX, currY);
    q5Ctx.lineCap = "round";
    q5Ctx.lineJoin = "round";

    if (q5Tool === "eraser") {
      q5Ctx.globalCompositeOperation = "destination-out";
      q5Ctx.lineWidth = q5LineWidth * 6;
    } else {
      q5Ctx.globalCompositeOperation = "source-over";
      q5Ctx.strokeStyle = "#4C1D95";
      const pressure = (e.pressure && e.pressure > 0) ? e.pressure : 0.5;
      q5Ctx.lineWidth = q5LineWidth * (pressure * 1.5 + 0.35);
    }
    q5Ctx.stroke();
    q5LastX = currX;
    q5LastY = currY;
    e.preventDefault();
  };

  const stopQ5 = (e) => {
    if (q5IsDrawing && (e.pointerId === q5ActivePointerId || q5ActivePointerId === null)) {
      q5IsDrawing = false;
      q5ActivePointerId = null;
      try { q5Canvas.releasePointerCapture(e.pointerId); } catch(_) {}
      saveQ5Canvas();
    }
  };
  q5Canvas.onpointerup = stopQ5;
  q5Canvas.onpointercancel = stopQ5;
  q5Canvas.onpointerleave = stopQ5;
}

function saveQ5Canvas() {
  if (!q5Canvas || q5Canvas.width <= 0 || appMode === "parent") return;
  try {
    const data = q5Canvas.toDataURL("image/png");
    localStorage.setItem(q5StorageKey(), data);
  } catch(e) {}
}

function clearQ5Canvas() {
  if (!q5Canvas || !q5Ctx) return;
  q5Ctx.clearRect(0, 0, q5Canvas.width, q5Canvas.height);
  localStorage.removeItem(q5StorageKey());
}

function setQ5Tool(t) {
  q5Tool = t;
  document.getElementById("q5Pen").classList.toggle("active", t === "pen");
  document.getElementById("q5Eraser").classList.toggle("active", t === "eraser");
}

function setQ5Width(w) { q5LineWidth = w; }

let roughCanvas = null, roughCtx = null, roughIsDrawing = false, roughTool = "pen";

function roughStorageKey() {

  return `v2_isolated_ink::zaina::maths_oct08::${targetSlot}::rough_pad`;
}

function initRoughCanvas() {
  roughCanvas = document.getElementById("roughCanvas");
  if (!roughCanvas) return;
  roughCtx = roughCanvas.getContext("2d");

  const r = roughCanvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  roughCanvas.width = Math.floor(r.width * dpr);
  roughCanvas.height = Math.floor(r.height * dpr);

  roughCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  roughCtx.clearRect(0, 0, roughCanvas.width, roughCanvas.height);
  const saved = localStorage.getItem(roughStorageKey());
  if (saved) {
    const img = new Image();
    img.onload = () => {
      roughCtx.save();
      roughCtx.setTransform(1, 0, 0, 1, 0, 0);
      roughCtx.drawImage(img, 0, 0, roughCanvas.width, roughCanvas.height);
      roughCtx.restore();
    };
    img.src = saved;
  }

  let lastX = 0, lastY = 0;
  roughCanvas.onpointerdown = (e) => {
    roughIsDrawing = true;
    try { roughCanvas.setPointerCapture(e.pointerId); } catch(_) {}
    const rect = roughCanvas.getBoundingClientRect();
    lastX = e.clientX - rect.left;
    lastY = e.clientY - rect.top;
    e.preventDefault();
  };

  roughCanvas.onpointermove = (e) => {
    if (!roughIsDrawing) return;
    const rect = roughCanvas.getBoundingClientRect();
    const currX = e.clientX - rect.left;
    const currY = e.clientY - rect.top;
    roughCtx.beginPath();
    roughCtx.moveTo(lastX, lastY);
    roughCtx.lineTo(currX, currY);
    roughCtx.lineCap = "round";
    roughCtx.lineJoin = "round";

    if (roughTool === "eraser") {
      roughCtx.globalCompositeOperation = "destination-out";
      roughCtx.lineWidth = 22;
    } else {
      roughCtx.globalCompositeOperation = "source-over";
      roughCtx.strokeStyle = "#B45309";
      roughCtx.lineWidth = 3.6;
    }
    roughCtx.stroke();
    lastX = currX;
    lastY = currY;
    e.preventDefault();
  };

  const stopRough = (e) => {
    if (roughIsDrawing) {
      roughIsDrawing = false;
      try { roughCanvas.releasePointerCapture(e.pointerId); } catch(_) {}
      saveRoughCanvas();
    }

/* DRAGGABLE ROUGH PAD HANDLER */
const roughPadEl = document.getElementById("floatingRoughPad");
const roughHeaderEl = document.getElementById("roughHeader");
let isDraggingPad = false;
let padStartX = 0, padStartY = 0, padInitialLeft = 0, padInitialTop = 0;

roughHeaderEl.addEventListener("pointerdown", (e) => {
  if (e.target.tagName === 'BUTTON') return;
  isDraggingPad = true;
  padStartX = e.clientX;
  padStartY = e.clientY;
  const rect = roughPadEl.getBoundingClientRect();
  padInitialLeft = rect.left;
  padInitialTop = rect.top;
  roughHeaderEl.setPointerCapture(e.pointerId);
});

roughHeaderEl.addEventListener("pointermove", (e) => {
  if (!isDraggingPad) return;
  const dx = e.clientX - padStartX;
  const dy = e.clientY - padStartY;
  roughPadEl.style.left = (padInitialLeft + dx) + "px";
  roughPadEl.style.top = (padInitialTop + dy) + "px";
  roughPadEl.style.right = "auto";
});

roughHeaderEl.addEventListener("pointerup", (e) => {
  isDraggingPad = false;
  try { roughHeaderEl.releasePointerCapture(e.pointerId); } catch(_) {}
});

function openPinModal() {
  enteredPin = "";
  updatePinDots();
  document.getElementById("pinModal").classList.add("open");
}
function closePinModal() {
  document.getElementById("pinModal").classList.remove("open");
  enteredPin = "";
}
function pressPin(n) {
  playBubbleTap();
  if (enteredPin.length < 4) {
    enteredPin += n;
    updatePinDots();
    if (enteredPin.length === 4) {
      if (enteredPin === PARENT_PIN) {
        closePinModal();
        setAppMode('parent');
      } else {
        alert("Incorrect PIN");
        clearPin();
      }
    }
  }
}
function clearPin() {
  enteredPin = "";
  updatePinDots();
}
function updatePinDots() {
  let str = "";
  for (let i = 0; i < 4; i++) {
    str += (i < enteredPin.length) ? "● " : "- ";
  }
  document.getElementById("pinDots").textContent = str.trim();
}
