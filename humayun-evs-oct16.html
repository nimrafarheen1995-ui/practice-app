<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F855A">
<title>Humayun's Social Studies: Indian Villages</title>
<style>
:root{--card:#FFFDF6;--text:#3B2A1A;--sub:#7A6A58;--line:#E7D5B0;--pri:#2F855A;--pri-d:#22543D;--acc:#DD6B20;--paper:#FFFEF5;--hint:#FEEBC8;--hint-t:#7B341E;--ok:#C6F6D5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;color:var(--text);background:linear-gradient(160deg,#FFF4D6,#DDF3E4);display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));gap:8px;font-size:clamp(15px,1.25vw,18px);-webkit-user-select:none;user-select:none}
body.onmap{padding:0;gap:0}
button{font-family:inherit;cursor:pointer;color:inherit}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
/* buttons */
.btn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;font-weight:800;font-size:.95rem}
.btn.on{background:var(--pri);border-color:var(--pri-d);color:#fff}.btn:disabled{opacity:.4}
.ibtn{width:46px;height:42px;border:2px solid var(--line);background:var(--card);border-radius:12px;font-size:1.3rem;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ibtn.on{background:var(--pri);border-color:var(--pri-d)}
.btn:active,.ibtn:active{transform:scale(.95)}
.seg{display:flex;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 18px;font-size:1.3rem}.seg button.on{background:var(--pri);color:#fff}
.pips{display:flex;gap:2px;margin-top:2px}.pips i{width:5px;height:5px;border-radius:50%;background:#CBD5E0}.pips i.f{background:var(--acc)}
/* dock */
.dock{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:6px 10px;height:58px;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.brand{background:none;border:0;padding:0;margin:0 auto 0 6px;display:flex;align-items:center;gap:8px;color:var(--pri-d);font-weight:900;font-size:1.05rem;white-space:nowrap}
.bav{height:50px;width:auto;object-fit:contain}
.dock.collapsed{width:max-content;align-self:flex-start;padding:4px 8px}
.dock.collapsed>*:not(.brand){display:none!important}
.dock.collapsed .brand{margin:0}.dock.collapsed .brand b{display:none}
body.onmap .dock{position:absolute;z-index:20;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right))}
body.onmap .dock.collapsed{right:auto}
body.onmap .dock.collapsed .bav{display:none}
body.onmap .dock.collapsed .brand::before{content:"☰";font-size:1.6rem;padding:0 6px}
/* map */
.map{position:relative;flex:1;min-height:0;background:#a8d5a2 center/cover no-repeat;overflow:hidden}
.road{position:absolute;inset:0;width:100%;height:100%}
.road path{fill:none;stroke:#C98F4F;stroke-width:26;stroke-linecap:round;opacity:.85}
.road path.d{stroke:#FFF3D0;stroke-width:4;stroke-dasharray:3 16;opacity:1}
.head,.pin,.shelfbtn{-webkit-backdrop-filter:blur(8px) saturate(140%);backdrop-filter:blur(8px) saturate(140%)}
.head{position:absolute;top:max(8px,env(safe-area-inset-top));left:76px;right:16px;z-index:3;display:flex;align-items:center;gap:14px;background:rgba(255,253,246,.7);border-radius:20px;padding:8px 16px;border:2px solid var(--line);color:#3B2A1A}
.dock:not(.collapsed)~#app .head{top:calc(72px + env(safe-area-inset-top))}
.head>img{height:clamp(120px,24vh,200px);width:auto;object-fit:contain;margin:-6px 0 -60px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.head h2{margin:0;font-size:1.35rem;color:var(--pri-d)}.head p{margin:2px 0 0;font-size:.9rem;color:var(--sub);font-weight:700}
.bar{margin-left:auto;width:240px}.bar i{display:block;height:14px;border-radius:9px;background:#E2E8F0;overflow:hidden}
.bar i b{display:block;height:100%;background:linear-gradient(90deg,#48BB78,var(--acc));transition:width .5s}.bar span{font-weight:900;font-size:.85rem}
.bale{font-size:1.25rem;filter:grayscale(1);opacity:.35;transition:filter .4s,opacity .4s,transform .4s}.bale.on{filter:none;opacity:1;transform:scale(1.2)}
.bales{display:flex;gap:4px;flex-shrink:0}
.pin{position:absolute;z-index:2;width:clamp(150px,15vw,200px);transform:translate(-50%,-78%);display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,253,246,.74);border:3px solid #fff;border-radius:22px;padding:8px 8px 10px;box-shadow:0 8px 20px rgba(0,0,0,.2);color:#3B2A1A}
.pin:active{transform:translate(-50%,-78%) scale(.95)}
.pin img{height:clamp(56px,11vh,86px);width:auto;max-width:100%;object-fit:contain}
.pin .em{font-size:clamp(2.2rem,6vh,3.4rem);line-height:1.1}
.pin b{font-size:1rem;font-weight:900;color:var(--pri-d);text-align:center}.pin small{font-size:.78rem;font-weight:700;color:var(--sub);text-align:center}
.pin.done{border-color:#48BB78;background:rgba(240,255,244,.8)}
.pin.next{animation:nx 1.8s ease-in-out infinite}
@keyframes nx{50%{box-shadow:0 8px 20px rgba(0,0,0,.2),0 0 0 9px rgba(221,107,32,.35)}}
.sc{font-weight:900;font-size:.8rem;color:#92400E;background:#FEF3C7;border-radius:10px;padding:0 8px}
.stamp{position:absolute;top:-10px;right:-8px;background:#48BB78;color:#fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-weight:900;border:3px solid #fff}
.map .tractor{position:absolute;left:0;top:0;z-index:1;width:clamp(90px,10vw,130px);height:auto;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sky span{position:absolute;left:-15%;white-space:nowrap;opacity:.9}
.sky .c1{top:14%;font-size:4.5rem;animation:drift 70s linear infinite}
.sky .c2{top:30%;font-size:3rem;animation:drift 95s linear -40s infinite}
.sky .c3{top:8%;font-size:3.6rem;animation:drift 120s linear -80s infinite}
.sky .b{top:20%;font-size:1.6rem;animation:drift 38s linear -10s infinite,bob 1.6s ease-in-out infinite}
@keyframes drift{to{transform:translateX(130vw)}}@keyframes bob{50%{translate:0 -14px}}
.shelfbtn{position:absolute;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:4;border:2px solid #fff;border-radius:20px;padding:8px 16px;font-weight:900;background:rgba(255,253,246,.8);color:#3B2A1A;box-shadow:0 6px 14px rgba(0,0,0,.2)}
/* stop page */
.stopbar{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-bottom:6px}
.stopbar h2{margin:0;font-size:1.25rem;color:var(--pri-d)}.sh{display:flex;align-items:center;gap:10px}
.sbimg{height:clamp(46px,9vh,72px);width:auto;object-fit:contain}
.stopbar .sub{color:var(--sub);font-weight:800;font-size:.9rem}.sp{margin-left:auto}
.bwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.stopbody{flex:1;min-height:0;overflow-y:auto;background:var(--wm) center/cover no-repeat,var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.stopbody.withclose{padding-top:60px}
.stopfoot{display:flex;justify-content:center;padding-top:8px;flex-shrink:0}
.check{width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:var(--pri);box-shadow:0 6px 16px rgba(0,0,0,.28);display:grid;place-items:center;padding:0}.check:active{transform:scale(.93)}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:16px;border:2px dashed var(--line);flex-wrap:wrap}
.num{font-weight:900;color:var(--acc);min-width:26px;font-size:1.15rem}
.sent,.q{flex:1;min-width:0;line-height:2.5;font-size:1.2rem;font-weight:700}
.opts{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px 22px;padding-left:36px;font-weight:700}
.opt{padding:2px 10px;border-radius:10px}.opt i{font-style:normal;font-weight:900;color:var(--acc)}.opt.correct{background:var(--ok)}
.ansrow{flex-basis:100%;display:flex;align-items:center;gap:8px;padding-left:36px;flex-wrap:wrap}.ansrow label{font-weight:800;color:var(--sub);font-size:.9rem}
.bl{display:inline-block;width:70px;border-bottom:3px solid var(--sub);margin:0 4px}
.hint{display:inline-block;background:var(--hint);color:var(--hint-t);border-radius:10px;padding:0 10px;font-weight:900;font-size:1.05rem;line-height:1.6;margin:0 4px;vertical-align:middle}
.answer{flex-basis:100%;background:var(--hint);color:var(--hint-t);border:2px dashed var(--acc);border-radius:14px;padding:8px 14px;font-weight:800;font-size:1.15rem;line-height:1.9}.answer ul{margin:4px 0 0;padding-left:22px}
.quote{font-size:1.35rem;font-weight:900;font-style:italic;color:var(--pri-d);background:var(--ok);border-radius:16px;padding:10px 16px;text-align:center}
/* self-check */
.chk{flex-basis:100%;padding-left:36px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ck{width:46px;height:42px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:1.3rem;font-weight:900;padding:0}
.ck.on{background:#48BB78;border-color:var(--pri-d);color:#fff}.ck.x.on{background:#E53E3E;border-color:#9B2C2C}
/* writing boxes + pad */
.ib{display:inline-flex;height:58px;border:2px solid #C9B58A;border-radius:12px;background:var(--paper);overflow:hidden;vertical-align:middle;margin:0 6px;max-width:100%}
.cv{position:relative;flex:1;min-width:0;background-image:linear-gradient(transparent 54%,#B8C4D0 55%,transparent 57%),linear-gradient(90deg,transparent 10px,#F87171 10px,#F87171 12px,transparent 12px)}
.cv canvas,.pad canvas{position:absolute;inset:0;touch-action:none;display:block}
.tools{display:flex;flex-direction:column;width:34px;border-left:2px solid #E3D6B8}
.tools button{flex:1;border:0;background:#F6EFDB;font-size:.95rem;padding:0;color:#3B2A1A}.tools button+button{border-top:1px solid #E3D6B8}
.pad{position:relative;height:clamp(210px,44vh,430px);flex-basis:100%;border:2px solid #C9B58A;border-radius:14px;overflow:hidden;background-color:var(--paper);background-image:linear-gradient(90deg,transparent 54px,#F87171 54px,#F87171 56px,transparent 56px,transparent 60px,#F87171 60px,#F87171 61px,transparent 61px),repeating-linear-gradient(transparent 0 38px,#93C5FD 38px 40px),var(--wm);background-size:auto,auto,cover;background-repeat:no-repeat,repeat,no-repeat}
.ptoggle{position:absolute;top:8px;right:8px;z-index:3;width:44px;height:44px;border-radius:50%;border:2px solid #E3D6B8;background:rgba(255,254,245,.92);font-size:1.25rem;padding:0;color:#3B2A1A;box-shadow:0 3px 8px rgba(0,0,0,.18)}
body.tools-on .ptoggle{background:var(--pri);border-color:var(--pri-d);color:#fff}
.ptools{position:absolute;top:8px;right:60px;max-width:calc(100% - 76px);z-index:2;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 8px;align-items:center;background:rgba(255,254,245,.92);border:2px solid #E3D6B8;border-radius:16px;padding:4px 6px;color:#3B2A1A}
body:not(.tools-on) .ptools{display:none}
.ptools .tg{display:flex;gap:4px;align-items:center}.ptools .tg+.tg{border-left:2px solid #E3D6B8;padding-left:8px}
.ptools button{width:38px;height:38px;border-radius:50%;border:2px solid #E3D6B8;background:#fff;font-size:1.1rem;padding:0;color:#3B2A1A}
.ptools button.on{background:var(--pri);border-color:var(--pri-d)}.ptools button:disabled{opacity:.35}
.ptools .sz i{display:block;width:20px;border-radius:4px;background:#1E293B}.ptools .sz.on{background:var(--hint);border-color:var(--acc)}
.ptools .sw{border:3px solid #fff;box-shadow:0 0 0 2px #CBD5E0}.ptools .sw.on{box-shadow:0 0 0 3px var(--acc)}
.ptools .pg b{font-size:.8rem;white-space:nowrap}
/* word chips */
.w{border-radius:6px;cursor:pointer}.w.sp2{background:#FEF08A;color:#3B2A1A}
.chip{background:#FEF3C7;border:1.5px solid #F59E0B;border-radius:10px;padding:0 6px;margin:0 1px;display:inline-block;-webkit-touch-callout:none;touch-action:manipulation}
.chip.split{background:transparent;border-color:transparent;padding:0}
.sb{display:inline-block;background:#DCFCE7;border:2px solid #34D399;border-radius:9px;padding:0 8px;font-weight:900;color:#065F46;transition:transform .15s,background .15s}
.sb.hl{background:#FDE68A;border-color:#F59E0B;transform:scale(1.12)}.dot{color:var(--acc);font-weight:900;margin:0 3px}
/* notebook cover */
.binder-cover{position:absolute;inset:0;z-index:5;border-radius:8px 24px 24px 8px;cursor:pointer;transform-origin:0 50%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.18,.89,.32,1.28),opacity .45s;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.05) 55%,rgba(255,255,255,.16));-webkit-backdrop-filter:blur(1.5px) saturate(120%);backdrop-filter:blur(1.5px) saturate(120%);border:1.5px solid rgba(255,255,255,.8);box-shadow:0 14px 34px rgba(0,0,0,.16),inset 0 0 40px rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-left:44px;color:#1E293B;overflow:hidden}
.binder-cover.binder-open{transform:perspective(1400px) rotateY(-118deg) rotateX(8deg) translateZ(20px);opacity:0;pointer-events:none}
.binder-cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:38px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 7px),linear-gradient(90deg,#0f172a,#1f2937 55%,#374151 85%,#111827);box-shadow:inset -6px 0 10px rgba(0,0,0,.55),inset 3px 0 6px rgba(255,255,255,.08)}
.binder-cover::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 45%,rgba(255,255,255,.04) 52%,transparent 65%)}
.rings{position:absolute;left:-5px;top:6%;bottom:6%;width:38px;z-index:6;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.ring{display:block;width:38px;height:8px;border-radius:5px;background:linear-gradient(180deg,#fff,#6b7280 50%,#1f2937);box-shadow:0 2px 3px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.7)}
.cb-label{position:relative;width:min(520px,78%);padding:12px 18px 14px 62px;border-radius:10px;border:3px solid #E5E7EB;color:#1E3A8A;background:#FFFDF0 repeating-linear-gradient(transparent 0 33px,#93C5FD 33px 34px);box-shadow:0 8px 20px rgba(0,0,0,.35);font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive}
.cb-label::before{content:"";position:absolute;left:44px;top:0;bottom:0;width:6px;border-left:2px solid #EF4444;border-right:2px solid #EF4444}
.cb-head{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.2rem;line-height:34px;color:#7F1D1D}.cb-head img{height:clamp(40px,8vh,64px);width:auto;object-fit:contain}
.cb-row{display:flex;gap:8px;align-items:baseline;line-height:34px;font-size:1.1rem}.cb-row span{font-size:.85rem;color:#475569;font-weight:700}.cb-row b{font-weight:800;color:#1E3A8A}
.cb-hint{font-weight:900;font-size:1.05rem;background:rgba(255,255,255,.6);padding:8px 20px;border-radius:14px;z-index:1}
.close-binder{position:absolute;top:10px;right:16px;z-index:4;display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #F59E0B;border-radius:20px;padding:6px 14px;font-weight:900;font-size:.95rem;color:#7B341E;box-shadow:0 4px 10px rgba(0,0,0,.15)}
/* overlays */
#toast,#win,#shelf{position:fixed}
#toast{z-index:99;bottom:16px;left:50%;transform:translateX(-50%);background:var(--pri-d);color:#fff;padding:8px 16px;border-radius:12px;font-weight:800;display:none;max-width:90vw;text-align:center}
#win,#shelf{inset:0;display:none;place-items:center}
#win{z-index:99;background:rgba(0,0,0,.55)}#shelf{z-index:98;background:rgba(0,0,0,.5)}
#win>div{background:var(--card);border-radius:28px;padding:26px 40px;text-align:center;max-width:520px;border:4px solid var(--acc)}
#win img{height:auto;width:min(440px,70vw);max-height:44vh;object-fit:contain}#win h2,#shelf h2{color:var(--pri-d);margin:6px 0}
#shelf>div{background:var(--card);border:4px solid var(--acc);border-radius:26px;padding:16px 22px;width:min(880px,94vw);text-align:center}
.shelf-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stk{width:clamp(110px,15vw,150px);padding:8px;border-radius:18px;background:linear-gradient(#fff,#FEF3C7);border:3px dashed #F59E0B;color:#3B2A1A;font-weight:900;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:4px}
.stk img{height:clamp(80px,16vh,130px);width:auto;max-width:100%;object-fit:contain}
.stk.lock{border-color:#CBD5E0;background:#F1F5F9}.stk.lock img{filter:brightness(0);opacity:.18}
.stk.new{animation:pop .7s ease-out}@keyframes pop{0%{transform:scale(.3) rotate(-12deg)}70%{transform:scale(1.15) rotate(4deg)}100%{transform:scale(1)}}
.burst{position:fixed;top:40%;left:50%;font-size:clamp(1.6rem,3vw,2.4rem);pointer-events:none;z-index:9995;animation:burstUp 2.2s ease-out forwards}
@keyframes burstUp{0%{transform:translate(-50%,0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),-35vh) scale(1.15) rotate(200deg);opacity:0}}
#dimLayer{position:fixed;inset:0;background:#000;pointer-events:none;z-index:9990;opacity:0;transition:opacity .25s}
@media (prefers-reduced-motion:reduce){.sky{display:none}.pin.next,.burst,.stk.new{animation:none}}
@media (orientation:portrait){body::after{content:"Please rotate your tablet to landscape";position:fixed;inset:0;background:var(--pri-d);color:#fff;display:grid;place-items:center;font-size:1.6rem;font-weight:900;z-index:999}}
</style>
</head>
<body>
<div class="dock">
  <button class="ibtn" onclick="goHub()" title="All subjects" aria-label="Hub">🏠</button>
  <button class="ibtn" onclick="goMap()" title="Journey map" aria-label="Map">🗺️</button>
  <button class="brand" id="brand" onclick="toggleDock()" title="Show or hide the header" aria-label="Show or hide the header"></button>
  <div class="seg"><button id="mPractice" onclick="setMode('practice')" title="Practice: hints shown" aria-label="Practice">📘</button><button id="mWrite" onclick="setMode('write')" title="Write: hints hidden, check your own answers" aria-label="Write">✍️</button></div>
  <button class="ibtn" id="bPen" onclick="togglePen()" aria-label="Pen only"></button>
  <button class="ibtn" id="bDim" onclick="cycleDim()" title="Dim the screen" aria-label="Dim"></button>
  <button class="ibtn" id="bSnd" onclick="toggleSound()" title="Village sounds" aria-label="Sound"></button>
</div>
<div id="app"></div>
<div id="toast"></div>
<div id="shelf" onclick="if(event.target===this)this.style.display='none'"></div>
<div id="win"><div><img id="winImg" alt=""><h2>Journey complete!</h2><p style="font-weight:800">You visited every stop in Indian Villages. Well done, Humayun!</p><button class="btn on" onclick="$('win').style.display='none'">Keep exploring</button></div></div>

<script>
/* ====== CONFIG ====== */
const ASSET_BASE='assets/';
const HUB_URL='index.html';
const HUB_ORIGIN=''; /* e.g. 'https://yourname.github.io'. Leave empty to use the page that embedded this lesson. */
document.documentElement.style.setProperty('--wm',`url(${ASSET_BASE}notebook-watermark.webp)`);
const IMG={guide:'humayun-avatar.webp',bg:'village-celebration_1.webp',fib:'stop-time-travel.webp',mcq:'stop-village-square.webp',tf:'stop-panchayat-hall.webp',qa:'stop-story-hut.webp',think:'stop-think-tree.webp',win:'village-celebration.webp'};
const STK={fib:['troll.webp','Cave Troll'],mcq:['humayun-avatar.webp','Explorer Humayun'],tf:['knight.webp','Brave Knight'],qa:['stop-story-hut.webp','Story Keeper'],think:['ulagam-globe.webp','World Globe']};

/* ====== DATA ====== */
const STOPS=[
 {id:'fib',em:'🏕️',t:'Time Travel Trail',s:'A. Fill in the blanks',x:9,y:72,shuffle:1},
 {id:'mcq',em:'🏡',t:'Village Square',s:'B. Choose the correct answer',x:29,y:44,shuffle:1},
 {id:'tf',em:'🏛️',t:'Panchayat Hall',s:"C. Write 'T' or 'F'",x:50,y:76,shuffle:1},
 {id:'qa',em:'📖',t:'Story Hut',s:'Textbook questions',x:71,y:44,shuffle:0,pages:2},
 {id:'think',em:'🌳',t:'Think Tree',s:'Think and answer',x:90,y:74,shuffle:0}];

let actx=null,noiseBuf=null,fxOn=true,amb=null,birdT=0;
function audio(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}const n=actx.sampleRate*2;noiseBuf=actx.createBuffer(1,n,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}if(actx.state==='suspended')actx.resume();return actx}
function toggleSound(){sndOn=!sndOn;store.set(S+'snd',sndOn?'1':'0');$('bSnd').textContent=sndOn?'🔊':'🔇';syncAmbient();toast(sndOn?'🔊 Village sounds on':'🔇 Muted')}
function syncAmbient(){ambient(sndOn&&view==='map')}
function ambient(on){
 if(on&&!amb){const a=audio();if(!a)return;const src=a.createBufferSource();src.buffer=noiseBuf;src.loop=true;
  const f=a.createBiquadFilter(),g=a.createGain(),lfo=a.createOscillator(),lg=a.createGain();
  f.type='lowpass';f.frequency.value=420;g.gain.value=.03;lfo.frequency.value=.12;lg.gain.value=.018;
  lfo.connect(lg);lg.connect(g.gain);src.connect(f);f.connect(g);g.connect(a.destination);src.start();lfo.start();amb={src,lfo,g};
  const chirp=()=>{if(!amb)return;const c=audio(),t=c.currentTime;
   for(let i=0;i<((2+Math.random()*3)|0);i++){const o=c.createOscillator(),gg=c.createGain(),s=t+i*.13,f0=2400+Math.random()*1200;
    o.frequency.setValueAtTime(f0,s);o.frequency.exponentialRampToValueAtTime(f0*1.35,s+.08);
    gg.gain.setValueAtTime(.0001,s);gg.gain.exponentialRampToValueAtTime(.025,s+.02);gg.gain.exponentialRampToValueAtTime(.0001,s+.1);
    o.connect(gg);gg.connect(c.destination);o.start(s);o.stop(s+.12)}
   birdT=setTimeout(chirp,4000+Math.random()*6000)};chirp()}
 else if(!on&&amb){clearTimeout(birdT);try{amb.g.gain.setTargetAtTime(0,actx.currentTime,.2);amb.src.stop(actx.currentTime+.8);amb.lfo.stop(actx.currentTime+.8)}catch(e){}amb=null}}
document.addEventListener('pointerdown',()=>{audio();syncAmbient()},{once:true});
function honk(){if(!sndOn)return;const a=audio();if(!a)return;[0,.16].forEach((d,i)=>{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+d;o.type='square';o.frequency.value=i?330:262;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.16)})}
function startScratch(kind){if(!fxOn)return null;const a=audio();if(!a)return null;const src=a.createBufferSource();src.buffer=noiseBuf;src.loop=true;const f=a.createBiquadFilter(),g=a.createGain();f.type=kind==='eraser'?'lowpass':'bandpass';f.frequency.value=kind==='eraser'?600:2600;f.Q.value=.9;g.gain.value=0;src.connect(f);f.connect(g);g.connect(a.destination);src.start();return{src,f,g,kind}}
function updScratch(s,v){if(!s)return;const t=actx.currentTime,e=s.kind==='eraser';s.g.gain.setTargetAtTime(Math.min(e?.16:.09,v*.012),t,.02);s.f.frequency.setTargetAtTime((e?500:2400)+Math.min(v,40)*(e?10:30),t,.03)}
function stopScratch(s){if(!s)return;try{s.g.gain.setTargetAtTime(0,actx.currentTime,.03);s.src.stop(actx.currentTime+.15)}catch(e){}}
function playUndo(){if(!fxOn)return;const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.frequency.setValueAtTime(620,t);o.frequency.exponentialRampToValueAtTime(240,t+.14);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(a.destination);o.start();o.stop(t+.18)}
function playClear(){const s=startScratch('eraser');if(!s)return;updScratch(s,14);setTimeout(()=>stopScratch(s),260)}

/* ====== TRACTOR: drives to the next unfinished stop; celebrates at a stop just finished ====== */
let tPos=null,tCel=null,tractorRaf=0,welcomed=false;
function startTractor(){
 cancelAnimationFrame(tractorRaf);
 const el=$('tractor'),road=$('road');if(!el||!road)return;
 const L=road.getTotalLength();
 const sl=STOPS.map(s=>{let b=0,bd=1e9;for(let l=0;l<=L;l+=4){const p=road.getPointAtLength(l),d=Math.hypot(p.x-s.x*10,p.y-s.y*5);if(d<bd){bd=d;b=l}}return b});
 const next=()=>{const d=done(),i=STOPS.findIndex(s=>!d[s.id]);return sl[i<0?STOPS.length-1:i]};
 if(tPos==null)tPos=sl[0];
 let goal=tCel!=null?sl[tCel]:next(),party=tCel!=null,pause=0,off=0,face=1,last=performance.now();tCel=null;
 const PARK_Y=46;
 const step=now=>{
  if(!$('tractor'))return;
  const dt=Math.min(50,now-last);last=now;let moving=false;
  if(pause>0)pause-=dt;
  else{const diff=goal-tPos,sp=dt*.14;
   if(Math.abs(diff)<=sp){tPos=goal;if(party){party=false;pause=1500;goal=next();burst();honk()}}
   else{tPos+=Math.sign(diff)*sp;face=Math.sign(diff);moving=true}}
  const p=road.getPointAtLength(tPos),q=road.getPointAtLength(Math.max(0,Math.min(L,tPos+face*3)));
  off+=((moving?0:PARK_Y)-off)*.08;
  const bob=RM?0:pause>0?-Math.abs(Math.sin(now/110))*14:moving?Math.sin(now/55)*1.5:Math.sin(now/500)*1.5;
  el.style.left=(p.x/10)+'%';el.style.top=(p.y/5)+'%';
  el.style.transform='translate(-50%,calc(-50% + '+(off+bob)+'px)) scaleX('+(q.x>=p.x?-1:1)+')';
  tractorRaf=requestAnimationFrame(step)};
 tractorRaf=requestAnimationFrame(step)}

 if(view==='map'){const d=done(),n=STOPS.filter(s=>d[s.id]).length,nx=STOPS.findIndex(s=>!d[s.id]);
  app.innerHTML=`<div class="map" id="map"><div class="sky" aria-hidden="true"><span class="c1">☁️</span><span class="c2">☁️</span><span class="c3">☁️</span><span class="b">🐦</span><span class="b" style="top:11%;animation-delay:-24s">🐦</span></div><svg class="road" viewBox="0 0 1000 500" preserveAspectRatio="none"><path id="road" d="M90,360 C190,230 250,230 290,220 S430,420 500,380 S640,240 710,220 S860,380 900,370"/><path class="d" d="M90,360 C190,230 250,230 290,220 S430,420 500,380 S640,240 710,220 S860,380 900,370"/></svg><img id="tractor" class="tractor" src="${ASSET_BASE}map-tractor-sprite.webp" alt="" onerror="this.style.display='none'">
  <div class="head">${imgTag('guide','🧑‍🎓')}<div><h2>Our Roots: Indian Villages</h2><p>Tap a stop on the trail. ${mode==='practice'?'Practice mode shows hints.':'Write mode hides hints and lets you check your own answers.'}</p></div><div class="bar"><span>${n} of ${STOPS.length} stops done</span><i><b style="width:${n/STOPS.length*100}%"></b></i></div><div class="bales">${STOPS.map(x=>`<span class="bale ${d[x.id]?'on':''}">🌾</span>`).join('')}</div></div>
  <button class="shelfbtn" onclick="showShelf()">🏅 Stickers <b>${n}/${STOPS.length}</b></button>${STOPS.map((s,i)=>{const c=score(s);return `<button class="pin ${d[s.id]?'done':''} ${i===nx?'next':''}" style="left:${s.x}%;top:${s.y}%" onclick="openStop(${i})">${imgTag(s.id,s.em)}<b>${s.t}</b><small>${s.s}</small>${c.n?`<span class="sc">⭐ ${c.y}/${c.t}</span>`:''}${d[s.id]?'<span class="stamp">✔</span>':''}</button>`}).join('')}</div>`;
  const m=$('map');m.style.backgroundImage=`url(${ASSET_BASE}${IMG.bg})`;
  startTractor();
  if(!welcomed){welcomed=true;if(nx<0)setTimeout(()=>{if(view==='map')showShelf()},1500);else if(n>0)toast('👋 Welcome back, Humayun! Next stop: '+STOPS[nx].t)}
  return wrapWords(app)}
 const s=STOPS[view],bind=s.id==='qa'||s.id==='think';
 app.innerHTML=`<div class="stopbar"><h2 class="sh">${imgTag(s.id,s.em,'sbimg')}<span>${s.t}</span></h2><span class="sub">${s.s}${pagesOf(view)>1?` · Question ${page+1} of ${pagesOf(view)}`:''}</span><span class="sp"></span>${s.shuffle?`<button class="ibtn" onclick="shuffleStop('${s.id}')" title="Shuffle the exercises" aria-label="Shuffle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg></button>`:''}<button class="btn" ${view===0&&page===0?'disabled':''} onclick="stepNav(-1)">◀</button><button class="btn" ${view===STOPS.length-1&&page===pagesOf(view)-1?'disabled':''} onclick="stepNav(1)">▶</button></div>
 <div class="bwrap"><div class="stopbody${bind?' withclose':''}" id="sb">${bodyFor(s)}</div>${bind?`<button class="close-binder" onclick="closeBinder('${s.id}')" title="Close notebook" aria-label="Close notebook">📕<span>Close notebook</span></button><div class="rings">${'<i class="ring"></i>'.repeat(22)}</div><div class="binder-cover ${openedStops[s.id]?'binder-open':''}" onclick="openBinder(this,'${s.id}')"><div class="cb-label"><div class="cb-head">${imgTag('guide','🧑‍🎓')}<span>Classwork Notebook</span></div><div class="cb-row"><span>Name:</span><b>Humayun</b></div><div class="cb-row"><span>Subject:</span><b>Social Studies</b></div><div class="cb-row"><span>Exercise:</span><b>${s.t} · ${s.s}</b></div></div><div class="cb-hint">Tap to open ⚡</div></div>`:''}</div><div class="stopfoot"><button class="check" onclick="markDone('${s.id}')" title="Done" aria-label="Done"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></button></div>`;
 wrapWords($('sb'));requestAnimationFrame(()=>requestAnimationFrame(initAllInk));setTool(tool);applyPenUI()}

/* ====== INK ENGINE ====== */
const DPR=Math.min(window.devicePixelRatio||1,2);let penSeen=0;const touches=new Set();
document.addEventListener('pointerdown',e=>{if(e.pointerType==='pen')penSeen=performance.now();else if(e.pointerType==='touch')touches.add(e.pointerId)},true);
['pointermove','pointerover'].forEach(n=>document.addEventListener(n,e=>{if(e.pointerType==='pen')penSeen=performance.now()},true));
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,e=>touches.delete(e.pointerId),true));
const palmLike=e=>performance.now()-penSeen<1800||touches.size>1||Math.max(e.width||0,e.height||0)>34;
const rejectTouch=e=>e.pointerType==='touch'&&(penOnly||palmLike(e));
let tool='pen';const cache={},dirty=new Set();let st_t=null;
function setTool(t){tool=t;document.querySelectorAll('#tPen').forEach(b=>b.classList.toggle('on',t==='pen'));document.querySelectorAll('#tEr').forEach(b=>b.classList.toggle('on',t==='eraser'))}
function scheduleSave(c){dirty.add(c);clearTimeout(st_t);st_t=setTimeout(flushInk,700)}
function flushInk(){clearTimeout(st_t);dirty.forEach(c=>{if(!c._key)return;if(!c._has){store.del(c._key);delete cache[c._key];return}
 try{const d=c.toDataURL('image/webp',.7);cache[c._key]=d;if(!store.set(c._key,d))toast('Storage is full. Writing is kept until you close the app.')}catch(e){}});dirty.clear()}
const inkOf=k=>document.querySelector(`canvas[data-k="${k}"]`);
function undoInk(k){const c=inkOf(k);if(c)c._undo_fn()}
function clearInk(k){const c=inkOf(k);if(c)c._clear_fn()}
function initAllInk(){document.querySelectorAll('canvas[data-k]').forEach(c=>initInk(c,S+'ink::'+mode+'::'+c.dataset.k,c.dataset.kind))}
function initInk(c,key,kind){
 if(c._ink)return;c._ink=true;c._key=key;c._undo=[];c._has=false;c.style.width='100%';c.style.height='100%';const ctx=c.getContext('2d');
 const load=()=>{const sv=cache[key]||store.get(key);if(!sv)return;cache[key]=sv;const im=new Image();im.onload=()=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);ctx.restore();c._has=true};im.src=sv};
 const size=()=>{const r=c.getBoundingClientRect(),w=Math.round(r.width),h=Math.round(r.height);if(w<2||h<2)return false;if(c._w===w&&c._h===h)return true;
  let old=null;if(c._w){old=document.createElement('canvas');old.width=c.width;old.height=c.height;old.getContext('2d').drawImage(c,0,0)}
  c.width=Math.round(w*DPR);c.height=Math.round(h*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);if(old)ctx.drawImage(old,0,0,w,h);c._w=w;c._h=h;if(!c._loaded){c._loaded=true;load()}return true};
 size();if(window.ResizeObserver)new ResizeObserver(size).observe(c);
 const snap=()=>{try{c._undo.push(ctx.getImageData(0,0,c.width,c.height));while(c._undo.length>(kind==='pad'?6:10))c._undo.shift()}catch(e){}};
 c._undo_fn=()=>{const s=c._undo.pop();if(!s){toast('Nothing to undo');return}if(s.width!==c.width)return;ctx.putImageData(s,0,0);c._has=true;scheduleSave(c);playUndo()};
 c._clear_fn=()=>{snap();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.restore();c._has=false;store.del(key);delete cache[key];playClear()};
 let st=null;
 c.addEventListener('pointerdown',e=>{if(rejectTouch(e)){e.preventDefault();if(penOnly&&!palmLike(e))nudge();return}if(st||!size())return;e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}snap();
  const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,tl=kind==='pad'?tool:'pen';st={id:e.pointerId,type:e.pointerType,x,y,mx:x,my:y,tl,t:performance.now(),snd:startScratch(tl)}});
 c.addEventListener('pointermove',e=>{if(!st||e.pointerId!==st.id)return;e.preventDefault();if(st.type==='touch'&&palmLike(e)){stopScratch(st.snd);const sn=c._undo.pop();if(sn&&sn.width===c.width)ctx.putImageData(sn,0,0);try{c.releasePointerCapture(st.id)}catch(_){}st=null;return}
  const ev=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e],r=c.getBoundingClientRect();let dist=0;
  for(const v of ev){const x=v.clientX-r.left,y=v.clientY-r.top,pr=v.pressure>0?v.pressure:.5,mx=(st.x+x)/2,my=(st.y+y)/2;ctx.lineCap=ctx.lineJoin='round';
   if(st.tl==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=kind==='pad'?penSize*6+8:26}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=kind==='pad'?penColor:'#1E3A5F';ctx.lineWidth=(kind==='pad'?penSize:3.6)*(pr*1.4+.4)}
   ctx.beginPath();ctx.moveTo(st.mx,st.my);ctx.quadraticCurveTo(st.x,st.y,mx,my);ctx.stroke();dist+=Math.hypot(x-st.x,y-st.y);st.x=x;st.y=y;st.mx=mx;st.my=my}
  ctx.globalCompositeOperation='source-over';const n=performance.now();updScratch(st.snd,dist/Math.max(1,n-st.t)*10);st.t=n;if(st.tl!=='eraser')c._has=true});
 const end=e=>{if(!st||e.pointerId!==st.id)return;stopScratch(st.snd);st=null;try{c.releasePointerCapture(e.pointerId)}catch(_){}scheduleSave(c)};
 ['pointerup','pointercancel','lostpointercapture'].forEach(n=>c.addEventListener(n,end));c.addEventListener('contextmenu',e=>e.preventDefault())}
window.addEventListener('pagehide',flushInk);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushInk();else{wl=null;wake()}});

/* ====== SPEECH: tap a word to hear it; hold for syllables (Practice answers) ====== */
let voice=null;function pickVoice(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]IN/i.test(x.lang))||v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}
const clean=t=>String(t).replace(/(^|[\s,;:])(\d+|[a-eA-E])[.)]\s+/g,'$1').replace(/[_·•*✔]+/g,' ').replace(/\s+/g,' ').trim();
function speak(t,rate=.85){if(!('speechSynthesis' in window))return;const c=clean(t);if(!c)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(c);if(voice){u.voice=voice;u.lang=voice.lang}else u.lang='en-IN';u.rate=rate;speechSynthesis.speak(u)}
let holdT=null,held=false;
document.addEventListener('click',e=>{const w=e.target.closest&&e.target.closest('.w');if(!w)return;e.stopPropagation();
 if(w.classList.contains('chip')){if(held){held=false;return}if(w.classList.contains('split')){renderSplit(w,false);if('speechSynthesis' in window)speechSynthesis.cancel();return}speak(w.dataset.w,.85);w.classList.add('sp2');setTimeout(()=>w.classList.remove('sp2'),700);return}
 speak(w.dataset.w,.7);w.classList.add('sp2');setTimeout(()=>w.classList.remove('sp2'),700)},true);
function renderSplit(w,on){if(on){w.classList.add('split');w.innerHTML=w.dataset.parts.split('|').map((p,i)=>`<span class="sb">${i===0&&w.dataset.w[0]!==w.dataset.w[0].toLowerCase()?p[0].toUpperCase()+p.slice(1):p}</span>`).join('<span class="dot">•</span>')}else{w.classList.remove('split');w.textContent=w.dataset.w}}
function speakSeq(w){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const parts=w.dataset.parts.split('|');
 const say=(t,rate,pitch,st,en)=>{const u=new SpeechSynthesisUtterance(clean(t));if(voice){u.voice=voice;u.lang=voice.lang}else u.lang='en-IN';u.rate=rate;u.pitch=pitch;u.onstart=st;u.onend=en;speechSynthesis.speak(u)};
 const bs=()=>[...w.querySelectorAll('.sb')];
 parts.forEach((p,i)=>say(p,.40,.82,()=>bs().forEach((b,j)=>b.classList.toggle('hl',j===i))));
 say(w.dataset.w,.40,.82,()=>bs().forEach(b=>b.classList.add('hl')),()=>bs().forEach(b=>b.classList.remove('hl')))}
document.addEventListener('pointerdown',e=>{const w=mode==='practice'&&e.target.closest&&e.target.closest('.chip');if(!w)return;held=false;clearTimeout(holdT);
 holdT=setTimeout(()=>{if(!w.dataset.parts)return;held=true;renderSplit(w,true);speakSeq(w)},450)},true);
['pointerup','pointercancel','pointerleave'].forEach(n=>document.addEventListener(n,()=>clearTimeout(holdT),true));
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.chip'))e.preventDefault()});
const SKIP='script,style,canvas,button,.ib,.w,.num,.pin,.hint .w,.chk';
function wrapWords(root){if(!root)return;
 const wk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>(!n.nodeValue.trim()||!n.parentElement||n.parentElement.closest(SKIP))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
 const nodes=[];while(wk.nextNode())nodes.push(wk.currentNode);
 nodes.forEach(n=>{const fr=document.createDocumentFragment();
  n.nodeValue.split(/(\s+)/).forEach(tok=>{if(!tok)return;if(/^\s+$/.test(tok)){fr.appendChild(document.createTextNode(tok));return}
   if(/^(Q?\d+|[a-eA-E])[.)]$/.test(tok)||/^\d+$/.test(tok)){fr.appendChild(document.createTextNode(tok));return}
   const m=tok.match(/^([^\p{L}\p{N}]*)([\p{L}\p{N}][\p{L}\p{N}'’-]*)(.*)$/u);if(!m){fr.appendChild(document.createTextNode(tok));return}
   if(m[1])fr.appendChild(document.createTextNode(m[1]));
   const sp=document.createElement('span');sp.className='w';sp.dataset.w=m[2];sp.textContent=m[2];
   if(mode==='practice'&&n.parentElement.closest('.answer')){sp.classList.add('chip');const pp=partsOf(m[2]);if(pp)sp.dataset.parts=pp.join('|')}
   fr.appendChild(sp);if(m[3])fr.appendChild(document.createTextNode(m[3]))});
  n.parentNode.replaceChild(fr,n)})}

/* ====== KEEP AWAKE + FULLSCREEN ====== */
let wl=null;async function wake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
document.addEventListener('pointerdown',wake,{passive:true});
let fsTried=false;document.addEventListener('pointerdown',()=>{if(fsTried)return;fsTried=true;const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{})});

$('brand').innerHTML=imgTag('guide','🧑‍🎓','bav')+'<b>Social Studies · Indian Villages</b>';
render();
