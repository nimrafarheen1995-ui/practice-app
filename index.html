<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Learning Quest</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', cursive, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #E0F2FE 0%, #EDE9FE 50%, #FEF3C7 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    .bg-bubble {
      position: fixed;
      font-size: 2.2rem;
      pointer-events: none;
      z-index: 0;
      opacity: 0.3;
      animation: floatUp 15s infinite linear;
    }
    @keyframes floatUp {
      0% { transform: translateY(105vh) rotate(0deg); }
      100% { transform: translateY(-15vh) rotate(360deg); }
    }

    /* Welcome Modal */
    #startModal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      background: #FFFFFF;
      border: 4px solid #38BDF8;
      border-radius: 36px;
      padding: 36px 28px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }
    .modal-btn {
      margin-top: 20px;
      background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%);
      color: #FFF;
      font-size: 1.4rem;
      font-weight: 800;
      padding: 16px 32px;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 6px 0 #92400E, 0 12px 20px rgba(217, 119, 6, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .modal-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #92400E;
    }

    .sound-toggle-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #FFFFFF;
      border: 2px solid #CBD5E1;
      padding: 8px 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #334155;
      z-index: 50;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .view-container {
      position: relative;
      z-index: 10;
      max-width: 860px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    header {
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: #0F172A;
      text-shadow: 0 2px 0 #FFF;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 1.2rem;
      font-weight: 600;
      color: #475569;
    }

    /* Screen 1: Names Grid */
    .names-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 28px;
      width: 100%;
      max-width: 720px;
    }

    .name-card {
      background: #FFFFFF;
      border-radius: 36px;
      padding: 36px 24px;
      border: 5px solid #E2E8F0;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .name-card:active {
      transform: translateY(2px) scale(0.98);
    }

    .card-humayun { border-color: #38BDF8; }
    .card-zaina { border-color: #C084FC; }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      border: 4px solid #FFF;
      box-shadow: 0 8px 18px rgba(0,0,0,0.1);
    }
    .card-humayun .avatar { background: #BAE6FD; }
    .card-zaina .avatar { background: #E9D5FF; }

    .name-title {
      font-size: 2.1rem;
      font-weight: 800;
      color: #0F172A;
    }
    .tap-tag {
      background: #F1F5F9;
      color: #475569;
      font-size: 1rem;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 999px;
    }

    /* Inside Student View */
    .inside-view {
      display: none;
      width: 100%;
      max-width: 650px;
      flex-direction: column;
      gap: 18px;
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .back-btn {
      background: #FFFFFF;
      border: 2px solid #CBD5E1;
      padding: 10px 20px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 800;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .current-student-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0F172A;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lessons-deck {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .lesson-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-radius: 24px;
      text-decoration: none;
      color: #FFFFFF;
      font-weight: 800;
      font-size: 1.3rem;
      box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 10px 20px rgba(0,0,0,0.08);
      transition: transform 0.1s ease;
    }
    .lesson-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.18);
    }

    .btn-green { background: linear-gradient(135deg, #10B981 0%, #059669 100%); }
    .btn-blue  { background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%); }
    .btn-purple{ background: linear-gradient(135deg, #A855F7 0%, #7E22CE 100%); }

    .arrow-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }
  </style>
</head>
<body>

  <div class="bg-bubble" style="left: 10%; animation-delay: 0s;">🚀</div>
  <div class="bg-bubble" style="left: 30%; animation-delay: 4s;">⭐</div>
  <div class="bg-bubble" style="left: 65%; animation-delay: 8s;">🌱</div>
  <div class="bg-bubble" style="left: 85%; animation-delay: 2s;">📚</div>

  <!-- Audio unlock dialog -->
  <div id="startModal">
    <div class="modal-card">
      <div style="font-size: 4rem; margin-bottom: 6px;">🏰</div>
      <h2 style="font-size: 2rem; font-weight: 800; color: #0F172A;">Learning Quest</h2>
      <p style="color: #64748B; font-weight: 600; margin-top: 6px;">Ready for today's tasks?</p>
      <button type="button" class="modal-btn" onclick="unlockAudioAndStart()">
        <span>Start!</span>
        <span>✨</span>
      </button>
    </div>
  </div>

  <button type="button" class="sound-toggle-btn" id="soundBtn" onclick="toggleMute()">
    <span id="soundIcon">🔊</span>
    <span id="soundText">Voice On</span>
  </button>

  <!-- SCREEN 1: CHOOSE NAME -->
  <div class="view-container" id="nameSelectView">
    <header>
      <h1>Who is learning today?</h1>
      <p class="subtitle">Tap your card to open your subjects:</p>
    </header>

    <div class="names-grid">
      <div class="name-card card-humayun" onclick="openStudentView('humayun')">
        <div class="avatar">👦</div>
        <div class="name-title">Humayun</div>
        <span class="tap-tag">Tap to Open ➔</span>
      </div>

      <div class="name-card card-zaina" onclick="openStudentView('zaina')">
        <div class="avatar">👧</div>
        <div class="name-title">Zaina</div>
        <span class="tap-tag">Tap to Open ➔</span>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: INSIDE HUMAYUN'S VIEW -->
  <div class="inside-view" id="humayunView">
    <div class="top-nav">
      <button type="button" class="back-btn" onclick="showNameSelect()">⬅ Back</button>
      <div class="current-student-title"><span>👦</span> Humayun</div>
      <div style="width: 80px;"></div>
    </div>

    <div class="lessons-deck">
      <a href="humayun-science.html" class="lesson-btn btn-green">
        <span>🌱 EVS Science Nature Trail</span>
        <div class="arrow-circle">➔</div>
      </a>

      <a href="humayun.html" class="lesson-btn btn-blue">
        <span>📖 English Word Quest</span>
        <div class="arrow-circle">➔</div>
      </a>
    </div>
  </div>

  <!-- SCREEN 2: INSIDE ZAINA'S VIEW -->
  <div class="inside-view" id="zainaView">
    <div class="top-nav">
      <button type="button" class="back-btn" onclick="showNameSelect()">⬅ Back</button>
      <div class="current-student-title"><span>👧</span> Zaina</div>
      <div style="width: 80px;"></div>
    </div>

    <div class="lessons-deck">
      <a href="zaina.html" class="lesson-btn btn-purple">
        <span>🏔️ English Trail</span>
        <div class="arrow-circle">➔</div>
      </a>
    </div>
  </div>

  <script>
    var isMuted = false;
    var audioCtx = null;

    function playUpbeatChime() {
      if (isMuted) return;
      try {
        var AudioClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioClass) return;
        if (!audioCtx) audioCtx = new AudioClass();
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(function() {});
        }

        var notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach(function(freq, idx) {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.06, audioCtx.currentTime + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.07 + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.07);
          osc.stop(audioCtx.currentTime + idx * 0.07 + 0.2);
        });
      } catch (err) {}
    }

    function speakKidVoice(text) {
      if (isMuted || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.pitch = 1.35;
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      } catch (err) {}
    }

    function unlockAudioAndStart() {
      // Step 1: Hide modal immediately regardless of sound support
      var modal = document.getElementById('startModal');
      if (modal) modal.style.display = 'none';

      // Step 2: Trigger audio inside safe wrappers
      playUpbeatChime();
      setTimeout(function() {
        speakKidVoice("Welcome! Tap your name to start.");
      }, 250);
    }

    function openStudentView(name) {
      playUpbeatChime();
      var nameView = document.getElementById('nameSelectView');
      var hView = document.getElementById('humayunView');
      var zView = document.getElementById('zainaView');

      if (nameView) nameView.style.display = 'none';

      if (name === 'humayun') {
        if (hView) hView.style.display = 'flex';
        if (zView) zView.style.display = 'none';
        speakKidVoice("Welcome Humayun! Pick your subject.");
      } else {
        if (zView) zView.style.display = 'flex';
        if (hView) hView.style.display = 'none';
        speakKidVoice("Welcome Zaina! Pick your subject.");
      }
    }

    function showNameSelect() {
      playUpbeatChime();
      var nameView = document.getElementById('nameSelectView');
      var hView = document.getElementById('humayunView');
      var zView = document.getElementById('zainaView');

      if (hView) hView.style.display = 'none';
      if (zView) zView.style.display = 'none';
      if (nameView) nameView.style.display = 'flex';

      speakKidVoice("Choose your name.");
    }

    function toggleMute() {
      isMuted = !isMuted;
      var icon = document.getElementById('soundIcon');
      var txt = document.getElementById('soundText');
      if (icon) icon.textContent = isMuted ? '🔇' : '🔊';
      if (txt) txt.textContent = isMuted ? 'Voice Off' : 'Voice On';
      if (isMuted && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }
  </script>
</body>
</html>
