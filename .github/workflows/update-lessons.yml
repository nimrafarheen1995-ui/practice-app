name: Update lesson list
on:
  push:
    branches: [main]
    paths: ['*.html', 'assets/**', 'shared/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_lessons.py
      - run: |
          git config user.name "lesson-list-bot"
          git config user.email "bot@users.noreply.github.com"
          git add lessons.json
          git diff --cached --quiet || (git commit -m "Update lesson list" && git push)
