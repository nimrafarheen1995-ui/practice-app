<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Zaina's Magical Maths Adventure: Exercise 5.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Quicksand:wght@600;700;800&family=Kalam:wght@700&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

<style>
:root {
  --twilight: #8B5CF6;
  --pinkie: #EC4899;
  --rainbow: #0EA5E9;
  --luna: #1E1B4B;
  --celestia: #F59E0B;
  --font-main: 'Quicksand', sans-serif;
  --font-display: 'Fredoka', cursive, sans-serif;
  --font-hand: 'Kalam', cursive, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  font-family: var(--font-main);
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0B0F19;
  color: #1E1B4B;
}

body {
  display: flex;
  flex-direction: column;
}

#screenDimOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 25, 0.6);
  pointer-events: none;
  z-index: 99998;
}

#milkyWayCanvas, #confettiSnowCanvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
}
#milkyWayCanvas { z-index: 1; }
#confettiSnowCanvas { z-index: 99999; }

/* GRAND CELEBRATION FINALE STAGE */
#grandCelebrationStage {
  position: fixed;
  inset: 0;
  z-index: 100000;
  pointer-events: none;
  display: none;
  overflow: hidden;
  background: radial-gradient(circle at center, rgba(30, 27, 75, 0.55) 0%, rgba(11, 15, 25, 0.92) 100%);
  backdrop-filter: blur(5px);
}
#grandFinaleCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
}

.magic-banner-centerpiece {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.2);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 25;
  opacity: 0;
  pointer-events: none;
  transition: transform 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
}
.magic-banner-centerpiece.impact {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}
.magic-crown-halo {
  position: absolute;
  width: 460px;
  height: 460px;
  border-radius: 50%;
  border: 28px solid transparent;
  border-top-color: rgba(244, 114, 182, 0.8);
  border-right-color: rgba(192, 132, 252, 0.75);
  border-bottom-color: rgba(56, 189, 248, 0.5);
  border-left-color: rgba(253, 224, 71, 0.7);
  filter: drop-shadow(0 0 35px rgba(236, 72, 153, 0.7));
  transform: rotate(-25deg);
}
.magic-top-title {
  font-family: var(--font-display);
  font-size: 64px;
  font-weight: 900;
  color: #FDF2F8;
  text-shadow: 0 0 25px #EC4899, 0 0 50px #8B5CF6, 0 4px 8px rgba(0,0,0,0.8);
  letter-spacing: 4px;
  line-height: 1.1;
  text-align: center;
}
.magic-subtitle-sparkle {
  font-family: 'Cinzel', serif;
  font-size: 24px;
  font-weight: 900;
  color: #FEF08A;
  letter-spacing: 6px;
  margin-top: 8px;
  text-shadow: 0 0 16px rgba(250, 204, 21, 0.9), 0 2px 6px #000;
  text-align: center;
}

.gliding-companion-rocket {
  position: absolute;
  width: 220px;
  height: 220px;
  z-index: 20;
  pointer-events: none;
  transform: rotate(12deg);
  filter: drop-shadow(0 0 28px rgba(255, 255, 255, 0.9)) drop-shadow(0 15px 35px rgba(0, 0, 0, 0.6));
}
.gliding-companion-rocket img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.royal-scroll-landing-right {
  position: absolute;
  top: 50%;
  right: 40px;
  transform: translateY(-50%) translateX(240px);
  width: 500px;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 16px;
  opacity: 0;
  transition: transform 0.65s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.5s ease;
  pointer-events: none;
}
.royal-scroll-landing-right.landed {
  transform: translateY(-50%) translateX(0);
  opacity: 1;
  pointer-events: auto;
}
.royal-unfurled-scroll {
  flex: 1;
  background: #FFFDF0;
  border: 4px solid #F59E0B;
  border-radius: 20px;
  padding: 18px 22px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 16px rgba(245, 158, 11, 0.2);
  color: #1E293B;
}
.royal-scroll-title {
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 800;
  color: #B45309;
  border-bottom: 2px dashed #FCD34D;
  padding-bottom: 6px;
  margin-bottom: 10px;
}
.royal-scroll-body {
  font-size: 0.95rem;
  font-weight: 800;
  line-height: 1.55;
  color: #334155;
  margin-bottom: 14px;
}
.royal-btn-continue {
  background: linear-gradient(135deg, #10B981, #059669);
  border: 2px solid #86EFAC;
  color: #FFF;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 0.95rem;
  padding: 10px 22px;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.5);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.royal-btn-continue:active { transform: scale(0.96); }

.royal-victory-companion {
  width: 170px;
  height: 250px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.royal-victory-companion img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));
}

.app-wrapper {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 1440px;
  margin: 0 auto;
  width: 100%;
  padding: 8px 14px;
  gap: 6px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 46px;
  flex-shrink: 0;
  padding: 0 4px;
}
.brand-group {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-title {
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 800;
  color: #FFFFFF;
  display: flex;
  align-items: center;
  gap: 8px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.7);
}
.badge-ch {
  background: rgba(255, 255, 255, 0.9);
  color: #BE185D;
  font-size: 0.8rem;
  font-weight: 800;
  padding: 3px 12px;
  border-radius: 999px;
  border: 1.5px solid #FBCFE8;
}

.header-tools {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ICON-ONLY FLOATING PILLS FOR HUB, DIM, & ROUGH PAD */
.icon-pill-btn {
  background: rgba(15, 23, 42, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.35);
  color: #FFFFFF;
  font-size: 1.1rem;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  text-decoration: none;
  transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.icon-pill-btn:hover { transform: scale(1.08); background: rgba(30, 41, 59, 0.95); }
.icon-pill-btn:active { transform: scale(0.94); }
.icon-pill-btn.rough-icon {
  background: #FEF3C7;
  border-color: #FCD34D;
  color: #92400E;
}

.head-btn {
  background: rgba(255, 255, 255, 0.94);
  border: 2px solid #CBD5E1;
  color: #0F172A;
  font-size: 0.85rem;
  font-weight: 800;
  padding: 6px 14px;
  border-radius: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  box-shadow: 0 2px 0 #94A3B8;
  text-decoration: none;
  transition: all 0.15s;
}
.head-btn:active { transform: translateY(2px); box-shadow: none; }

.views-container {
  flex: 1;
  min-height: 0;
  display: flex;
  position: relative;
  align-items: center;
  justify-content: center;
}

#exerciseView {
  display: flex;
  width: 100%;
  height: 100%;
  border-radius: 28px;
  padding: 14px 18px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), inset 0 0 0 2px rgba(255, 255, 255, 0.35);
  flex-direction: column;
  min-height: 0;
  position: relative;
  overflow: hidden;
  border: 3.5px solid rgba(255, 255, 255, 0.2);
}

.scene-luna {
  background: radial-gradient(circle at 85% 15%, rgba(129, 140, 248, 0.35) 0%, transparent 40%),
              linear-gradient(135deg, #030712 0%, #0F172A 50%, #1E1B4B 100%) !important;
}
.scene-celestia {
  background: radial-gradient(circle at 85% 15%, rgba(253, 230, 138, 0.45) 0%, transparent 40%),
              linear-gradient(135deg, #78350F 0%, #92400E 50%, #F59E0B 100%) !important;
}
.scene-rainbow {
  background: radial-gradient(circle at 85% 15%, rgba(254, 240, 138, 0.45) 0%, transparent 40%),
              linear-gradient(135deg, #0284C7 0%, #38BDF8 60%, #BAE6FD 100%) !important;
}

.exercise-backdrop-watermark {
  position: absolute;
  right: 15px;
  top: -10px;
  width: 320px;
  height: auto;
  opacity: 0.65;
  pointer-events: none;
  z-index: 1;
  transform: rotate(5deg);
  filter: drop-shadow(0 0 25px rgba(255,255,255,0.5));
}
.exercise-backdrop-watermark-bottom-left {
  position: absolute;
  left: -20px;
  bottom: -20px;
  width: 300px;
  height: auto;
  opacity: 0.55;
  pointer-events: none;
  z-index: 1;
  transform: rotate(-10deg);
  filter: drop-shadow(0 0 25px rgba(255,255,255,0.5));
}

.header-mascot-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  height: 60px;
  overflow: hidden;
  margin: 0 10px;
  z-index: 5;
}
.header-mascot-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 50px;
  height: 50px;
  background: transparent;
  border: none;
  position: absolute;
  cursor: pointer;
  padding: 0;
  filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 20px rgba(250, 204, 21, 0.8));
}
.header-mascot-wrapper:nth-child(1) { animation: hop9_1 3.2s infinite ease-in-out; }
.header-mascot-wrapper:nth-child(2) { animation: hop9_2 3.6s infinite ease-in-out; animation-delay: 0.4s; }
.header-mascot-wrapper:nth-child(3) { animation: hop9_3 3.4s infinite ease-in-out; animation-delay: 0.8s; }

@keyframes hop9_1 {
  0%, 100% { transform: translateY(0) scale(1) translateX(-70px) rotate(0deg); }
  50% { transform: translateY(-20px) scale(1.1) translateX(-50px) rotate(-6deg); }
}
@keyframes hop9_2 {
  0%, 100% { transform: translateY(0) scale(1) translateX(0px) rotate(0deg); }
  50% { transform: translateY(-24px) scale(1.12) translateX(15px) rotate(6deg); }
}
@keyframes hop9_3 {
  0%, 100% { transform: translateY(0) scale(1) translateX(70px) rotate(0deg); }
  50% { transform: translateY(-18px) scale(1.08) translateX(90px) rotate(-5deg); }
}

.header-mascot-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.quest-banner-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 8px;
  border-bottom: 2px dashed rgba(255, 255, 255, 0.3);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.window-heading {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 800;
  color: #FFFFFF;
  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
}
.window-sub {
  font-size: 0.82rem;
  font-weight: 700;
  color: #E2E8F0;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
}

.exercise-scroll-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
  overflow-y: auto;
  padding: 10px 6px 20px 2px;
  position: relative;
  z-index: 10;
}

.problem-card {
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 2.5px solid rgba(255, 255, 255, 0.95);
  border-radius: 20px;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.8);
}
.problem-q-text {
  font-size: 1.08rem;
  font-weight: 800;
  color: #0F172A;
  line-height: 1.6;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.stack-frac {
  display: inline-flex;
  flex-direction: column;
  vertical-align: middle;
  text-align: center;
  font-weight: 800;
  line-height: 1;
  padding: 0 4px;
  margin: 0 2px;
}
.stack-frac .num {
  display: block;
  font-size: 0.9em;
  padding-bottom: 2px;
}
.stack-frac .den {
  display: block;
  font-size: 0.9em;
  border-top: 2.2px solid currentColor;
  padding-top: 2px;
}

.bracket-frac-slot {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  vertical-align: middle;
  margin: 0 4px;
}
.bracket-bracket {
  font-family: var(--font-display);
  font-size: 1.85rem;
  line-height: 1;
  color: #64748B;
  user-select: none;
}
.stacked-inputs-column {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 2px 0;
}
.stacked-bar-divider {
  width: 100%;
  height: 2.5px;
  background: #334155;
  border-radius: 2px;
}

.pony-input-blank {
  height: 36px;
  background: #FFFFFF;
  border: 2px solid #CBD5E1;
  border-radius: 10px;
  padding: 0 8px;
  font-size: 1.05rem;
  font-weight: 800;
  color: #1E1B4B;
  text-align: center;
  outline: none;
  transition: all 0.15s;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
}
.pony-input-blank.frac-num,
.pony-input-blank.frac-den {
  min-width: 65px;
  max-width: 85px;
  height: 32px;
  font-size: 0.98rem;
}
.pony-input-blank.inline-whole {
  min-width: 50px;
  max-width: 65px;
  margin-right: 4px;
}
.pony-input-blank.standard-blank {
  min-width: 120px;
  max-width: 210px;
}

.pony-input-blank:focus {
  border-color: var(--pinkie);
  box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.25);
  background: #FFFFFF;
}
.pony-input-blank::placeholder {
  color: #94A3B8;
  font-size: 0.8rem;
  font-weight: 700;
}
.pony-input-blank.graded-correct {
  background: #DCFCE7 !important;
  border-color: #22C55E !important;
  color: #15803D !important;
}
.pony-input-blank.graded-wrong {
  background: #FEE2E2 !important;
  border-color: #EF4444 !important;
  color: #B91C1C !important;
}

.notebook-peek-btn {
  background: #FEF08A;
  border: 1.5px solid #F59E0B;
  border-radius: 50%;
  width: 34px;
  height: 34px;
  font-size: 1.1rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  margin-left: auto;
}
.notebook-peek-btn:active { transform: scale(0.9); }

.notebook-popup-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(4px);
  z-index: 99999;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.notebook-popup-overlay.open { display: flex; }

.notebook-sheet {
  background: #FFFDF0;
  width: 100%;
  max-width: 680px;
  border: 3px solid #E2E8F0;
  border-radius: 20px;
  padding: 22px 26px 22px 46px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  position: relative;
  background-image: repeating-linear-gradient(to bottom, transparent, transparent 31px, #E2E8F0 31px, #E2E8F0 32px);
  background-size: 100% 32px;
}

.notebook-sheet::before {
  content: '';
  position: absolute;
  top: 14px;
  left: 12px;
  bottom: 14px;
  width: 14px;
  background-image: radial-gradient(circle, #475569 45%, transparent 50%);
  background-size: 14px 24px;
}

.notebook-header-title {
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 800;
  color: #1E293B;
  border-bottom: 3px solid #1E293B;
  padding-bottom: 4px;
  margin-bottom: 14px;
  display: inline-block;
}

.notebook-handwritten-body {
  font-family: var(--font-hand);
  font-size: 1.3rem;
  color: #1E3A8A;
  line-height: 32px;
  letter-spacing: 0.4px;
  min-height: 140px;
  margin-bottom: 16px;
}

.notebook-footer-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 2px dashed #CBD5E1;
  padding-top: 12px;
}

.notebook-pony-corner {
  width: 75px;
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
}

.strip-table-wrapper {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  background: #FFFFFF;
  border-radius: 16px;
  padding: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  border: 3px solid #38BDF8;
}
.strip-table {
  width: 100%;
  min-width: 540px;
  border-collapse: collapse;
}
.strip-table th {
  background: #F0F9FF;
  padding: 10px;
  font-size: 0.95rem;
  font-weight: 800;
  color: #0369A1;
  border: 2px solid #0EA5E9;
}
.strip-table td {
  padding: 10px;
  border: 2px solid #0EA5E9;
  vertical-align: middle;
  text-align: center;
  background: #FFFFFF;
}
.strip-bar-visual {
  display: inline-flex;
  border: 3px solid #1E293B;
  border-radius: 6px;
  overflow: hidden;
  height: 26px;
  width: 180px;
  max-width: 100%;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
.strip-cell {
  flex: 1;
  border-right: 2px solid #1E293B;
  background: #FFFFFF;
}
.strip-cell:last-child { border-right: none; }
.strip-cell.shaded { background: #C084FC; }

.quest-finish-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 10px;
  border-top: 2px dashed rgba(255, 255, 255, 0.3);
  gap: 10px;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
/* ICON-ONLY CHECK & FINISH QUEST BUTTON */
.quest-finish-btn {
  background: linear-gradient(135deg, #10B981, #059669);
  color: #FFF;
  font-family: var(--font-display);
  font-size: 1.25rem;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.45);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.quest-finish-btn:active { transform: scale(0.94); }

/* FLOATING ROUGH PAD */
.floating-rough-pad {
  position: fixed;
  top: 70px;
  left: 20px;
  width: 360px;
  height: 440px;
  background: #FFFDF0;
  border: 3.5px solid #F59E0B;
  border-radius: 18px;
  box-shadow: 0 16px 45px rgba(0, 0, 0, 0.4);
  display: none;
  flex-direction: column;
  z-index: 99999;
  overflow: hidden;
  resize: both;
  min-width: 300px;
  min-height: 320px;
}

.rough-header {
  height: 38px;
  background: #FEF3C7;
  border-bottom: 2px solid #FDE68A;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
  cursor: move;
  flex-shrink: 0;
}
.rough-title {
  font-family: var(--font-display);
  font-size: 0.95rem;
  font-weight: 800;
  color: #92400E;
}
.rough-close-btn {

<script>
let selectedSectionIdx = 0;

function handleImageFallback(imgEl) {
  imgEl.onerror = null;
  imgEl.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><circle cx='60' cy='60' r='56' fill='%23EDE9FE' stroke='%23C4B5FD' stroke-width='4'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='56'>🦄</text></svg>";
}

let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playPonyChime() {
  try {
    const ctx = getAudioContext();
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
      gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.08);
      osc.stop(ctx.currentTime + idx * 0.08 + 0.4);
    });
  } catch (e) {}
}

function playGrandFanfareSound() {
  try {
    const ctx = getAudioContext();
    const t0 = ctx.currentTime;
    const chord = [392.00, 523.25, 659.25, 783.99, 1046.50, 1318.51];
    chord.forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t0 + idx * 0.07);
      gain.gain.setValueAtTime(0.25, t0 + idx * 0.07);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + idx * 0.07 + 1.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0 + idx * 0.07);
      osc.stop(t0 + idx * 0.07 + 1.45);
    });
  } catch(e) {}
}

function playMagicWhooshSound() {
  try {
    const ctx = getAudioContext();
    const t0 = ctx.currentTime;
    const dur = 2.2;
    const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 3.5;
    filter.frequency.setValueAtTime(320, t0);
    filter.frequency.exponentialRampToValueAtTime(2600, t0 + dur);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.01, t0);
    gain.gain.linearRampToValueAtTime(0.28, t0 + dur * 0.35);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    noise.start(t0);
    noise.stop(t0 + dur);
  } catch(e) {}
}

function playBubbleTap() {
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(380, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(700, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.09);
  } catch(e) {}
}

/* MILKY WAY CANVAS */
const mCanvas = document.getElementById("milkyWayCanvas");
const mCtx = mCanvas.getContext("2d");
let stars = [];

function resizeMilkyWay() {
  mCanvas.width = window.innerWidth;
  mCanvas.height = window.innerHeight;
  stars = [];
  for (let i = 0; i < 90; i++) {
    stars.push({
      x: Math.random() * mCanvas.width,
      y: Math.random() * mCanvas.height,
      radius: Math.random() * 2.2 + 0.6,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -Math.random() * 0.45 - 0.15,
      alpha: Math.random() * 0.75 + 0.25,
      dAlpha: (Math.random() - 0.5) * 0.012,
      color: ['#FDF2F8', '#DDD6FE', '#BAE6FD', '#FDE047'][Math.floor(Math.random() * 4)]
    });
  }
}
window.addEventListener("resize", resizeMilkyWay);
resizeMilkyWay();

function renderMilkyWay() {
  mCtx.clearRect(0, 0, mCanvas.width, mCanvas.height);
  const grad = mCtx.createLinearGradient(0, 0, mCanvas.width, mCanvas.height);
  grad.addColorStop(0, '#0F172A');
  grad.addColorStop(0.5, '#1E1B4B');
  grad.addColorStop(1, '#090D16');
  mCtx.fillStyle = grad;
  mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);

  for (let s of stars) {
    s.x += s.vx;
    s.y += s.vy;
    s.alpha += s.dAlpha;
    if (s.alpha > 0.95 || s.alpha < 0.2) s.dAlpha = -s.dAlpha;
    if (s.y < 0) s.y = mCanvas.height;
    if (s.x < 0) s.x = mCanvas.width;
    if (s.x > mCanvas.width) s.x = 0;

    mCtx.save();
    mCtx.globalAlpha = s.alpha;
    mCtx.fillStyle = s.color;
    mCtx.beginPath();
    mCtx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
    mCtx.fill();
    mCtx.restore();
  }
  requestAnimationFrame(renderMilkyWay);
}
requestAnimationFrame(renderMilkyWay);

/* HEADER TAP CONFETTI BURST */
const snowCanvas = document.getElementById("confettiSnowCanvas");
const snowCtx = snowCanvas.getContext("2d");
let snowParticles = [];
let isSnowingActive = false;

function resizeSnowCanvas() {
  snowCanvas.width = window.innerWidth;
  snowCanvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeSnowCanvas);
resizeSnowCanvas();

function triggerPixieDustBurst(e) {
  playPonyChime();
  const rect = e.currentTarget.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  
  isSnowingActive = true;
  const colors = ['#FDE047', '#F472B6', '#38BDF8', '#FFFFFF', '#C084FC'];
  for (let i = 0; i < 35; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 2;
    snowParticles.push({
      x: cx,
      y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      size: Math.random() * 6 + 3,
      rotation: Math.random() * 360,
      vRot: (Math.random() - 0.5) * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1
    });
  }
  requestAnimationFrame(updateSnow);
}

function updateSnow() {
  if (!isSnowingActive) return;
  snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
  let livingCount = 0;

  for (let p of snowParticles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.rotation += p.vRot;
    p.alpha -= 0.015;

    if (p.alpha > 0) {
      livingCount++;
      snowCtx.save();
      snowCtx.globalAlpha = Math.max(0, p.alpha);
      snowCtx.translate(p.x, p.y);
      snowCtx.rotate((p.rotation * Math.PI) / 180);
      snowCtx.fillStyle = p.color;
      snowCtx.beginPath();
      snowCtx.arc(0, 0, p.size, 0, Math.PI * 2);
      snowCtx.fill();
      snowCtx.restore();
    }
  }

  if (livingCount > 0) {
    requestAnimationFrame(updateSnow);
  } else {
    isSnowingActive = false;
    snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
  }
}

/* CELEBRATION STAGE */
const grandStage = document.getElementById("grandCelebrationStage");
const grandCanvas = document.getElementById("grandFinaleCanvas");
const grandCtx = grandCanvas.getContext("2d", { alpha: true });
const magicCenterpiece = document.getElementById("magicCenterpiece");
const glidingCompanionRocket = document.getElementById("glidingCompanionRocket");
const glidingCompanionImg = document.getElementById("glidingCompanionImg");
const royalScrollLandingRight = document.getElementById("royalScrollLandingRight");
const royalScrollTitle = document.getElementById("royalScrollTitle");
const royalScrollBody = document.getElementById("royalScrollBody");
const royalVictoryImg = document.getElementById("royalVictoryImg");

let grandAnimRunning = false;
let magicConfettiStorm = [];
let stardustTrails = [];
let glideStartTime = 0;

function resizeGrandCanvas() {
  grandCanvas.width = window.innerWidth;
  grandCanvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeGrandCanvas);

class RoyalConfettiParticle {
  constructor(type = 'star') {
    this.x = Math.random() * window.innerWidth;
    this.y = -30 - Math.random() * 200;
    this.type = type;
    this.size = type === 'star' ? (Math.random() * 10 + 8) : (Math.random() * 8 + 5);
    this.vx = (Math.random() - 0.5) * 1.6;
    this.vy = Math.random() * 2.4 + 1.8;
    this.rot = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.05;
    const colors = ['#EC4899', '#C084FC', '#38BDF8', '#FDE047', '#4ADE80', '#FFFFFF'];
    this.color = colors[Math.floor(Math.random() * colors.length)];
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.rot += this.rotSpeed;
    if (this.y > window.innerHeight + 40) {
      this.y = -20;
      this.x = Math.random() * window.innerWidth;
    }
  }
  draw(c) {
    c.save();
    c.translate(this.x, this.y);
    c.rotate(this.rot);
    c.fillStyle = this.color;
    c.beginPath();
    c.arc(0, 0, this.size * 0.5, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
}

class StardustTrailParticle {
  constructor(x, y) {
    this.x = x + (Math.random() - 0.5) * 35;
    this.y = y + (Math.random() - 0.5) * 35;
    const colors = ['#FDE047', '#F472B6', '#38BDF8', '#C084FC', '#FFFFFF'];
    this.color = colors[Math.floor(Math.random() * colors.length)];
    this.size = Math.random() * 7 + 2;
    this.vx = (Math.random() - 0.5) * 2.5 - 1.5;
    this.vy = (Math.random() - 0.5) * 2.5 + 1.5;
    this.life = 1;
    this.decay = 0.026;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }
  draw(c) {
    c.save();
    c.globalAlpha = Math.max(0, this.life);
    c.fillStyle = this.color;
    c.beginPath();
    c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }
}

function triggerGrandCelebration(sec) {
  resizeGrandCanvas();
  grandStage.style.display = 'block';
  grandAnimRunning = true;

  playGrandFanfareSound();
  magicCenterpiece.className = 'magic-banner-centerpiece impact';

  glidingCompanionImg.src = sec.avatar;
  royalVictoryImg.src = sec.avatar;

  royalScrollTitle.innerText = `🌟 ${sec.title.toUpperCase()}! 🌟`;
  royalScrollBody.innerHTML = `
    Magnificent work, Zaina!<br/>
    You solved every problem alongside <b>${sec.ponyName}</b> with complete precision!
  `;

  magicConfettiStorm = [];
  for (let i = 0; i < 55; i++) magicConfettiStorm.push(new RoyalConfettiParticle('star'));
  for (let i = 0; i < 35; i++) magicConfettiStorm.push(new RoyalConfettiParticle('heart'));

  stardustTrails = [];

  setTimeout(() => {
    playMagicWhooshSound();
    glideStartTime = performance.now();
    animateCompanionGlide();
  }, 350);

  setTimeout(() => {
    royalScrollLandingRight.className = 'royal-scroll-landing-right landed';
    playPonyChime();
  }, 2300);

  requestAnimationFrame(renderGrandScene);
}

function animateCompanionGlide() {
  const dur = 2800;
  const w = window.innerWidth;
  const h = window.innerHeight;

  const startX = -180;
  const startY = h + 100;
  const targetX = w * 0.42;
  const targetY = h * 0.45;

  function step(now) {
    const elapsed = now - glideStartTime;
    const p = Math.min(1, elapsed / dur);
    const ease = 1 - Math.pow(1 - p, 3);

    const curX = startX + (targetX - startX) * ease;
    const curY = startY + (targetY - startY) * ease;

    glidingCompanionRocket.style.left = `${curX}px`;
    glidingCompanionRocket.style.top = `${curY}px`;

    for (let k = 0; k < 4; k++) {
      stardustTrails.push(new StardustTrailParticle(curX + 75, curY + 75));
    }

    if (p < 1 && grandAnimRunning) {
      requestAnimationFrame(step);
    }
  }
  requestAnimationFrame(step);
}

function renderGrandScene() {
  if (!grandAnimRunning) return;
  grandCtx.clearRect(0, 0, grandCanvas.width, grandCanvas.height);

  for (let i = stardustTrails.length - 1; i >= 0; i--) {
    stardustTrails[i].update();
    stardustTrails[i].draw(grandCtx);
    if (stardustTrails[i].life <= 0) stardustTrails.splice(i, 1);
  }

  for (let c of magicConfettiStorm) {
    c.update();
    c.draw(grandCtx);
  }

  requestAnimationFrame(renderGrandScene);
}

function closeGrandCelebration() {
  grandAnimRunning = false;
  grandStage.style.display = 'none';
  magicCenterpiece.className = 'magic-banner-centerpiece';
  royalScrollLandingRight.className = 'royal-scroll-landing-right';
  magicConfettiStorm = [];
  stardustTrails = [];
  cycleExerciseSection();
}

/* MATH CHECKING ENGINE & DEFERRED DRAFT TRACKING */
function checkMathAnswersMatch(entered, targetAllowedStr, formatRule = "any") {
  if (!entered || !targetAllowedStr) return false;
  const cleanEntered = entered.trim().toLowerCase().replace(/\s+/g, ' ');
  const targets = targetAllowedStr.split('|').map(t => t.trim().toLowerCase().replace(/\s+/g, ' '));

  if (targets.includes(cleanEntered)) return true;

  const isMixedInput = /^\d+\s+\d+\/\d+$/.test(cleanEntered);
  const isImproperInput = /^\d+\/\d+$/.test(cleanEntered);

  if (formatRule === "mixed" && !isMixedInput) return false;
  if (formatRule === "improper" && !isImproperInput) return false;

  const parseVal = (str) => {
    const mm = str.match(/^(\d+)\s+(\d+)\/(\d+)$/);
    if (mm) {
      const d = parseFloat(mm[3]);
      return d === 0 ? null : parseFloat(mm[1]) + (parseFloat(mm[2]) / d);
    }
    const fm = str.match(/^(\d+)\/(\d+)$/);
    if (fm) {
      const d = parseFloat(fm[2]);
      return d === 0 ? null : parseFloat(fm[1]) / d;
    }
    const num = parseFloat(str);
    return isNaN(num) ? null : num;
  };

  const valEntered = parseVal(cleanEntered);
  if (valEntered !== null) {
    for (let t of targets) {
      const valT = parseVal(t);
      if (valT !== null && Math.abs(valEntered - valT) < 0.00001) {
        return true;
      }
    }
  }

  return false;
}

function handleDraftInput(inputEl) {
  const id = inputEl.getAttribute('data-id');
  const val = inputEl.value;
  if (id) {
    localStorage.setItem(storageKeyForId(id), val);
  }
  // Clear any instant grading while typing freely
  inputEl.classList.remove('graded-correct', 'graded-wrong');
}

function completeCurrentExerciseQuest() {
  let anyWrong = false;

  document.querySelectorAll('#exerciseScrollBody input.standard-blank').forEach(el => {
    const entered = (el.value || "").trim();
    const targets = el.getAttribute('data-correct') || "";
    const formatRule = el.getAttribute('data-format') || "any";

    if (!entered) {
      anyWrong = true;
      el.classList.add('graded-wrong');
      el.classList.remove('graded-correct');
      return;
    }

    if (targets && checkMathAnswersMatch(entered, targets, formatRule)) {
      el.classList.add('graded-correct');
      el.classList.remove('graded-wrong');
    } else {
      el.classList.add('graded-wrong');
      el.classList.remove('graded-correct');
      anyWrong = true;
    }
  });

  document.querySelectorAll('#exerciseScrollBody .bracket-frac-slot').forEach(slotEl => {
    const wholeInp = slotEl.querySelector('.inline-whole');
    const numInp = slotEl.querySelector('.frac-num');
    const denInp = slotEl.querySelector('.frac-den');

    const wholeVal = wholeInp ? wholeInp.value.trim() : "";
    const numVal = numInp ? numInp.value.trim() : "";
    const denVal = denInp ? denInp.value.trim() : "";

    let combined = "";
    if (wholeVal && numVal && denVal) {
      combined = `${wholeVal} ${numVal}/${denVal}`;
    } else if (numVal && denVal) {
      combined = `${numVal}/${denVal}`;
    } else if (wholeVal && !numVal && !denVal) {
      combined = wholeVal;
    }

    const correct = slotEl.getAttribute('data-correct') || "";
    const formatRule = slotEl.getAttribute('data-format') || "any";
    const inputs = slotEl.querySelectorAll('.pony-input-blank');

    if (!combined || (numVal && !denVal) || (!numVal && denVal)) {
      anyWrong = true;
      inputs.forEach(i => { i.classList.add('graded-wrong'); i.classList.remove('graded-correct'); });
      return;
    }

    if (checkMathAnswersMatch(combined, correct, formatRule)) {
      inputs.forEach(i => { i.classList.add('graded-correct'); i.classList.remove('graded-wrong'); });
    } else {
      inputs.forEach(i => { i.classList.add('graded-wrong'); i.classList.remove('graded-correct'); });
      anyWrong = true;
    }
  });

  if (anyWrong) {
    playBubbleTap();
    return;
  }

  triggerGrandCelebration(SECTIONS_DATA[selectedSectionIdx]);
}

/* ROUGH PAD ENGINE WITH DYNAMIC RESIZEOBSERVER */
let roughCanvas = null;
let roughCtx = null;
let roughIsDrawing = false;
let roughCurrentTool = 'pen';
let roughActiveColor = '#1E272E';
let isPenOnlyMode = false;
let roughUndoStack = [];
let resizeObserver = null;

function roughStorageKey() {
  return "v6_zaina_maths_rough_pad_canvas";
}

function toggleRoughPad() {
  playBubbleTap();
  const pad = document.getElementById("floatingRoughPad");
  const isShown = pad.style.display === "flex";
  pad.style.display = isShown ? "none" : "flex";
  if (!isShown) {
    setTimeout(initRoughCanvas, 50);
  } else {
    saveRoughCanvas();
  }
}

function initRoughCanvas() {
  roughCanvas = document.getElementById("roughCanvas");
  if (!roughCanvas) return;
  roughCtx = roughCanvas.getContext("2d", { alpha: true });

  const viewport = document.getElementById("roughCanvasViewport");
  syncCanvasToViewport(viewport);

  if (!resizeObserver && window.ResizeObserver) {
    resizeObserver = new ResizeObserver(() => {
      syncCanvasToViewport(viewport);
    });
    resizeObserver.observe(viewport);
  }

  setupRoughPointerEvents();
}

function syncCanvasToViewport(viewport) {
  if (!roughCanvas || !roughCtx) return;
  const rect = viewport.getBoundingClientRect();
  if (rect.width <= 0 || rect.height <= 0) return;

  const dpr = window.devicePixelRatio || 1;
  const newWidth = Math.floor(rect.width * dpr);
  const newHeight = Math.floor(rect.height * dpr);

  if (roughCanvas.width === newWidth && roughCanvas.height === newHeight) return;

  let tempBuffer = null;
  if (roughCanvas.width > 0 && roughCanvas.height > 0) {
    tempBuffer = document.createElement("canvas");
    tempBuffer.width = roughCanvas.width;
    tempBuffer.height = roughCanvas.height;
    const tempCtx = tempBuffer.getContext("2d");
    tempCtx.drawImage(roughCanvas, 0, 0);
  }

  roughCanvas.width = newWidth;
  roughCanvas.height = newHeight;
  roughCanvas.style.width = rect.width + "px";
  roughCanvas.style.height = rect.height + "px";
  roughCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (tempBuffer) {
    roughCtx.drawImage(tempBuffer, 0, 0, tempBuffer.width / dpr, tempBuffer.height / dpr);
  } else {
    loadRoughCanvas();
  }
}

function saveRoughCanvas() {
  if (!roughCanvas || roughCanvas.width <= 0) return;
  try {
    localStorage.setItem(storageKeyForId("rough_canvas_data"), roughCanvas.toDataURL());
  } catch (e) {}
}

function loadRoughCanvas() {
  const saved = localStorage.getItem(storageKeyForId("rough_canvas_data"));
  if (saved) {
    const img = new Image();
    img.onload = () => {
      roughCtx.save();
      roughCtx.setTransform(1, 0, 0, 1, 0, 0);
      roughCtx.clearRect(0, 0, roughCanvas.width, roughCanvas.height);
      roughCtx.drawImage(img, 0, 0, roughCanvas.width, roughCanvas.height);
      roughCtx.restore();
      pushRoughUndo();
    };
    img.src = saved;
  } else {
    pushRoughUndo();
  }
}

function pushRoughUndo() {
  if (!roughCanvas) return;
  try {
    roughUndoStack.push(roughCanvas.toDataURL());
    if (roughUndoStack.length > 20) roughUndoStack.shift();
  } catch (e) {}
}

function undoRoughStroke() {
  if (roughUndoStack.length > 1) {
    roughUndoStack.pop();
    const previous = roughUndoStack[roughUndoStack.length - 1];
    const img = new Image();
    img.onload = () => {
      roughCtx.save();
      roughCtx.setTransform(1, 0, 0, 1, 0, 0);
      roughCtx.clearRect(0, 0, roughCanvas.width, roughCanvas.height);
      roughCtx.drawImage(img, 0, 0, roughCanvas.width, roughCanvas.height);
      roughCtx.restore();
      saveRoughCanvas();
    };
    img.src = previous;
  }
}

  saveRoughCanvas();
};

document.getElementById('toolUndo').onclick = undoRoughStroke;

function togglePalmRejectionMode() {
  isPenOnlyMode = !isPenOnlyMode;
  const btn = document.getElementById('btnPalmMode');
  btn.textContent = isPenOnlyMode ? "✍️ S-Pen" : "👆 Touch";
  btn.classList.toggle('active', isPenOnlyMode);
}

document.querySelectorAll('.floating-rough-pad .color-swatch').forEach(swatch => {
  swatch.onclick = () => {
    document.querySelectorAll('.floating-rough-pad .color-swatch').forEach(s => s.classList.remove('active'));
    swatch.classList.add('active');
    roughActiveColor = swatch.getAttribute('data-color');
    roughCurrentTool = 'pen';
    document.getElementById('toolPen').classList.add('active');
    document.getElementById('toolEraser').classList.remove('active');
  };
});

let lastX = 0, lastY = 0;

function setupRoughPointerEvents() {
  roughCanvas.onpointerdown = (e) => {
    if (isPenOnlyMode && e.pointerType !== 'pen') return;
    roughIsDrawing = true;
    try { roughCanvas.setPointerCapture(e.pointerId); } catch (_) {}

    const rect = roughCanvas.getBoundingClientRect();
    lastX = e.clientX - rect.left;
    lastY = e.clientY - rect.top;

    roughCtx.beginPath();
    roughCtx.moveTo(lastX, lastY);
    roughCtx.lineCap = 'round';
    roughCtx.lineJoin = 'round';

    if (roughCurrentTool === 'eraser') {
      roughCtx.globalCompositeOperation = 'destination-out';
      roughCtx.lineWidth = 26;
    } else {
      roughCtx.globalCompositeOperation = 'source-over';
      roughCtx.strokeStyle = roughActiveColor;
      const pressure = (e.pressure && e.pressure > 0) ? e.pressure : 0.5;
      roughCtx.lineWidth = 3.6 * (pressure * 1.5 + 0.35);
    }
    e.preventDefault();
  };

  roughCanvas.onpointermove = (e) => {
    if (!roughIsDrawing) return;
    const rect = roughCanvas.getBoundingClientRect();
    const currX = e.clientX - rect.left;
    const currY = e.clientY - rect.top;

    roughCtx.lineTo(currX, currY);
    roughCtx.stroke();
    lastX = currX;
    lastY = currY;
    e.preventDefault();
  };

  const stopDrawing = (e) => {
    if (roughIsDrawing) {
      roughIsDrawing = false;
      try { roughCanvas.releasePointerCapture(e.pointerId); } catch (_) {}
      roughCtx.closePath();
      roughCtx.globalCompositeOperation = 'source-over';
      pushRoughUndo();
      saveRoughCanvas();
    }
  };

  roughCanvas.onpointerup = stopDrawing;
  roughCanvas.onpointercancel = stopDrawing;
  roughCanvas.onpointerleave = stopDrawing;
}

(function makeDraggablePad() {
  const box = document.getElementById("floatingRoughPad");
  const handle = document.getElementById("roughHeader");
  let isDragging = false;
  let startX = 0, startY = 0, initLeft = 0, initTop = 0;

  handle.addEventListener("pointerdown", (e) => {
    if (e.target.tagName === 'BUTTON') return;
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
    const rect = box.getBoundingClientRect();
    initLeft = rect.left;
    initTop = rect.top;
    handle.setPointerCapture(e.pointerId);
  });

  handle.addEventListener("pointermove", (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    box.style.left = Math.max(10, initLeft + dx) + "px";
    box.style.top = Math.max(10, initTop + dy) + "px";
    box.style.right = "auto";
    box.style.bottom = "auto";
  });

  const stopDrag = (e) => {
    isDragging = false;
    try { handle.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  handle.addEventListener("pointerup", stopDrag);
  handle.addEventListener("pointercancel", stopDrag);
})();

window.addEventListener("load", () => {
  switchSection(0, false);
});
window.addEventListener("beforeunload", saveRoughCanvas);
window.addEventListener("pagehide", saveRoughCanvas);
</script>
</body>
