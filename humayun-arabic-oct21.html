<script>
function imgFallback(img, emoji){ const s=document.createElement('span'); s.textContent=emoji; s.style.fontSize='28px'; img.replaceWith(s); }
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let audioCtx = null;
function initAudioCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function playRollSound(unrolling){
  try{
    initAudioCtx();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const len = audioCtx.sampleRate * (unrolling ? 0.6 : 0.5);
    const buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<len;i++){
      const t = i/len;
      const rustle = (Math.random()*2-1) * Math.exp(-t*2) * 0.3;
      const rumble = Math.sin(2*Math.PI*80*t) * Math.exp(-t*3) * 0.2;
      data[i] = (rustle + rumble) * (unrolling ? 1 : 0.8);
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = unrolling ? 1200 : 800;
    filter.Q.value = 0.7;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(unrolling ? 0.18 : 0.14, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (unrolling ? 0.6 : 0.5));
    src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start();
  }catch(e){}
}
const TRADITIONAL_WORDS = [
  {en:'bear', ar:'دُبٌّ', arSimple:'دُبّ'}, {en:'house', ar:'بَيْتٌ', arSimple:'بَيْت'},
  {en:'apple', ar:'تُفَّاحٌ', arSimple:'تُفَّاح'}, {en:'students', ar:'تَلَامِيذُ', arSimple:'تَلَامِيذ'},
  {en:'books', ar:'كُتُبٌ', arSimple:'كُتُب'}, {en:'chair', ar:'كُرْسِيٌّ', arSimple:'كُرْسِيّ'},
  {en:'map', ar:'خَرِيطَةٌ', arSimple:'خَرِيطَة'}, {en:'ox', ar:'ثَوْرٌ', arSimple:'ثَوْر'},
  {en:'flower', ar:'زَهْرَةٌ', arSimple:'زَهْرَة'}, {en:'chick', ar:'صَوْصٌ', arSimple:'صَوْص'},
  {en:'father', ar:'أَبٌ', arSimple:'أَب'}, {en:'corn', ar:'ذُرَةٌ', arSimple:'ذُرَة'},
  {en:'room', ar:'غُرْفَةٌ', arSimple:'غُرْفَة'}, {en:'student', ar:'تِلْمِيذٌ', arSimple:'تِلْمِيذ'},
  {en:'book', ar:'كِتَابٌ', arSimple:'كِتَاب'}, {en:'table', ar:'مَكْتَبٌ', arSimple:'مَكْتَب'},
  {en:'juice', ar:'عَصِيرٌ', arSimple:'عَصِير'}, {en:'horse', ar:'حِصَانٌ', arSimple:'حِصَان'},
  {en:'head', ar:'رَأْسٌ', arSimple:'رَأْس'}, {en:'sun', ar:'شَمْسٌ', arSimple:'شَمْس'}
];
const VOCAB_AR_EN = [
  ['جُغْرَافِيَا','geography'], ['حِسَابٌ','Mathematics'], ['مَكْتَبَةٌ','library'], ['مَدْرَسَةٌ','school'],
  ['عَرَبِيَّةٌ','Arabic'], ['سُورَةٌ','chapter'], ['مَسْجِدٌ','mosque'], ['سُوقٌ','market'],
  ['حَدِيقَةٌ','garden'], ['فَصْلٌ','classroom'], ['حَقِيبَةٌ','bag'], ['جَرَسٌ','bell'],
  ['مُخْتَبَرٌ','lab'], ['مَرِيضٌ','sick person'], ['وَاجِبٌ','homework'], ['حَاسُوبٌ','computer']
].map(([p,a]) => ({p, a, pl:'ar', al:'en'}));
const DEFINITE_IV = [
  ['دُبٌّ','الدُّبُّ'], ['بَيْتٌ','البَيْتُ'], ['تُفَّاحٌ','التُّفَّاحُ'], ['تَلَامِيذُ','التَّلَامِيذُ'], ['كُتُبٌ','الكُتُبُ'],
  ['كُرْسِيٌّ','الكُرْسِيُّ'], ['خَرِيطَةٌ','الخَرِيطَةُ'], ['ثَوْرٌ','الثَّوْرُ'], ['زَهْرَةٌ','الزَّهْرَةُ'], ['صَوْصٌ','الصَّوْصُ'],

].map(([p,a]) => ({p, a, pl:'ar', al:'ar'}));

  ['الحَدِيقَةُ','حَدِيقَةٌ'], ['الفَصْلُ','فَصْلٌ'], ['الحَقِيبَةُ','حَقِيبَةٌ'], ['الجَرَسُ','جَرَسٌ'],
  ['العَرَبِيَّةُ','عَرَبِيَّةٌ'], ['السُّورَةُ','سُورَةٌ'], ['المَسْجِدُ','مَسْجِدٌ'], ['السُّوقُ','سُوقٌ'],
  ['المُخْتَبَرُ','مُخْتَبَرٌ'], ['المَرِيضُ','مَرِيضٌ'], ['الوَاجِبُ','وَاجِبٌ'], ['الحَاسُوبُ','حَاسُوبٌ']

const DEMONSTRATIVE_VI_VII = [
  ['مَسْجِدٌ','هَذَا'], ['مَكْتَبَةٌ','هَذِهِ'], ['بَيْتٌ','هَذَا'], ['دُرَّةٌ','هَذِهِ'], ['عَصِيرٌ','هَذَا'], ['خَرِيطَةٌ','هَذِهِ'],
  ['مَدْرَسَةٌ','تِلْكَ'], ['سُوقٌ','ذَلِكَ'], ['غُرْفَةٌ','تِلْكَ'], ['كِتَابٌ','ذَلِكَ'], ['سُورَةٌ','تِلْكَ'], ['ثَوْرٌ','ذَلِكَ']
].map(([n,a]) => ({p:'______ ' + n, a, pl:'ar', al:'ar'}));
const PREPOSITIONS_VIII = [
  {q:'أَيْنَ الكِتَابُ؟', p:'الكِتَابُ ______ الحَقِيبَةِ.', icon:'assets/prep-bag.png', iconAlt:'🎒', a:'فِي', pl:'ar', al:'ar'},
  {q:'أَيْنَ الكِتَابُ؟', p:'الكِتَابُ ______ المَكْتَبِ.', icon:'assets/prep-on-table.png', iconAlt:'📖', a:'عَلَى', pl:'ar', al:'ar'},
  {q:'أَيْنَ الكِتَابُ؟', p:'الكِتَابُ ______ المَكْتَبِ.', icon:'assets/prep-under-table.png', iconAlt:'📚', a:'تَحْتَ', pl:'ar', al:'ar'}
];
const SECTIONS = [
  {id:'sec1', title:'Section I', titleAr:'الأساسيات', sub:'Worksheet I • 5 words • bear→books', words:TRADITIONAL_WORDS.slice(0,5)},
  {id:'sec2', title:'Section I', titleAr:'العائلة', sub:'Worksheet I • 5 words • chair→chick', words:TRADITIONAL_WORDS.slice(5,10)},
  {id:'sec3', title:'Section I', titleAr:'الصف', sub:'Worksheet I • 5 words • father→book', words:TRADITIONAL_WORDS.slice(10,15)},
  {id:'sec4', title:'Section I', titleAr:'الطبيعة', sub:'Worksheet I • 5 words • table→sun', words:TRADITIONAL_WORDS.slice(15,20)},
  {id:'vocab', title:'Section II', titleAr:'المفردات', sub:'Arabic → English • 16 words', type:'items', items:VOCAB_AR_EN},
  {id:'sec5', title:'Section III', titleAr:'الشمسية والقمرية', sub:'Solar & Lunar letters • شمسية/قمرية', special:'letters'},
  {id:'def', title:'Section IV', titleAr:'التعريف', sub:'20 words • Definite • الدب', type:'items', items:DEFINITE_IV},
  {id:'ind', title:'Section V', titleAr:'التنكير', sub:'16 words • Indefinite • حساب', type:'items', items:INDEFINITE_V},
  {id:'demo', title:'Sections VI-VII', titleAr:'هذا وذلك', sub:'12 sentences • هذا/هذه/ذلك/تلك', type:'items', items:DEMONSTRATIVE_VI_VII},
  {id:'prep', title:'Section VIII', titleAr:'حروف الجر', sub:'3 pictures • في/على/تحت • Book icons', type:'items', items:PREPOSITIONS_VIII}
];
const PIN_CHECK = '37b6c794';
const PIN_SALT = 'humayun-ar-v5:';
const UNLOCK_MINUTES = 10;
let mode = 'write';
let expandedId = null;
let scrollUnfolded = false;
let headerHidden = false;
const stripHistory = {};
function fnv1a(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return (h>>>0).toString(16).padStart(8,'0'); }
function isUnlocked(){ return Number(store.get('humayun_ar_unlock_until')||0) > Date.now(); }
function unlockSession(){ store.set('humayun_ar_unlock_until', String(Date.now() + UNLOCK_MINUTES*60*1000)); }
function practiceVisible(){ return mode==='practice' && isUnlocked(); }
let arVoice=null, enVoice=null;
function loadVoices(){ if(!('speechSynthesis' in window)) return; const v=speechSynthesis.getVoices(); arVoice=v.find(x=>/^ar/i.test(x.lang))||null; enVoice=v.find(x=>/^en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; }
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=loadVoices; loadVoices(); }
function speak(text, lang, el){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=0.82; u.pitch=1.0;
    const v=lang.startsWith('ar')?arVoice:enVoice; if(v) u.voice=v;
    speechSynthesis.speak(u);
    if(el){ el.style.background='rgba(201,168,106,0.25)'; setTimeout(()=>el.style.background='',380); }
  }catch(e){}
}
function speakEl(el, lang){ speak(el.dataset.say || el.textContent, lang, el); }
function escAttr(t){ return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function buildRail(){
  const c=$('railContainer'); c.innerHTML='';
  SECTIONS.forEach((s,i)=>{
    const wrap=document.createElement('div'); wrap.className='flex flex-col items-center';
    const btn=document.createElement('button'); btn.className='rail-lantern'; btn.id='rail-'+s.id; btn.setAttribute('aria-label', s.title+' '+s.titleAr);
    btn.innerHTML='<img src="assets/lantern-gem.webp" alt="" onerror="imgFallback(this,\'🏮\')">';
    btn.onclick=()=>openSection(s.id); wrap.appendChild(btn);
    if(i<SECTIONS.length-1){ const line=document.createElement('div'); line.className='rail-line'; wrap.appendChild(line); }
    c.appendChild(wrap);
  });
}
function buildCards(){
  const c=$('cardsContainer'); c.innerHTML='';
  SECTIONS.forEach(sec=>{
    const card=document.createElement('div'); card.className='scroll-card'; card.id='card-'+sec.id; card.setAttribute('role','button'); card.tabIndex=0;
    card.innerHTML=`<div class="flex items-center justify-between"><div class="card-banner"><img src="assets/lantern-gem.webp" class="w-4 h-4" alt="" onerror="this.style.display='none'"> <span class="sec-title-main">${sec.title}</span> <span class="ar-heading">• ${sec.titleAr}</span></div><img src="assets/badge-crescent-star.webp" class="w-6 h-6" alt="" onerror="this.style.display='none'"></div><div class="text-[11px] text-[#8B7355] mt-1">${sec.sub}</div>`;
    card.onclick=()=>openSection(sec.id); card.onkeydown=e=>{ if(e.key==='Enter') openSection(sec.id); };
    c.appendChild(card);
  });
}
function strip(key, extraClass, traceText){
  const cls='ruled'+(extraClass?' '+extraClass:'');
  const trace=traceText?`<span class="trace">${traceText}</span>`:'';
  return `<div class="strip-wrap">
      <div class="${cls}">${trace}<canvas class="ink" data-ink-key="${key}" width="560" height="96" aria-label="Writing area"></canvas></div>
      <div class="strip-tools">
        <button class="strip-btn" type="button" onclick="event.stopPropagation(); undoStrip('${key}')" aria-label="Undo">↩️</button>
        <button class="strip-btn clear" type="button" onclick="event.stopPropagation(); clearStrip('${key}')" aria-label="Clear">🗑️</button>
      </div>
    </div>`;
}
function renderItems(sec, secId, show, hideClass, practiceClass){
  return sec.items.map((it,i)=>{
    const key=secId+'-'+i+'-'+mode;
    const pCls=it.pl==='en'?'english-clean':'arabic-trad';
    const aCls=it.al==='en'?'english-clean':'arabic-trad';
    const pLang=it.pl==='en'?'en-GB':'ar-SA';
    const aLang=it.al==='en'?'en-GB':'ar-SA';
    const q=it.q?`<div class="q-line">${it.q}</div>`:'';
    const isPrepIcon = it.icon && it.icon.includes('assets/');
    const iconHtml = isPrepIcon ? `<img src="${it.icon}" class="prep-icon" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"><span style="display:none" class="prompt-icon">${it.iconAlt}</span>` : `<span class="prompt-icon">${it.icon||''}</span> `;
    return `<div class="strip-row-rtl">
      <div class="eng-side">${iconHtml}<span class="${pCls} prompt-txt" data-say="${escAttr(it.p.replace(/_+/g,'').trim())}" onclick="speakEl(this,'${pLang}')">${it.p}</span></div>
      <div class="canvas-side">${strip(key, practiceClass, show?it.a:'')}</div>
      <div class="ar-side"><span class="${aCls} ${hideClass}" data-say="${escAttr(it.a)}" onclick="speakEl(this,'${aLang}')">${it.a}</span></div>
    </div>`;
  }).join('');
}
function renderModal(secId){
  const sec=SECTIONS.find(s=>s.id===secId);
  const body=$('modalBody');
  $('modalTitle').innerHTML=`<span class="sec-title-main">${sec.title}</span> <span class="sec-title-ar">• ${sec.titleAr}</span>`;
  $('modalSub').textContent=sec.sub;
  const show=practiceVisible();
  const hideClass=show?'':'hidden-answer';
  const practiceClass=show?'practice':'';
  if(sec.type==='items'){
    body.innerHTML=renderItems(sec, secId, show, hideClass, practiceClass);
  } else if(sec.special==='letters'){
  const boxes=[['شَمْسِيَّةٌ','الشَّمْسِيَّةُ',SOLAR,'shamsi'],['قَمَرِيَّةٌ','القَمَرِيَّةُ',LUNAR,'qamari']];
  body.innerHTML=`<div class="grid grid-cols-1 md:grid-cols-2 gap-3">${boxes.map(([,title,letters,k])=>`
    <div class="border-2 border-[#E8DCC0] rounded-xl p-3 bg-[#FFFEF7]">
      <div class="text-center font-black text-[#3B2A14] sec-title-ar">${title}</div>
      <div class="text-center arabic-trad ${hideClass}" onclick="speak(this.textContent,'ar-SA',this)">${letters}</div>
      <div class="mt-2">${strip(secId+'-'+k+'-1-'+mode, practiceClass, '')}</div>
      <div class="mt-2">${strip(secId+'-'+k+'-2-'+mode, practiceClass, show ? letters : '')}</div>
    </div>`).join('')}</div>`;
  } else {
    body.innerHTML=sec.words.map((w,i)=>{
      const key=secId+'-'+i+'-'+mode;
      return `<div class="strip-row-rtl">
        <div class="eng-side"><span class="english-clean" onclick="speak('${(w.en).replace(/'/g,"\\'")}','en-GB',this)">${w.en}</span></div>
        <div class="canvas-side">${strip(key, practiceClass, show?w.ar:'')}</div>
        <div class="ar-side"><span class="arabic-trad ${hideClass}" onclick="speak('${(w.arSimple).replace(/'/g,"\\'")}','ar-SA',this)">${w.ar}</span></div>
      </div>`;
    }).join('');
  }
  setTimeout(()=>{
    body.querySelectorAll('canvas.ink').forEach(c=>{
      const dpr=window.devicePixelRatio||1;
      const rect=c.getBoundingClientRect();
      if(rect.width < 10) return;
      c.width=Math.round(rect.width*dpr);
      c.height=Math.round(96*dpr);
      c.style.width=rect.width+'px';
      c.style.height='96px';
      const ctx=c.getContext('2d');
      try{ ctx.setTransform(1,0,0,1,0,0); }catch(e){}
      c.dataset.initialized='1';
      c.style.touchAction='none';
      if(window.UniversalPen && window.UniversalPen.forceCanvas) window.UniversalPen.forceCanvas(c);
      if(!stripHistory[c.dataset.inkKey]) stripHistory[c.dataset.inkKey]=[];
      try{ stripHistory[c.dataset.inkKey].push(c.toDataURL()); }catch(e){}
    });
  },120);
  $('prevBtn').disabled=SECTIONS.findIndex(s=>s.id===secId)<=0;
  $('nextBtn').disabled=SECTIONS.findIndex(s=>s.id===secId)>=SECTIONS.length-1;
  body.scrollTop=0;
}
function openSection(id){ expandedId=id; renderModal(id); $('sectionModal').classList.add('open'); $('sectionModal').setAttribute('aria-hidden','false'); document.querySelectorAll('.rail-lantern').forEach(el=>el.classList.remove('active')); const r=$('rail-'+id); if(r) r.classList.add('active'); }
function closeModal(){ $('sectionModal').classList.remove('open'); $('sectionModal').setAttribute('aria-hidden','true'); }
function stepSection(d){ const idx=SECTIONS.findIndex(s=>s.id===expandedId); const next=SECTIONS[idx+d]; if(next) openSection(next.id); }
function canvasFor(key){ return document.querySelector(`canvas[data-ink-key="${key}"]`); }
function clearStrip(key){
  const c=canvasFor(key); if(!c) return;
  const ctx=c.getContext('2d');
  try{ ctx.setTransform(1,0,0,1,0,0); }catch(e){}
  ctx.clearRect(0,0,c.width,c.height);
  if(window.UniversalPen){ UniversalPen.state.activeCanvas=c; UniversalPen.state.ctx=ctx; if(UniversalPen.clearInk) UniversalPen.clearInk(); else UniversalPen.clearCanvas && UniversalPen.clearCanvas(); }
  stripHistory[key]=[]; try{ stripHistory[key].push(c.toDataURL()); }catch(e){}
}
function undoStrip(key){
  const c=canvasFor(key); if(!c) return;
  if(!stripHistory[key]||stripHistory[key].length<2) return;
  stripHistory[key].pop();
  const prev=stripHistory[key][stripHistory[key].length-1];
  const ctx=c.getContext('2d');
  try{ ctx.setTransform(1,0,0,1,0,0); }catch(e){}
  const img=new Image(); img.onload=()=>{ ctx.clearRect(0,0,c.width,c.height); ctx.drawImage(img,0,0); if(window.UniversalPen){ window.UniversalPen.state.activeCanvas=c; window.UniversalPen.state.ctx=ctx; } }; img.src=prev;
}
function setModeUI(){
  const pr=$('practiceBtn'), wr=$('writeBtn');
  const practice=mode==='practice';
  pr.className='seg-btn '+(practice?'pill-on':'pill-off');
  pr.textContent=practice?'✓ Practice':(isUnlocked()?'Practice':'🔒 Practice');
  wr.className='seg-btn '+(practice?'pill-off':'pill-on');
}
function setMode(next){ mode=next; setModeUI(); if(expandedId) renderModal(expandedId); }
function showPin(){ $('pinInput').value=''; $('pinError').classList.add('hidden'); $('pinModal').classList.add('open'); $('pinModal').setAttribute('aria-hidden','false'); setTimeout(()=>$('pinInput').focus(),100); }
function hidePin(){ $('pinModal').classList.remove('open'); $('pinModal').setAttribute('aria-hidden','true'); }
function checkPin(){
  const entered=$('pinInput').value.trim();
  if(fnv1a(PIN_SALT+entered)===PIN_CHECK){
    unlockSession(); hidePin(); setMode('practice');
  } else { $('pinError').classList.remove('hidden'); $('pinInput').value=''; }
}
function applyBig(){ 
  const on=store.get('humayun_ar_big')==='1';
  document.body.classList.toggle('big', on);
  if(expandedId){ renderModal(expandedId); } 
  $('fontBtn').style.background = on ? '#FFD77A' : '#FFFEF7';
  $('fontBtn').style.color = on ? '#3B2A14' : '#5A3C22';
}
// English-style hub: save ink then go to index.html - no confirm
let isLeavingToHub = false;
function saveVisibleInk(){
  try{
    document.querySelectorAll('canvas.ink').forEach(c=>{
      const key=c.dataset.inkKey;
      if(!key) return;
      const d=store.get('LQ_INK_V16_'+location.pathname.replace(/^\//,'').replace(/\.html?$/i,'').replace(/[^a-z0-9_-]/gi,'_')+'__'+key);
      // also via UniversalPen save
      if(window.UniversalPen && window.UniversalPen.saveInkNow) window.UniversalPen.saveInkNow();
    });
  }catch(e){}
}
function exitToHub(e){
  if(e) e.preventDefault();
  if(isLeavingToHub) return false;
  isLeavingToHub=true;
  try{ saveVisibleInk(); if(window.UniversalPen && window.UniversalPen.saveInkNow) window.UniversalPen.saveInkNow(); }catch(_){}
  if(window.parent && window.parent!==window){
    window.parent.postMessage('close-lesson-to-hub','*');
    setTimeout(()=>{ isLeavingToHub=false; },1500);
    return false;
  }
  setTimeout(()=>{ window.location.href='index.html'; },80);
  return false;
}
function toggleScroll(){
  const wrap=$('rolledScrollWrap');
  const main=$('mainScroll');
  const avatar=$('hangingAvatar');
  const isRolled = wrap.classList.contains('rolled');
  avatar.classList.add('pulling');
  setTimeout(()=>avatar.classList.remove('pulling'), 600);
  if(isRolled){
    scrollUnfolded=true;
    playRollSound(true);
    wrap.classList.remove('rolled');
    wrap.classList.add('unrolled');
    setTimeout(()=>main.classList.add('open'),320);
    showRollHint('📜 Scroll unrolled - Tap Humayun or Roll Up to roll back');
  } else {
    scrollUnfolded=false;
    playRollSound(false);
    main.classList.remove('open');
    setTimeout(()=>{
      wrap.classList.remove('unrolled');
      wrap.classList.add('rolled');
      window.scrollTo({top:0, behavior:'smooth'});
    },320);
    showRollHint('📜 Scroll rolled - Tap to unroll again');
  }
}
function showRollHint(msg){
  const hint=$('rollHint');
  hint.textContent=msg;
  hint.classList.add('show');
  setTimeout(()=>hint.classList.remove('show'), 2500);
}
$('practiceBtn').onclick=()=>{ if(isUnlocked()) setMode('practice'); else showPin(); };
$('writeBtn').onclick=()=>setMode('write');
$('pinCancel').onclick=hidePin;
$('pinSubmit').onclick=checkPin;
$('pinInput').onkeydown=e=>{ if(e.key==='Enter') checkPin(); };
$('pinModal').onclick=e=>{ if(e.target.id==='pinModal') hidePin(); };
$('closeModal').onclick=closeModal;
$('sectionModal').onclick=e=>{ if(e.target.id==='sectionModal') closeModal(); };
$('prevBtn').onclick=()=>stepSection(-1);
$('nextBtn').onclick=()=>stepSection(1);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('pinModal').classList.contains('open')) hidePin(); else closeModal(); } });
$('rolledScrollWrap').onclick=toggleScroll;
$('rolledScrollWrap').onkeydown=e=>{ if(e.key==='Enter') toggleScroll(); };
$('hangingAvatar').onclick=()=>{ toggleScroll(); toggleHeader(); };
$('rollUpBtn').onclick=()=>{ if(scrollUnfolded) toggleScroll(); };
function toggleHeader(){ headerHidden=!headerHidden; $('topHeader').classList.toggle('hiddenBar', headerHidden); $('hangingAvatar').classList.toggle('hiddenPos', headerHidden); }
$('fontBtn').onclick=()=>{
  const cur=store.get('humayun_ar_big')==='1';
  store.set('humayun_ar_big', cur?'0':'1');
  applyBig();
  try{ if(window.UniversalPen){ window.UniversalPen.initAudio(); window.UniversalPen.playDing && window.UniversalPen.playDing(); } }catch(e){}
  showRollHint(cur ? 'Aa - Normal size' : 'Aa - Big size ✓');
};
buildRail(); buildCards(); applyBig(); setModeUI();
document.addEventListener('pointerup', e=>{
  const canvas=e.target.closest('canvas'); if(!canvas) return;
  const key=canvas.dataset.inkKey; if(!key) return;
  if(!stripHistory[key]) stripHistory[key]=[];
  setTimeout(()=>{ try{ stripHistory[key].push(canvas.toDataURL()); if(stripHistory[key].length>22) stripHistory[key].shift(); }catch(err){} },60);
});
setTimeout(()=>{ showRollHint('📜 Tap scroll or Humayun to roll / unroll'); }, 1200);
window.addEventListener('pagehide', ()=>{ try{ saveVisibleInk(); }catch(_){} });
</script>
