<style>
  *{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }

  #topHeader.hiddenBar{ transform:translateY(-110%); opacity:0; pointer-events:none; }
  #hangingAvatar{ position:fixed; top:0; left:50%; transform:translateX(-50%); z-index:45; width:150px; height:150px; background:transparent; border:0; display:flex; align-items:flex-start; justify-content:center; cursor:pointer; transition:all .4s cubic-bezier(.34,1.56,.64,1); }
  #hangingAvatar img{ width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 8px 14px rgba(0,0,0,.55)); }
  #hangingAvatar.hiddenPos{ top:-30px; transform:translateX(-50%) scale(0.72); }
  #rolledScrollWrap{ position:relative; z-index:2; width:min(520px,88vw); margin:160px auto 0; cursor:pointer; transition:all .7s cubic-bezier(.34,1.2,.64,1); }
  #rolledScrollWrap.unrolled{ opacity:0; transform:scale(0.9) translateY(-30px); pointer-events:none; max-height:0; margin:0 auto; overflow:hidden; }
  .rolled-scroll{ background:linear-gradient(180deg,#FFF9E6,#E8DCC0); border-radius:28px; padding:18px 16px; box-shadow:0 18px 40px rgba(0,0,0,.4); border:2px solid #C9A86A; text-align:center; position:relative; }

  .parchment-scroll{ position:relative; z-index:1; width:min(980px,94vw); margin:0 auto; background:linear-gradient(180deg,#FFFEF7 0%,#FFF8E1 100%); border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,.45); padding:0 0 22px 0; max-height:0; opacity:0; overflow:hidden; transform:scaleY(0.12); transform-origin:top center; transition:all .85s cubic-bezier(.34,1.2,.64,1); }

  #lanternRail{ position:fixed; left:0; top:70px; bottom:0; width:86px; z-index:30; background:linear-gradient(180deg,rgba(11,20,38,0.92),rgba(11,20,38,0.75)); border-right:1.5px solid rgba(201,168,106,0.25); display:flex; flex-direction:column; align-items:center; padding:12px 0 120px; overflow-y:auto; }
  .rail-lantern{ width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .3s; background:rgba(255,255,255,0.06); border:2px solid rgba(201,168,106,0.18); }
  .rail-lantern img{ width:36px; height:36px; object-fit:contain; }
  .rail-lantern.active{ background:radial-gradient(circle,#FFF3C0,#C9A86A); border-color:#FFD77A; box-shadow:0 0 18px rgba(255,215,122,.65); transform:scale(1.08); }
  .rail-line{ width:2px; height:16px; background:rgba(201,168,106,0.25); }
  .scroll-card{ position:relative; margin:14px 16px; padding:14px 16px; background:#FFFEF7; border:1.5px solid #E8DCC0; border-radius:14px; cursor:pointer; transition:all .25s; }
  .card-banner{ display:inline-flex; align-items:center; gap:6px; background:#FFF3C0; border:1px solid rgba(201,168,106,0.35); border-radius:999px; padding:3px 10px; font-size:.76rem; font-weight:800; color:#5A3C22; }

  .strip-row-rtl{ display:flex; align-items:center; gap:10px; margin:16px 0; direction:ltr; flex-wrap:nowrap; }
  .strip-row-rtl .eng-side{ order:1; min-width:82px; flex-shrink:0; }
  .strip-row-rtl .canvas-side{ order:2; flex:1; min-width:0; }
  .strip-row-rtl .ar-side{ order:3; min-width:100px; display:flex; justify-content:flex-end; flex-shrink:0; }
  .strip-wrap{ position:relative; width:100%; height:88px; }
  .big .strip-wrap{ height:102px; }
  .ruled{ position:absolute; inset:0; border:1.8px solid #D9C8A0; border-radius:12px; background:linear-gradient(180deg,#FFFFFF 0%,#FFFEF7 100%); overflow:hidden; }
  .ruled::before{ content:""; position:absolute; left:0; right:0; top:calc(50% + 22px); height:1px; background:#8FB8E8; }
  .ruled.practice{ background:linear-gradient(180deg,#FFFEF7 0%,#FFF8E1 100%); }
  .trace{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-family:'Amiri','Lateef',serif; font-size:28px; color:#8B7355; opacity:.18; pointer-events:none; white-space:nowrap; z-index:0; font-weight:400; }
  .big .trace{ font-size:34px; }
  .ink{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; z-index:1; }
  .strip-tools{ position:absolute; top:-10px; right:-8px; display:flex; gap:5px; z-index:3; }
  .strip-btn{ width:30px; height:30px; border-radius:50%; border:1.6px solid #C9A86A; background:#FFFEF7; display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.18); padding:0; }
  .strip-btn.clear{ background:#FFF1F1; border-color:#E0A0A0; }
  #sectionModal{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:14px; background:rgba(11,20,38,0.72); backdrop-filter:blur(8px); opacity:0; pointer-events:none; transition:opacity .45s; }
  #sectionModal.open{ opacity:1; pointer-events:auto; }
  .modal-parchment{ width:min(860px,96vw); max-height:92vh; display:flex; flex-direction:column; background:linear-gradient(180deg,#FFFEF7,#FFF8E1); border-radius:18px; border:2px solid #C9A86A; box-shadow:0 24px 80px rgba(0,0,0,.5); transform:scale(0.9) translateY(20px); transition:transform .5s cubic-bezier(.34,1.56,.64,1); }
  #sectionModal.open .modal-parchment{ transform:none; }
  .modal-body{ overflow-y:auto; padding:12px; -webkit-overflow-scrolling:touch; }
  .modal-head{ padding:10px 12px; border-bottom:2px solid rgba(201,168,106,.3); display:flex; align-items:center; justify-content:space-between; gap:8px; background:#FFFEF7; }
  .modal-foot{ padding:10px 12px; border-top:1px solid rgba(201,168,106,.25); display:flex; gap:8px; background:#FFFEF7; }
  .nav-btn{ flex:1; padding:8px; border-radius:999px; background:#1A2340; color:#FFD77A; font-weight:700; font-size:12px; border:2px solid #C9A86A; cursor:pointer; }
  .nav-btn:disabled{ opacity:.4; cursor:not-allowed; }
  #pinModal{ position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; background:rgba(11,20,38,0.82); backdrop-filter:blur(6px); opacity:0; pointer-events:none; transition:opacity .3s; }
  #pinModal.open{ opacity:1; pointer-events:auto; }
  #pinModal .pin-box{ background:#FFFEF7; border:2px solid #C9A86A; border-radius:16px; padding:20px; width:min(320px,90vw); text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.4); }
  .hidden{ display:none !important; }
  .hdr-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; }
  .hdr-group{ display:flex; align-items:center; gap:8px; }
  .hdr-title{ color:#FFD77A; line-height:1.2; }
  .hdr-main{ font-weight:800; font-size:14px; }
  .hdr-sub{ font-size:10px; color:#C9A86A; }
  .hdr-logo{ width:28px; height:28px; object-fit:contain; }
  .hdr-seg{ display:flex; background:#1A2340; border:1px solid rgba(201,168,106,.3); border-radius:999px; padding:4px; gap:2px; }
  .seg-btn{ padding:4px 12px; border-radius:999px; font-size:12px; font-weight:700; border:0; cursor:pointer; font-family:inherit; }
  .icon-btn{ width:32px; height:32px; border-radius:999px; background:#FFFEF7; border:1px solid #C9A86A; color:#5A3C22; font-weight:900; font-size:12px; cursor:pointer; }
  .pin-title{ font-size:14px; font-weight:900; color:#3B2A14; }
  .pin-sub{ font-size:11px; color:#8B7355; margin-top:4px; }
  .pin-input{ margin-top:12px; width:100%; text-align:center; font-size:20px; letter-spacing:.4em; border:2px solid #C9A86A; border-radius:12px; padding:8px; background:#fff; font-family:inherit; }
  .pin-row{ display:flex; gap:8px; margin-top:12px; }
  .pin-btn{ flex:1; padding:8px; border-radius:999px; font-weight:700; font-size:12px; border:2px solid #C9A86A; cursor:pointer; font-family:inherit; }
  .pin-btn.primary{ background:#1A2340; color:#FFD77A; }
  .pin-btn.plain{ background:#fff; color:#3B2A14; border-color:#E8DCC0; }
  .pin-error{ font-size:11px; color:#dc2626; margin-top:8px; }
  .pill-on{ background:#FFD77A; color:#3B2A14; }
  .pill-off{ background:transparent; color:#C9A86A; }
</style>
</head>
<body>
<div id="bgLayer"></div>
<div class="night-overlay"></div>
<header id="topHeader" class="layer">
  <div class="hdr-row">
    <div class="hdr-group">
      <img src="assets/badge-crescent-star.webp" alt="" class="hdr-logo" onerror="this.style.display='none'">
      <div class="hdr-title">
        <div class="hdr-main">تعلم العربية • Arabic</div>
        <div class="hdr-sub">Unit 3 • Lesson 1 • S9 Tab</div>
      </div>
    </div>
    <div class="hdr-group">
      <div class="hdr-seg">
        <button id="practiceBtn" class="seg-btn"></button>
        <button id="writeBtn" class="seg-btn">Write</button>
      </div>
      <button id="fontBtn" class="icon-btn" aria-label="Text size">Aa</button>
    </div>
  </div>
</header>
<button id="hangingAvatar" class="layer" title="Show or hide header" aria-label="Show or hide header">
  <img src="assets/humayun-scholar.webp" alt="Humayun" onerror="this.textContent='👦'; this.style.fontSize='60px'">
</button>
<div id="rolledScrollWrap" class="layer" role="button" tabindex="0" aria-label="Unroll the scroll">
  <div class="rolled-scroll">
    <div class="flex items-center justify-center gap-2">
      <img src="assets/lantern-gem.webp" class="w-8 h-8" alt="" onerror="this.textContent='🏮'">
      <div class="font-extrabold text-[#5A3C22] text-[17px]">📜 Scroll is Rolled</div>
      <img src="assets/lantern-gem.webp" class="w-8 h-8" alt="" onerror="this.textContent='🏮'">
    </div>
    <div class="text-[12px] text-[#6B5A3E] mt-1">Tap to unroll • 10 sections • S9 Tab Optimized</div>
  </div>
</div>
<nav id="lanternRail" class="layer" aria-label="Sections"><div id="railContainer" class="flex flex-col items-center mt-1"></div></nav>
<main class="parchment-scroll layer" id="mainScroll"><div id="cardsContainer"></div></main>
<div id="sectionModal" aria-hidden="true">
  <div class="modal-parchment" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <div class="hdr-group min-w-0">
        <img src="assets/lantern-gem.webp" class="w-7 h-7" alt="" onerror="this.style.display='none'">
        <div class="min-w-0">
          <div class="font-black text-[#3B2A14] text-[14px] sec-title-ar" id="modalTitle">Section</div>
          <div class="text-[11px] text-[#8B7355]" id="modalSub"></div>
        </div>
      </div>
      <button id="closeModal" class="icon-btn w-9 h-9 rounded-full bg-[#1A2340] text-[#FFD77A] border-2 border-[#C9A86A]" aria-label="Close">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
    <div class="modal-foot">
      <button id="prevBtn" class="nav-btn">Previous</button>
      <button id="nextBtn" class="nav-btn">Next</button>
    </div>
  </div>
</div>
<div id="pinModal" aria-hidden="true">
  <div class="pin-box">
    <div class="pin-title">Parent PIN Required</div>
    <div class="pin-sub">Practice shows answers. Enter PIN to unlock.</div>
    <input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
    <div class="pin-row">
      <button id="pinCancel" class="pin-btn plain">Cancel</button>
      <button id="pinSubmit" class="pin-btn primary">Unlock</button>
    </div>
    <div id="pinError" class="pin-error hidden">Wrong PIN.</div>
  </div>
</div>
<script src="shared/universal-pen.js"></script>
<script>

const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const TRADITIONAL_WORDS = [
  {en:'bear', ar:'دُبٌّ', arSimple:'دُبّ', audioEn:'bear', audioAr:'دُبّ'},

const VOCAB_AR_EN = [
  ['جُغْرَافِيَا','geography'], ['حِسَابٌ','Mathematics'], ['مَكْتَبَةٌ','library'], ['مَدْرَسَةٌ','school'],
  ['عَرَبِيَّةٌ','Arabic'], ['سُورَةٌ','chapter'], ['مَسْجِدٌ','mosque'], ['سُوقٌ','market'],

const INDEFINITE_V = [

].map(([n,a]) => ({p:'______ ' + n, a, pl:'ar', al:'ar'}));
const PREPOSITIONS_VIII = [
  {q:'أَيْنَ الكِتَابُ؟', p:'الكِتَابُ ______ الحَقِيبَةِ.', icon:'🎒', a:'فِي', pl:'ar', al:'ar'},
  {q:'أَيْنَ الكِتَابُ؟', p:'الكِتَابُ ______ المَكْتَبِ.', icon:'📖', a:'عَلَى', pl:'ar', al:'ar'},
  {q:'أَيْنَ الكِتَابُ؟', p:'الكِتَابُ ______ المَكْتَبِ.', icon:'📚', a:'تَحْتَ', pl:'ar', al:'ar'}
];
const SECTIONS = [
  {id:'sec1', title:'Section I', titleAr:'الأساسيات', sub:'Worksheet I • 5 words', words:TRADITIONAL_WORDS.slice(0,5)},
  {id:'sec2', title:'Section I', titleAr:'العائلة', sub:'Worksheet I • 5 words', words:TRADITIONAL_WORDS.slice(5,10)},
  {id:'sec3', title:'Section I', titleAr:'الصف', sub:'Worksheet I • 5 words', words:TRADITIONAL_WORDS.slice(10,15)},
  {id:'sec4', title:'Section I', titleAr:'الطبيعة', sub:'Worksheet I • 5 words', words:TRADITIONAL_WORDS.slice(15,20)},
  {id:'vocab', title:'Section II', titleAr:'المفردات', sub:'Arabic → English • 16 words', type:'items', items:VOCAB_AR_EN},
  {id:'sec5', title:'Section III', titleAr:'الشمسية والقمرية', sub:'Solar & Lunar letters', special:'letters'},
  {id:'def', title:'Section IV', titleAr:'التعريف', sub:'20 words • Definite', type:'items', items:DEFINITE_IV},
  {id:'ind', title:'Section V', titleAr:'التنكير', sub:'16 words • Indefinite', type:'items', items:INDEFINITE_V},
  {id:'demo', title:'Sections VI-VII', titleAr:'هذا وذلك', sub:'12 sentences', type:'items', items:DEMONSTRATIVE_VI_VII},
  {id:'prep', title:'Section VIII', titleAr:'حروف الجر', sub:'3 pictures', type:'items', items:PREPOSITIONS_VIII}
];
const SOLAR = 'ت ث د ذ ر ز س ش ص ض ط ظ ل ن';
const LUNAR = 'أ ب ج ح خ ع غ ف ق ك م هـ و ي';
const PIN_CHECK = '37b6c794';
const PIN_SALT = 'humayun-ar-v5:';
const UNLOCK_MINUTES = 10;
let mode = 'write';
let expandedId = null;
let scrollUnfolded = false;
let headerHidden = false;
const stripHistory = {};
function fnv1a(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return (h>>>0).toString(16).padStart(8,'0'); }
function isUnlocked(){ return Number(store.get('humayun_ar_unlock_until')||0) > Date.now(); }
function unlockSession(){ store.set('humayun_ar_unlock_until', String(Date.now() + UNLOCK_MINUTES*60*1000)); }
function practiceVisible(){ return mode==='practice' && isUnlocked(); }
let arVoice=null, enVoice=null;
function loadVoices(){ if(!('speechSynthesis' in window)) return; const v=speechSynthesis.getVoices(); arVoice=v.find(x=>/^ar/i.test(x.lang))||null; enVoice=v.find(x=>/^en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; }
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=loadVoices; loadVoices(); }
function speak(text, lang, el){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=0.82; u.pitch=1.0;
    const v=lang.startsWith('ar')?arVoice:enVoice; if(v) u.voice=v;
    speechSynthesis.speak(u);
    if(el){ el.style.background='rgba(201,168,106,0.25)'; setTimeout(()=>el.style.background='',380); }
  }catch(e){}
}
function speakEl(el, lang){ speak(el.dataset.say || el.textContent, lang, el); }
function escAttr(t){ return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function buildRail(){
  const c=$('railContainer'); c.innerHTML='';
  SECTIONS.forEach((s,i)=>{
    const wrap=document.createElement('div'); wrap.className='flex flex-col items-center';
    const btn=document.createElement('button'); btn.className='rail-lantern'; btn.id='rail-'+s.id; btn.setAttribute('aria-label', s.title+' '+s.titleAr);
    btn.innerHTML='<img src="assets/lantern-gem.webp" alt="" onerror="imgFallback(this,\'🏮\')">';
    btn.onclick=()=>openSection(s.id); wrap.appendChild(btn);
    if(i<SECTIONS.length-1){ const line=document.createElement('div'); line.className='rail-line'; wrap.appendChild(line); }
    c.appendChild(wrap);
  });
}
function buildCards(){
  const c=$('cardsContainer'); c.innerHTML='';
  SECTIONS.forEach(sec=>{
    const card=document.createElement('div'); card.className='scroll-card'; card.id='card-'+sec.id; card.setAttribute('role','button'); card.tabIndex=0;
    card.innerHTML=`<div class="flex items-center justify-between"><div class="card-banner"><img src="assets/lantern-gem.webp" class="w-4 h-4" alt="" onerror="this.style.display='none'"> <span class="sec-title-main">${sec.title}</span> <span class="ar-heading">• ${sec.titleAr}</span></div><img src="assets/badge-crescent-star.webp" class="w-6 h-6" alt="" onerror="this.style.display='none'"></div><div class="text-[11px] text-[#8B7355] mt-1">${sec.sub}</div>`;
    card.onclick=()=>openSection(sec.id); card.onkeydown=e=>{ if(e.key==='Enter') openSection(sec.id); };
    c.appendChild(card);
  });
}
function strip(key, extraClass, traceText){
  const cls='ruled'+(extraClass?' '+extraClass:'');
  const trace=traceText?`<span class="trace">${traceText}</span>`:'';
  return `<div class="strip-wrap">
      <div class="${cls}">${trace}<canvas class="ink" data-ink-key="${key}" width="560" height="88" aria-label="Writing area"></canvas></div>
      <div class="strip-tools">
        <button class="strip-btn" onclick="undoStrip('${key}')" aria-label="Undo">↩️</button>
        <button class="strip-btn clear" onclick="clearStrip('${key}')" aria-label="Clear">🗑️</button>
      </div>
    </div>`;
}
function renderItems(sec, secId, show, hideClass, practiceClass){
  return sec.items.map((it,i)=>{
    const key=secId+'-'+i+'-'+mode;
    const pCls=it.pl==='en'?'english-clean':'arabic-trad';
    const aCls=it.al==='en'?'english-clean':'arabic-trad';
    const pLang=it.pl==='en'?'en-GB':'ar-SA';
    const aLang=it.al==='en'?'en-GB':'ar-SA';
    const q=it.q?`<div class="q-line">${it.q}</div>`:'';
    const icon=it.icon?`<span class="prompt-icon">${it.icon}</span> `:'';
    return `<div class="strip-row-rtl">
      <div class="eng-side">${q}<span class="${pCls} prompt-txt" data-say="${escAttr(it.p.replace(/_+/g,'').trim())}" onclick="speakEl(this,'${pLang}')">${icon}${it.p}</span></div>
      <div class="canvas-side">${strip(key, practiceClass, show?it.a:'')}</div>
      <div class="ar-side"><span class="${aCls} ${hideClass}" data-say="${escAttr(it.a)}" onclick="speakEl(this,'${aLang}')">${it.a}</span></div>
    </div>`;
  }).join('');
}
function renderModal(secId){
  const sec=SECTIONS.find(s=>s.id===secId);
  const body=$('modalBody');
  $('modalTitle').innerHTML=`<span class="sec-title-main">${sec.title}</span> <span class="sec-title-ar">• ${sec.titleAr}</span>`;
  $('modalSub').textContent=sec.sub;
  const show=practiceVisible();
  const hideClass=show?'':'hidden-answer';
  const practiceClass=show?'practice':'';
  if(sec.type==='items'){
    body.innerHTML=renderItems(sec, secId, show, hideClass, practiceClass);
  } else if(sec.special==='letters'){
    const boxes=[['شَمْسِيَّةٌ','الشَّمْسِيَّةُ',SOLAR,'shamsi'],['قَمَرِيَّةٌ','القَمَرِيَّةُ',LUNAR,'qamari']];
    body.innerHTML=`<div class="grid grid-cols-1 md:grid-cols-2 gap-3">${boxes.map(([,title,letters,k])=>`
      <div class="border-2 border-[#E8DCC0] rounded-xl p-3 bg-[#FFFEF7]">
        <div class="text-center font-black text-[#3B2A14] sec-title-ar">${title}</div>
        <div class="text-center arabic-trad ${hideClass}" onclick="speak(this.textContent,'ar-SA',this)">${letters}</div>
        <div class="mt-2">${strip(secId+'-'+k+'-'+mode, practiceClass, '')}</div>
      </div>`).join('')}</div>`;
  } else {
    body.innerHTML=sec.words.map((w,i)=>{
      const key=secId+'-'+i+'-'+mode;
      return `<div class="strip-row-rtl">
        <div class="eng-side"><span class="english-clean" onclick="speak('${(w.audioEn||w.en).replace(/'/g,"\\'")}','en-GB',this)">${w.en}</span></div>
        <div class="canvas-side">${strip(key, practiceClass, show?w.ar:'')}</div>
        <div class="ar-side"><span class="arabic-trad ${hideClass}" onclick="speak('${(w.audioAr||w.arSimple).replace(/'/g,"\\'")}','ar-SA',this)">${w.ar}</span></div>
      </div>`;
    }).join('');
  }
  setTimeout(()=>{
    body.querySelectorAll('canvas.ink').forEach(c=>{
      const dpr=window.devicePixelRatio||1; const rect=c.getBoundingClientRect();
      if(!c.dataset.initialized){
        c.width=rect.width*dpr; c.height=88*dpr; c.style.width=rect.width+'px'; c.style.height='88px';
        const ctx=c.getContext('2d'); try{ ctx.setTransform(dpr,0,0,dpr,0,0); }catch(e){}
        c.dataset.initialized='1';
        if(window.UniversalPen){ UniversalPen.forceCanvas(c); }
        if(!stripHistory[c.dataset.inkKey]) stripHistory[c.dataset.inkKey]=[];
        try{ stripHistory[c.dataset.inkKey].push(c.toDataURL()); }catch(e){}
      }
    });
  },80);
  $('prevBtn').disabled=SECTIONS.findIndex(s=>s.id===secId)<=0;
  $('nextBtn').disabled=SECTIONS.findIndex(s=>s.id===secId)>=SECTIONS.length-1;
  body.scrollTop=0;
}
function openSection(id){ expandedId=id; renderModal(id); $('sectionModal').classList.add('open'); $('sectionModal').setAttribute('aria-hidden','false'); document.querySelectorAll('.rail-lantern').forEach(el=>el.classList.remove('active')); const r=$('rail-'+id); if(r) r.classList.add('active'); }
function closeModal(){ $('sectionModal').classList.remove('open'); $('sectionModal').setAttribute('aria-hidden','true'); }
function stepSection(d){ const idx=SECTIONS.findIndex(s=>s.id===expandedId); const next=SECTIONS[idx+d]; if(next) openSection(next.id); }
function canvasFor(key){ return document.querySelector(`canvas[data-ink-key="${key}"]`); }
function clearStrip(key){
  const c=canvasFor(key); if(!c) return;
  const ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height);
  if(window.UniversalPen){ UniversalPen.state.activeCanvas=c; UniversalPen.state.ctx=ctx; UniversalPen.clearInk(); }
  stripHistory[key]=[]; try{ stripHistory[key].push(c.toDataURL()); }catch(e){}
}
function undoStrip(key){
  const c=canvasFor(key); if(!c) return;
  if(window.UniversalPen && UniversalPen.state.activeCanvas===c && UniversalPen.state.undoStack.length>1){
    // Use universal pen undo if active
    return;
  }
  if(!stripHistory[key]||stripHistory[key].length<2) return;
  stripHistory[key].pop();
  const prev=stripHistory[key][stripHistory[key].length-1];
  const ctx=c.getContext('2d'); const img=new Image(); img.onload=()=>{ ctx.clearRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height); }; img.src=prev;
}
function setModeUI(){
  const pr=$('practiceBtn'), wr=$('writeBtn');
  const practice=mode==='practice';
  pr.className='seg-btn '+(practice?'pill-on':'pill-off');
  pr.textContent=practice?'✓ Practice':(isUnlocked()?'Practice':'🔒 Practice');
  wr.className='seg-btn '+(practice?'pill-off':'pill-on');
}
function setMode(next){ mode=next; setModeUI(); if(expandedId) renderModal(expandedId); }
function showPin(){ $('pinInput').value=''; $('pinError').classList.add('hidden'); $('pinModal').classList.add('open'); $('pinModal').setAttribute('aria-hidden','false'); setTimeout(()=>$('pinInput').focus(),100); }
function hidePin(){ $('pinModal').classList.remove('open'); $('pinModal').setAttribute('aria-hidden','true'); }
function checkPin(){
  const entered=$('pinInput').value.trim();
  if(fnv1a(PIN_SALT+entered)===PIN_CHECK){
    unlockSession(); hidePin(); setMode('practice');
  } else { $('pinError').classList.remove('hidden'); $('pinInput').value=''; }
}
function applyBig(){ document.body.classList.toggle('big', store.get('humayun_ar_big')==='1'); if(expandedId){ renderModal(expandedId); } }
$('practiceBtn').onclick=()=>{ if(isUnlocked()) setMode('practice'); else showPin(); };
$('writeBtn').onclick=()=>setMode('write');
$('pinCancel').onclick=hidePin;
$('pinSubmit').onclick=checkPin;
$('pinInput').onkeydown=e=>{ if(e.key==='Enter') checkPin(); };
$('pinModal').onclick=e=>{ if(e.target.id==='pinModal') hidePin(); };
$('closeModal').onclick=closeModal;
$('sectionModal').onclick=e=>{ if(e.target.id==='sectionModal') closeModal(); };
$('prevBtn').onclick=()=>stepSection(-1);
$('nextBtn').onclick=()=>stepSection(1);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('pinModal').classList.contains('open')) hidePin(); else closeModal(); } });
function unrollScroll(){ if(scrollUnfolded) return; scrollUnfolded=true; $('rolledScrollWrap').classList.add('unrolled'); setTimeout(()=>$('mainScroll').classList.add('open'),320); }
$('rolledScrollWrap').onclick=unrollScroll;
$('rolledScrollWrap').onkeydown=e=>{ if(e.key==='Enter') unrollScroll(); };
function toggleHeader(){ headerHidden=!headerHidden; $('topHeader').classList.toggle('hiddenBar', headerHidden); $('hangingAvatar').classList.toggle('hiddenPos', headerHidden); }
$('hangingAvatar').onclick=toggleHeader;
$('fontBtn').onclick=()=>{
  store.set('humayun_ar_big', store.get('humayun_ar_big')==='1'?'0':'1');
  applyBig();
};
buildRail(); buildCards(); applyBig(); setModeUI();
// Hook universal pen history per strip
document.addEventListener('pointerup', e=>{
  const canvas=e.target.closest('canvas'); if(!canvas) return;
  const key=canvas.dataset.inkKey; if(!key) return;
  if(!stripHistory[key]) stripHistory[key]=[];
  setTimeout(()=>{ try{ stripHistory[key].push(canvas.toDataURL()); if(stripHistory[key].length>22) stripHistory[key].shift(); }catch(err){} },60);
});
setTimeout(()=>{ if(!scrollUnfolded) unrollScroll(); },1200);
</script>
</body>
</html>
