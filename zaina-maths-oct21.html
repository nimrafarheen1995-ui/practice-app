<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Maths Pen Test - Oct 21</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
html,body{height:100%;overflow:hidden;background:#FEF3C7;font-family:system-ui}
.graph-paper{position:absolute;inset:0;background-image:linear-gradient(to right,#8B5A2B20 1px,transparent 1px),linear-gradient(to bottom,#8B5A2B20 1px,transparent 1px);background-size:20px 20px}
#inkCanvas{position:absolute;inset:0;z-index:10}
.test-label{position:fixed;top:10px;left:10px;background:#8B5A2B;color:#fff;padding:8px 12px;border-radius:12px;font-weight:800;z-index:20}
</style>
</head>
<body>
<div class="test-label">Maths Pen Test - Drag ✏️ anywhere</div>
<div class="graph-paper"></div>
<canvas id="inkCanvas"></canvas>

<script>
// Setup canvas
const c = document.getElementById('inkCanvas');
const ctx = c.getContext('2d');
function resize(){ c.width = window.innerWidth; c.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);

// Safe storage stub (so pen doesn't error)
window.Storage = {
  safeGet: (k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}},
  safeSet: (k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}
};
</script>

<!-- Math pen with line tool -->
<script src="shared/math-pen.js"></script>
</body>
</html>
