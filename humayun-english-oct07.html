<style>
:root{--bg1:#FFF4D6;--bg2:#DDF3E4;--card:#FFFDF6;--text:#3B2A1A;--sub:#7A6A58;--line:#E7D5B0;--pri:#2F855A;--pri-d:#22543D;--acc:#DD6B20;--paper:#FFFEF5;--hint:#FEEBC8;--hint-t:#7B341E;--ok:#C6F6D5}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Nunito','Segoe UI',system-ui,sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));gap:8px;font-size:clamp(15px,1.25vw,18px)}
button{font-family:inherit;cursor:pointer;color:inherit}
.dock{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:6px 10px;height:52px;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.dock h1{font-size:1.05rem;margin:0 auto 0 4px;font-weight:900;color:var(--pri-d);white-space:nowrap}
body.night .dock h1{color:#9AE6B4}
.btn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;font-weight:800;font-size:.95rem}
.btn:active{transform:scale(.96)}
.btn.on{background:var(--pri);border-color:var(--pri-d);color:#fff}
.seg{display:flex;border:2px solid var(--line);border-radius:14px;overflow:hidden}

#app{flex:1;min-height:0;display:flex;flex-direction:column}
/* map */
.map{position:relative;flex:1;min-height:0;border-radius:26px;border:2px solid var(--line);background:linear-gradient(180deg,#BEE3F8 0%,#E6F6D8 45%,#C6E5A6 100%);overflow:hidden}

.road{position:absolute;inset:0;width:100%;height:100%}
.road path{fill:none;stroke:#C98F4F;stroke-width:26;stroke-linecap:round;opacity:.85}

.head{position:absolute;top:12px;left:16px;right:16px;display:flex;align-items:center;gap:14px;background:rgba(255,253,246,.92);border-radius:20px;padding:8px 16px;border:2px solid var(--line);color:#3B2A1A}

.head h2{margin:0;font-size:1.35rem;color:#22543D}.head p{margin:2px 0 0;font-size:.9rem;color:#7A6A58;font-weight:700}
.bar{margin-left:auto;width:240px}.bar i{display:block;height:14px;border-radius:9px;background:#E2E8F0;overflow:hidden}.bar i b{display:block;height:100%;background:linear-gradient(90deg,#48BB78,#DD6B20);transition:width .5s}.bar span{font-weight:900;font-size:.85rem}
.pin{position:absolute;width:clamp(150px,15vw,200px);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,253,246,.95);border:3px solid #fff;border-radius:22px;padding:8px 8px 10px;box-shadow:0 8px 20px rgba(0,0,0,.2);color:#3B2A1A;transition:transform .15s}

.pin.done{border-color:#48BB78;background:#F0FFF4}
.stamp{position:absolute;top:-10px;right:-8px;background:#48BB78;color:#fff;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-weight:900;border:3px solid #fff}
.tractor-sprite{position:absolute;width:64px;height:auto;transform:translate(-50%,-50%);transition:all 0.6s ease;z-index:5;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.3))}

.stopbar h2{margin:0;font-size:1.25rem;color:var(--pri-d)}body.night .stopbar h2{color:#9AE6B4}
.stopbar .sub{color:var(--sub);font-weight:800;font-size:.9rem}.sp{margin-left:auto}

.stopfoot{display:flex;justify-content:center;padding-top:8px;flex-shrink:0}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:16px;border:2px dashed var(--line);flex-wrap:wrap;background:rgba(255,253,246,0.88)}
.num{font-weight:900;color:var(--acc);min-width:26px;font-size:1.15rem}

.opts{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px 22px;padding-left:36px;font-weight:700}

.cv{position:relative;flex:1;min-width:0;background-image:linear-gradient(transparent 54%,#B8C4D0 55%,transparent 57%)}

.answer ul{margin:4px 0 0;padding-left:22px}
.quote{font-size:1.35rem;font-weight:900;font-style:italic;color:var(--pri-d);background:var(--ok);border-radius:16px;padding:10px 16px;text-align:center}
body.night .quote{color:#C6F6D5}
.col{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px}
.w{border-radius:6px;cursor:pointer}.w.sp2{background:#FEF08A;color:#3B2A1A}
.syl{display:inline-block;color:#2F855A;font-weight:900}.syl:nth-child(even){color:#DD6B20}.syl+.syl{margin-left:3px;padding-left:3px;border-left:2px solid rgba(47,133,90,.3)}

.pad{height:clamp(210px,44vh,430px);background-image:linear-gradient(90deg,transparent 54px,#F87171 54px,#F87171 56px,transparent 56px,transparent 60px,#F87171 60px,#F87171 61px,transparent 61px),repeating-linear-gradient(transparent 0 38px,#C7D2DE 38px 40px);background-size:cover}

/* word chips */
.chip{background:#FEF3C7;border:1.5px solid #F59E0B;border-radius:10px;padding:0 6px;margin:0 1px;display:inline-block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.chip.split{background:transparent;border-color:transparent;padding:0}
.sb{display:inline-block;background:#DCFCE7;border:2px solid #34D399;border-radius:9px;padding:0 8px;font-weight:900;color:#065F46;transition:transform .15s,background .15s}.sb.hl{background:#FDE68A;border-color:#F59E0B;transform:scale(1.12)}.dot{color:#DD6B20;font-weight:900;margin:0 3px}
/* classwork notebook binder cover */
.bwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.binder-cover{position:absolute;inset:0;z-index:5;border-radius:8px 24px 24px 8px;cursor:pointer;transform-origin:0% 50%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(0.18,0.89,0.32,1.28),opacity .45s ease;background:linear-gradient(135deg,#14532D 0%,#166534 50%,#052E16 100%);box-shadow:0 14px 34px rgba(0,0,0,.35),inset 0 0 60px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-left:56px;color:#fff;overflow:hidden}
.binder-cover.binder-open{transform:perspective(1400px) rotateY(-118deg) rotateX(8deg) translateZ(20px);opacity:0;pointer-events:none}
.binder-cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:50px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 7px),linear-gradient(90deg,#0f172a 0%,#1f2937 55%,#374151 85%,#111827 100%);box-shadow:inset -6px 0 10px rgba(0,0,0,.55),inset 3px 0 6px rgba(255,255,255,.08)}
.binder-cover::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 45%,rgba(255,255,255,.04) 52%,transparent 65%)}
.rings{position:absolute;left:-12px;top:5%;bottom:5%;width:64px;z-index:6;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.ring{display:block;width:64px;height:13px;border-radius:8px;background:linear-gradient(180deg,#ffffff 0%,#6b7280 50%,#1f2937 100%);box-shadow:0 3px 4px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.7)}
.cb-label{position:relative;width:min(520px,78%);padding:12px 18px 14px 62px;border-radius:10px;border:3px solid #E5E7EB;color:#1E3A8A;background:#FFFDF0 repeating-linear-gradient(transparent 0 33px,#93C5FD 33px 34px);box-shadow:0 8px 20px rgba(0,0,0,.35);font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive}
.cb-label::before{content:"";position:absolute;left:44px;top:0;bottom:0;width:6px;border-left:2px solid #EF4444;border-right:2px solid #EF4444}
.cb-head{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.2rem;line-height:34px;color:#7F1D1D}.cb-head img{height:clamp(40px,8vh,64px);width:auto;object-fit:contain}
.cb-row{display:flex;gap:8px;align-items:baseline;line-height:34px;font-size:1.1rem}.cb-row span{font-size:.85rem;color:#475569;font-weight:700}.cb-row b{font-weight:800;color:#1E3A8A}
.cb-hint{font-weight:900;font-size:1.05rem;background:rgba(255,255,255,.18);padding:8px 20px;border-radius:14px;z-index:1}

#dimLayer{position:fixed;inset:0;background:#000;pointer-events:none;z-index:9990;opacity:0;transition:opacity .25s}
.rings{left:-5px;top:6%;bottom:6%;width:38px}
.ring{width:38px;height:8px;border-radius:5px;box-shadow:0 2px 3px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.7)}
.binder-cover{background:linear-gradient(135deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,.10) 55%,rgba(255,255,255,.28) 100%);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);border:1.5px solid rgba(255,255,255,.8);box-shadow:0 14px 34px rgba(0,0,0,.16),inset 0 0 40px rgba(255,255,255,.3);color:#1E293B;padding-left:44px}
.binder-cover::before{width:38px}
.cb-hint{background:rgba(255,255,255,.6);color:#1E293B}
.cb-label{padding-left:62px}

.ibtn{width:46px;height:42px;border:2px solid var(--line);background:var(--card);border-radius:12px;font-size:1.3rem;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ibtn:active{transform:scale(.94)}.ibtn.on{background:var(--pri);border-color:var(--pri-d)}
.seg button{font-size:1.3rem;padding:4px 18px}
.brand{margin:0 auto 0 6px;display:flex;align-items:center;gap:8px;color:var(--pri-d);font-weight:900;font-size:1.05rem;white-space:nowrap}.bav{height:38px;width:auto;object-fit:contain}
.pips{display:flex;gap:2px;margin-top:2px}.pips i{width:5px;height:5px;border-radius:50%;background:#CBD5E0}.pips i.f{background:#DD6B20}
.check{width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:var(--pri);box-shadow:0 6px 16px rgba(0,0,0,.28);display:grid;place-items:center;padding:0}.check:active{transform:scale(.93)}
.close-binder{position:absolute;top:10px;right:16px;z-index:4;display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #F59E0B;border-radius:20px;padding:6px 14px;font-weight:900;font-size:.95rem;color:#7B341E;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.stopbody.withclose{padding-top:60px}
.binder-cover{background:linear-gradient(135deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.05) 55%,rgba(255,255,255,.16) 100%);-webkit-backdrop-filter:blur(1.5px) saturate(120%);backdrop-filter:blur(1.5px) saturate(120%)}
.ptools{flex-wrap:wrap;max-width:calc(100% - 16px);justify-content:flex-end;gap:4px 8px}

.ptools .sz i{display:block;width:20px;border-radius:4px;background:#1E293B}
.ptools .sw{border:3px solid #fff;box-shadow:0 0 0 2px #CBD5E0}.ptools .sw.on{box-shadow:0 0 0 3px #DD6B20}
.ptools .sz.on{background:#FEEBC8;border-color:#DD6B20}
</style>

<body>
<div class="dock">
  <button class="ibtn" onclick="goHub()" title="All subjects" aria-label="Hub">🏠</button>

<div id="win"><div><img id="winImg" alt=""><h2>Journey complete!</h2><p style="font-weight:800">You visited every stop in Indian Villages. Well done, Humayun!</p><button class="btn on" onclick="document.getElementById('win').style.display='none'">Keep exploring</button></div></div>

<script>
const ASSET_BASE = 'assets/';
const HUB_URL = 'index.html';
const IMG = { guide:'humayun-avatar.webp', bg:'village-map-bg.webp', fib:'stop-time-travel.webp', mcq:'stop-village-square.webp', tf:'stop-panchayat-hall.webp', qa:'stop-story-hut.webp', think:'stop-think-tree.webp', win:'village-celebration.jpg', tractor:'map-tractor-sprite.jpg', watermark:'notebook-watermark.webp' };

const STOPS = [
 {id:'fib',em:'🏕️',t:'Time Travel Trail',s:'A. Fill in the blanks',x:9,y:72,shuffle:1},
 {id:'mcq',em:'🏡',t:'Village Square',s:'B. Choose the correct answer',x:29,y:44,shuffle:1},
 {id:'tf',em:'🏛️',t:'Panchayat Hall',s:"C. Write 'T' or 'F'",x:50,y:76,shuffle:1},
 {id:'qa',em:'📖',t:'Story Hut',s:'Textbook questions',x:71,y:44,shuffle:0},
 {id:'think',em:'🌳',t:'Think Tree',s:'Think and answer',x:90,y:74,shuffle:0}];
STOPS[3].pages=2;
const FIB=[
 {id:'f1',t:['Early humans were ',['nomads'],'.']},
 {id:'f2',t:['Early humans moved from place to place, in search of ',['food'],' and ',['shelter'],'.']},
 {id:'f3',t:['In many villages, ',['farming'],' is the main occupation of the people.']},
 {id:'f4',t:['In many villages in coastal regions, ',['fishing'],' is the main occupation.']},
 {id:'f5',t:['Earlier, people in villages went either on foot or by ',['bullock carts'],'.']}];
const MCQ=[
 {id:'m1',q:'The main occupation of people in the villages of Jammu and Kashmir',o:['fishing','pottery','handicrafts','carpentry'],a:2},
 {id:'m2',q:'Nowadays, people also use ___ as a means of transport in many villages.',o:['volvo buses','motorcycles','mountain bikes','luxury cars'],a:1},
 {id:'m3',q:'Who heads the Gram Panchayat?',o:['Principal','Sarpanch','Prime Minister','President'],a:1},
 {id:'m4',q:'Villages mainly have farms, fields and ___.',o:['malls','swings','amusement parks','forests'],a:3},
 {id:'m5',q:'Who elects the members of the Gram Panchayat?',o:['people living in cities','people living in villages','people living in pucca houses','farmers'],a:1}];
const TF=[
 {id:'t1',s:'Villages have shopping malls.',a:'F'},
 {id:'t2',s:'In many villages, people live in pucca houses.',a:'T'},
 {id:'t3',s:'The main needs of the villagers are modern services like dining restaurants.',a:'F'},
 {id:'t4',s:'The Gram Panchayat adopts measures to maintain cleanliness in the village.',a:'T'},
 {id:'t5',s:'Early humans lived in bungalows.',a:'F'}];
const QA=[
 {id:'q1',q:'What is the main occupation of people in villages?',a:'<p>Farming is the main occupation of the people in villages.</p>'},
 {id:'q2',q:'What is Gram Panchayat and what are its two functions?',a:"<p>A village has a local government to address people's needs and maintain peace and order. This local government is called Gram Panchayat. Two functions of Gram Panchayat are:</p><ul><li>Making roads and repairing them.</li><li>Setting up school and healthcare facilities and repairing old ones.</li></ul>"}];
const THINK={quote:'"Villages form our roots. Respect them."',q:"Why are villages called our 'roots' and why should we respect them?",
 a:'<ul><li>Villages are called our roots because about 60% of people in India live in villages.</li><li>We must respect them because hard-working farmers labour in the sun and rain everyday to grow fresh crops and vegetables for us.</li><li>Villages live close to nature and teach us important lessons about protecting animals, saving water, and loving the Earth.</li></ul>'};

function fisherYates(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

  return ids.map(id=>list.find(x=>x.id===id))}

let actx=null,noiseBuf=null,fxOn=true;
function audio(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}const n=actx.sampleRate*2;noiseBuf=actx.createBuffer(1,n,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}if(actx.state==='suspended')actx.resume();return actx}
function startScratch(kind){if(!fxOn)return null;const a=audio();if(!a)return null;const src=a.createBufferSource();src.buffer=noiseBuf;src.loop=true;const f=a.createBiquadFilter(),g=a.createGain();f.type=kind==='eraser'?'lowpass':'bandpass';f.frequency.value=kind==='eraser'?600:2600;f.Q.value=.9;g.gain.value=0;src.connect(f);f.connect(g);g.connect(a.destination);src.start();return{src,f,g,kind}}
function updScratch(s,v){if(!s)return;const t=actx.currentTime,e=s.kind==='eraser';s.g.gain.setTargetAtTime(Math.min(e?.16:.09,v*.012),t,.02);s.f.frequency.setTargetAtTime((e?500:2400)+Math.min(v,40)*(e?10:30),t,.03)}
function stopScratch(s){if(!s)return;try{s.g.gain.setTargetAtTime(0,actx.currentTime,.03);s.src.stop(actx.currentTime+.15)}catch(e){}}
function playUndo(){if(!fxOn)return;const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.frequency.setValueAtTime(620,t);o.frequency.exponentialRampToValueAtTime(240,t+.14);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(a.destination);o.start();o.stop(t+.18)}
function playClear(){const s=startScratch('eraser');if(!s)return;updScratch(s,14);setTimeout(()=>stopScratch(s),260)}

const DPR=Math.min(window.devicePixelRatio||1,2); let penSeen=0;const touches=new Set();
document.addEventListener('pointerdown',e=>{if(e.pointerType==='pen')penSeen=performance.now();else if(e.pointerType==='touch')touches.add(e.pointerId)},true);
['pointermove','pointerover'].forEach(n=>document.addEventListener(n,e=>{if(e.pointerType==='pen')penSeen=performance.now()},true));

const palmLike=e=>performance.now()-penSeen<1800||touches.size>1||Math.max(e.width||0,e.height||0)>34;
const rejectTouch=e=>e.pointerType==='touch'&&(penOnly||palmLike(e));

function setTool(t){tool=t;document.querySelectorAll('#tPen').forEach(b=>b.classList.toggle('on',t==='pen'));document.querySelectorAll('#tEr').forEach(b=>b.classList.toggle('on',t==='eraser'))}

  try{const d=c.toDataURL('image/webp',.7);cache[c._key]=d;if(!store.set(c._key,d))toast('Storage is full. Writing is kept until you close the app.')}catch(e){}});dirty.clear()}

function initInk(c,key,kind){
 if(c._ink)return;c._ink=true;c._key=key;c._undo=[];c._has=false;c.style.width='100%';c.style.height='100%';const ctx=c.getContext('2d');
 const load=()=>{const sv=cache[key]||store.get(key);if(!sv)return;cache[key]=sv;const im=new Image();im.onload=()=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);ctx.restore();c._has=true};im.src=sv};
 const size=()=>{const r=c.getBoundingClientRect(),w=Math.round(r.width),h=Math.round(r.height);if(w<2||h<2)return false;if(c._w===w&&c._h===h)return true;
  let old=null;if(c._w){old=document.createElement('canvas');old.width=c.width;old.height=c.height;old.getContext('2d').drawImage(c,0,0)}
  c.width=Math.round(w*DPR);c.height=Math.round(h*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);if(old)ctx.drawImage(old,0,0,w,h);c._w=w;c._h=h;if(!c._loaded){c._loaded=true;load()}return true};
 size();if(window.ResizeObserver)new ResizeObserver(size).observe(c);
 const snap=()=>{try{c._undo.push(ctx.getImageData(0,0,c.width,c.height));while(c._undo.length>(kind==='pad'?6:10))c._undo.shift()}catch(e){}};
 c._undo_fn=()=>{const s=c._undo.pop();if(!s){toast('Nothing to undo');return}if(s.width!==c.width)return;ctx.putImageData(s,0,0);c._has=true;scheduleSave(c);playUndo()};
 c._clear_fn=()=>{snap();ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);ctx.restore();c._has=false;store.del(key);delete cache[key];playClear()};
 let st=null;
 c.addEventListener('pointerdown',e=>{if(rejectTouch(e)){e.preventDefault();return}if(st||!size())return;e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}snap();
  const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,tl=kind==='pad'?tool:'pen';st={id:e.pointerId,type:e.pointerType,x,y,mx:x,my:y,tl,t:performance.now(),snd:startScratch(tl)}});
 c.addEventListener('pointermove',e=>{if(!st||e.pointerId!==st.id)return;e.preventDefault();if(st.type==='touch'&&palmLike(e)){stopScratch(st.snd);const sn=c._undo.pop();if(sn&&sn.width===c.width)ctx.putImageData(sn,0,0);try{c.releasePointerCapture(st.id)}catch(_){}st=null;return}const ev=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e],r=c.getBoundingClientRect();let dist=0;
  for(const v of ev){const x=v.clientX-r.left,y=v.clientY-r.top,pr=v.pressure>0?v.pressure:.5,mx=(st.x+x)/2,my=(st.y+y)/2;ctx.lineCap=ctx.lineJoin='round';
   if(st.tl==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=kind==='pad'?penSize*6+8:26}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=kind==='pad'?penColor:'#1E3A5F';ctx.lineWidth=(kind==='pad'?penSize:3.6)*(pr*1.4+.4)}

let voice=null;function pickVoice(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]IN/i.test(x.lang))||v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}

function renderSplit(w,on){if(on){w.classList.add('split');w.innerHTML=w.dataset.parts.split('|').map((p,i)=>`<span class="sb">${i===0&&w.dataset.w[0]!==w.dataset.w[0].toLowerCase()?p[0].toUpperCase()+p.slice(1):p}</span>`).join('<span class="dot">•</span>')}else{w.classList.remove('split');w.textContent=w.dataset.w}}
function speakSeq(w){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const parts=w.dataset.parts.split('|');
 const say=(t,rate,pitch,st,en)=>{const u=new SpeechSynthesisUtterance(clean(t));if(voice){u.voice=voice;u.lang=voice.lang}else u.lang='en-IN';u.rate=rate;u.pitch=pitch;u.onstart=st;u.onend=en;speechSynthesis.speak(u)};
 const bs=()=>[...w.querySelectorAll('.sb')];
 parts.forEach((p,i)=>say(p,.62,.82,()=>bs().forEach((b,j)=>b.classList.toggle('hl',j===i))));
 say(w.dataset.w,.62,.82,()=>bs().forEach(b=>b.classList.add('hl')),()=>bs().forEach(b=>b.classList.remove('hl')))}
document.addEventListener('pointerdown',e=>{const w=mode==='practice'&&e.target.closest&&e.target.closest('.chip');if(!w)return;held=false;clearTimeout(holdT);
 holdT=setTimeout(()=>{if(!w.dataset.parts)return;held=true;renderSplit(w,true);speakSeq(w)},450)},true);
['pointerup','pointercancel','pointerleave'].forEach(n=>document.addEventListener(n,()=>clearTimeout(holdT),true));
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.chip'))e.preventDefault()});
const SKIP='script,style,canvas,button,.ib,.w,.num,.pin,.hint .w,.padtools';
function wrapWords(root){if(!root)return;
 const wk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>(!n.nodeValue.trim()||!n.parentElement||n.parentElement.closest(SKIP))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
 const nodes=[];while(wk.nextNode())nodes.push(wk.currentNode);
 nodes.forEach(n=>{const fr=document.createDocumentFragment();
  n.nodeValue.split(/(\s+)/).forEach(tok=>{if(!tok)return;if(/^\s+$/.test(tok)){fr.appendChild(document.createTextNode(tok));return}
   if(/^(Q?\d+|[a-eA-E])[.)]$/.test(tok)\vert{}\vert{}/^\d+$/.test(tok)){fr.appendChild(document.createTextNode(tok));return}
   const m=tok.match(/^([^\p{L}\p{N}]*)([\p{L}\p{N}][\p{L}\p{N}'’-]*)(.*)$/u);if(!m){fr.appendChild(document.createTextNode(tok));return}
   if(m[1])fr.appendChild(document.createTextNode(m[1]));
   const sp=document.createElement('span');sp.className='w';sp.dataset.w=m[2];const chip=mode==='practice'&&n.parentElement.closest('.answer'),pp=partsOf(m[2]);if(chip){sp.classList.add('chip');if(pp)sp.dataset.parts=pp.join('|')}const parts=null;
   if(parts){if(m[2][0]!==m[2][0].toLowerCase())parts[0]=parts[0][0].toUpperCase()+parts[0].slice(1);parts.forEach(s=>{const x=document.createElement('span');x.className='syl';x.textContent=s;sp.appendChild(x)})}else sp.textContent=m[2];
   fr.appendChild(sp);if(m[3])fr.appendChild(document.createTextNode(m[3]))});
  n.parentNode.replaceChild(fr,n)})}

let wl=null;async function wake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
document.addEventListener('pointerdown',wake,{passive:true});
let fsTried=false;document.addEventListener('pointerdown',()=>{if(fsTried)return;fsTried=true;const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{})});
$('brand').innerHTML=imgTag('guide','🧑‍🎓','bav')+'<b>Social Studies · Indian Villages</b>';
render();
