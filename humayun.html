  <script>
    // Resilient Dual Storage Engine (LocalStorage + In-Memory Fallback)
    const AppStorage = {
      _mem: {},
      setItem(key, val) {
        this._mem[key] = val;
        try { localStorage.setItem(key, val); } catch (e) {}
      },
      getItem(key) {
        if (this._mem[key] !== undefined) return this._mem[key];
        try {
          const v = localStorage.getItem(key);
          if (v !== null) { this._mem[key] = v; return v; }
        } catch (e) {}
        return null;
      },
      removeItem(key) {
        delete this._mem[key];
        try { localStorage.removeItem(key); } catch (e) {}
      }
    };

    window.__showSaveToast = function(msg, icon) {
      var t = document.getElementById('trail-toast');
      var txt = document.getElementById('toast-txt');
      var ico = document.getElementById('toast-icon');
      if (!t) return;
      if (txt) txt.textContent = msg || 'Saved';
      if (ico) ico.textContent = icon || '💾';
      t.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function() { t.classList.remove('show'); }, 950);
    };

    (function runWallpaper() {
      const cvs = document.getElementById('wallpaperCanvas');
      if (!cvs) return;
      const ctx = cvs.getContext('2d');
      let items = [];
      const emojis = ['🌱', '🍃', '☁️', '🐢', '🌾', '⭐', '💧', '🦜', '🌸'];

      function resize() {
        cvs.width = window.innerWidth;
        cvs.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < 20; i++) {
        items.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          vy: -(0.2 + Math.random() * 0.3),
          vx: (Math.random() - 0.5) * 0.2,
          char: emojis[Math.floor(Math.random() * emojis.length)],
          size: 18 + Math.random() * 18,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.015
        });
      }

      function draw() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        for (let it of items) {
          it.y += it.vy;
          it.x += it.vx;
          it.rot += it.vRot;
          if (it.y < -30) {
            it.y = cvs.height + 20;
            it.x = Math.random() * cvs.width;
          }
          ctx.save();
          ctx.translate(it.x, it.y);
          ctx.rotate(it.rot);
          ctx.font = `${it.size}px Fredoka, sans-serif`;
          ctx.fillText(it.char, 0, 0);
          ctx.restore();
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>

      try { return AppStorage.getItem('evs_audio_muted') === 'true'; } catch(err) { return false; }
    })();

    let _audioCtx = null;
    function getAudioCtx() {
      if (!_audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) _audioCtx = new AudioClass();
      }
      if (_audioCtx && _audioCtx.state === 'suspended') {
        _audioCtx.resume().catch(() => {});
      }
      return _audioCtx;
    }

    const SoundFX = {
      playTap() {
        if (IS_AUDIO_MUTED) return;
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(540, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(780, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.06, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.05);
        } catch(err){}
      },
      playSpaceTone() {
        if (IS_AUDIO_MUTED) return;
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.06);
          gain.gain.setValueAtTime(0.09, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.06);
        } catch(err){}
      },
      playBackspaceTone() {
        if (IS_AUDIO_MUTED) return;
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(380, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.07);
          gain.gain.setValueAtTime(0.045, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.07);
        } catch(err){}
      },
      playClearTone() {
        if (IS_AUDIO_MUTED) return;
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          [350, 240].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = f;
            gain.gain.setValueAtTime(0.05, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.06);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.05); osc.stop(ctx.currentTime + i * 0.05 + 0.06);
          });
        } catch(err){}
      },
      playSuccess() {
        if (IS_AUDIO_MUTED) return;
        try {
          const ctx = getAudioCtx();
          if (!ctx) return;
          [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {

            gain.gain.setValueAtTime(0.05, ctx.currentTime + idx * 0.065);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.065 + 0.15);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.065);
            osc.stop(ctx.currentTime + idx * 0.065 + 0.15);
          });
        } catch(err){}
      }
    };

    // DEFINITIVE ERROR-FREE PERSISTENT CANVAS
    const StageCanvas = forwardRef(({ storageKey, isMini = false }, ref) => {
      const canvasRef = useRef(null);
      const isDrawing = useRef(false);
      const activePointerId = useRef(null);
      const tempEraserRef = useRef(false);

      const [penColor, setPenColor] = useState('#047857');
      const [isEraser, setIsEraser] = useState(false);
      const [penSize, setPenSize] = useState(4);
      const [eraserSize, setEraserSize] = useState(28);
      const [scrollLock, setScrollLock] = useState(false);

      const strokeData = useRef([]);
      const currentPath = useRef([]);
      const lastRecordedPt = useRef(null);
      const uniqueStorageKey = 'evs_ink_v10_' + storageKey;

      const saveStrokes = () => {
        try {
          AppStorage.setItem(uniqueStorageKey, JSON.stringify(strokeData.current));
          if (!isMini && window.__showSaveToast) window.__showSaveToast('Ink Saved', '✍️');
        } catch(err){}
      };

      const redrawAll = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const rect = canvas.getBoundingClientRect();
        const W = rect.width;
        const H = rect.height;
        if (W <= 2 || H <= 2) return;

        ctx.clearRect(0, 0, W, H);
        const list = strokeData.current;
        if (!list || list.length === 0) return;

        list.forEach(st => {
          if (!st.points || st.points.length === 0) return;
          ctx.save();
          ctx.globalCompositeOperation = st.eraser ? 'destination-out' : 'source-over';
          ctx.strokeStyle = st.eraser ? 'rgba(0,0,0,1)' : st.color;
          ctx.fillStyle = st.eraser ? 'rgba(0,0,0,1)' : st.color;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          if (st.points.length === 1) {
            ctx.beginPath();
            ctx.arc(st.points[0].nx * W, st.points[0].ny * H, (st.width || 4) / 2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.beginPath();
            ctx.lineWidth = st.width || 4;
            ctx.moveTo(st.points[0].nx * W, st.points[0].ny * H);
            for (let i = 1; i < st.points.length; i++) {
              ctx.lineTo(st.points[i].nx * W, st.points[i].ny * H);
            }
            ctx.stroke();
          }
          ctx.restore();
        });
      }, []);

      const fit = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        if (rect.width <= 2 || rect.height <= 2) return;

        const dpr = window.devicePixelRatio || 1;
        const newW = Math.round(rect.width * dpr);
        const newH = Math.round(rect.height * dpr);

        if (canvas.width !== newW || canvas.height !== newH) {
          canvas.width = newW;
          canvas.height = newH;
          const ctx = canvas.getContext('2d');
          if (ctx) {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
          }
        }
        redrawAll();
      }, [redrawAll]);

      useEffect(() => {
        const unsub = StylusStore.subscribe((s) => {
          setIsEraser(s.eraser);
          setPenColor(s.color);
          setPenSize(s.penSize);
          setEraserSize(s.eraserSize);
          setScrollLock(s.scrollLock);
        });
        const curr = StylusStore.get();
        setIsEraser(curr.eraser);
        setPenColor(curr.color);
        setPenSize(curr.penSize);
        setEraserSize(curr.eraserSize);
        setScrollLock(curr.scrollLock);
        return unsub;
      }, []);

      useEffect(() => {
        try {
          const saved = AppStorage.getItem(uniqueStorageKey);
          strokeData.current = saved ? JSON.parse(saved) : [];
        } catch(err) {
          strokeData.current = [];
        }

        fit();
        const t1 = setTimeout(fit, 30);
        const t2 = setTimeout(fit, 150);
        const t3 = setTimeout(fit, 350);

        let ro = null;
        if (typeof ResizeObserver !== 'undefined' && canvasRef.current && canvasRef.current.parentElement) {
          ro = new ResizeObserver((entries) => {
            for (let entry of entries) {
              if (entry.contentRect.width > 2 && entry.contentRect.height > 2) {
                fit();
              }
            }
          });
          ro.observe(canvasRef.current.parentElement);
        }

        return () => {
          clearTimeout(t1);
          clearTimeout(t2);
          clearTimeout(t3);
          if (ro) ro.disconnect();
        };
      }, [uniqueStorageKey, fit]);

      useImperativeHandle(ref, () => ({
        clear: () => {
          strokeData.current = [];
          try {
            AppStorage.removeItem(uniqueStorageKey);
            if (!isMini && window.__showSaveToast) window.__showSaveToast('Pad Cleared', '🗑️');
          } catch(err){}
          const canvas = canvasRef.current;
          if (canvas) {
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            if (ctx) ctx.clearRect(0, 0, rect.width, rect.height);
          }
        }
      }));

      const getPos = (ev) => {
        const r = canvasRef.current.getBoundingClientRect();
        return {
          x: ev.clientX - r.left,
          y: ev.clientY - r.top,
          nx: Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)),
          ny: Math.max(0, Math.min(1, (ev.clientY - r.top) / r.height))
        };
      };

      const handlePointerDown = (ev) => {
        if (scrollLock || isDrawing.current) return;
        if (ev.pointerType !== 'pen' && ev.pointerType !== 'mouse' && ev.pointerType !== 'touch') return;
        
        ev.preventDefault();
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        try { canvas.setPointerCapture(ev.pointerId); } catch(err){}
        activePointerId.current = ev.pointerId;
        isDrawing.current = true;

        const isSideBtn = (ev.pointerType === 'pen' && (ev.buttons === 2 || ev.button === 5));
        tempEraserRef.current = isSideBtn;
        const usingEraser = isSideBtn || isEraser;

        const p = getPos(ev);
        let strokeW = usingEraser ? (isMini ? 18 : eraserSize) : (isMini ? 3.5 : penSize);
        if (!usingEraser && ev.pointerType === 'pen' && ev.pressure > 0) {
          strokeW = Math.max(1.5, strokeW * (0.6 + ev.pressure));
        }

        const pointObj = { nx: Number(p.nx.toFixed(4)), ny: Number(p.ny.toFixed(4)) };
        currentPath.current = [pointObj];
        lastRecordedPt.current = { x: p.x, y: p.y };

        ctx.save();
        ctx.globalCompositeOperation = usingEraser ? 'destination-out' : 'source-over';
        ctx.fillStyle = usingEraser ? 'rgba(0,0,0,1)' : penColor;
        ctx.beginPath();
        ctx.arc(p.x, p.y, strokeW / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      };

      const handlePointerMove = (ev) => {
        if (scrollLock || !isDrawing.current || ev.pointerId !== activePointerId.current) return;
        if (ev.pointerType !== 'pen' && ev.pointerType !== 'mouse' && ev.pointerType !== 'touch') return;
        
        ev.preventDefault();
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const p = getPos(ev);
        // Distance decimation filter prevents quota overflow in Edge
        if (lastRecordedPt.current) {
          const dx = p.x - lastRecordedPt.current.x;
          const dy = p.y - lastRecordedPt.current.y;
          if (dx * dx + dy * dy < 4) return;
        }

        const isSideBtn = (ev.pointerType === 'pen' && (ev.buttons === 2 || ev.button === 5));
        const usingEraser = isSideBtn || tempEraserRef.current || isEraser;

        let strokeW = usingEraser ? (isMini ? 18 : eraserSize) : (isMini ? 3.5 : penSize);
        if (!usingEraser && ev.pointerType === 'pen' && ev.pressure > 0) {
          strokeW = Math.max(1.5, strokeW * (0.6 + ev.pressure));
        }

        const rect = canvas.getBoundingClientRect();
        const pts = currentPath.current;
        const lastP = pts[pts.length - 1];

        ctx.save();
        ctx.globalCompositeOperation = usingEraser ? 'destination-out' : 'source-over';
        ctx.strokeStyle = usingEraser ? 'rgba(0,0,0,1)' : penColor;
        ctx.lineWidth = strokeW;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(lastP.nx * rect.width, lastP.ny * rect.height);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        ctx.restore();

        currentPath.current.push({ nx: Number(p.nx.toFixed(4)), ny: Number(p.ny.toFixed(4)) });
        lastRecordedPt.current = { x: p.x, y: p.y };
      };

      const handlePointerUp = (ev) => {
        if (scrollLock || !isDrawing.current || ev.pointerId !== activePointerId.current) return;
        const usingEraser = tempEraserRef.current || isEraser;
        let strokeW = usingEraser ? (isMini ? 18 : eraserSize) : (isMini ? 3.5 : penSize);

        if (currentPath.current.length > 0) {
          strokeData.current.push({
            points: [...currentPath.current],
            color: penColor,
            width: Number(strokeW.toFixed(1)),
            eraser: usingEraser
          });
          saveStrokes();
        }

        isDrawing.current = false;
        activePointerId.current = null;
        tempEraserRef.current = false;
        lastRecordedPt.current = null;
        currentPath.current = [];
      };

      return e('div', {
        className: `relative w-full h-full overflow-hidden flex flex-col min-h-0 ${isMini ? 'node-ruled-paper rounded-xl border border-emerald-300 shadow-inner' : 'soft-ruled-paper rounded-2xl border border-emerald-200 shadow-inner'}`
      },
        e('canvas', {
          ref: canvasRef,
          style: { touchAction: scrollLock ? 'auto' : 'none', pointerEvents: scrollLock ? 'none' : 'auto' },
          className: 'evs-canvas',
          onPointerDown: handlePointerDown,
          onPointerMove: handlePointerMove,
          onPointerUp: handlePointerUp,
          onPointerCancel: handlePointerUp,
          onPointerLeave: handlePointerUp,
          onContextMenu: ev => ev.preventDefault()
        })
      );
    });

    function App() {
      const [isMuted, setIsMuted] = useState(IS_AUDIO_MUTED);
      const [scrollLock, setScrollLock] = useState(false);
      const [eyeComfort, setEyeComfort] = useState(false);
      const [bookOpened, setBookOpened] = useState(false);
      const [currentStageId, setCurrentStageId] = useState(null);
      const [activeMode, setActiveMode] = useState('learn');
      const [isPracticeLocked, setIsPracticeLocked] = useState(false);
      const [questionIndex, setQuestionIndex] = useState(0);

      const [sectionScores, setSectionScores] = useState(() => {
        try {
          const saved = AppStorage.getItem('evs_adventure_scores_v10');
          return saved ? JSON.parse(saved) : {};
        } catch(err){ return {}; }
      });

      const [allStoredAnswers, setAllStoredAnswers] = useState(() => {
        try {
          const saved = AppStorage.getItem('evs_answers_state_v10');
          return saved ? JSON.parse(saved) : {};
        } catch(err){ return {}; }
      });

      const [shuffledFill, setShuffledFill] = useState(() => {
        try {
          const saved = AppStorage.getItem('evs_order_fill_v10');
          return saved ? JSON.parse(saved) : (ADVENTURE_SECTIONS.find(s => s.id === 'sec_1')?.questions || []);
        } catch(err){ return ADVENTURE_SECTIONS.find(s => s.id === 'sec_1')?.questions || []; }
      });

      const [shuffledMCQs, setShuffledMCQs] = useState(() => {
        try {
          const saved = AppStorage.getItem('evs_order_mcq_v10');
          if (saved) return JSON.parse(saved);
        } catch(err){}
        const base = ADVENTURE_SECTIONS.find(s => s.id === 'sec_2')?.questions || [];
        return base.map(q => ({ ...q, correctIndex: q.options.indexOf(q.answerText) }));
      });

      const [shuffledTF, setShuffledTF] = useState(() => {
        try {
          const saved = AppStorage.getItem('evs_order_tf_v10');
          return saved ? JSON.parse(saved) : (ADVENTURE_SECTIONS.find(s => s.id === 'sec_3')?.questions || []);
        } catch(err){ return ADVENTURE_SECTIONS.find(s => s.id === 'sec_3')?.questions || []; }
      });

      const [shuffledNameFollowing, setShuffledNameFollowing] = useState(() => {
        try {
          const saved = AppStorage.getItem('evs_order_nf_v10');
          return saved ? JSON.parse(saved) : (ADVENTURE_SECTIONS.find(s => s.id === 'sec_5')?.questions || []);
        } catch(err) {
          return ADVENTURE_SECTIONS.find(s => s.id === 'sec_5')?.questions || [];
        }
      });

      const [shuffledOdd, setShuffledOdd] = useState(() => {
        try {
          const saved = AppStorage.getItem('evs_order_odd_v10');
          return saved ? JSON.parse(saved) : (ADVENTURE_SECTIONS.find(s => s.id === 'sec_6')?.questions || []);
        } catch(err) {
          return ADVENTURE_SECTIONS.find(s => s.id === 'sec_6')?.questions || [];
        }
      });

      const [shuffledTwoExamples, setShuffledTwoExamples] = useState(() => {
        try {
          const saved = AppStorage.getItem('evs_order_twoex_v10');
          return saved ? JSON.parse(saved) : (ADVENTURE_SECTIONS.find(s => s.id === 'sec_7')?.questions || []);
        } catch(err) {
          return ADVENTURE_SECTIONS.find(s => s.id === 'sec_7')?.questions || [];
        }
      });

      const [activeBlankIndex, setActiveBlankIndex] = useState(0);
      const [objectiveGraded, setObjectiveGraded] = useState(false);
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [isFullscreen, setIsFullscreen] = useState(false);

      const activePadRef = useRef(null);
      const carouselRef = useRef(null);

      useEffect(() => {
        const handleFsChange = () => {
          setIsFullscreen(!!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement));
        };
        document.addEventListener('fullscreenchange', handleFsChange);
        return () => document.removeEventListener('fullscreenchange', handleFsChange);
      }, []);

      const toggleFullscreen = () => {
        SoundFX.playTap();
        const docEl = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement) {
          if (docEl.requestFullscreen) docEl.requestFullscreen().catch(() => {});
          else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
      };

      const toggleScrollLock = () => {
        const next = !scrollLock;
        setScrollLock(next);
        StylusStore.set({ scrollLock: next });
        SoundFX.playTap();
        window.__showSaveToast(next ? 'Scroll Lock: ON' : 'Scroll Lock: OFF', next ? '🔒' : '✏️');
      };

      const toggleEyeComfort = () => {
        const next = !eyeComfort;
        setEyeComfort(next);
        SoundFX.playTap();
        if (next) {
          document.body.classList.add('dark-mode');
          window.__showSaveToast('Eye Comfort ON 🌙', '🛡️');
        } else {
          document.body.classList.remove('dark-mode');
          window.__showSaveToast('Eye Comfort OFF ☀️', '💡');
        }
      };

      useEffect(() => {
        try { AppStorage.setItem('evs_adventure_scores_v10', JSON.stringify(sectionScores)); } catch(err){}
      }, [sectionScores]);

      useEffect(() => {
        try { AppStorage.setItem('evs_answers_state_v10', JSON.stringify(allStoredAnswers)); } catch(err){}
      }, [allStoredAnswers]);

      const toggleMute = () => {
        const next = !isMuted;
        setIsMuted(next);
        IS_AUDIO_MUTED = next;
        try { AppStorage.setItem('evs_audio_muted', String(next)); } catch(err){}
        if (next && 'speechSynthesis' in window) speechSynthesis.cancel();
      };

      const activeStage = useMemo(() => {
        return ADVENTURE_SECTIONS.find(l => l.id === currentStageId) || null;
      }, [currentStageId]);

      const initShuffledFill = useCallback(() => {
        const base = ADVENTURE_SECTIONS.find(s => s.id === 'sec_1')?.questions || [];
        const nextList = [...base].sort(() => Math.random() - 0.5);
        setShuffledFill(nextList);
        try { AppStorage.setItem('evs_order_fill_v10', JSON.stringify(nextList)); } catch(err){}
      }, []);

      const initShuffledMCQ = useCallback(() => {
        const base = ADVENTURE_SECTIONS.find(s => s.id === 'sec_2')?.questions || [];
        const shuffledList = [...base].sort(() => Math.random() - 0.5).map(q => {
          const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
          return {
            ...q,
            options: shuffledOptions,
            correctIndex: shuffledOptions.indexOf(q.answerText)
          };
        });
        setShuffledMCQs(shuffledList);
        try { AppStorage.setItem('evs_order_mcq_v10', JSON.stringify(shuffledList)); } catch(err){}
      }, []);

      const initShuffledTF = useCallback(() => {
        const base = ADVENTURE_SECTIONS.find(s => s.id === 'sec_3')?.questions || [];
        const nextList = [...base].sort(() => Math.random() - 0.5);
        setShuffledTF(nextList);
        try { AppStorage.setItem('evs_order_tf_v10', JSON.stringify(nextList)); } catch(err){}
      }, []);

      const initShuffledNameFollowing = useCallback(() => {
        const base = ADVENTURE_SECTIONS.find(s => s.id === 'sec_5')?.questions || [];
        const nextList = [...base].sort(() => Math.random() - 0.5);
        setShuffledNameFollowing(nextList);
        try { AppStorage.setItem('evs_order_nf_v10', JSON.stringify(nextList)); } catch(err){}
      }, []);

      const initShuffledOdd = useCallback(() => {
        const base = ADVENTURE_SECTIONS.find(s => s.id === 'sec_6')?.questions || [];
        const nextList = [...base].sort(() => Math.random() - 0.5);
        setShuffledOdd(nextList);
        try { AppStorage.setItem('evs_order_odd_v10', JSON.stringify(nextList)); } catch(err){}
      }, []);

      const initShuffledTwoExamples = useCallback(() => {
        const base = ADVENTURE_SECTIONS.find(s => s.id === 'sec_7')?.questions || [];
        const nextList = [...base].sort(() => Math.random() - 0.5);
        setShuffledTwoExamples(nextList);
        try { AppStorage.setItem('evs_order_twoex_v10', JSON.stringify(nextList)); } catch(err){}
      }, []);

      const openStage = (sec) => {
        SoundFX.playTap();
        setCurrentStageId(sec.id);
        setQuestionIndex(0);
        setActiveMode('learn');
        setIsPracticeLocked(false);
        setObjectiveGraded(false);
        setActiveBlankIndex(0);
        setDrawerOpen(false);

        if (sec.type === 'match' && !allStoredAnswers['sec_4_match']) {
          const lefts = sec.pairs.map(p => ({ id: p.id, text: p.left })).sort(() => Math.random() - 0.5);
          const rights = sec.pairs.map(p => ({ id: p.id, text: p.right })).sort(() => Math.random() - 0.5);
          setAllStoredAnswers(prev => ({
            ...prev,
            sec_4_match: { lefts, rights, selectedLeft: null, links: {} }
          }));
        }
      };

      const recordSectionCompletion = (secId, pct) => {
        setSectionScores(prev => {
          const updated = {
            ...prev,
            [secId]: { completed: true, pct: Math.max(pct, prev[secId]?.pct || 0) }
          };
          try { AppStorage.setItem('evs_adventure_scores_v10', JSON.stringify(updated)); } catch(err){}
          return updated;
        });
        window.__showSaveToast(`Completed! (${pct}%)`, '⭐');
        setTimeout(() => { setCurrentStageId(null); }, 1400);
      };

      const goToNextSection = () => {
        SoundFX.playTap();
        const currentIndex = ADVENTURE_SECTIONS.findIndex(s => s.id === currentStageId);
        if (currentIndex !== -1 && currentIndex < ADVENTURE_SECTIONS.length - 1) {
          openStage(ADVENTURE_SECTIONS[currentIndex + 1]);
        } else {
          setCurrentStageId(null);
        }
      };

      const goToPrevSection = () => {
        SoundFX.playTap();
        const currentIndex = ADVENTURE_SECTIONS.findIndex(s => s.id === currentStageId);
        if (currentIndex > 0) {
          openStage(ADVENTURE_SECTIONS[currentIndex - 1]);
        }
      };

      const gradeObjective = () => {
        SoundFX.playTap();
        if (!activeStage) return;
        let correct = 0;

        if (activeStage.type === 'fill') {
          const total = shuffledFill.length;
          shuffledFill.forEach((q, idx) => {
            const val = String(allStoredAnswers['fill_' + idx] || '').trim().toLowerCase();
            if (val && q.answers.some(a => a.toLowerCase() === val)) correct++;
          });
          const pct = Math.round((correct / total) * 100);
          setObjectiveGraded(true);
          setDrawerOpen(false);
          if (pct >= 60) {
            SoundFX.playSuccess();
            if (window.confetti) window.confetti({ particleCount: 75, spread: 70 });
            Speech.read(`Awesome work champ! You scored ${correct} out of ${total}!`);
          }
          recordSectionCompletion(activeStage.id, pct);
        } else if (activeStage.type === 'mcq') {
          const total = shuffledMCQs.length;
          shuffledMCQs.forEach((q, idx) => {
            if (allStoredAnswers['mcq_shuffled_' + idx] === q.correctIndex) correct++;
          });
          const pct = Math.round((correct / total) * 100);
          setObjectiveGraded(true);
          if (pct >= 60) {
            SoundFX.playSuccess();
            if (window.confetti) window.confetti({ particleCount: 75, spread: 70 });
            Speech.read(`Quiz complete! You scored ${correct} out of ${total}.`);
          }
          recordSectionCompletion(activeStage.id, pct);
        } else if (activeStage.type === 'tf') {
          const total = shuffledTF.length;
          shuffledTF.forEach((q) => {
            if (allStoredAnswers['tf_' + q.id] === q.answer) correct++;
          });
          const pct = Math.round((correct / total) * 100);
          setObjectiveGraded(true);
          if (pct >= 60) {
            SoundFX.playSuccess();
            if (window.confetti) window.confetti({ particleCount: 75, spread: 70 });
            Speech.read(`Great job Humayun! You scored ${correct} out of ${total}.`);
          }
          recordSectionCompletion(activeStage.id, pct);
        } else if (activeStage.type === 'match') {
          const mState = allStoredAnswers['sec_4_match'] || { links: {} };
          activeStage.pairs.forEach(p => {
            if (mState.links[p.id] === p.id) correct++;
          });
          const pct = Math.round((correct / activeStage.pairs.length) * 100);
          setObjectiveGraded(true);
          if (pct >= 60) {
            SoundFX.playSuccess();
            if (window.confetti) window.confetti({ particleCount: 75, spread: 70 });
            Speech.read(`Great matching champion!`);
          }
          recordSectionCompletion(activeStage.id, pct);
        } else if (activeStage.type === 'odd_one_out') {
          shuffledOdd.forEach((q) => {
            if (allStoredAnswers['odd_' + q.id] === q.odd) correct++;
          });
          const pct = Math.round((correct / shuffledOdd.length) * 100);
          setObjectiveGraded(true);
          if (pct >= 60) {

                e('div', { className: 'flex-1 overflow-y-auto no-scrollbar space-y-3 pb-3' },
                  shuffledMCQs.map((q, idx) => {
                    const key = 'mcq_shuffled_' + idx;
                    const picked = allStoredAnswers[key];
                    return e('div', { key: idx, className: 'bg-white p-3.5 rounded-xl border border-emerald-200 space-y-2' },
                      e('p', { className: 'text-sm sm:text-base font-bold text-emerald-950' }, `${idx + 1}. ${q.q}`),
                      e('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-2' },
                        q.options.map((opt, oIdx) => {
                          const isSel = picked === oIdx;
                          const isCor = oIdx === q.correctIndex;
                          let style = 'bg-emerald-50/50 border-emerald-200 text-emerald-950 hover:bg-emerald-100';
                          if (objectiveGraded) {
                            if (isCor) style = 'bg-emerald-100 border-emerald-500 text-emerald-950 font-bold';
                            else if (isSel) style = 'bg-rose-50 border-rose-300 text-rose-950';
                          } else if (isSel) {
                            style = 'bg-emerald-700 border-emerald-800 text-white font-bold shadow-sm';
                          }
                          return e('button', {
                            key: oIdx,
                            disabled: objectiveGraded,
                            onClick: () => {
                              SoundFX.playTap();
                              setAllStoredAnswers(prev => ({ ...prev, [key]: oIdx }));
                            },
                            className: `p-3 rounded-lg border text-sm font-bold text-left transition ${style}`
                          }, opt);
                        })
                      )
                    );
                  })
                ),
                e('div', { className: 'pt-3 flex justify-between items-center gap-2 shrink-0 border-t border-emerald-100' },
                  e('button', {
                    onClick: () => {
                      SoundFX.playTap();
                      setObjectiveGraded(false);
                      initShuffledMCQ();
                      setAllStoredAnswers(prev => {
                        const next = { ...prev };
                        Object.keys(next).forEach(k => { if (k.startsWith('mcq_shuffled_')) delete next[k]; });
                        return next;
                      });
                      window.__showSaveToast('MCQ Reset & Reshuffled', '🔄');
                    },
                    className: 'px-4 py-2 bg-rose-100 hover:bg-rose-200 text-rose-800 rounded-xl font-bold text-sm transition border border-rose-200 shadow-xs'
                  }, 'Reset & Reshuffle 🔄'),
                  e('button', {
                    onClick: gradeObjective,
                    className: 'px-6 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl font-bold text-sm shadow-md'
                  }, 'Submit Quiz ✨')
                )
              ),

              activeStage.type === 'tf' && e('div', { className: 'flex-1 flex flex-col min-h-0 overflow-hidden' },
                e('div', { className: 'flex-1 overflow-y-auto no-scrollbar space-y-3 pb-3' },
                  shuffledTF.map((q, idx) => {
                    const key = 'tf_' + q.id;
                    const picked = allStoredAnswers[key];
                    return e('div', { key: q.id, className: 'bg-white p-3.5 rounded-xl border border-emerald-200 space-y-2' },
                      e('p', { className: 'text-sm sm:text-base font-bold text-emerald-950' }, `${idx + 1}. ${q.q}`),
                      e('div', { className: 'flex gap-2.5' },
                        [true, false].map(val => {
                          const isSel = picked === val;
                          const isCor = val === q.answer;
                          let style = 'bg-emerald-50/50 border-emerald-200 text-emerald-950 hover:bg-emerald-100';
                          if (objectiveGraded) {
                            if (isCor) style = 'bg-emerald-100 border-emerald-500 text-emerald-950 font-bold';
                            else if (isSel) style = 'bg-rose-50 border-rose-300 text-rose-950';
                          } else if (isSel) {
                            style = 'bg-emerald-700 border-emerald-800 text-white font-bold shadow-sm';
                          }
                          return e('button', {
                            key: String(val),
                            disabled: objectiveGraded,
                            onClick: () => {
                              SoundFX.playTap();
                              setAllStoredAnswers(prev => ({ ...prev, [key]: val }));
                            },
                            className: `flex-1 p-2.5 rounded-lg border text-sm font-bold transition ${style}`
                          }, val ? 'True' : 'False');
                        })
                      )
                    );
                  })
                ),
                e('div', { className: 'pt-3 flex justify-between items-center gap-2 shrink-0 border-t border-emerald-100' },
                  e('button', {
                    onClick: () => {
                      SoundFX.playTap();
                      setObjectiveGraded(false);
                      initShuffledTF();
                      setAllStoredAnswers(prev => {
                        const next = { ...prev };
                        Object.keys(next).forEach(k => { if (k.startsWith('tf_')) delete next[k]; });
                        return next;
                      });
                      window.__showSaveToast('True/False Reset & Reshuffled', '🔄');
                    },
                    className: 'px-4 py-2 bg-rose-100 hover:bg-rose-200 text-rose-800 rounded-xl font-bold text-sm transition border border-rose-200 shadow-xs'
                  }, 'Reset & Reshuffle 🔄'),
                  e('button', {
                    onClick: gradeObjective,
                    className: 'px-6 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl font-bold text-sm shadow-md'
                  }, 'Check Answers ✨')
                )
              ),

              activeStage.type === 'match' && (() => {
                const mState = allStoredAnswers['sec_4_match'] || {
                  lefts: activeStage.pairs.map(p => ({ id: p.id, text: p.left })),
                  rights: activeStage.pairs.map(p => ({ id: p.id, text: p.right })),
                  selectedLeft: null,
                  links: {}
                };

                const updateMatchState = (patch) => {
                  setAllStoredAnswers(prev => ({
                    ...prev,
                    sec_4_match: { ...mState, ...patch }
                  }));
                };

                return e('div', { className: 'flex-1 flex flex-col min-h-0 space-y-2.5 pb-4' },
                  e('p', { className: 'text-sm sm:text-base font-bold text-emerald-950' }, 'Tap an item on Column A, then tap its partner on Column B:'),
                  e('div', { className: 'flex-1 overflow-y-auto no-scrollbar grid grid-cols-1 sm:grid-cols-2 gap-3.5' },
                    e('div', { className: 'space-y-2' },
                      e('span', { className: 'text-xs font-bold uppercase text-emerald-900' }, 'Column A'),
                      mState.lefts.map(l => {
                        const isSel = mState.selectedLeft === l.id;
                        const isLinked = !!mState.links[l.id];
                        const isCor = objectiveGraded && mState.links[l.id] === l.id;
                        const isWrong = objectiveGraded && mState.links[l.id] && mState.links[l.id] !== l.id;

                        return e('div', {
                          key: l.id,
                          onClick: () => {
                            if (objectiveGraded) return;
                            SoundFX.playTap();
                            updateMatchState({ selectedLeft: isSel ? null : l.id });
                          },
                          className: `p-3 rounded-xl border text-sm sm:text-base font-bold cursor-pointer transition flex items-center justify-between ${isSel ? 'bg-amber-100 border-amber-400 ring-2 ring-amber-300' : isLinked ? 'bg-emerald-50 border-emerald-300' : 'bg-white border-emerald-200 hover:bg-emerald-50/60'} ${isCor ? '!bg-emerald-100 !border-emerald-500 !text-emerald-950' : ''} ${isWrong ? '!bg-rose-50 !border-rose-400 !text-rose-950' : ''}`
                        },
                          e('span', null, l.text),
                          isLinked && e('span', { className: 'w-3 h-3 rounded-full bg-emerald-700' })
                        );
                      })
                    ),
                    e('div', { className: 'space-y-2' },
                      e('span', { className: 'text-xs font-bold uppercase text-emerald-900' }, 'Column B'),
                      mState.rights.map(r => {
                        const linkedLeft = Object.keys(mState.links).find(k => mState.links[k] === r.id);
                        const isCor = objectiveGraded && linkedLeft === r.id;
                        const isWrong = objectiveGraded && linkedLeft && linkedLeft !== r.id;

                        return e('div', {
                          key: r.id,
                          onClick: () => {
                            if (objectiveGraded || !mState.selectedLeft) return;
                            SoundFX.playTap();
                            const leftId = mState.selectedLeft;
                            const nextLinks = { ...mState.links };
                            Object.keys(nextLinks).forEach(k => { if (nextLinks[k] === r.id) delete nextLinks[k]; });
                            nextLinks[leftId] = r.id;
                            updateMatchState({ links: nextLinks, selectedLeft: null });
                          },
                          className: `p-3 rounded-xl border text-sm sm:text-base font-bold cursor-pointer transition flex items-center justify-between ${linkedLeft ? 'bg-emerald-50 border-emerald-300' : 'bg-white border-emerald-200 hover:bg-emerald-50/60'} ${isCor ? '!bg-emerald-100 !border-emerald-500 !text-emerald-950' : ''} ${isWrong ? '!bg-rose-50 !border-rose-400 !text-rose-950' : ''}`
                        },
                          e('span', null, r.text),
                          linkedLeft && e('span', { className: 'w-3 h-3 rounded-full bg-emerald-700' })
                        );
                      })
                    )
                  ),
                  e('div', { className: 'pt-2 flex justify-end gap-2 shrink-0 border-t border-emerald-100' },
                    e('button', {
                      onClick: gradeObjective,
                      className: 'px-6 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl font-bold text-sm shadow-md'
                    }, 'Check Pairs ✨')
                  )
                );
              })(),

              activeStage.type === 'odd_one_out' && e('div', { className: 'flex-1 flex flex-col min-h-0' },
                e('div', { className: 'flex items-center justify-between gap-2.5 pb-2 shrink-0 flex-wrap border-b border-emerald-100' },
                  e('span', { className: 'text-sm font-bold text-emerald-900' }, 'Tap the odd item, then write it and its reason in the lined boxes:'),
                  e('div', { className: 'flex items-center gap-2' },
                    e('button', {
                      onClick: () => {
                        SoundFX.playTap();
                        initShuffledOdd();
                        window.__showSaveToast('List Reset & Reshuffled', '🔄');
                      },
                      className: 'px-3 py-1 bg-rose-100 hover:bg-rose-200 text-rose-800 rounded-lg text-xs font-bold border border-rose-200 transition'
                    }, 'Reset & Reshuffle 🔄'),
                    e(PencilCaseBar, {
                      onClear: () => {
                        shuffledOdd.forEach((q) => {
                          try {
                            AppStorage.removeItem(`evs_ink_v10_odd_scribble_${q.id}`);
                            AppStorage.removeItem(`evs_ink_v10_reason_scribble_${q.id}`);
                          } catch(err){}
                        });
                        window.location.hash = Math.random();
                        if (window.__showSaveToast) window.__showSaveToast('All boxes cleared', '🗑️');
                      }
                    })
                  )
                ),
                e('div', { className: 'flex-1 overflow-y-auto no-scrollbar space-y-4 py-3' },
                  shuffledOdd.map((q, idx) => {
                    const selKey = 'odd_' + q.id;
                    const pickedWord = allStoredAnswers[selKey];
                    const isOddCorrect = objectiveGraded && pickedWord === q.odd;

                    return e('div', { key: q.id, className: 'p-4 rounded-xl border border-emerald-200 bg-white space-y-3 shadow-xs' },
                      e('p', { className: 'text-base sm:text-lg font-bold text-emerald-950' }, `${idx + 1}. ${q.q}`),
                      e('div', { className: 'flex flex-wrap gap-2' },
                        q.words.map((w, wIdx) => {
                          const isSel = pickedWord === w;
                          let btnCls = 'bg-emerald-50/60 border-emerald-200 text-emerald-950 hover:bg-emerald-100';
                          if (objectiveGraded) {
                            if (w === q.odd) btnCls = 'bg-emerald-100 border-emerald-500 text-emerald-950 font-bold';
                            else if (isSel) btnCls = 'bg-rose-50 border-rose-300 text-rose-950';
                          } else if (isSel) {
                            btnCls = 'bg-emerald-700 border-emerald-800 text-white font-bold shadow-sm';
                          }
                          return e('button', {
                            key: wIdx,
                            disabled: objectiveGraded,
                            onClick: () => {
                              SoundFX.playTap();
                              setAllStoredAnswers(prev => ({ ...prev, [selKey]: w }));
                            },
                            className: `px-4 py-2 rounded-xl text-sm font-bold border transition ${btnCls}`
                          }, w);
                        })
                      ),
                      e('div', { className: 'space-y-2 pt-1' },
                        e(InlineScribbleBox, { key: `odd_scribble_${q.id}`, storageKey: `odd_scribble_${q.id}`, label: '1. Write Odd Item', widthClass: 'w-full max-w-md', heightClass: 'h-20' }),
                        e(InlineScribbleBox, { key: `reason_scribble_${q.id}`, storageKey: `reason_scribble_${q.id}`, label: '2. Write Reason', widthClass: 'w-full', heightClass: 'h-24' })
                      ),
                      objectiveGraded && e('div', { className: 'p-2.5 bg-emerald-50 rounded-lg text-sm space-y-1 border border-emerald-200' },
                        e('span', { className: `text-xs font-bold px-2 py-0.5 rounded ${isOddCorrect ? 'bg-emerald-200 text-emerald-900' : 'bg-rose-100 text-rose-900'}` }, `Odd item: ${q.odd}`),
                        e('p', { className: 'text-emerald-950 font-medium' }, e('span', { className: 'font-bold' }, 'Model Reason: '), q.reason)
                      )
                    );
                  })
                ),
                e('div', { className: 'pt-3 flex justify-between items-center gap-2 border-t border-emerald-100 shrink-0' },
                  e('button', {
                    onClick: () => {
                      SoundFX.playTap();
                      setObjectiveGraded(false);
                      initShuffledOdd();
                      setAllStoredAnswers(prev => {
                        const next = { ...prev };
                        Object.keys(next).forEach(k => { if (k.startsWith('odd_')) delete next[k]; });
                        return next;
                      });
                      window.__showSaveToast('Odd One Out Reset & Reshuffled', '🔄');
                    },
                    className: 'px-4 py-2 bg-rose-100 hover:bg-rose-200 text-rose-800 rounded-xl font-bold text-sm transition border border-rose-200 shadow-xs'
                  }, 'Reset & Reshuffle 🔄'),
                  e('button', {
                    onClick: gradeObjective,
                    className: 'px-6 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl font-bold text-sm shadow-md'
                  }, 'Check Answers ✨')
                )
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
