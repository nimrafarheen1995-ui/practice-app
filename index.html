<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Learning Quest</title>

  <!-- PWA & Standalone Fullscreen Directives -->
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#38BDF8" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', cursive, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: linear-gradient(135deg, #E0F2FE 0%, #EDE9FE 50%, #FEF3C7 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
    }

    .bg-bubble {
      position: fixed;
      font-size: 2.2rem;
      pointer-events: none;
      z-index: 0;
      opacity: 0.3;
      animation: floatUp 15s infinite linear;
    }
    @keyframes floatUp {
      0% { transform: translateY(105vh) rotate(0deg); }
      100% { transform: translateY(-15vh) rotate(360deg); }
    }

    .view-container {
      position: relative;
      z-index: 10;
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    header { text-align: center; }
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: #0F172A;
      text-shadow: 0 2px 0 #FFF;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 1.15rem;
      font-weight: 600;
      color: #475569;
    }

    /* Screen 1: Names Grid */
    .names-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 32px;
      width: 100%;
      max-width: 680px;
    }

    .name-card {
      background: #FFFFFF;
      border-radius: 36px;
      padding: 16px;
      border: 5px solid #E2E8F0;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .name-card:active { transform: translateY(3px) scale(0.98); }

    .card-humayun { border-color: #38BDF8; }
    .card-humayun:hover { border-color: #0284C7; box-shadow: 0 20px 40px rgba(56, 189, 248, 0.25); }

    .card-zaina { border-color: #C084FC; }
    .card-zaina:hover { border-color: #9333EA; box-shadow: 0 20px 40px rgba(192, 132, 252, 0.25); }

    .avatar-full-wrap {
      width: 100%;
      height: 320px;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #F1F5F9;
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Screen 2: Inside Student View */
    .inside-view {
      display: none;
      width: 100%;
      max-width: 650px;
      flex-direction: column;
      gap: 18px;
      position: relative;
      z-index: 10;
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .back-btn {
      background: #FFFFFF;
      border: 2px solid #CBD5E1;
      padding: 10px 20px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 800;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .back-btn:active { transform: translateY(2px); }

    .current-student-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0F172A;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-avatar-img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #FFF;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .lessons-deck {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .lesson-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-radius: 24px;
      text-decoration: none;
      color: #FFFFFF;
      font-weight: 800;
      font-size: 1.25rem;
      cursor: pointer;
      border: none;
      box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 10px 20px rgba(0,0,0,0.08);
      transition: transform 0.1s ease;
    }
    .lesson-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.18);
    }

    /* Color Palette for Subjects */
    .btn-english  { background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%); }
    .btn-math     { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); }
    .btn-evs      { background: linear-gradient(135deg, #10B981 0%, #059669 100%); }
    .btn-islam    { background: linear-gradient(135deg, #0D9488 0%, #115E59 100%); }
    .btn-tamil    { background: linear-gradient(135deg, #EF4444 0%, #B91C1C 100%); }
    .btn-arabic   { background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%); }
    .btn-default  { background: linear-gradient(135deg, #64748B 0%, #334155 100%); }

    .badge-count {
      background: rgba(255, 255, 255, 0.3);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 800;
      margin-left: 8px;
    }

    .arrow-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .status-msg {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      color: #64748B;
      font-weight: 700;
      border: 2px dashed #CBD5E1;
    }

    /* CHAPTER DRAWER MODAL */
    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .drawer-overlay.open { display: flex; }
    
    .drawer-box {
      background: #FFFFFF;
      border-radius: 28px;
      padding: 22px;
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border: 4px solid #E2E8F0;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      animation: popDrawer 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popDrawer {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px dashed #CBD5E1;
      padding-bottom: 10px;
    }
    .drawer-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0F172A;
    }
    .drawer-close {
      background: #F1F5F9;
      border: 2px solid #CBD5E1;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 55vh;
      overflow-y: auto;
    }
    .chapter-item-btn {
      background: #F8FAFC;
      border: 2px solid #CBD5E1;
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 1.05rem;
      font-weight: 800;
      color: #1E293B;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
      box-shadow: 0 3px 0 #CBD5E1;
    }
    .chapter-item-btn:hover {
      background: #FEF08A;
      border-color: #EAB308;
      transform: translateY(-2px);
    }
    .chapter-item-btn:active { transform: translateY(2px); box-shadow: none; }

    /* Fullscreen Seamless Lesson Frame */
    #lessonFrameContainer {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      background: #FFFFFF;
    }

    #activeLessonFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="bg-bubble" style="left: 10%; animation-delay: 0s;">🚀</div>
  <div class="bg-bubble" style="left: 30%; animation-delay: 4s;">⭐</div>
  <div class="bg-bubble" style="left: 65%; animation-delay: 8s;">🌱</div>
  <div class="bg-bubble" style="left: 85%; animation-delay: 2s;">📚</div>

  <!-- SCREEN 1: CHOOSE NAME -->
  <div class="view-container" id="nameSelectView">
    <header>
      <h1>Who is learning today?</h1>
      <p class="subtitle">Tap your photo to open your subjects:</p>
    </header>

    <div class="names-grid">
      <div class="name-card card-humayun" onclick="openStudentView('humayun')">
        <div class="avatar-full-wrap">
          <img src="assets/humayun-avatar.png" alt="Humayun" class="avatar-img" onerror="handleAvatarFallback(this, '👦')" />
        </div>
      </div>

      <div class="name-card card-zaina" onclick="openStudentView('zaina')">
        <div class="avatar-full-wrap">
          <img src="assets/zaina-avatar.png" alt="Zaina" class="avatar-img" onerror="handleAvatarFallback(this, '👧')" />
        </div>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: INSIDE STUDENT VIEW -->
  <div class="inside-view" id="studentView">
    <div class="top-nav">
      <button type="button" class="back-btn" onclick="showNameSelect()">⬅ Back</button>
      <div class="current-student-title" id="activeStudentLabel">
        <img src="assets/humayun-avatar.png" alt="Student" class="header-avatar-img" id="headerAvatar" onerror="handleAvatarFallback(this, '⭐')" />
        <span>Student</span>
      </div>
      <div style="width: 80px;"></div>
    </div>

    <!-- Automatically Populated Deck (One card per Subject) -->
    <div class="lessons-deck" id="lessonsDeck">
      <div class="status-msg">Finding active lessons... 🔍</div>
    </div>
  </div>

  <!-- CHAPTER / DATE PICKER DRAWER -->
  <div class="drawer-overlay" id="chapterDrawer" onclick="closeDrawerOnBackdrop(event)">
    <div class="drawer-box">
      <div class="drawer-header">
        <span class="drawer-title" id="drawerSubjectTitle">Maths Chapters</span>
        <button class="drawer-close" onclick="closeDrawer()">✕</button>
      </div>
      <div class="chapter-list" id="drawerChapterList"></div>
    </div>
  </div>

  <!-- SEAMLESS FULLSCREEN EMBED -->
  <div id="lessonFrameContainer">
    <iframe id="activeLessonFrame" src="about:blank" allow="autoplay; fullscreen"></iframe>
  </div>

  <script>
    const GITHUB_REPO = "nimrafarheen1995-ui/practice-app";
    let lessonsCache = null;

    const SUBJECT_CONFIG = {
      english:    { key: "english",    icon: "📖", colorClass: "btn-english", label: "English" },
      maths:      { key: "maths",      icon: "🔢", colorClass: "btn-math",    label: "Maths" },
      math:       { key: "maths",      icon: "🔢", colorClass: "btn-math",    label: "Maths" },
      evs:        { key: "evs",        icon: "🌱", colorClass: "btn-evs",     label: "EVS" },
      science:    { key: "evs",        icon: "🔬", colorClass: "btn-evs",     label: "EVS Science" },
      islamiyath: { key: "islamiyath", icon: "🌙", colorClass: "btn-islam",   label: "Islamiyath" },
      islam:      { key: "islamiyath", icon: "🌙", colorClass: "btn-islam",   label: "Islamiyath" },
      tamil:      { key: "tamil",      icon: "🪔", colorClass: "btn-tamil",   label: "Tamil" },
      arabic:     { key: "arabic",     icon: "📜", colorClass: "btn-arabic",  label: "Arabic" }
    };

    function handleAvatarFallback(img, emoji) {
      img.onerror = null;
      img.src = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><circle cx='80' cy='80' r='75' fill='%23F1F5F9' stroke='%23CBD5E1' stroke-width='4'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-size='70'>${emoji}</text></svg>`;
    }

    function requestFullScreenAuto() {
      const el = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      }
    }

    function parseFileName(fileName) {
      let base = fileName.replace(/\.html$/i, "");
      
      let student = "";
      if (base.toLowerCase().startsWith("humayun")) student = "humayun";
      else if (base.toLowerCase().startsWith("zaina")) student = "zaina";
      else return null;

      let remainder = base.replace(new RegExp(`^${student}[-_]?`, "i"), "").toLowerCase();
      if (!remainder) remainder = "english";

      let matchedConfig = { key: remainder, icon: "📝", colorClass: "btn-default", label: "Lesson" };

      for (const [key, cfg] of Object.entries(SUBJECT_CONFIG)) {
        if (remainder.includes(key)) {
          matchedConfig = cfg;
          break;
        }
      }

      // Extract optional date or chapter label (e.g. oct06, oct09)
      const dateMatch = remainder.match(/(oct\d+|nov\d+|dec\d+|jan\d+|feb\d+|ch\d+|part\d+|\d+)/i);
      const chapterLabel = dateMatch ? dateMatch[0].toUpperCase() : "Today's Lesson";

      return {
        student: student,
        fileName: fileName,
        subjectKey: matchedConfig.key,
        subjectTitle: `${matchedConfig.icon} ${matchedConfig.label}`,
        colorClass: matchedConfig.colorClass,
        chapterLabel: chapterLabel
      };
    }

    async function loadRepositoryFiles(forceRefresh = false) {
      if (lessonsCache && !forceRefresh) return lessonsCache;

      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/?t=${Date.now()}`, {
          cache: "no-store",
          headers: { "Accept": "application/vnd.github.v3+json" }
        });
        
        if (!res.ok) throw new Error("API call error");
        const files = await res.json();
        
        lessonsCache = files
          .filter(f => f.name.endsWith(".html") && f.name !== "index.html")
          .map(f => parseFileName(f.name))
          .filter(Boolean);

        return lessonsCache;
      } catch (err) {
        return [
          { student: "humayun", fileName: "humayun-english-oct07.html", subjectKey: "english", subjectTitle: "📖 English", colorClass: "btn-english", chapterLabel: "OCT07" },
          { student: "humayun", fileName: "humayun-evs-oct07.html", subjectKey: "evs", subjectTitle: "🌱 EVS", colorClass: "btn-evs", chapterLabel: "OCT07" },
          { student: "humayun", fileName: "humayun-maths-oct06.html", subjectKey: "maths", subjectTitle: "🔢 Maths", colorClass: "btn-math", chapterLabel: "OCT06" },
          { student: "humayun", fileName: "humayun-maths-oct09.html", subjectKey: "maths", subjectTitle: "🔢 Maths", colorClass: "btn-math", chapterLabel: "OCT09" },
          { student: "humayun", fileName: "humayun-tamil-oct07.html", subjectKey: "tamil", subjectTitle: "🪔 Tamil", colorClass: "btn-tamil", chapterLabel: "OCT07" },
          { student: "zaina", fileName: "zaina-maths-oct07.html", subjectKey: "maths", subjectTitle: "🔢 Maths", colorClass: "btn-math", chapterLabel: "OCT07" }
        ];
      }
    }

    let activeStudentGroupedLessons = {};

    async function openStudentView(name) {
      requestFullScreenAuto();

      document.getElementById('nameSelectView').style.display = 'none';
      const studentView = document.getElementById('studentView');
      studentView.style.display = 'flex';

      const avatarSrc = name === 'humayun' ? 'assets/humayun-avatar.png' : 'assets/zaina-avatar.png';
      const studentNameCapitalized = name.charAt(0).toUpperCase() + name.slice(1);
      
      const label = document.getElementById('activeStudentLabel');
      label.innerHTML = `
        <img src="${avatarSrc}" alt="${studentNameCapitalized}" class="header-avatar-img" onerror="handleAvatarFallback(this, '${name === 'humayun' ? '👦' : '👧'}')" /> 
        <span>${studentNameCapitalized}</span>
      `;

      const deck = document.getElementById('lessonsDeck');
      deck.innerHTML = '<div class="status-msg">Finding active lessons... 🔍</div>';

      const allFiles = await loadRepositoryFiles(true);
      const studentFiles = allFiles.filter(item => item.student === name);

      deck.innerHTML = "";

      if (studentFiles.length === 0) {
        deck.innerHTML = '<div class="status-msg">No lessons uploaded yet for today! ✨</div>';
        return;
      }

      // Group by canonical subject key
      activeStudentGroupedLessons = {};
      studentFiles.forEach(file => {
        if (!activeStudentGroupedLessons[file.subjectKey]) {
          activeStudentGroupedLessons[file.subjectKey] = {
            subjectKey: file.subjectKey,
            subjectTitle: file.subjectTitle,
            colorClass: file.colorClass,
            files: []
          };
        }
        activeStudentGroupedLessons[file.subjectKey].files.push(file);
      });

      // Render ONE button per subject
      Object.values(activeStudentGroupedLessons).forEach(subjectGroup => {
        // Sort files newest date first
        subjectGroup.files.sort((a, b) => b.fileName.localeCompare(a.fileName));

        const countBadge = subjectGroup.files.length > 1 ? `<span class="badge-count">${subjectGroup.files.length} Chapters</span>` : '';
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `lesson-btn ${subjectGroup.colorClass}`;
        btn.innerHTML = `
          <span>${subjectGroup.subjectTitle} ${countBadge}</span>
          <div class="arrow-circle">➔</div>
        `;
        
        btn.onclick = () => {
          if (subjectGroup.files.length === 1) {
            launchLesson(subjectGroup.files[0].fileName);
          } else {
            openChapterDrawer(subjectGroup);
          }
        };
        deck.appendChild(btn);
      });
    }

    function openChapterDrawer(subjectGroup) {
      document.getElementById('drawerSubjectTitle').textContent = `${subjectGroup.subjectTitle} Chapters`;
      const list = document.getElementById('drawerChapterList');
      list.innerHTML = "";

      subjectGroup.files.forEach(f => {
        const itemBtn = document.createElement("button");
        itemBtn.type = "button";
        itemBtn.className = "chapter-item-btn";
        itemBtn.innerHTML = `
          <span>📅 Lesson: <b>${f.chapterLabel}</b></span>
          <span>Start ▶</span>
        `;
        itemBtn.onclick = () => {
          closeDrawer();
          launchLesson(f.fileName);
        };
        list.appendChild(itemBtn);
      });

      document.getElementById('chapterDrawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('chapterDrawer').classList.remove('open');
    }

    function closeDrawerOnBackdrop(e) {
      if (e.target.id === 'chapterDrawer') closeDrawer();
    }

    function showNameSelect() {
      closeDrawer();
      document.getElementById('studentView').style.display = 'none';
      document.getElementById('nameSelectView').style.display = 'flex';
    }

    function launchLesson(fileName) {
      requestFullScreenAuto();
      const container = document.getElementById('lessonFrameContainer');
      const frame = document.getElementById('activeLessonFrame');
      frame.src = fileName;
      container.style.display = 'block';
    }

    window.addEventListener("message", function(e) {
      if (e.data === "close-lesson-to-hub") {
        const container = document.getElementById('lessonFrameContainer');
        const frame = document.getElementById('activeLessonFrame');
        container.style.display = 'none';
        frame.src = "about:blank";
      }
    });

    loadRepositoryFiles();
  </script>
</body>
</html>
