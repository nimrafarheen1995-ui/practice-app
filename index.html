<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Daily Learning Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fredoka', cursive, sans-serif; }
    body {
      background: linear-gradient(180deg, #f0fdf4 0%, #e0f2fe 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
      color: #1e293b;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      text-align: center;
      color: #0f172a;
    }
    p.subtitle {
      font-size: 1.1rem;
      color: #475569;
      margin-bottom: 30px;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      max-width: 950px;
      width: 100%;
    }
    .student-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      border: 2px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .student-card h2 {
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f1f5f9;
    }
    .lesson-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.15rem;
      color: #ffffff;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .lesson-btn:active { transform: scale(0.98); }
    .bg-science { background: #059669; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3); }
    .bg-english { background: #2563eb; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    .bg-zaina   { background: #7c3aed; box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3); }
  </style>
</head>
<body>

  <h1>🚀 Learning Quest Hub</h1>
  <p class="subtitle">Select your lesson for today to begin!</p>

  <div class="grid">
    <!-- HUMAYUN'S SECTION -->
    <div class="student-card">
      <h2>👦 Humayun</h2>
      
      <!-- Science EVS File -->
      <a href="humayun-science.html" class="lesson-btn bg-science">
        <span>🌱 EVS Science Nature Trail</span>
        <span>➔</span>
      </a>

      <!-- English Word Quest File -->
      <a href="humayun.html" class="lesson-btn bg-english">
        <span>📖 English Word Quest</span>
        <span>➔</span>
      </a>
    </div>

    <!-- ZAINA'S SECTION -->
    <div class="student-card">
      <h2>👧 Zaina</h2>
      
      <!-- Zaina English Trail -->
      <a href="zaina.html" class="lesson-btn bg-zaina">
        <span>🏔️ English Trail (Grade 5)</span>
        <span>➔</span>
      </a>
    </div>
  </div>

</body>
</html>
