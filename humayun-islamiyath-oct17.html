<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Humayun's Islamiyath Notebook</title>
<style>
:root { --gold:#f59e0b; --ink:#0f172a; --paper:#fffefb; --bg:#eef6ff; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; font-family:"Fredoka","Segoe UI",system-ui,sans-serif; }
html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); }
body { display:flex; flex-direction:column; }

/* TOP BAR: only what is needed */
.bar { display:flex; align-items:center; gap:10px; padding:8px 12px; background:#fff; border-bottom:2px solid #cbd5e1; flex-wrap:wrap; }
.hub { height:48px; padding:0 18px; border-radius:14px; border:0; background:#0d9488; color:#fff; font-size:18px; font-weight:700; cursor:pointer; }
.hub:active { transform:scale(.97); }
.stations { display:flex; gap:8px; flex:1; flex-wrap:wrap; }
.st { height:48px; padding:0 14px; border-radius:14px; border:2px solid #cbd5e1; background:#f8fafc; font-size:16px; font-weight:700; cursor:pointer; }
.st.on { background:#fef3c7; border-color:var(--gold); }
.st.done::after { content:" ✔"; color:#059669; }
.right { display:flex; gap:8px; align-items:center; }
.seg { display:flex; border:2px solid #cbd5e1; border-radius:14px; overflow:hidden; }
.seg button { height:44px; padding:0 14px; border:0; background:#fff; font-size:16px; font-weight:700; cursor:pointer; }
.seg button.on { background:var(--gold); color:#000; }
.iconbtn { width:48px; height:48px; border-radius:14px; border:2px solid #cbd5e1; background:#fff; font-size:22px; cursor:pointer; }
.iconbtn.on { border-color:var(--gold); }

/* MAIN: question on the left (tablet) or top (phone); writing beside/below */
main { flex:1; min-height:0; display:grid; gap:10px; padding:10px; grid-template-rows:minmax(0,38%) minmax(0,1fr); }
@media (min-width:760px) { main { grid-template-columns:minmax(300px,38%) 1fr; grid-template-rows:1fr; } }

.lesson { background:#fff; border:2px solid #cbd5e1; border-radius:18px; padding:14px 16px; overflow-y:auto; -webkit-overflow-scrolling:touch; font-size:19px; line-height:1.5; }
.lnum { font-size:14px; font-weight:700; color:#b45309; }
.ltitle { font-size:24px; font-weight:700; margin:2px 0 6px; }
.question { font-weight:600; margin-bottom:10px; }
.answer { background:#f0fdf4; border:2px solid #86efac; border-radius:14px; padding:10px 12px; font-size:18px; line-height:1.6; }
.answer ol { padding-left:24px; margin-top:4px; }
.answer li { margin-bottom:3px; }
.sw { display:inline-block; cursor:pointer; border-radius:6px; padding:0 1px; }
.sw:active { background:#fde68a; }
.sy { font-weight:700; padding:0 2px; border-radius:4px; }
.s1 { color:#be123c; } .s2 { color:#1d4ed8; } .s3 { color:#047857; } .s4 { color:#b45309; }
.btn { height:44px; padding:0 14px; border-radius:12px; border:2px solid #94a3b8; background:#fff; font-size:17px; font-weight:700; cursor:pointer; margin:4px 4px 4px 0; }
.btn.go { background:#059669; color:#fff; border-color:#047857; }
.btn.warm { background:#fef3c7; border-color:var(--gold); }
.chip { display:inline-block; padding:8px 12px; margin:4px; border-radius:12px; border:2px solid #94a3b8; background:#fff; font-size:17px; cursor:pointer; }
.slots { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:6px; margin-top:8px; }
.slot { min-height:42px; padding:6px 10px; border-radius:12px; border:2px dashed #94a3b8; background:#f8fafc; display:flex; align-items:center; gap:6px; font-size:16px; cursor:pointer; }
.slot.ok { border-style:solid; border-color:#059669; background:#d1fae5; }
.slot.bad { border-style:solid; border-color:#e11d48; background:#ffe4e6; }
.blank { display:inline-flex; align-items:center; justify-content:center; min-width:84px; height:36px; padding:0 8px; border-bottom:3px solid var(--gold); background:#fef3c7; border-radius:8px; margin:0 4px; font-weight:700; cursor:pointer; }
.blank.sel { outline:3px solid var(--gold); }
.blank.fill { background:#d1fae5; border-bottom-color:#059669; }
.blank.wb { cursor:default; background:#f1f5f9; border-bottom-color:#94a3b8; }
.arabic { font-family:"Traditional Arabic","Scheherazade New",serif; font-size:22px; direction:rtl; line-height:1.8; background:#fffbeb; border-right:4px solid var(--gold); padding:8px 12px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; }

/* WRITING */
.writing { display:flex; flex-direction:column; min-height:0; gap:8px; }
.tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:#fff; border:2px solid #cbd5e1; border-radius:16px; padding:6px 10px; }
.tool { height:46px; min-width:46px; padding:0 10px; border-radius:12px; border:2px solid #cbd5e1; background:#f8fafc; font-size:20px; cursor:pointer; }
.tool.on { background:#fef3c7; border-color:var(--gold); }
.dot { width:30px; height:30px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2px #cbd5e1; cursor:pointer; }
.dot.on { box-shadow:0 0 0 3px var(--gold); }
.sep { width:2px; height:30px; background:#cbd5e1; }
.page { flex:1; min-height:0; position:relative; background:var(--paper); border:2px solid #cbd5e1; border-radius:18px; overflow:hidden; background-image:repeating-linear-gradient(to bottom, transparent 0 39px, #cbd5e1 39px 40px); }
#ink { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }

/* FOOTER */
.foot { display:flex; gap:10px; justify-content:flex-end; align-items:center; padding:8px 12px; background:#fff; border-top:2px solid #cbd5e1; }
.foot .go { height:52px; padding:0 22px; font-size:19px; border-radius:14px; }
.foot #next { display:none; }

/* PIN + CELEBRATION */
.modal { display:none; position:fixed; inset:0; background:rgba(15,23,42,.7); z-index:200; align-items:center; justify-content:center; padding:16px; }
.modal.open { display:flex; }
.mbox { background:#fff; border-radius:20px; padding:22px; width:min(360px,92vw); text-align:center; }
.mbox h3 { font-size:22px; margin-bottom:6px; }
.mbox p { font-size:16px; color:#475569; margin-bottom:12px; }
.dots { display:flex; justify-content:center; gap:10px; margin-bottom:12px; }
.dots i { width:16px; height:16px; border-radius:50%; border:2px solid var(--gold); }
.dots i.f { background:var(--gold); }
.pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.pad button { height:56px; font-size:22px; font-weight:700; border-radius:12px; border:2px solid #cbd5e1; background:#f8fafc; cursor:pointer; }
.err { color:#e11d48; font-weight:700; min-height:20px; margin-top:8px; }
.cel-title { font-size:30px; font-weight:700; color:#b45309; margin:6px 0; }
</style>
</head>
<body>

<header class="bar">
  <button class="hub" id="hub" title="Back to the main hub">🏠 Hub</button>
  <div class="stations" id="stations"></div>
  <div class="right">
    <div class="seg" role="group" aria-label="Mode">
      <button id="mP" class="on">📘 Practice</button>
      <button id="mW">✍️ Write</button>
    </div>
    <button class="iconbtn on" id="snd" title="Read aloud on/off">🔊</button>
  </div>
</header>

<main>
  <section class="lesson" id="lesson">
    <div class="lnum" id="lnum"></div>
    <h2 class="ltitle" id="ltitle"></h2>
    <p class="question" id="qtext"></p>
    <div id="pillars" style="display:none">
      <p style="font-weight:600;margin-bottom:4px">Tap the cards in order:</p>
      <div id="bank"></div>
      <div class="slots" id="slots"></div>
    </div>
    <div id="dua" style="display:none"></div>
    <div class="answer" id="answer"></div>
    <div id="check" style="margin-top:8px"></div>
  </section>

  <section class="writing">
    <div class="tools" id="tools">
      <button class="tool on" id="tPen" title="Pen">✏️</button>
      <button class="tool" id="tEr" title="Eraser">🧽</button>
      <span class="sep"></span>
      <span id="cols"></span>
      <span class="sep"></span>
      <button class="tool" id="sS" title="Thin">▪</button>
      <button class="tool on" id="sM" title="Medium">◼</button>
      <button class="tool" id="sL" title="Thick">⬛</button>
      <span class="sep"></span>
      <button class="tool" id="undo" title="Undo">↩️</button>
      <button class="tool" id="clear" title="Clear">🗑️</button>
    </div>
    <div class="page"><canvas id="ink"></canvas></div>
  </section>
</main>

<footer class="foot">
  <button class="btn go" id="done">✔ Mark done</button>
  <button class="btn warm" id="next">Next ▶</button>
</footer>

<!-- Parent check (write mode): PIN is not shown on screen -->
<div class="modal" id="pin">
  <div class="mbox">
    <h3>Parent check</h3>
    <p>A parent enters the PIN to mark this lesson done.</p>
    <div class="dots" id="pdots"><i></i><i></i><i></i><i></i></div>
    <div class="pad" id="ppad"></div>
    <div class="err" id="perr"></div>
    <button class="btn" id="pcancel" style="margin-top:6px">Not now</button>
  </div>
</div>

<div class="modal" id="cel">
  <div class="mbox">
    <div style="font-size:60px">🌟</div>
    <div class="cel-title" id="celT">MashaAllah, Humayun!</div>
    <p id="celX"></p>
    <button class="btn go" id="celOk">Continue</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};

/* ---------- LESSON CONTENT (from the textbook) ---------- */
const ST = [
  { id: 1, title: 'Articles of Faith', q: 'What are the articles of faith?',
    pillars: ['Believe in Allah (SWT)', 'His angels', 'His books', 'His messengers', 'The Day of Resurrection', 'Destiny (Whatever Allah has ordained)'] },
  { id: 2, title: 'Sayyidah Khadijah (RA)', q: 'Who was Khadijah (RA) and what was her honor in Islam?',
    a: 'Khadijah (RA) was a noble, kind, wealthy lady of Makkah. She was the wife of Prophet Muhammad (SAW). Khadijah (RA) was the first woman to accept Islam.' },
  { id: 3, title: 'Cleanliness & Bathing', q: 'Why is bathing daily a good practice?',
    a: 'Taking bath daily is a good practice. It makes a person clean and healthy.' },
  { id: 4, title: 'Dua for Garment', q: 'Fill in the blanks with the Hadith on wearing a garment:',
    words: ['garment', 'clothes', 'without', 'power', 'ability', 'forgiven'] }
];
const DUA_TEXT = ["<strong>Allah's messenger (SAW) said:</strong> He who puts on a ", 0, " and says: Praise be to Allah, who ", 1, " me with this and who provides me with it ", 2, " any ", 3, " or ", 4, " from me, his past and present sins are ", 5, " for him. (Abu Dawood)"];
const DUA_ARABIC = "الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا الثَّوْبَ وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلاَ قُوَّةٍ";
const SYL = { allah:['Al','lah'], prophet:['Pro','phet'], muhammad:['Mu','ham','mad'], angels:['An','gels'], resurrection:['Re','sur','rec','tion'], messengers:['Mes','sen','gers'], ordained:['Or','dained'], destiny:['Des','ti','ny'], khadijah:['Kha','di','jah'], makkah:['Mak','kah'], cleanliness:['Clean','li','ness'], practice:['Prac','tice'], garment:['Gar','ment'], ability:['A','bil','i','ty'], forgiven:['For','giv','en'], healthy:['Health','y'] };

const stOf = id => ST.find(s => s.id === id);

/* ---------- STATE ---------- */
let cur = 1, write = false, readAloud = store.get('isl::speak') !== 'off';
let done = new Set(JSON.parse(store.get('isl::done') || '[]'));
const saveDone = () => store.set('isl::done', JSON.stringify([...done]));

/* ---------- SPEECH ---------- */
function say(t, rate = .9, pitch = 1) {
  if (!readAloud || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.rate = rate; u.pitch = pitch; u.lang = 'en-IN';
  speechSynthesis.speak(u);
}
function sayParts(parts) {
  if (!readAloud || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  parts.forEach(p => { const u = new SpeechSynthesisUtterance(p); u.rate = .45; u.pitch = .85; u.lang = 'en-IN'; speechSynthesis.speak(u); });
}

/* Tap a word = hear it. Hold a word = hear it in syllables (only where the split is known). */
let lp = null, held = false;
function wordSpan(w) {
  const k = w.toLowerCase().replace(/[^a-z]/g, ''), s = document.createElement('span');
  s.className = 'sw'; s.textContent = w + ' ';
  s.addEventListener('click', e => { e.stopPropagation(); if (held) { held = false; return; } say(w); });
  s.addEventListener('pointerdown', () => { held = false; clearTimeout(lp); lp = setTimeout(() => {
      held = true;
      if (SYL[k]) { s.innerHTML = ''; SYL[k].forEach((x, i) => { const p = document.createElement('span'); p.className = 'sy s' + ((i % 4) + 1); p.textContent = x + (i < SYL[k].length - 1 ? '·' : ' '); s.appendChild(p); }); sayParts(SYL[k]); }
      else say(w);
    }, 450); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => s.addEventListener(n, () => clearTimeout(lp)));
  return s;
}
function wordsInto(el, text) { el.innerHTML = ''; text.split(/\s+/).forEach(w => el.appendChild(wordSpan(w))); }
function wrapWords(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false), ns = [];
  while (w.nextNode()) ns.push(w.currentNode);
  ns.forEach(n => {
    if (!n.nodeValue.trim() || n.parentElement.closest('.blank,button,.chip,.slot')) return;
    const fr = document.createDocumentFragment();
    n.nodeValue.split(/(\s+)/).forEach(p => fr.appendChild(p.trim() ? wordSpan(p) : document.createTextNode(p)));
    n.parentNode.replaceChild(fr, n);
  });
}

/* ---------- STATIONS BAR ---------- */
function renderStations() {
  $('stations').innerHTML = ST.map(s => `<button class="st ${s.id === cur ? 'on' : ''} ${done.has(s.id) ? 'done' : ''}" data-id="${s.id}">${s.id}. ${s.title}</button>`).join('');
}
$('stations').onclick = e => { const b = e.target.closest('[data-id]'); if (b) openStation(+b.dataset.id); };

/* ---------- HUB: back to the main hub (the student's subjects) ---------- */
$('hub').onclick = () => {
  saveInk();
  if (window.parent && window.parent !== window) window.parent.postMessage('close-lesson-to-hub', '*');
  else location.href = 'index.html';
};

/* ---------- MODE ---------- */
function setMode(w) {
  saveInk();
  write = w;
  $('mP').classList.toggle('on', !w); $('mW').classList.toggle('on', w);
  store.set('isl::mode', w ? 'w' : 'p');
  openStation(cur);
}
$('mP').onclick = () => setMode(false);
$('mW').onclick = () => setMode(true);
$('snd').onclick = () => { readAloud = !readAloud; $('snd').textContent = readAloud ? '🔊' : '🔇'; $('snd').classList.toggle('on', readAloud); store.set('isl::speak', readAloud ? 'on' : 'off'); if (!readAloud && window.speechSynthesis) speechSynthesis.cancel(); };

/* ---------- LESSON VIEW ---------- */
function openStation(id) {
  saveInk();
  cur = id;
  const s = stOf(id);
  $('lnum').textContent = 'Lesson ' + id + ' of ' + ST.length;
  $('ltitle').textContent = s.title;
  wordsInto($('qtext'), s.q);
  $('pillars').style.display = 'none';
  $('dua').style.display = 'none';
  $('answer').style.display = 'block';
  $('answer').innerHTML = '';
  $('check').innerHTML = '';

  if (id === 1) { $('pillars').style.display = 'block'; pillarsGame(); }
  if (id === 4) { $('dua').style.display = 'block'; buildDua(); }

  if (id === 1) {
    $('answer').style.display = 'none';
    if (write) $('check').innerHTML = '<button class="btn warm" id="showAns">🔍 Check my answer</button>';
    else $('check').innerHTML = '<button class="btn warm" id="showAns">💡 Show answer</button>';
    $('showAns').onclick = () => showAnswer(1);
  } else if (id === 2 || id === 3) {
    if (write) {
      $('answer').style.display = 'none';
      $('check').innerHTML = '<button class="btn warm" id="showAns">🔍 Check my answer</button>';
      $('showAns').onclick = () => showAnswer(id);
    } else {
      showAnswer(id);
    }
  } else if (id === 4) {
    $('answer').style.display = 'none';
  }

  renderStations();
  $('next').style.display = done.has(id) ? 'inline-block' : 'none';
  loadInk();
}

function showAnswer(id) {
  const s = stOf(id);
  const html = id === 1
    ? '<div>The articles of faith are:</div><ol>' + s.pillars.map(p => '<li>' + p + '</li>').join('') + '</ol>'
    : s.a;
  $('answer').style.display = 'block';
  $('answer').innerHTML = html;
  wrapWords($('answer'));
  const b = $('showAns'); if (b) b.style.display = 'none';
}

/* ---------- STATION 1: ORDER THE ARTICLES ---------- */
let order = [], placed = [], tries = 0;
function shuffled(a) { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function pillarsGame() {
  const P = stOf(1).pillars;
  order = shuffled(P); placed = Array(P.length).fill(null); tries = 0;
  drawPillars();
}
function drawPillars() {
  const P = stOf(1).pillars, used = new Set(placed.filter(Boolean));
  $('bank').innerHTML = '';
  order.filter(p => !used.has(p)).forEach(p => {
    const c = document.createElement('span'); c.className = 'chip'; c.textContent = p;
    c.onclick = () => {
      const i = placed.indexOf(null); if (i < 0) return;
      placed[i] = p; drawPillars();
      if (placed.every(Boolean)) {
        if (placed.every((v, j) => v === P[j])) { say('MashaAllah! Correct order!'); markDone(1); }
        else { tries++; if (tries >= 2) { placed = [...P]; drawPillars(); markDone(1); } else say('Try again'); }
      }
    };
    $('bank').appendChild(c);
  });
  $('slots').innerHTML = '';
  placed.forEach((p, i) => {
    const s = document.createElement('div');
    s.className = 'slot' + (p === P[i] ? ' ok' : p ? ' bad' : '');
    s.textContent = (i + 1) + '. ' + (p || '[tap a card]');
    if (p) s.onclick = () => { placed[i] = null; drawPillars(); };
    $('slots').appendChild(s);
  });
}

/* ---------- STATION 4: THE DUA BLANKS ---------- */
let dua = { sel: 0, placed: new Set(), order: [], tries: 0 };
function buildDua() {
  const W = stOf(4).words;
  dua = { sel: 0, placed: new Set(), order: shuffled(W), tries: 0 };
  const text = DUA_TEXT.map(p => typeof p === 'string' ? p
    : write ? '<span class="blank wb" id="b' + p + '">' + (p + 1) + '</span>'
    : '<span class="blank" id="b' + p + '" onclick="pickBlank(' + p + ')">' + (p + 1) + '</span>').join('');
  $('dua').innerHTML = '<div class="arabic"><span>' + DUA_ARABIC + '</span><button class="btn" id="duaPlay">🔊</button></div><div style="font-size:19px;line-height:2">' + text + '</div>' +
    (write ? '<p style="margin-top:6px;color:#475569">Write the missing words in your notebook.</p>' : '<div id="duaBank" style="margin-top:6px"></div>');
  $('duaPlay').onclick = () => { if (window.speechSynthesis && readAloud) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(DUA_ARABIC); u.lang = 'ar-SA'; speechSynthesis.speak(u); } };
  if (!write) { drawDuaBank(); pickBlank(0); }
}
function pickBlank(k) {
  if (dua.placed.has(stOf(4).words[k])) return;
  dua.sel = k;
  document.querySelectorAll('.blank').forEach(e => e.classList.remove('sel'));
  const b = $('b' + k); if (b) b.classList.add('sel');
}
function drawDuaBank() {
  $('duaBank').innerHTML = dua.order.filter(w => !dua.placed.has(w)).map(w => '<span class="chip" onclick="placeWord(\'' + w + '\')">' + w + '</span>').join('');
}
function placeWord(w) {
  const W = stOf(4).words, sl = $('b' + dua.sel);
  if (W[dua.sel] !== w) {
    sl.classList.add('shake'); dua.tries++;
    say('Try again');
    if (dua.tries >= 2) { w = W[dua.sel]; dua.tries = 0; } else return;
  }
  dua.tries = 0;
  sl.textContent = w; sl.classList.remove('sel'); sl.classList.add('fill');
  dua.placed.add(w); say(w);
  drawDuaBank();
  const n = W.findIndex(x => !dua.placed.has(x));
  if (n < 0) markDone(4); else pickBlank(n);
}

/* ---------- DONE + PARENT CHECK ---------- */
let pinTyped = '';
function buildPad() {
  $('ppad').innerHTML = ['1','2','3','4','5','6','7','8','9','C','0','✖'].map(k =>
    '<button data-k="' + k + '">' + k + '</button>').join('');
  $('ppad').onclick = e => {
    const k = e.target.dataset.k; if (!k) return;
    if (k === 'C') pinTyped = ''; else if (k === '✖') { closePin(); return; }
    else if (pinTyped.length < 4) pinTyped += k;
    drawDots();
    if (pinTyped.length === 4) {
      if (pinTyped === '1995') { closePin(); markDone(cur); }
      else { $('perr').textContent = 'Not correct. Try again.'; pinTyped = ''; drawDots(); }
    }
  };
}
function drawDots() { document.querySelectorAll('#pdots i').forEach((d, i) => d.classList.toggle('f', i < pinTyped.length)); }
function closePin() { $('pin').classList.remove('open'); pinTyped = ''; drawDots(); $('perr').textContent = ''; }
$('pcancel').onclick = closePin;

$('done').onclick = () => {
  if (write) { pinTyped = ''; drawDots(); $('perr').textContent = ''; $('pin').classList.add('open'); }
  else markDone(cur);
};

function markDone(id) {
  const first = !done.has(id);
  done.add(id); saveDone(); renderStations();
  $('next').style.display = 'inline-block';
  if (first) celebrate(id);
}
function celebrate(id) {
  const all = done.size === ST.length;
  $('celT').textContent = all ? 'MashaAllah, Humayun!' : 'Well done!';
  $('celX').textContent = all ? 'You finished all four Islamiyath lessons.' : 'Lesson ' + id + ' is done. Keep going!';
  $('cel').classList.add('open');
  say(all ? 'MashaAllah Humayun! You finished all the lessons.' : 'Well done Humayun!');
}
$('celOk').onclick = () => $('cel').classList.remove('open');
$('next').onclick = () => openStation(cur < ST.length ? cur + 1 : 1);

/* ---------- WRITING CANVAS ---------- */
const cv = $('ink'), ctx = cv.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let color = '#0f172a', size = 4, tool = 'pen', stroke = null, undoStack = [], penSeen = 0, inkDirty = false, saveTimer = null;
const COLS = ['#0f172a', '#1d4ed8', '#059669', '#dc2626'];
$('cols').innerHTML = COLS.map((c, i) => '<span class="dot ' + (i ? '' : 'on') + '" style="display:inline-block;background:' + c + '" data-c="' + c + '"></span>').join('');
$('cols').onclick = e => { const d = e.target.closest('[data-c]'); if (!d) return; color = d.dataset.c; setTool('pen'); document.querySelectorAll('#cols .dot').forEach(x => x.classList.toggle('on', x === d)); };
const SIZES = { sS: 2.5, sM: 4.5, sL: 8 };
['sS', 'sM', 'sL'].forEach(id => $(id).onclick = () => { size = SIZES[id]; ['sS', 'sM', 'sL'].forEach(x => $(x).classList.toggle('on', x === id)); });
function setTool(t) { tool = t; $('tPen').classList.toggle('on', t === 'pen'); $('tEr').classList.toggle('on', t === 'eraser'); }
$('tPen').onclick = () => setTool('pen');
$('tEr').onclick = () => setTool('eraser');

function inkKey() { return 'isl::ink::' + (write ? 'w' : 'p') + '::' + cur; }
function sizeCanvas() {
  const p = cv.parentElement, w = p.clientWidth, h = p.clientHeight;
  if (w < 2 || h < 2) return;
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function saveInk() {
  if (!inkDirty || cv.width < 2) return;
  try { store.set(inkKey(), cv.toDataURL('image/webp', .75)); inkDirty = false; } catch (e) {}
}
function scheduleSave() { inkDirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(saveInk, 800); }
function loadInk() {
  sizeCanvas();
  undoStack = [];
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore();
  const d = store.get(inkKey()); if (!d) return;
  const im = new Image();
  im.onload = () => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(im, 0, 0, cv.width, cv.height); ctx.restore(); };
  im.src = d;
}
window.addEventListener('resize', () => { saveInk(); loadInk(); });
window.addEventListener('pagehide', saveInk);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveInk(); });

/* Palm rejection: while the pen is in use, finger/palm touches are ignored; a big contact patch is a palm */
document.addEventListener('pointerdown', e => { if (e.pointerType === 'pen') penSeen = performance.now(); }, true);
const isPalm = e => e.pointerType === 'touch' && (performance.now() - penSeen < 1500 || Math.max(e.width || 0, e.height || 0) > 34);
const ptOf = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pressure > 0 ? e.pressure : .5 }; };

cv.addEventListener('pointerdown', e => {
  if (stroke || isPalm(e)) return;
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  undoStack.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (undoStack.length > 10) undoStack.shift();
  ctx.restore();
  const p = ptOf(e);
  stroke = { id: e.pointerId, last: p };
  drawDot(p);
});
function drawDot(p) {
  ctx.save();
  if (tool === 'eraser') { ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc(p.x, p.y, size * 3, 0, 7); ctx.fill(); }
  else { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(p.x, p.y, size / 2 + .5, 0, 7); ctx.fill(); }
  ctx.restore();
}
cv.addEventListener('pointermove', e => {
  if (!stroke || e.pointerId !== stroke.id) return;
  e.preventDefault();
  const evs = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
  for (const v of evs) {
    const p = ptOf(v);
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (tool === 'eraser') { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = size * 6; ctx.strokeStyle = '#000'; }
    else { ctx.strokeStyle = color; ctx.lineWidth = size * (p.p * 1.2 + .4); }
    ctx.beginPath(); ctx.moveTo(stroke.last.x, stroke.last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ctx.restore();
    stroke.last = p;
  }
});
function endStroke(e) { if (!stroke || e.pointerId !== stroke.id) return; stroke = null; scheduleSave(); }
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => cv.addEventListener(n, endStroke));

$('undo').onclick = () => {
  const img = undoStack.pop(); if (!img) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.putImageData(img, 0, 0); ctx.restore();
  scheduleSave();
};
$('clear').onclick = () => {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  undoStack.push(ctx.getImageData(0, 0, cv.width, cv.height)); if (undoStack.length > 10) undoStack.shift();
  ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore();
  scheduleSave();
};

/* ---------- START ---------- */
buildPad();
write = store.get('isl::mode') === 'w';
$('mP').classList.toggle('on', !write); $('mW').classList.toggle('on', write);
openStation(1);
</script>
</body>
</html>
