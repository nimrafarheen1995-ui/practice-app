<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1426">
<title>Humayun - Arabic Unit 3 Lesson 1 </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Amiri:wght@400&family=Lateef:wght@400&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  *{ -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; }
  body{ font-family:'Baloo 2',system-ui,sans-serif; background:#0b1426; color:#2B1E0E; overflow-x:hidden; }
  #bgLayer{ position:fixed; inset:0; z-index:0; background:#0b1426 url('assets/islamic-night-bg.webp') center/cover no-repeat; }
  .night-overlay{ position:fixed; inset:0; background:rgba(11,20,38,0.82); pointer-events:none; z-index:0; }
  .layer{ position:relative; z-index:1; }
  #topHeader{ position:sticky; top:0; z-index:40; background:linear-gradient(180deg,rgba(20,28,48,0.96),rgba(11,20,38,0.92)); border-bottom:2.5px solid #C9A86A; backdrop-filter:blur(10px); transition:transform .4s ease, opacity .4s ease; }
  #topHeader.hiddenBar{ transform:translateY(-110%); opacity:0; pointer-events:none; }
  #hangingAvatar{ position:fixed; top:4px; left:50%; transform:translateX(-50%); z-index:45; width:90px; height:110px; background:transparent; border:0; display:flex; align-items:flex-start; justify-content:center; cursor:pointer; transition:all .4s cubic-bezier(.34,1.56,.64,1); overflow:visible; }
  #hangingAvatar img{ width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 8px 14px rgba(0,0,0,.55)); pointer-events:none; transition:transform .3s ease; }
  #hangingAvatar::after{ content:""; position:absolute; top:-18px; left:50%; width:2px; height:18px; background:#C9A86A; transform:translateX(-50%); }
  #hangingAvatar.hiddenPos{ top:-10px; transform:translateX(-50%) scale(0.72); }
  #hangingAvatar.pulling img{ transform:translateY(8px) scale(0.95) rotate(-4deg); }
  #hangingAvatar.pulling::after{ height:26px; background:#FFD77A; }
  #rolledScrollWrap{ position:relative; z-index:2; width:min(500px,88vw); margin:88px auto 0; cursor:pointer; transition:all .7s cubic-bezier(.34,1.2,.64,1); }
  #rolledScrollWrap.unrolled{ opacity:0; transform:scale(0.9) translateY(-30px); pointer-events:none; max-height:0; margin:0 auto; overflow:hidden; }
  #rolledScrollWrap.rolled{ opacity:1; transform:scale(1) translateY(0); pointer-events:auto; max-height:400px; margin:88px auto 0; }
  .rolled-scroll{ background:linear-gradient(180deg,#FFF9E6,#E8DCC0); border-radius:28px; padding:16px 14px; box-shadow:0 18px 40px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.6); border:2px solid #C9A86A; text-align:center; position:relative; }
  .rolled-scroll::before,.rolled-scroll::after{ content:""; position:absolute; left:10%; right:10%; height:12px; background:linear-gradient(180deg,#D9C8A0,#C9A86A); border-radius:10px; }
  .rolled-scroll::before{ top:-7px; } .rolled-scroll::after{ bottom:-7px; }
  .parchment-scroll{ position:relative; z-index:1; width:min(960px,94vw); margin:0 auto; background:linear-gradient(180deg,#FFFEF7 0%,#FFF8E1 100%); border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 0 1.5px rgba(201,168,106,.35); padding:0 0 20px; max-height:0; opacity:0; overflow:hidden; transform:scaleY(0.12); transform-origin:top center; transition:all .85s cubic-bezier(.34,1.2,.64,1); }
  .parchment-scroll.open{ max-height:8000px; opacity:1; transform:scaleY(1); margin:16px auto 100px; }
  #lanternRail{ position:fixed; left:0; top:66px; bottom:0; width:78px; z-index:30; background:linear-gradient(180deg,rgba(11,20,38,0.92),rgba(11,20,38,0.75)); border-right:1.5px solid rgba(201,168,106,0.25); display:flex; flex-direction:column; align-items:center; padding:10px 0 120px; overflow-y:auto; }
  .rail-lantern{ width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; background:rgba(255,255,255,0.06); border:2px solid rgba(201,168,106,0.18); transition:all .25s; font-size:1.1rem; font-weight:800; color:#C9A86A; }
  .rail-lantern img{ width:30px; height:30px; object-fit:contain; }
  .rail-lantern.active{ background:radial-gradient(circle,#FFF3C0,#C9A86A); border-color:#FFD77A; box-shadow:0 0 16px rgba(255,215,122,.6); transform:scale(1.08); color:#3B2A14; }
  .rail-line{ width:2px; height:12px; background:rgba(201,168,106,0.25); }
  .scroll-card{ margin:12px 14px; padding:12px 14px; background:#FFFEF7; border:1.5px solid #E8DCC0; border-radius:14px; cursor:pointer; transition:all .2s; }
  .scroll-card:active{ transform:scale(0.98); background:#FFF8E1; }
  .card-banner{ display:inline-flex; align-items:center; gap:6px; background:#FFF3C0; border:1px solid rgba(201,168,106,0.35); border-radius:999px; padding:3px 10px; font-size:.78rem; font-weight:800; color:#5A3C22; }
  .ar-heading{ font-family:'Scheherazade New','Amiri',serif; font-weight:400; font-size:0.95rem; }
  .sec-title-ar{ font-family:'Scheherazade New','Amiri',serif; font-weight:700; }
  .arabic-trad{ font-family:'Scheherazade New','Amiri',serif; direction:rtl; text-align:right; font-size:1.95rem; line-height:2.15; font-weight:700; color:#2B1E0E; font-feature-settings:"liga" 1,"calt" 1; cursor:pointer; user-select:none; padding:2px 8px; border-radius:8px; -webkit-font-smoothing:antialiased; }
  .big .arabic-trad{ font-size:2.4rem; }
  .hidden-answer{ display:none !important; }
  .q-line{ font-family:'Scheherazade New','Amiri',serif; font-size:1.25rem; color:#5A3C22; margin-bottom:4px; direction:rtl; text-align:right; font-weight:700; }
  .big .q-line{ font-size:1.55rem; }
  .english-clean{ font-weight:700; color:#3B2A14; font-size:1rem; cursor:pointer; user-select:none; padding:2px 6px; border-radius:6px; }
  .big .english-clean{ font-size:1.25rem; }
  .strip-row-rtl{ display:flex; align-items:center; gap:10px; margin:16px 0; direction:ltr; flex-wrap:nowrap; }
  .strip-row-rtl .eng-side{ order:1; min-width:86px; flex-shrink:0; }
  .strip-row-rtl .canvas-side{ order:2; flex:1; min-width:0; }
  .strip-row-rtl .ar-side{ order:3; min-width:110px; display:flex; justify-content:flex-end; flex-shrink:0; }
  .strip-wrap{ position:relative; width:100%; height:96px; }
  .big .strip-wrap{ height:110px; }
  .ruled{ position:absolute; inset:0; border:1.8px solid #D9C8A0; border-radius:12px; background:linear-gradient(180deg,#FFFFFF 0%,#FFFEF7 100%); overflow:hidden; }
  .ruled::before{ content:""; position:absolute; left:0; right:0; top:calc(50% + 22px); height:1px; background:#8FB8E8; }
  .ruled.practice{ background:linear-gradient(180deg,#FFFEF7 0%,#FFF8E1 100%); }
  .trace{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-family:'Scheherazade New','Amiri',serif; font-size:28px; color:#8B7355; opacity:.18; pointer-events:none; white-space:nowrap; z-index:0; font-weight:700; }
  .big .trace{ font-size:34px; }
  .ink{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; z-index:1; }
  .strip-tools{ position:absolute; top:-8px; right:-6px; display:flex; gap:4px; z-index:3; }
  .strip-btn{ width:26px; height:26px; border-radius:50%; border:1.5px solid #C9A86A; background:#FFFEF7; display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.15); padding:0; }
  .strip-btn.clear{ background:#FFF1F1; border-color:#E0A0A0; }
  #sectionModal{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:12px; background:rgba(11,20,38,0.72); backdrop-filter:blur(8px); opacity:0; pointer-events:none; transition:opacity .4s; }
  #sectionModal.open{ opacity:1; pointer-events:auto; }
  .modal-parchment{ width:min(860px,96vw); max-height:92vh; display:flex; flex-direction:column; background:linear-gradient(180deg,#FFFEF7,#FFF8E1); border-radius:18px; border:2px solid #C9A86A; box-shadow:0 24px 80px rgba(0,0,0,.5); transform:scale(0.9) translateY(20px); transition:transform .5s cubic-bezier(.34,1.56,.64,1); }
  #sectionModal.open .modal-parchment{ transform:none; }
  .modal-body{ overflow-y:auto; padding:12px; -webkit-overflow-scrolling:touch; }
  .modal-head{ padding:10px 12px; border-bottom:2px solid rgba(201,168,106,.3); display:flex; align-items:center; justify-content:space-between; gap:8px; background:#FFFEF7; }
  .modal-foot{ padding:10px 12px; border-top:1px solid rgba(201,168,106,.25); display:flex; gap:8px; background:#FFFEF7; }
  .nav-btn{ flex:1; padding:8px; border-radius:999px; background:#1A2340; color:#FFD77A; font-weight:700; font-size:12px; border:2px solid #C9A86A; cursor:pointer; }
  .nav-btn:disabled{ opacity:.4; cursor:not-allowed; }
  #pinModal{ position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; background:rgba(11,20,38,0.82); backdrop-filter:blur(6px); opacity:0; pointer-events:none; transition:opacity .3s; }
  #pinModal.open{ opacity:1; pointer-events:auto; }
  .pin-box{ background:#FFFEF7; border:2px solid #C9A86A; border-radius:16px; padding:20px; width:min(320px,90vw); text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.4); }
  .hidden{ display:none !important; }
  .hdr-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; }
  .hdr-group{ display:flex; align-items:center; gap:8px; }
  .hdr-title{ color:#FFD77A; line-height:1.2; }
  .hdr-main{ font-weight:800; font-size:14px; }
  .hdr-sub{ font-size:10px; color:#C9A86A; }
  .hdr-logo{ width:28px; height:28px; object-fit:contain; }
  .hdr-seg{ display:flex; background:#1A2340; border:1px solid rgba(201,168,106,.3); border-radius:999px; padding:4px; gap:2px; }
  .seg-btn{ padding:4px 12px; border-radius:999px; font-size:12px; font-weight:700; border:0; cursor:pointer; font-family:inherit; }
  .icon-btn{ width:32px; height:32px; border-radius:999px; background:#FFFEF7; border:1px solid #C9A86A; color:#5A3C22; font-weight:900; font-size:12px; cursor:pointer; }
  .home-btn{ width:32px; height:32px; border-radius:999px; background:#FFD77A; border:2px solid #C9A86A; color:#3B2A14; font-weight:900; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .pin-title{ font-size:14px; font-weight:900; color:#3B2A14; }
  .pin-sub{ font-size:11px; color:#8B7355; margin-top:4px; }
  .pin-input{ margin-top:12px; width:100%; text-align:center; font-size:20px; letter-spacing:.4em; border:2px solid #C9A86A; border-radius:12px; padding:8px; background:#fff; font-family:inherit; }
  .pin-row{ display:flex; gap:8px; margin-top:12px; }
  .pin-btn{ flex:1; padding:8px; border-radius:999px; font-weight:700; font-size:12px; border:2px solid #C9A86A; cursor:pointer; font-family:inherit; }
  .pin-btn.primary{ background:#1A2340; color:#FFD77A; }
  .pin-btn.plain{ background:#fff; color:#3B2A14; border-color:#E8DCC0; }
  .pin-error{ font-size:11px; color:#dc2626; margin-top:8px; }
  .pill-on{ background:#FFD77A; color:#3B2A14; }
  .pill-off{ background:transparent; color:#C9A86A; }
  .roll-hint{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:35; background:rgba(26,35,64,0.92); color:#FFD77A; padding:8px 16px; border-radius:999px; font-size:11px; font-weight:700; border:1.5px solid #C9A86A; opacity:0; pointer-events:none; transition:opacity .3s; }
  .roll-hint.show{ opacity:1; }
</style>
</head>
<body>
<div id="bgLayer"></div>
<div class="night-overlay"></div>
<header id="topHeader" class="layer">
  <div class="hdr-row">
    <div class="hdr-group">
      <button id="homeBtn" class="home-btn" title="Home - All Subjects">🏠</button>
      <img src="assets/badge-crescent-star.webp" alt="" class="hdr-logo" onerror="this.style.display='none'">
      <div class="hdr-title">
        <div class="hdr-main">تعلم العربية • Arabic • Unit 3 Lesson 1</div>
        <div class="hdr-sub">FINAL V2 • Qalam 🪶 • Toggle Roll • Sound • S9 Tab</div>
      </div>
    </div>
    <div class="hdr-group">
      <div class="hdr-seg">
        <button id="practiceBtn" class="seg-btn"></button>
        <button id="writeBtn" class="seg-btn">Write</button>
      </div>
      <button id="fontBtn" class="icon-btn" aria-label="Text size">Aa</button>
    </div>
  </div>
</header>
<button id="hangingAvatar" class="layer" title="Tap to roll / unroll scroll">
  <img src="assets/humayun-scholar.webp" alt="Humayun" onerror="this.textContent='👦'; this.style.fontSize='60px'">
</button>
<div id="rolledScrollWrap" class="layer rolled" role="button" tabindex="0" aria-label="Tap to unroll scroll">
  <div class="rolled-scroll">
    <div class="flex items-center justify-center gap-2">
      <img src="assets/lantern-gem.webp" class="w-8 h-8" alt="" onerror="this.textContent='🏮'">
      <div class="font-extrabold text-[#5A3C22] text-[17px]">📜 Tap to Unroll</div>
      <img src="assets/lantern-gem.webp" class="w-8 h-8" alt="" onerror="this.textContent='🏮'">
    </div>
    <div class="text-[12px] text-[#6B5A3E] mt-1">Humayun will pull • Sound • 8 sections • S9 Tab</div>
  </div>
</div>
<nav id="lanternRail" class="layer" aria-label="Sections"><div id="railContainer" class="flex flex-col items-center mt-1"></div></nav>
<main class="parchment-scroll layer" id="mainScroll"><div id="cardsContainer"></div><div class="text-center p-4"><button id="rollUpBtn" class="nav-btn" style="max-width:200px">📜 Roll Up Scroll</button></div></main>
<div id="sectionModal" aria-hidden="true">
  <div class="modal-parchment" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <div class="hdr-group min-w-0">
        <img src="assets/lantern-gem.webp" class="w-7 h-7" alt="" onerror="this.style.display='none'">
        <div class="min-w-0">
          <div class="font-black text-[#3B2A14] text-[14px] sec-title-ar" id="modalTitle">Section</div>
          <div class="text-[11px] text-[#8B7355]" id="modalSub"></div>
        </div>
      </div>
      <button id="closeModal" class="icon-btn w-9 h-9 rounded-full bg-[#1A2340] text-[#FFD77A] border-2 border-[#C9A86A]" aria-label="Close">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
    <div class="modal-foot">
      <button id="prevBtn" class="nav-btn">Previous</button>
      <button id="nextBtn" class="nav-btn">Next</button>
    </div>
  </div>
</div>
<div id="pinModal" aria-hidden="true">
  <div class="pin-box">
    <div class="pin-title">Parent PIN Required</div>
    <div class="pin-sub">Practice shows answers. Enter PIN to unlock.</div>
    <input id="pinInput" class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
    <div class="pin-row">
      <button id="pinCancel" class="pin-btn plain">Cancel</button>
      <button id="pinSubmit" class="pin-btn primary">Unlock</button>
    </div>
    <div id="pinError" class="pin-error hidden">Wrong PIN.</div>
  </div>
</div>

const store = {

// Sound system for roll/unroll - parchment sound
let audioCtx = null;
function initAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
}
function playRollSound(unrolling){
  try{
    initAudioCtx();
    if(audioCtx.state==='suspended') audioCtx.resume();
    // Create parchment roll sound: low rumble + high rustle
    const len = audioCtx.sampleRate * (unrolling ? 0.6 : 0.5);
    const buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<len;i++){
      const t = i/len;
      // Rustle + rumble
      const rustle = (Math.random()*2-1) * Math.exp(-t*2) * 0.3;
      const rumble = Math.sin(2*Math.PI*80*t) * Math.exp(-t*3) * 0.2;
      data[i] = (rustle + rumble) * (unrolling ? 1 : 0.8);
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = unrolling ? 1200 : 800;
    filter.Q.value = 0.7;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(unrolling ? 0.18 : 0.14, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (unrolling ? 0.6 : 0.5));
    src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start();
    // Add ding for feedback
    if(window.UniversalPen && window.UniversalPen.playDing){
      setTimeout(()=>{ try{ window.UniversalPen.initAudio(); window.UniversalPen.playDing(); }catch(e){} }, unrolling ? 320 : 100);
    }
  }catch(e){}
}

function fnv1a(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return (h>>>0).toString(16).padStart(8,'0'); }
function isUnlocked(){ return Number(store.get('humayun_ar_unlock_until')||0) > Date.now(); }
function unlockSession(){ store.set('humayun_ar_unlock_until', String(Date.now() + UNLOCK_MINUTES*60*1000)); }
function practiceVisible(){ return mode==='practice' && isUnlocked(); }
let arVoice=null, enVoice=null;
function loadVoices(){ if(!('speechSynthesis' in window)) return; const v=speechSynthesis.getVoices(); arVoice=v.find(x=>/^ar/i.test(x.lang))||null; enVoice=v.find(x=>/^en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; }
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=loadVoices; loadVoices(); }
function speak(text, lang, el){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=0.82; u.pitch=1.0;
    const v=lang.startsWith('ar')?arVoice:enVoice; if(v) u.voice=v;
    speechSynthesis.speak(u);
    if(el){ el.style.background='rgba(201,168,106,0.25)'; setTimeout(()=>el.style.background='',380); }
  }catch(e){}
}
function speakEl(el, lang){ speak(el.dataset.say || el.textContent, lang, el); }
function escAttr(t){ return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

}

function strip(key, extraClass, traceText){
  const cls='ruled'+(extraClass?' '+extraClass:'');
  const trace=traceText?`<span class="trace">${traceText}</span>`:'';
  return `<div class="strip-wrap">
      <div class="${cls}">${trace}<canvas class="ink" data-ink-key="${key}" width="560" height="96" aria-label="Writing area"></canvas></div>
      <div class="strip-tools">
        <button class="strip-btn" type="button" onclick="event.stopPropagation(); undoStrip('${key}')" aria-label="Undo">↩️</button>
        <button class="strip-btn clear" type="button" onclick="event.stopPropagation(); clearStrip('${key}')" aria-label="Clear">🗑️</button>
      </div>
    </div>`;
}
function renderItems(sec, secId, show, hideClass, practiceClass){
  return sec.items.map((it,i)=>{
    const key=secId+'-'+i+'-'+mode;
    const pCls=it.pl==='en'?'english-clean':'arabic-trad';
    const aCls=it.al==='en'?'english-clean':'arabic-trad';
    const pLang=it.pl==='en'?'en-GB':'ar-SA';
    const aLang=it.al==='en'?'en-GB':'ar-SA';
    const q=it.q?`<div class="q-line">${it.q}</div>`:'';
    const icon=it.icon?`<span class="prompt-icon">${it.icon}</span> `:'';
    return `<div class="strip-row-rtl">
      <div class="eng-side">${q}<span class="${pCls} prompt-txt" data-say="${escAttr(it.p.replace(/_+/g,'').trim())}" onclick="speakEl(this,'${pLang}')">${icon}${it.p}</span></div>
      <div class="canvas-side">${strip(key, practiceClass, show?it.a:'')}</div>
      <div class="ar-side"><span class="${aCls} ${hideClass}" data-say="${escAttr(it.a)}" onclick="speakEl(this,'${aLang}')">${it.a}</span></div>
    </div>`;
  }).join('');
}
function renderModal(secId){
  const sec=SECTIONS.find(s=>s.id===secId);
  const body=$('modalBody');
  $('modalTitle').innerHTML=`<span class="sec-title-main">${sec.title}</span> <span class="sec-title-ar">• ${sec.titleAr}</span>`;
  $('modalSub').textContent=sec.sub;
  const show=practiceVisible();
  const hideClass=show?'':'hidden-answer';
  const practiceClass=show?'practice':'';
  if(sec.type==='items'){
    body.innerHTML=renderItems(sec, secId, show, hideClass, practiceClass);
  } else if(sec.special==='letters'){
    const boxes=[['شَمْسِيَّةٌ','الشَّمْسِيَّةُ',SOLAR,'shamsi'],['قَمَرِيَّةٌ','القَمَرِيَّةُ',LUNAR,'qamari']];
    body.innerHTML=`<div class="grid grid-cols-1 md:grid-cols-2 gap-3">${boxes.map(([,title,letters,k])=>`
      <div class="border-2 border-[#E8DCC0] rounded-xl p-3 bg-[#FFFEF7]">
        <div class="text-center font-black text-[#3B2A14] sec-title-ar">${title}</div>
        <div class="text-center arabic-trad ${hideClass}" onclick="speak(this.textContent,'ar-SA',this)">${letters}</div>
        <div class="mt-2">${strip(secId+'-'+k+'-1-'+mode, practiceClass, '')}</div>
        <div class="mt-2">${strip(secId+'-'+k+'-2-'+mode, practiceClass, '')}</div>
      </div>`).join('')}</div>`;
  } else {
    body.innerHTML=sec.words.map((w,i)=>{
      const key=secId+'-'+i+'-'+mode;
      return `<div class="strip-row-rtl">
        <div class="eng-side"><span class="english-clean" onclick="speak('${(w.en).replace(/'/g,"\\'")}','en-GB',this)">${w.en}</span></div>
        <div class="canvas-side">${strip(key, practiceClass, show?w.ar:'')}</div>
        <div class="ar-side"><span class="arabic-trad ${hideClass}" onclick="speak('${(w.arSimple).replace(/'/g,"\\'")}','ar-SA',this)">${w.ar}</span></div>
      </div>`;
    }).join('');
  }
  // FIXED: DPR handling - identity transform, let UniversalPen handle scaling
  setTimeout(()=>{
    body.querySelectorAll('canvas.ink').forEach(c=>{
      const dpr=window.devicePixelRatio||1;
      const rect=c.getBoundingClientRect();
      if(rect.width < 10) return;
      c.width=Math.round(rect.width*dpr);
      c.height=Math.round(96*dpr);
      c.style.width=rect.width+'px';
      c.style.height='96px';
      const ctx=c.getContext('2d');
      try{ ctx.setTransform(1,0,0,1,0,0); }catch(e){}
      c.dataset.initialized='1';
      c.style.touchAction='none';
      if(window.UniversalPen){ UniversalPen.forceCanvas(c); }
      if(!stripHistory[c.dataset.inkKey]) stripHistory[c.dataset.inkKey]=[];
      try{ stripHistory[c.dataset.inkKey].push(c.toDataURL()); }catch(e){}
    });
  },100);
  $('prevBtn').disabled=SECTIONS.findIndex(s=>s.id===secId)<=0;
  $('nextBtn').disabled=SECTIONS.findIndex(s=>s.id===secId)>=SECTIONS.length-1;
  body.scrollTop=0;
}
function openSection(id){ expandedId=id; renderModal(id); $('sectionModal').classList.add('open'); $('sectionModal').setAttribute('aria-hidden','false'); document.querySelectorAll('.rail-lantern').forEach(el=>el.classList.remove('active')); const r=$('rail-'+id); if(r) r.classList.add('active'); }
function closeModal(){ $('sectionModal').classList.remove('open'); $('sectionModal').setAttribute('aria-hidden','true'); }
function stepSection(d){ const idx=SECTIONS.findIndex(s=>s.id===expandedId); const next=SECTIONS[idx+d]; if(next) openSection(next.id); }
function canvasFor(key){ return document.querySelector(`canvas[data-ink-key="${key}"]`); }
function clearStrip(key){
  const c=canvasFor(key); if(!c) return;
  const ctx=c.getContext('2d');
  try{ ctx.setTransform(1,0,0,1,0,0); }catch(e){}
  ctx.clearRect(0,0,c.width,c.height);
  if(window.UniversalPen){ UniversalPen.state.activeCanvas=c; UniversalPen.state.ctx=ctx; UniversalPen.clearInk(); }
  stripHistory[key]=[]; try{ stripHistory[key].push(c.toDataURL()); }catch(e){}
}
function undoStrip(key){
  const c=canvasFor(key); if(!c) return;
  if(!stripHistory[key]||stripHistory[key].length<2) return;
  stripHistory[key].pop();
  const prev=stripHistory[key][stripHistory[key].length-1];
  const ctx=c.getContext('2d');
  try{ ctx.setTransform(1,0,0,1,0,0); }catch(e){}
  const img=new Image(); img.onload=()=>{ ctx.clearRect(0,0,c.width,c.height); ctx.drawImage(img,0,0); if(window.UniversalPen){ window.UniversalPen.state.activeCanvas=c; window.UniversalPen.state.ctx=ctx; } }; img.src=prev;
}

// Toggle Roll/Unroll with Humayun Avatar + Sound - NEW FEATURE
function toggleScroll(){
  const wrap=$('rolledScrollWrap');
  const main=$('mainScroll');
  const avatar=$('hangingAvatar');
  const isRolled = wrap.classList.contains('rolled');
  
  // Avatar pulling animation
  avatar.classList.add('pulling');
  setTimeout(()=>avatar.classList.remove('pulling'), 600);
  
  if(isRolled){
    // Unroll
    scrollUnfolded=true;
    playRollSound(true);
    wrap.classList.remove('rolled');
    wrap.classList.add('unrolled');
    setTimeout(()=>main.classList.add('open'),320);
    wrap.querySelector('.font-extrabold').textContent='📜 Scroll is Open';
    showRollHint('📜 Scroll unrolled - Tap Humayun or Roll Up button to roll back');
  } else {
    // Roll up
    scrollUnfolded=false;
    playRollSound(false);
    main.classList.remove('open');
    setTimeout(()=>{
      wrap.classList.remove('unrolled');
      wrap.classList.add('rolled');
      wrap.querySelector('.font-extrabold').textContent='📜 Tap to Unroll';
      window.scrollTo({top:0, behavior:'smooth'});
    },320);
    showRollHint('📜 Scroll rolled - Tap to unroll again');
  }
}
function showRollHint(msg){
  const hint=$('rollHint');
  hint.textContent=msg;
  hint.classList.add('show');
  setTimeout(()=>hint.classList.remove('show'), 2500);
}

document.addEventListener('pointerup', e=>{
  const canvas=e.target.closest('canvas'); if(!canvas) return;
  const key=canvas.dataset.inkKey; if(!key) return;
  if(!stripHistory[key]) stripHistory[key]=[];
  setTimeout(()=>{ try{ stripHistory[key].push(canvas.toDataURL()); if(stripHistory[key].length>22) stripHistory[key].shift(); }catch(err){} },60);
});
