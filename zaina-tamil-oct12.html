<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Zaina's Tamil Temple Quest: திருக்குறள் மனப்பாடப் பகுதி</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Mukta+Malar:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-bright: #F59E0B;
      --gold-dark: #B45309;
      --teak-border: #5A3C22;
      --tamil-font: 'Mukta Malar', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Nunito', sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #0C0603;
      color: #381A04;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 6px 10px;
      gap: 6px;
      position: relative;
    }

    /* TOP ACADEMY HUD BAR */
    .temple-hud-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      z-index: 50;
      flex-shrink: 0;
    }

    .hud-controls-left, .hud-controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-btn {
      background: linear-gradient(180deg, #3A2312 0%, #1E110A 100%);
      border: 2px solid #D97706;
      color: #FEEBC8;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.84rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      transition: all 0.15s;
    }
    .hud-btn:active { transform: scale(0.96); }

    /* SEGMENTED MODE SELECTOR */
    .mode-switch-segmented {
      display: flex;
      background: rgba(26, 13, 6, 0.92);
      border: 2px solid #D97706;
      border-radius: 25px;
      padding: 3px;
      gap: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .mode-tab-pill {
      background: transparent;
      border: none;
      color: #FDE68A;
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-tab-pill.active {
      background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%);
      color: #271204;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.45);
    }

    .pen-toggle-btn {
      background: linear-gradient(180deg, #3A2312 0%, #1E110A 100%);
      border: 2px solid #D97706;
      color: #FEEBC8;
      font-size: 0.8rem;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .pen-toggle-btn.spen-active {
      background: #14532D;
      border-color: #22C55E;
      color: #DCFCE7;
    }

    /* =========================================================
       MAIN EXPANSIVE STAGE (HUMAYUN-STYLE ARCHITECTURE)
    ========================================================= */
    .temple-stage-wrapper {
      flex: 1;
      position: relative;
      border: 4px solid var(--teak-border);
      border-radius: 22px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 14px;
      padding: 12px 16px;
      box-shadow: 0 16px 45px rgba(0,0,0,0.85);
      min-height: 0;
      background: #110B07 url('assets/village-bg.png') no-repeat center center;
      background-size: cover;
    }

    /* CONTRAST TINT VEIL MATCHED TO HUMAYUN'S OCT10 */
    .village-tint-wash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255, 250, 235, 0.44) 0%, rgba(28, 14, 6, 0.72) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* =========================================================
       LEFT ASIDE: TACTILE SAGE MENTOR & VERSE SELECTOR
    ========================================================= */
    .mentor-aside-stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px;
      gap: 8px;
      overflow-y: auto;
    }

    .thiruvalluvar-character-pod {
      width: 100%;
      height: 240px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }
    .thiruvalluvar-avatar-large {
      max-height: 240px;
      max-width: 220px;
      object-fit: contain;
      filter: drop-shadow(0 14px 24px rgba(45, 20, 5, 0.5));
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .thiruvalluvar-avatar-large:hover { transform: scale(1.03); }

    .kural-nav-ribbons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .kural-ribbon-btn {
      background: rgba(255, 253, 248, 0.9);
      border: 2px solid #D97706;
      border-radius: 14px;
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(60, 25, 5, 0.15);
      transition: all 0.15s ease;
      backdrop-filter: blur(6px);
    }
    .kural-ribbon-btn:hover { transform: translateX(3px); }
    .kural-ribbon-btn.active {
      background: #FEF3C7;
      border-color: #B45309;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.6);
      transform: scale(1.02);
    }
    .kural-ribbon-btn.solved {
      background: #DCFCE7;
      border-color: #16A34A;
    }
    .ribbon-heading {
      font-size: 0.86rem;
      font-weight: 900;
      color: #92400E;
    }
    .ribbon-verse-snippet {
      font-family: var(--tamil-font);
      font-size: 0.88rem;
      font-weight: 800;
      color: #381A04;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* =========================================================
       RIGHT WORKSPACE: FLOWEY & EXPANSIVE
    ========================================================= */
    .workspace-arena-stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }

    /* PALM LEAF BANNER WITH DOCKED HOVERING PARROT */
    .palm-scroll-banner-box {
      width: 100%;
      height: 72px;
      background: url('assets/palm-scroll-banner.jpg') no-repeat center center;
      background-size: 100% 100%;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 50px 0 45px;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,0.3));
      flex-shrink: 0;
      position: relative;
    }

    .banner-title-tamil {
      font-family: var(--tamil-font);
      font-size: 1.35rem;
      font-weight: 800;
      color: #351804;
      line-height: 1.2;
      text-shadow: 0 1px 0 rgba(255,255,255,0.7);
    }
    .banner-sub-phonetic {
      font-size: 0.88rem;
      font-weight: 900;
      color: #713F12;
      letter-spacing: 0.5px;
    }

    /* STANDALONE HOVERING PARROT PNG TRIGGER */
    .floating-parrot-trigger {
      position: relative;
      width: 88px;
      height: 88px;
      margin-right: -15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 8px 16px rgba(60, 25, 5, 0.45));
      animation: gentleParrotHover 3.2s ease-in-out infinite;
      transition: transform 0.15s;
    }
    .floating-parrot-trigger:hover { transform: scale(1.12); }
    .floating-parrot-trigger:active { transform: scale(0.92); }
    .floating-parrot-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    @keyframes gentleParrotHover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* INTERACTIVE STAGE BODY */
    .interactive-stage-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 0;
      overflow-y: auto;
      padding: 4px;
    }

    /* ORGANIC DUAL-LINE RACK (NO BOX IN A BOX) */
    .kural-assembly-flow {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 720px;
    }

    .rack-scroll-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 253, 246, 0.82);
      border: 2.5px dashed #D97706;
      border-radius: 18px;
      padding: 8px 14px;
      min-height: 72px;
      box-shadow: 0 8px 20px rgba(60, 25, 5, 0.1);
      backdrop-filter: blur(8px);
    }

    .open-verse-slot {
      min-width: 96px;
      height: 56px;
      border: 2px dashed rgba(180, 83, 9, 0.6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(254, 243, 199, 0.45);
      color: #B45309;
      font-size: 0.88rem;
      font-weight: 900;
      padding: 0 8px;
    }

    /* EXPANSIVE WORD TABLETS */
    .word-tablet-dock {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 720px;
      margin-top: 4px;
    }

    .kural-word-tablet {
      background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%);
      border: 2px solid #FEF3C7;
      border-radius: 14px;
      padding: 8px 16px;
      min-height: 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(60, 25, 5, 0.25);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }
    .kural-word-tablet:hover { transform: scale(1.06); box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4); }
    .kural-word-tablet:active { transform: scale(0.94); }
    .kural-word-tablet.placed {
      opacity: 0.22;
      pointer-events: none;
      filter: grayscale(85%);
    }
    .kural-word-tablet.highlight {
      border-color: #22C55E;
      box-shadow: 0 0 18px #22C55E;
      transform: scale(1.1);
    }

    .tablet-tamil-text {
      font-family: var(--tamil-font);
      font-size: 1.25rem;
      font-weight: 800;
      color: #FFFDF0;
      line-height: 1.1;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
    .tablet-phonetic-sub {
      font-size: 0.78rem;
      font-weight: 900;
      color: #FEF08A;
      letter-spacing: 0.4px;
    }

    /* =========================================================
       WRITE EXAM: FULL-WIDTH OPEN PALM SLATE (OPTION A)
    ========================================================= */
    .write-exam-stage-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 740px;
    }

    .exam-prompt-banner {
      font-family: var(--tamil-font);
      font-size: 1.35rem;
      font-weight: 800;
      color: #92400E;
      text-align: center;
      background: rgba(255, 253, 246, 0.95);
      border: 2px solid #F59E0B;
      border-radius: 14px;
      padding: 8px 18px;
      width: 100%;
      box-shadow: 0 6px 16px rgba(60, 25, 5, 0.12);
    }

    .palm-manuscript-slate-frame {
      position: relative;
      width: 100%;
      height: 240px;
      background: #FFFDF5;
      border: 3.5px solid #8C5827;
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(60, 25, 5, 0.22), inset 0 2px 10px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .slate-handwriting-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
      z-index: 5;
    }

    .slate-double-rules {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .slate-controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .self-check-scroll-curtain {
      display: none;
      width: 100%;
      background: #FEF3C7;
      border: 2.5px solid #16A34A;
      border-radius: 14px;
      padding: 12px 18px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(22, 163, 74, 0.25);
    }
    .self-check-scroll-curtain.revealed { display: block; }
    .correct-verse-text-l1, .correct-verse-text-l2 {
      font-family: var(--tamil-font);
      font-size: 1.25rem;
      font-weight: 800;
      color: #14532D;
    }
    .correct-verse-text-l2 { margin-top: 4px; }

    /* FOOTER DOCK */
    .workspace-footer-dock {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1.5px dashed rgba(245, 158, 11, 0.6);
      padding-top: 8px;
      flex-shrink: 0;
    }
    .btn-verify-seal {
      background: linear-gradient(180deg, #16A34A 0%, #15803D 100%);
      border: 2px solid #86EFAC;
      color: #FFF;
      font-size: 1rem;
      font-weight: 800;
      padding: 8px 26px;
      border-radius: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(22, 163, 74, 0.4);
      transition: all 0.15s;
    }
    .btn-verify-seal:active { transform: scale(0.96); }

    /* ASANA SOARING PARROT CELEBRATION */
    #celebrationFinaleStage {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: none;
      overflow: hidden;
      background: radial-gradient(circle at center, rgba(30, 15, 6, 0.4) 0%, rgba(14, 7, 2, 0.92) 100%);
      backdrop-filter: blur(6px);
    }
    #finaleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    .soaring-parrot-rocket {
      position: absolute;
      width: 160px;
      height: 160px;
      z-index: 20;
      pointer-events: none;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.65));
    }
    .soaring-parrot-rocket img { width: 100%; height: 100%; object-fit: contain; }

    .victory-award-scroll {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.3);
      width: 90%;
      max-width: 540px;
      background: #FFFDF9;
      border: 4px solid #D97706;
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.85);
      z-index: 25;
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
    }
    .victory-award-scroll.impact {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
    .victory-award-title {
      font-family: var(--tamil-font);
      font-size: 2.1rem;
      font-weight: 800;
      color: #92400E;
    }
    .btn-finish-celebration {
      background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%);
      border: 2px solid #FEF08A;
      color: #381A04;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 10px 30px;
      border-radius: 14px;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .temple-stage-wrapper { grid-template-columns: 210px 1fr; }
      .thiruvalluvar-character-pod { height: 180px; }
      .floating-parrot-trigger { width: 70px; height: 70px; }
      .palm-manuscript-slate-frame { height: 190px; }
    }
  </style>
</head>
<body>

  <!-- TOP HUD -->
  <header class="temple-hud-bar">
    <div class="hud-controls-left">
      <button type="button" class="hud-btn" onclick="goToHub()">🪷 Hub</button>
      <button type="button" class="hud-btn" id="btnFullscreenToggle" onclick="toggleFullscreen()">⛶ Fullscreen</button>
      <button type="button" class="pen-toggle-btn" id="btnPenMode" onclick="togglePenMode()">👆 Touch Mode</button>
    </div>

    <!-- CLEAN 3-TIER MODE SELECTOR -->
    <div class="mode-switch-segmented">
      <button type="button" class="mode-tab-pill active" id="modePractice" onclick="setAppMode('practice')">🪷 Practice</button>
      <button type="button" class="mode-tab-pill" id="modeTest" onclick="setAppMode('test')">🧩 Test</button>
      <button type="button" class="mode-tab-pill" id="modeWrite" onclick="setAppMode('write')">✍️ Write Exam</button>
    </div>

    <div class="hud-controls-right">
      <button type="button" class="hud-btn" onclick="resetCurrentKural()">🔄 Reset</button>
    </div>
  </header>

  <!-- MAIN TEMPLE STAGE (MATCHED TO HUMAYUN'S STAGE FRAME) -->
  <main class="temple-stage-wrapper">
    <!-- FADED AMBIENT VEIL -->
    <div class="village-tint-wash"></div>

    <!-- LEFT STAGE: LARGE SAGE MENTOR & CLEAN TAMIL RIBBONS -->
    <aside class="mentor-aside-stage">
      <div class="thiruvalluvar-character-pod">
        <img src="assets/thiruvalluvar.png" class="thiruvalluvar-avatar-large" alt="Thiruvalluvar" onerror="handleImageFallback(this)" />
      </div>

      <div style="font-family:var(--tamil-font); font-size:1.05rem; font-weight:800; color:#451A03; text-align:center;">
        அதிகாரம்: பண்புடைமை
      </div>

      <div class="kural-nav-ribbons" id="kuralTabsContainer">
        <!-- Rendered via JavaScript -->
      </div>
    </aside>

    <!-- RIGHT STAGE: OPEN ARENA WORKSPACE -->
    <section class="workspace-arena-stage">

      <!-- PALM LEAF SCROLL BANNER WITH FLOATING PARROT -->
      <div class="palm-scroll-banner-box">
        <div>
          <div class="banner-title-tamil" id="bannerHeaderTamil">குறள் 1</div>
          <div class="banner-sub-phonetic" id="bannerHeaderPhonetic">பண்புடைமை</div>
        </div>

        <!-- LARGE HOVERING PARROT TRIGGER -->
        <div class="floating-parrot-trigger" onclick="reciteKaraokeKural()" title="Listen to chant">
          <img src="assets/mentor-parrot.png" class="floating-parrot-img" alt="Parrot" onerror="handleImageFallback(this)">
        </div>
      </div>

      <!-- WORKSPACE INTERACTIVE BODY -->
      <div class="interactive-stage-body" id="workspaceStageBody"></div>

      <!-- FOOTER DOCK -->
      <div class="workspace-footer-dock">
        <span style="font-size:0.92rem; font-weight:800; color:#3B1B04;" id="workspaceInstructionNotice">
          Tap the 7 words in order.
        </span>
        <button type="button" class="btn-verify-seal" id="btnVerifyAction" onclick="verifyActiveTask()">
          <span>✨</span> Verify
        </button>
      </div>

    </section>

  </main>

  <!-- ASANA-STYLE SOARING CELEBRATION STAGE -->
  <div id="celebrationFinaleStage">
    <canvas id="finaleCanvas"></canvas>

    <div class="soaring-parrot-rocket" id="soaringParrot">
      <img src="assets/mentor-parrot.png" alt="Parrot" onerror="handleImageFallback(this)">
    </div>

    <div class="victory-award-scroll" id="victoryAwardScroll">
      <div style="font-size:3.2rem;">🪷</div>
      <div class="victory-award-title">அற்புதம் ஜைனா!</div>
      <div style="font-size:1rem; font-weight:800; color:#451A03; line-height:1.5;">
        You have mastered and written all 3 couplets from memory!<br/>
        நகையுள்ளும் இன்னாது • நயனொடு நன்றி • பண்புடையார்ப் பட்டுண்டு
      </div>
      <button type="button" class="btn-finish-celebration" onclick="closeCelebrationStage()">
        Continue ➔
      </button>
    </div>
  </div>

  <script>
    /* 1-TAP FULLSCREEN API */
    function toggleFullscreen() {
      const doc = window.document;
      const docEl = doc.documentElement;
      const requestFs = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      const exitFs = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (requestFs) {
          requestFs.call(docEl).then(() => {
            document.getElementById('btnFullscreenToggle').textContent = "✖ Exit Full";
          }).catch(err => console.log(err));
        }
      } else {
        if (exitFs) {
          exitFs.call(doc).then(() => {
            document.getElementById('btnFullscreenToggle').textContent = "⛶ Fullscreen";
          });
        }
      }
    }

    /* HARDWARE S-PEN PALM REJECTION TOGGLE */
    let sPenOnlyMode = false;
    function togglePenMode() {
      sPenOnlyMode = !sPenOnlyMode;
      const btn = document.getElementById('btnPenMode');
      if (sPenOnlyMode) {
        btn.textContent = "🖊️ S-Pen Only";
        btn.classList.add('spen-active');
      } else {

    /* PROCEDURAL AUDIO */
    class TempleAudioEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playVeenaPluck(freq = 440) {
        this.init();
        const t0 = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t0);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.98, t0 + 0.28);
        gain.gain.setValueAtTime(0.35, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.38);
      }
      playBell() {
        this.init();
        const t0 = this.ctx.currentTime;
        [523.25, 783.99, 1046.50].forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t0 + i * 0.05);
          gain.gain.setValueAtTime(0.2, t0 + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.05 + 1.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t0 + i * 0.05);
          osc.stop(t0 + i * 0.05 + 1.15);
        });
      }
    }

        u.rate = 0.85;
        window.speechSynthesis.speak(u);

      }
    }

    function initSlateCanvasInstance(idx) {
      const cvs = document.getElementById(`canvasSlate_${idx}`);
      if (!cvs) return;
      const ctx = cvs.getContext('2d');

      slateCanvasInstances[idx] = {
        canvas: cvs,
        ctx: ctx,
        history: [],
        drawing: false
      };

      const saved = localStorage.getItem(`z_kural_slate_ink_${idx}`);
      if (saved) {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0);
        img.src = saved;
      }

      function getPos(e) {
        const rect = cvs.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (cvs.width / rect.width),
          y: (e.clientY - rect.top) * (cvs.height / rect.height)
        };
      }

      function startDraw(e) {
        if (sPenOnlyMode && e.pointerType !== 'pen') return;

        const inst = slateCanvasInstances[idx];
        inst.drawing = true;
        inst.history.push(ctx.getImageData(0, 0, cvs.width, cvs.height));
        if (inst.history.length > 25) inst.history.shift();

        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.strokeStyle = '#1E3A8A';
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        e.preventDefault();
      }

      function moveDraw(e) {
        const inst = slateCanvasInstances[idx];
        if (!inst.drawing) return;
        if (sPenOnlyMode && e.pointerType !== 'pen') return;

        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        e.preventDefault();
      }

      function stopDraw() {
        const inst = slateCanvasInstances[idx];
        if (inst.drawing) {
          inst.drawing = false;
          localStorage.setItem(`z_kural_slate_ink_${idx}`, cvs.toDataURL());
        }
      }

      cvs.addEventListener('pointerdown', startDraw);
      cvs.addEventListener('pointermove', moveDraw);
      cvs.addEventListener('pointerup', stopDraw);
      cvs.addEventListener('pointercancel', stopDraw);
    }

    function undoSlate(idx) {
      const inst = slateCanvasInstances[idx];
      if (inst && inst.history.length > 0) {
        inst.ctx.putImageData(inst.history.pop(), 0, 0);
        localStorage.setItem(`z_kural_slate_ink_${idx}`, inst.canvas.toDataURL());
      }
    }

    function clearSlate(idx) {
      const inst = slateCanvasInstances[idx];
      if (inst) {
        inst.ctx.clearRect(0, 0, inst.canvas.width, inst.canvas.height);

        localStorage.removeItem(`z_kural_slate_ink_${idx}`);

    }

    const finaleCanvas = document.getElementById('finaleCanvas');
    const finaleCtx = finaleCanvas.getContext('2d', { alpha: true });
    const soaringParrot = document.getElementById('soaringParrot');
    const victoryAwardScroll = document.getElementById('victoryAwardScroll');

    let finaleRunning = false;
    let petals = [];
    let flightStartTime = 0;

    function resizeFinaleCanvas() {
      finaleCanvas.width = window.innerWidth;
      finaleCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeFinaleCanvas);

    class DriftingPetal {
      constructor() {
        this.x = Math.random() * window.innerWidth;
        this.y = -30 - Math.random() * 200;
        this.size = Math.random() * 12 + 8;
        this.vx = (Math.random() - 0.5) * 1.5;
        this.vy = Math.random() * 2.2 + 1.8;
        this.rot = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.05;
        const colors = ['#F472B6', '#FBCFE8', '#F59E0B', '#FEF08A', '#34D399'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.rot += this.rotSpeed;
        if (this.y > window.innerHeight + 40) {
          this.y = -20;
          this.x = Math.random() * window.innerWidth;
        }
      }
      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.rotate(this.rot);
        c.fillStyle = this.color;
        c.beginPath();
        c.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    function triggerAsanaCelebration() {
      resizeFinaleCanvas();
      finaleStage.style.display = 'block';
      finaleRunning = true;

      audio.playBell();
      speakWord("அற்புதம் ஜைனா! மூன்று குறள்களையும் மனனம் செய்துவிட்டாய்!", "Congratulations Zaina! You have mastered all 3 Kurals!");

      petals = [];
      for (let i = 0; i < 60; i++) petals.push(new DriftingPetal());

      flightStartTime = performance.now();
      animateSoaringFlight();

      setTimeout(() => {
        victoryAwardScroll.classList.add('impact');
      }, 1900);

      requestAnimationFrame(renderPetalLoop);
    }

    function animateSoaringFlight() {
      const dur = 2600;
      const w = window.innerWidth;
      const h = window.innerHeight;

      function step(now) {
        const elapsed = now - flightStartTime;
        const p = Math.min(1, elapsed / dur);
        const ease = 1 - Math.pow(1 - p, 3);

        const curX = -120 + (w + 240) * ease;
        const curY = h * 0.75 - Math.sin(ease * Math.PI) * (h * 0.55);

        soaringParrot.style.left = `${curX}px`;
        soaringParrot.style.top = `${curY}px`;

        if (p < 1 && finaleRunning) {
          requestAnimationFrame(step);
        }
      }
      requestAnimationFrame(step);
    }

    function renderPetalLoop() {
      if (!finaleRunning) return;
      finaleCtx.clearRect(0, 0, finaleCanvas.width, finaleCanvas.height);
      for (let p of petals) {
        p.update();
        p.draw(finaleCtx);
      }
      requestAnimationFrame(renderPetalLoop);
    }

    function closeCelebrationStage() {
      finaleRunning = false;
      finaleStage.style.display = 'none';
      victoryAwardScroll.classList.remove('impact');
      goToHub();
    }

    window.onload = () => {
      renderKuralTabs();
      switchKural(0);
    };
  </script>
</body>
</html>
