<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Zaina - Soil Farm Final - Gardenscapes</title>
<script src="shared/safe-storage.js"></script>
<link rel="preload" as="image" href="assets/farm-gardenscape-bg.jpeg" />
<link rel="preload" as="image" href="assets/soil-girl-hero.png" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
:root{--font-scale:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100vw;height:100vh;height:100dvh;margin:0;padding:0;overflow:hidden;background:#1a2f1a;font-family:'Nunito',sans-serif}
.master-farm{position:relative;width:100vw;height:100dvh;overflow:hidden;background:url('assets/farm-gardenscape-bg.jpeg') center/cover no-repeat}
.master-farm::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom, rgba(255,255,255,0.12) 0%, rgba(0,0,0,0.08) 100%);pointer-events:none;z-index:1}
/* Top HUD - minimal */
.hud{position:absolute;top:10px;left:10px;right:10px;z-index:20;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.94);backdrop-filter:blur(8px);border:2.5px solid #4A7C59;border-radius:16px;padding:6px 10px;box-shadow:0 6px 18px rgba(0,0,0,0.25)}
.icon-btn{border:2px solid #4A7C59;background:#fff;border-radius:10px;width:38px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer;font-size:1rem}
.icon-btn.active{background:#4A7C59;color:#fff}
.mode-pill{display:flex;gap:4px;background:#E8F5E9;border:2px solid #4A7C59;border-radius:12px;padding:2px}
.mode-btn{border:0;background:transparent;padding:4px 10px;border-radius:8px;font-weight:800;font-size:.7rem;cursor:pointer}
.mode-btn.active{background:#4A7C59;color:#fff}
.progress-mini{flex:1;margin:0 8px;height:6px;background:#C8E6C9;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#4A7C59,#81C784);transition:width .5s}
.earth-count{font-size:.65rem;font-weight:800;color:#2E7D32}
/* Farm Map Signboards */
.farm-map{position:absolute;inset:0;z-index:5;padding:70px 12px 12px 12px}
.signboard{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:transform .2s;filter:drop-shadow(0 6px 12px rgba(0,0,0,0.3))}
.signboard:active{transform:scale(0.95)}
.sign-post{width:8px;height:28px;background:linear-gradient(90deg,#8D6E63,#5D4037);border-radius:2px}
.sign-wood{min-width:90px;padding:8px 12px;background:linear-gradient(135deg,#D7CCC8,#BCAAA4);border:2.5px solid #5D4037;border-radius:8px;box-shadow:0 4px 0 #5D4037;font-weight:900;font-size:.75rem;color:#3E2723;text-align:center;line-height:1.2}
.sign-wood.done{background:linear-gradient(135deg,#A5D6A7,#81C784);border-color:#2E7D32}
.sign-emoji{font-size:22px;background:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:2px solid #5D4037;margin-bottom:2px}
#signA{left:8%;top:22%}
#signB{left:28%;top:38%}
#signC{left:58%;top:32%}
#signD{left:72%;top:58%}
#signE{left:42%;top:68%;display:none}
#signE.show{display:flex}
/* Center Card Modal - S11 fit */
#cardModal{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,0.35);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:12px}
#cardModal.show{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card-box{position:relative;width:min(860px,92vw);height:min(700px,90dvh);background:rgba(255,255,255,0.98);border:3px solid #4A7C59;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,0.4);display:flex;flex-direction:column;overflow:hidden;animation:pptOpen .45s cubic-bezier(.16,1,.3,1)}
@keyframes pptOpen{from{transform:scale(0.15) translate(var(--fromX,0), var(--fromY,0)) rotate(-8deg);opacity:0}to{transform:scale(1) translate(0,0) rotate(0);opacity:1}}
.card-box.closing{animation:pptClose .35s cubic-bezier(.6,0,.8,.2) forwards}
@keyframes pptClose{from{transform:scale(1) translate(0,0);opacity:1}to{transform:scale(0.15) translate(var(--toX,0), var(--toY,0));opacity:0}}
.card-header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(90deg,#E8F5E9,#C8E6C9);border-bottom:2px solid #A5D6A7}
.card-title{font-family:'Fredoka',sans-serif;font-weight:800;color:#2E7D32;font-size:1.05rem;flex:1}
.close-btn{width:36px;height:36px;border-radius:50%;border:2px solid #4A7C59;background:#fff;font-weight:900;cursor:pointer}
.card-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 14px 12px 12px;display:flex;flex-direction:column;gap:10px;position:relative}
/* Girl Hero Tall Embossed - per section */
.girl-embossed{position:absolute;right:-12px;bottom:-8px;width:auto;height:340px;object-fit:contain;pointer-events:none;z-index:2;filter:drop-shadow(0 10px 18px rgba(0,0,0,0.28));transform:rotate(-2deg);opacity:0.96}
@media(max-width:900px){.girl-embossed{height:260px;right:-18px;opacity:0.85}}
.card-content{position:relative;z-index:3;flex:1}
/* Q rows */
.q-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px;border:1.5px dashed #A5D6A7;border-radius:14px;margin-bottom:8px;background:linear-gradient(to bottom,#fffffe,#F1F8E9);line-height:1.5}
.q-num{color:#4A7C59;font-weight:900}
.q-text{font-weight:800;font-size:calc(.9rem * var(--font-scale));flex:1}
.s-word{cursor:pointer;border-radius:4px;padding:0 2px;display:inline-block}
.s-word.speaking{background:#A5D6A7;outline:2px solid #4A7C59}
.inline-strip{position:relative;display:inline-flex;vertical-align:middle;width:min(450px,100%);height:60px;border:1.8px solid #A5C4A0;border-radius:12px;background:#fffffe;overflow:hidden;touch-action:none}
.inline-strip.has-ink{border-color:#4A7C59;box-shadow:0 0 0 3px rgba(74,124,89,.12)}
.inline-strip::before{content:'';position:absolute;left:12px;top:0;bottom:0;width:1.2px;background:#EF9A9A;opacity:.9;z-index:1}
.inline-strip::after{content:'';position:absolute;left:0;right:36px;top:54%;height:1.2px;background:#C5CAE9;z-index:1}
.inline-strip canvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;touch-action:none}
.strip-tools{position:absolute;right:0;top:0;bottom:0;width:36px;display:flex;flex-direction:column;border-left:1.2px solid #E0E0E0;background:#E8F5E9;z-index:4}
.tool-btn{flex:1;display:flex;align-items:center;justify-content:center;border:0;background:transparent;cursor:pointer}
.tf-chip{display:inline-flex;align-items:center;justify-content:center;min-width:58px;height:36px;padding:0 12px;border:2px solid #C8E6C9;border-radius:999px;font-weight:900;font-size:.78rem;cursor:pointer;background:#fff;transition:.18s}
.tf-chip.true{border-color:#4A7C59;color:#2E7D32}
.tf-chip.false{border-color:#EF5350;color:#C62828}
.tf-chip.on.true{background:#4A7C59;color:#fff}
.tf-chip.on.false{background:#EF5350;color:#fff}
/* Soil Clod Grid - Candy Crush but soil */
.soil-grid-wrap{background:linear-gradient(180deg,#FFF8E1 0%, #D7CCC8 100%);border:3px solid #5D4037;border-radius:16px;padding:10px}
.soil-top-tray{display:flex;gap:8px;justify-content:center;align-items:center;padding:8px;background:rgba(255,255,255,0.9);border-radius:12px;margin-bottom:8px;border:2px dashed #8D6E63}
.fruit-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#fff;border:2px solid #BCAAA4;box-shadow:0 2px 6px rgba(0,0,0,0.12)}
.clod-wall{display:grid;grid-template-columns:repeat(17, minmax(0,1fr));gap:3px;background:#5D4037;padding:5px;border-radius:10px;box-shadow:inset 0 3px 10px rgba(0,0,0,0.4)}
.clod-cell{aspect-ratio:1;background:linear-gradient(145deg,#A1887F 0%,#8D6E63 20%,#795548 60%,#6D4C41 100%);border:2px solid #3E2723;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(10px,1.7vw,15px);color:#3E2723;cursor:pointer;touch-action:none;position:relative;box-shadow:0 3px 0 #3E2723, 0 3px 8px rgba(0,0,0,0.25), inset 0 2px 3px rgba(255,255,255,0.3);transition:transform .08s}
.clod-cell.selected{background:linear-gradient(145deg,#FFF9C4,#FFEB3B);border-color:#F9A825;color:#3E2723;transform:scale(1.08) translateY(-2px);z-index:2;box-shadow:0 0 0 3px #FFEB3B, 0 6px 12px rgba(0,0,0,0.3)}
.clod-cell.found{background:linear-gradient(145deg,#A5D6A7,#66BB6A);border-color:#2E7D32;color:#1B5E20;opacity:0.6}
.clod-cell.pop{animation:clodPop .65s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes clodPop{0%{transform:scale(1)} 25%{transform:scale(1.35) rotate(6deg)} 50%{transform:scale(1.2) rotate(-6deg)} 100%{transform:scale(0) rotate(160deg);opacity:0}}
.clod-cell.hint{animation:clodHint .6s ease infinite}
@keyframes clodHint{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.word-targets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.word-target{padding:5px 10px;background:#fff;border:2px solid #5D4037;border-radius:999px;font-weight:900;font-size:.72rem;color:#3E2723}
.word-target.done{background:#4A7C59;color:#fff;text-decoration:line-through}
.candy-confetti{position:absolute;width:8px;height:8px;border-radius:2px;pointer-events:none;animation:candyConfetti .8s ease-out forwards;z-index:40}
@keyframes candyConfetti{0%{transform:translateY(0) scale(0) rotate(0);opacity:1}100%{transform:translateY(-80px) scale(1.5) rotate(360deg);opacity:0}}
/* Try Again */
#tryAgainModal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#tryAgainModal.show{display:flex}
.try-box{background:#F1F8E9;border:3px solid #D32F2F;border-radius:20px;padding:16px;width:min(360px,90vw);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{0%{transform:scale(0) rotate(-10deg)}100%{transform:scale(1) rotate(0)}}
.try-hero{width:160px;height:160px;object-fit:contain;margin:0 auto;display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,.25));animation:float 2.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* Pen Bubble - draggable with memory */
#penBubble{position:fixed;z-index:50;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#2E7D32,#4A7C59);box-shadow:0 8px 24px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none}
#penBubble.dragging{cursor:grabbing;transform:scale(1.1)}
#penPanel{position:fixed;z-index:51;width:260px;background:rgba(255,255,255,.98);border:2.5px solid #4A7C59;border-radius:18px;padding:10px;box-shadow:0 16px 40px rgba(0,0,0,.25);transform:scale(.9);opacity:0;pointer-events:none;transition:all .22s cubic-bezier(.34,1.56,.64,1);transform-origin:top left}
#penPanel.open{transform:scale(1);opacity:1;pointer-events:auto}
.pen-row{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.pen-tool{width:40px;height:40px;border-radius:10px;border:2px solid #C8E6C9;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:.15s;position:relative}
.pen-tool.on{border-color:#4A7C59;background:#E8F5E9;box-shadow:0 0 0 3px rgba(74,124,89,.2)}
.pen-submenu{position:absolute;bottom:44px;left:0;background:#fff;border:2px solid #4A7C59;border-radius:12px;padding:6px;display:none;flex-direction:column;gap:4px;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:10}
.pen-submenu.show{display:flex}
.pen-sub{width:36px;height:36px;border-radius:8px;border:1.5px solid #C8E6C9;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.pen-sub.on{border-color:#4A7C59;background:#E8F5E9}
.color-dot{width:28px;height:28px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1.2px #C8E6C9;cursor:pointer}
.color-dot.on{box-shadow:0 0 0 2.5px #4A7C59}
.size-slider{width:100%;accent-color:#4A7C59}
#pinModal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center}
#pinModal.show{display:flex}
.pin-box{background:#fff;border:3px solid #4A7C59;border-radius:18px;padding:18px;width:min(300px,90vw);text-align:center}
.pin-input{width:100%;padding:12px;border:2px solid #C8E6C9;border-radius:12px;font-size:1.2rem;font-weight:800;text-align:center;margin:10px 0;letter-spacing:6px}
#dimLayer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:25;transition:opacity .25s}
</style>
</head>
<body>
<div id="dimLayer"></div>
<div id="tryAgainModal"><div class="try-box"><img src="assets/soil-girl-hero.png" class="try-hero" alt=""/><div style="font-family:'Fredoka',sans-serif;font-weight:800;color:#D32F2F;font-size:1.2rem" id="tryTitle">Try Again</div><div style="font-size:.8rem;color:#5D4037;font-weight:700;margin-top:6px" id="trySub">Let's try!</div><button type="button" onclick="handleTryAgain()" style="margin-top:12px;background:#D32F2F;color:#fff;border:2px solid #B71C1C;border-radius:12px;padding:10px 20px;font-weight:800;cursor:pointer">Try Again</button></div></div>
<div id="pinModal"><div class="pin-box"><div style="font-weight:900;color:#2E7D32">Enter PIN to go to Practice</div><div style="font-size:.7rem;color:#757575">PIN is 1995</div><input type="password" id="pinInput" class="pin-input" placeholder="••••" inputmode="numeric"/><div id="pinError" style="display:none;color:#D32F2F;font-size:.7rem;font-weight:800">Wrong PIN</div><div style="display:flex;gap:8px;margin-top:10px"><button class="icon-btn" type="button" onclick="closePin()" style="flex:1">Cancel</button><button class="icon-btn" type="button" onclick="checkPin()" style="flex:1;background:#4A7C59;color:#fff">OK</button></div></div></div>
<div class="master-farm" id="masterFarm">
<div class="hud" id="hud">
<button class="icon-btn" type="button" onclick="toggleDim()">🌙</button>
<div class="mode-pill"><button class="mode-btn active" id="btnPractice" type="button" onclick="requestMode('practice')">Practice</button><button class="mode-btn" id="btnWrite" type="button" onclick="requestMode('write')">Write</button></div>
<button class="icon-btn" type="button" onclick="changeFont(-1)">A-</button><button class="icon-btn" type="button" onclick="changeFont(1)">A+</button>
<div class="progress-mini"><div class="progress-fill" id="earthFill" style="width:0%"></div></div>
<div class="earth-count" id="gardenCount">0% 🌱</div>
<img src="assets/soil-girl-hero.png" style="width:38px;height:38px;object-fit:contain;cursor:pointer" alt="" onclick="speakHint()"/>
</div>
<div class="farm-map" id="farmMap">
<div class="signboard" id="signA" onclick="openSection('A', this)"><div class="sign-emoji">🌻</div><div class="sign-post"></div><div class="sign-wood" id="woodA">A<br/>Objective</div></div>
<div class="signboard" id="signB" onclick="openSection('B', this)"><div class="sign-emoji">🌷</div><div class="sign-post"></div><div class="sign-wood" id="woodB">B<br/>Fill Blanks</div></div>
<div class="signboard" id="signC" onclick="openSection('C', this)"><div class="sign-emoji">💧</div><div class="sign-post"></div><div class="sign-wood" id="woodC">C<br/>True / False</div></div>
<div class="signboard" id="signD" onclick="openSection('D', this)"><div class="sign-emoji">🌾</div><div class="sign-post"></div><div class="sign-wood" id="woodD">D<br/>Concept Map</div></div>
<div class="signboard" id="signE" onclick="openSection('E', this)"><div class="sign-emoji">🧱</div><div class="sign-post"></div><div class="sign-wood" id="woodE">E<br/>Soil Clods</div></div>
</div>
<div id="cardModal" onclick="if(event.target===this) closeCard()"><div class="card-box" id="cardBox"><div class="card-header"><div class="card-title" id="cardTitle">Section A</div><button class="close-btn" type="button" onclick="closeCard()">✕</button></div><div class="card-scroll" id="cardScroll"></div></div></div>
</div>
<div id="penBubble">✏️</div>
<div id="penPanel">
<div style="font-weight:900;font-size:.7rem;margin-bottom:6px;color:#2E7D32">Tools - drag bubble anywhere, position saved</div>
<div class="pen-row">
<div class="pen-tool on" id="penMain" onclick="togglePenSubmenu()"><span id="penIcon">✏️</span><div class="pen-submenu" id="penSub"><button class="pen-sub on" data-pen="pen" type="button" onclick="setPenType('pen', '✏️')">✏️</button><button class="pen-sub" data-pen="cursive" type="button" onclick="setPenType('cursive','🖋️')">🖋️</button><button class="pen-sub" data-pen="rainbow" type="button" onclick="setPenType('rainbow','🌈')">🌈</button><button class="pen-sub" data-pen="glitter" type="button" onclick="setPenType('glitter','✨')">✨</button></div></div>
<button class="pen-tool" id="eraserTool" type="button" onclick="setPenType('eraser','🧽')">🧽</button>
<button class="pen-tool" type="button" onclick="doUndo()">↩️</button>
<button class="pen-tool" type="button" onclick="doRedo()">↪️</button>
<button class="pen-tool" type="button" onclick="doClearCurrent()">🧹</button>
</div>
<div class="pen-row"><div class="color-dot on" style="background:#3E2723" data-color="#3E2723"></div><div class="color-dot" style="background:#2E7D32" data-color="#2E7D32"></div><div class="color-dot" style="background:#1565C0" data-color="#1565C0"></div><div class="color-dot" style="background:#C62828" data-color="#C62828"></div><div class="color-dot" style="background:#F9A825" data-color="#F9A825"></div></div>
<div class="pen-row"><input type="range" min="1" max="8" value="2.6" step="0.5" class="size-slider" id="sizeSlider"/></div>
<div class="pen-row"><button class="pen-tool" type="button" onclick="toggleStamps()" style="width:auto;padding:0 12px;font-size:.75rem">🎨 Stamps</button><span style="font-size:.6rem;color:#757575">tap any word to hear en-GB</span></div>
<div class="pen-row" id="stickerRow" style="display:none"><button class="pen-tool" data-sticker="🌻" type="button">🌻</button><button class="pen-tool" data-sticker="🌷" type="button">🌷</button><button class="pen-tool" data-sticker="💧" type="button">💧</button><button class="pen-tool" data-sticker="🦋" type="button">🦋</button><button class="pen-tool" data-sticker="🐝" type="button">🐝</button><button class="pen-tool" data-sticker="🌾" type="button">🌾</button><button class="pen-tool" data-sticker="🌱" type="button">🌱</button><button class="pen-tool" data-sticker="⭐" type="button">⭐</button></div>
</div>
<script>
let audioCtx=null;
function initAudio(){if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();}
function playPop(){if(!audioCtx) return; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=440; o.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime+.15); g.gain.value=.15; g.gain.exponentialRampToValueAtTime(.01, audioCtx.currentTime+.2); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+.2);}
function playCandyPop(){if(!audioCtx) return; [523,659,784,1046].forEach((f,i)=>{const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=f; g.gain.value=.12; o.connect(g); g.connect(audioCtx.destination); o.start(audioCtx.currentTime+i*.07); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+i*.07+.3); o.stop(audioCtx.currentTime+i*.07+.3);});}
function playPen(){if(!audioCtx) return; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sawtooth'; o.frequency.value=120+Math.random()*80; g.gain.value=.02; o.connect(g); g.connect(audioCtx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime+.08); o.stop(audioCtx.currentTime+.08);}
const STORE='zaina_soil_final_';

const OBJECTIVE=[{id:'o1', q:'What is a major cause of soil erosion?', opts:['Earth Day','Deforestation','Afforestation'], ans:'Deforestation'},{id:'o2', q:'Earth Day is celebrated on?', opts:['22 April','15 August','5 June'], ans:'22 April'},{id:'o3', q:'Regolith is also called?', opts:['Humus','Parent material','Topsoil'], ans:'Parent material'},{id:'o4', q:'Afforestation means?', opts:['Cutting trees','Growing trees','Soil erosion'], ans:'Growing trees'},{id:'o5', q:'Plants hold soil with?', opts:['Leaves','Roots','Flowers'], ans:'Roots'}];

function inkKey(id){return STORE+'ink_'+mode+'_'+id;}
function flushInk(){document.querySelectorAll('canvas[data-ink-id]').forEach(c=>{try{if(c.width) localStorage.setItem(inkKey(c.dataset.inkId), c.toDataURL('image/png'));}catch(_){}});}
function mountStrip(canvas){
 const id=canvas.dataset.inkId; const p=canvas.parentElement; const dpr=Math.min(devicePixelRatio||1,2);
 const rect=p.getBoundingClientRect(); canvas.width=rect.width*dpr; canvas.height=rect.height*dpr; canvas.style.width=rect.width+'px'; canvas.style.height=rect.height+'px';
 const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,rect.width,rect.height);
 try{const saved=localStorage.getItem(inkKey(id)); if(saved){const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height); img.src=saved;}}catch(_){}
}
function stripHTML(id){return `<div class="inline-strip"><canvas data-ink-id="${id}"></canvas><div class="strip-tools"><button class="tool-btn" type="button" onclick="doUndoStrip('${id}')">↩️</button><button class="tool-btn" type="button" onclick="doClearStrip('${id}')">🧹</button></div></div>`;}
function shortStripHTML(id){return `<div class="inline-strip" style="width:min(140px,40vw);height:48px"><canvas data-ink-id="${id}"></canvas><div class="strip-tools"><button class="tool-btn" type="button" onclick="doUndoStrip('${id}')">↩️</button><button class="tool-btn" type="button" onclick="doClearStrip('${id}')">🧹</button></div></div>`;}
function doUndoStrip(id){const c=document.querySelector(`canvas[data-ink-id="${id}"]`); if(!c) return; const h=historyMap[id]; if(!h||!h.length) return; h.pop(); const ctx=c.getContext('2d'); const rect=c.parentElement.getBoundingClientRect(); ctx.clearRect(0,0,rect.width,rect.height); if(h.length){const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height); img.src=h[h.length-1];} localStorage.setItem(inkKey(id), h.length?h[h.length-1]:'');}
function doClearStrip(id){const c=document.querySelector(`canvas[data-ink-id="${id}"]`); if(!c) return; const ctx=c.getContext('2d'); const rect=c.parentElement.getBoundingClientRect(); ctx.clearRect(0,0,rect.width,rect.height); historyMap[id]=[]; localStorage.removeItem(inkKey(id));}
let redoMap={};
function doUndo(){const keys=Object.keys(historyMap); if(!keys.length) return; const k=keys[keys.length-1]; doUndoStrip(k);}

function isCellFound(r,c){for(let w of foundWords){const key=STORE+'wordpos_'+w; const saved=localStorage.getItem(key); if(!saved) continue; try{const arr=JSON.parse(saved); if(arr.some(p=>p.r===r&&p.c===c)) return true;}catch(_){}} return false;}
function getWord(){return selected.map(sc=>GRID[sc.r][sc.c]).join('');}
function checkSel(){
 const w=getWord(); const rev=w.split('').reverse().join('');

}
function foundClodWord(word){
 foundWords.push(word); localStorage.setItem(STORE+'foundWords', JSON.stringify(foundWords)); localStorage.setItem(STORE+'wordpos_'+word, JSON.stringify(selected.slice()));

function clearSel(){selected=[]; renderCurrent();}
function hintClod(){const rem=TARGETS.filter(w=>!foundWords.includes(w)); if(!rem.length) return; const word=rem[0]; for(let r=0;r<GRID.length;r++){for(let c=0;c<=GRID[r].length-word.length;c++){let m=true; for(let k=0;k<word.length;k++) if(GRID[r][c+k]!==word[k]){m=false;break;} if(m){for(let k=0;k<word.length;k++){const el=document.querySelector(`.clod-cell[data-r="${r}"][data-c="${c+k}"]`); if(el){el.classList.add('hint'); setTimeout(()=>el.classList.remove('hint'),1200);}} return;}}}}
function initClodDrag(){
 const wall=document.getElementById('clodWall'); if(!wall) return;
 wall.addEventListener('pointerdown', e=>{
  const cell=e.target.closest('.clod-cell'); if(!cell||cell.classList.contains('found')) return; e.preventDefault(); initAudio();
  const r=parseInt(cell.dataset.r), c=parseInt(cell.dataset.c); selected=[{r,c}]; isSelecting=true; cell.setPointerCapture(e.pointerId); renderCurrent(); initClodDrag();
 });
 wall.addEventListener('pointermove', e=>{
  if(!isSelecting) return; const el=document.elementFromPoint(e.clientX, e.clientY); const cell=el?.closest('.clod-cell'); if(!cell||cell.classList.contains('found')) return;
  const r=parseInt(cell.dataset.r), c=parseInt(cell.dataset.c); const last=selected[selected.length-1]; if(!last) return;
  const dr=Math.abs(r-last.r), dc=Math.abs(c-last.c); if(dr<=1&&dc<=1){if(!selected.some(sc=>sc.r===r&&sc.c===c)){selected.push({r,c}); renderCurrent(); initClodDrag();} else if(selected.length>1 && selected[selected.length-2].r===r && selected[selected.length-2].c===c){selected.pop(); renderCurrent(); initClodDrag();}}
 });
 const end=()=>{if(!isSelecting) return; isSelecting=false; checkSel(); if(getWord().length===0) renderCurrent();};
 wall.addEventListener('pointerup', end); wall.addEventListener('pointercancel', ()=>{isSelecting=false; clearSel();});
}

 ['A','B','C','D','E'].forEach(k=>{const id='wood'+k; const el=document.getElementById(id); if(!el) return; let doneK=false; if(k==='A') doneK=OBJECTIVE.some(q=>localStorage.getItem(STORE+'obj_'+mode+'_'+q.id)); if(k==='B') doneK=FILLS.some(f=>localStorage.getItem(STORE+'ink_'+mode+'_'+f.id)); if(k==='C') doneK=TF.some(q=>localStorage.getItem(STORE+'tf_'+mode+'_'+q.id)); if(k==='D') doneK=CONCEPT.some((_,i)=>localStorage.getItem(STORE+'ink_'+mode+'_concept_'+i)); if(k==='E') doneK=foundWords.length>0; if(doneK) el.classList.add('done');});
 checkUnlock();
}
function speakHint(){const hints=['Find TERRACE FARMING in soil clods','Tap any word to hear UK accent','Drag bubble anywhere - it remembers']; speak(hints[Math.floor(Math.random()*hints.length)]);}
// Ink events
(function(){
 let drawing=false,lx=0,ly=0,active=null,started=false;
 function pos(e,c){const r=c.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top];}
 document.addEventListener('pointerdown', e=>{
  const c=e.target.closest('canvas[data-ink-id]'); if(!c) return; e.preventDefault(); initAudio(); c.setPointerCapture(e.pointerId); drawing=true; active=c; started=true;
  const [x,y]=pos(e,c); lx=x; ly=y; const ctx=c.getContext('2d');
  if(currentPen.type==='eraser') ctx.globalCompositeOperation='destination-out'; else ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle=currentPen.type==='rainbow'?`hsl(${rainbowHue},100%,50%)`:currentPen.color; ctx.lineWidth=currentPen.size; ctx.lineCap='round'; ctx.lineJoin='round';
  if(currentPen.type==='cursive') ctx.lineWidth=currentPen.size*1.6;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+0.01,y); ctx.stroke();
 },{passive:false});
 document.addEventListener('pointermove', e=>{
  if(!drawing||!active) return; e.preventDefault(); const [x,y]=pos(e,active); const ctx=active.getContext('2d');
  if(currentPen.type==='rainbow'){rainbowHue=(rainbowHue+2)%360; ctx.strokeStyle=`hsl(${rainbowHue},100%,50%)`;}
  ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(x,y); ctx.stroke(); lx=x; ly=y;
 },{passive:false});
 function end(){if(!drawing||!active) return; drawing=false; if(started){if(!historyMap[active.dataset.inkId]) historyMap[active.dataset.inkId]=[]; try{historyMap[active.dataset.inkId].push(active.toDataURL('image/png')); if(historyMap[active.dataset.inkId].length>24) historyMap[active.dataset.inkId].shift(); localStorage.setItem(inkKey(active.dataset.inkId), active.toDataURL('image/png')); active.parentElement.classList.add('has-ink');}catch(_){}} started=false; active=null;}
 document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
})();
document.querySelectorAll('.color-dot').forEach(d=>{d.addEventListener('click',()=>{currentPen.color=d.dataset.color; document.querySelectorAll('.color-dot').forEach(x=>x.classList.remove('on')); d.classList.add('on');});});
document.getElementById('sizeSlider').addEventListener('input', e=>{currentPen.size=parseFloat(e.target.value);});
document.querySelectorAll('[data-sticker]').forEach(b=>{b.addEventListener('click',()=>{const emoji=b.dataset.sticker; const layer=document.getElementById('farmMap'); const el=document.createElement('div'); el.style.position='absolute'; el.style.left=(100+Math.random()*200)+'px'; el.style.top=(100+Math.random()*200)+'px'; el.style.fontSize='32px'; el.style.filter='drop-shadow(0 4px 8px rgba(0,0,0,.3))'; el.textContent=emoji; el.style.cursor='grab'; layer.appendChild(el); let dx=0,dy=0,sx=0,sy=0,drag=false; el.addEventListener('pointerdown', ev=>{ev.preventDefault(); el.setPointerCapture(ev.pointerId); drag=true; sx=ev.clientX; sy=ev.clientY; dx=parseFloat(el.style.left); dy=parseFloat(el.style.top);}); el.addEventListener('pointermove', ev=>{if(!drag) return; el.style.left=(dx+ev.clientX-sx)+'px'; el.style.top=(dy+ev.clientY-sy)+'px';}); el.addEventListener('pointerup', ()=>drag=false);});});
setMode('practice'); updateProgress(); checkUnlock();
</script>
