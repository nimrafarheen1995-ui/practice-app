<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Learning Quest</title>

  <!-- PWA & Standalone Fullscreen Directives -->
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#38BDF8" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', cursive, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: linear-gradient(135deg, #E0F2FE 0%, #EDE9FE 50%, #FEF3C7 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
    }

    .bg-bubble {
      position: fixed;
      font-size: 2.2rem;
      pointer-events: none;
      z-index: 0;
      opacity: 0.3;
      animation: floatUp 15s infinite linear;
    }
    @keyframes floatUp {
      0% { transform: translateY(105vh) rotate(0deg); }
      100% { transform: translateY(-15vh) rotate(360deg); }
    }

    .view-container {
      position: relative;
      z-index: 10;
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    header { text-align: center; }
    h1 {
      font-size: 2.6rem;
      font-weight: 800;
      color: #0F172A;
      text-shadow: 0 2px 0 #FFF;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 1.2rem;
      font-weight: 600;
      color: #475569;
    }

    /* Screen 1: Names Grid */
    .names-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 32px;
      width: 100%;
      max-width: 760px;
    }

    .name-card {
      background: #FFFFFF;
      border-radius: 40px;
      padding: 28px 24px;
      border: 5px solid #E2E8F0;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .name-card:active { transform: translateY(3px) scale(0.98); }

    .card-humayun { border-color: #38BDF8; }
    .card-humayun:hover { border-color: #0284C7; box-shadow: 0 20px 40px rgba(56, 189, 248, 0.2); }

    .card-zaina { border-color: #C084FC; }
    .card-zaina:hover { border-color: #9333EA; box-shadow: 0 20px 40px rgba(192, 132, 252, 0.2); }

    .avatar-big-wrap {
      width: 160px;
      height: 160px;
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }
    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-humayun .avatar-big-wrap { background: #BAE6FD; }
    .card-zaina .avatar-big-wrap { background: #E9D5FF; }

    .name-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: #0F172A;
    }

    /* Screen 2: Inside Student View */
    .inside-view {
      display: none;
      width: 100%;
      max-width: 650px;
      flex-direction: column;
      gap: 18px;
      position: relative;
      z-index: 10;
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .back-btn {
      background: #FFFFFF;
      border: 2px solid #CBD5E1;
      padding: 10px 20px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 800;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .back-btn:active { transform: translateY(2px); }

    .current-student-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0F172A;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-avatar-img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #FFF;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .lessons-deck {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .lesson-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-radius: 24px;
      text-decoration: none;
      color: #FFFFFF;
      font-weight: 800;
      font-size: 1.3rem;
      cursor: pointer;
      border: none;
      box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 10px 20px rgba(0,0,0,0.08);
      transition: transform 0.1s ease;
    }
    .lesson-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.18);
    }

    /* Color Palette for Subjects */
    .btn-english  { background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%); }
    .btn-math     { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); }
    .btn-evs      { background: linear-gradient(135deg, #10B981 0%, #059669 100%); }
    .btn-islam    { background: linear-gradient(135deg, #0D9488 0%, #115E59 100%); }
    .btn-tamil    { background: linear-gradient(135deg, #EF4444 0%, #B91C1C 100%); }
    .btn-arabic   { background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%); }
    .btn-default  { background: linear-gradient(135deg, #64748B 0%, #334155 100%); }

    .arrow-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .status-msg {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      color: #64748B;
      font-weight: 700;
      border: 2px dashed #CBD5E1;
    }

    /* Fullscreen Seamless Lesson Frame */
    #lessonFrameContainer {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      background: #FFFFFF;
    }

    #activeLessonFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="bg-bubble" style="left: 10%; animation-delay: 0s;">🚀</div>
  <div class="bg-bubble" style="left: 30%; animation-delay: 4s;">⭐</div>
  <div class="bg-bubble" style="left: 65%; animation-delay: 8s;">🌱</div>
  <div class="bg-bubble" style="left: 85%; animation-delay: 2s;">📚</div>

  <!-- SCREEN 1: CHOOSE NAME -->
  <div class="view-container" id="nameSelectView">
    <header>
      <h1>Who is learning today?</h1>
      <p class="subtitle">Tap your card to open your subjects:</p>
    </header>

    <div class="names-grid">
      <div class="name-card card-humayun" onclick="openStudentView('humayun')">
        <div class="avatar-big-wrap">
          <img src="humayun-avatar.png" alt="Humayun" class="avatar-img" />
        </div>
        <div class="name-title">Humayun</div>
      </div>

      <div class="name-card card-zaina" onclick="openStudentView('zaina')">
        <div class="avatar-big-wrap">
          <img src="zaina-avatar.png" alt="Zaina" class="avatar-img" />
        </div>
        <div class="name-title">Zaina</div>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: INSIDE STUDENT VIEW -->
  <div class="inside-view" id="studentView">
    <div class="top-nav">
      <button type="button" class="back-btn" onclick="showNameSelect()">⬅ Back</button>
      <div class="current-student-title" id="activeStudentLabel">
        <img src="humayun-avatar.png" alt="Humayun" class="header-avatar-img" id="headerAvatar" /> Humayun
      </div>
      <div style="width: 80px;"></div>
    </div>

    <!-- Automatically Populated Deck -->
    <div class="lessons-deck" id="lessonsDeck">
      <div class="status-msg">Finding active lessons... 🔍</div>
    </div>
  </div>

  <!-- SEAMLESS FULLSCREEN EMBED -->
  <div id="lessonFrameContainer">
    <iframe id="activeLessonFrame" src="about:blank" allow="autoplay; fullscreen"></iframe>
  </div>

  <script>
    const GITHUB_REPO = "nimrafarheen1995-ui/practice-app";
    let lessonsCache = null;

    const SUBJECT_CONFIG = {
      english:    { icon: "📖", colorClass: "btn-english", label: "English" },
      math:       { icon: "🔢", colorClass: "btn-math",    label: "Maths" },
      maths:      { icon: "🔢", colorClass: "btn-math",    label: "Maths" },
      evs:        { icon: "🌱", colorClass: "btn-evs",     label: "EVS" },
      science:    { icon: "🔬", colorClass: "btn-evs",     label: "EVS Science" },
      islamiyath: { icon: "🌙", colorClass: "btn-islam",   label: "Islamiyath" },
      islam:      { icon: "🌙", colorClass: "btn-islam",   label: "Islamiyath" },
      tamil:      { icon: "🪔", colorClass: "btn-tamil",   label: "Tamil" },
      arabic:     { icon: "📜", colorClass: "btn-arabic",  label: "Arabic" }
    };

    function requestFullScreenAuto() {
      const el = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (el.requestFullscreen) {
          el.requestFullscreen().catch(() => {});
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        }
      }
    }

    function parseFileName(fileName) {
      let base = fileName.replace(/\.html$/i, "");
      
      let student = "";
      if (base.toLowerCase().startsWith("humayun")) student = "humayun";
      else if (base.toLowerCase().startsWith("zaina")) student = "zaina";
      else return null;

      let remainder = base.replace(new RegExp(`^${student}[-_]?`, "i"), "").toLowerCase();
      if (!remainder) remainder = "english";

      let matchedConfig = { icon: "📝", colorClass: "btn-default", label: "Lesson" };
      let displayLabel = "";

      for (const key of Object.keys(SUBJECT_CONFIG)) {
        if (remainder.includes(key)) {
          matchedConfig = SUBJECT_CONFIG[key];
          displayLabel = matchedConfig.label;
          break;
        }
      }

      if (!displayLabel) {
        displayLabel = remainder.replace(/[-_]/g, " ").trim();
        displayLabel = displayLabel.charAt(0).toUpperCase() + displayLabel.slice(1);
      }

      return {
        student: student,
        fileName: fileName,
        title: `${matchedConfig.icon} ${displayLabel}`,
        colorClass: matchedConfig.colorClass
      };
    }

    async function loadRepositoryFiles(forceRefresh = false) {
      if (lessonsCache && !forceRefresh) return lessonsCache;

      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/?t=${Date.now()}`, {
          cache: "no-store",
          headers: { "Accept": "application/vnd.github.v3+json" }
        });
        
        if (!res.ok) throw new Error("API call error");
        const files = await res.json();
        
        lessonsCache = files
          .filter(f => f.name.endsWith(".html") && f.name !== "index.html")
          .map(f => parseFileName(f.name))
          .filter(Boolean);

        return lessonsCache;
      } catch (err) {
        return [
          { student: "humayun", fileName: "humayun.html", title: "📖 English", colorClass: "btn-english" },
          { student: "zaina", fileName: "zaina.html", title: "📖 English", colorClass: "btn-english" }
        ];
      }
    }

    async function openStudentView(name) {
      requestFullScreenAuto();

      document.getElementById('nameSelectView').style.display = 'none';
      const studentView = document.getElementById('studentView');
      studentView.style.display = 'flex';

      const label = document.getElementById('activeStudentLabel');
      const avatarSrc = name === 'humayun' ? 'humayun-avatar.png' : 'zaina-avatar.png';
      const studentNameCapitalized = name.charAt(0).toUpperCase() + name.slice(1);
      
      label.innerHTML = `<img src="${avatarSrc}" alt="${studentNameCapitalized}" class="header-avatar-img" id="headerAvatar" /> ${studentNameCapitalized}`;

      const deck = document.getElementById('lessonsDeck');
      deck.innerHTML = '<div class="status-msg">Finding active lessons... 🔍</div>';

      const allFiles = await loadRepositoryFiles(true);
      const studentFiles = allFiles.filter(item => item.student === name);

      deck.innerHTML = "";

      if (studentFiles.length === 0) {
        deck.innerHTML = '<div class="status-msg">No lessons uploaded yet for today! ✨</div>';
        return;
      }

      studentFiles.forEach(item => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `lesson-btn ${item.colorClass}`;
        btn.innerHTML = `<span>${item.title}</span><div class="arrow-circle">➔</div>`;
        btn.onclick = () => launchLesson(item.fileName);
        deck.appendChild(btn);
      });
    }

    function showNameSelect() {
      document.getElementById('studentView').style.display = 'none';
      document.getElementById('nameSelectView').style.display = 'flex';
    }

    function launchLesson(fileName) {
      requestFullScreenAuto();
      const container = document.getElementById('lessonFrameContainer');
      const frame = document.getElementById('activeLessonFrame');
      frame.src = fileName;
      container.style.display = 'block';
    }

    window.addEventListener("message", function(e) {
      if (e.data === "close-lesson-to-hub") {
        const container = document.getElementById('lessonFrameContainer');
        const frame = document.getElementById('activeLessonFrame');
        container.style.display = 'none';
        frame.src = "about:blank";
      }
    });

    loadRepositoryFiles();
  </script>
</body>
</html>
