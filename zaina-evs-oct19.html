<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Zaina - Soil Farm Final Clean</title>
<script src="shared/safe-storage.js"></script>
<link rel="preload" as="image" href="assets/farm-gardenscape-bg.jpeg" />
<link rel="preload" as="image" href="assets/soil-girl-hero.png" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
:root{--font-scale:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100vw;height:100vh;height:100dvh;margin:0;padding:0;overflow:hidden;background:#1a2f1a;font-family:'Nunito',sans-serif}
.master-farm{position:relative;width:100vw;height:100dvh;overflow:hidden;background:url('assets/farm-gardenscape-bg.jpeg') center/cover no-repeat}
.master-farm::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom, rgba(255,255,255,0.06) 0%, rgba(0,0,0,0.06) 100%);z-index:1;pointer-events:none}
/* HUD - with Hub button as in pollution image */
.hud{position:absolute;top:8px;left:8px;right:8px;z-index:20;display:flex;align-items:center;gap:6px;background:rgba(255,253,240,0.96);border:2.5px solid #5D4037;border-radius:20px;padding:5px 8px;box-shadow:0 6px 18px rgba(0,0,0,0.28)}
.hub-btn{width:42px;height:36px;border-radius:12px;border:2px solid #5D4037;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer;font-size:1.1rem}
.zaina-pill{display:flex;align-items:center;gap:4px;background:#D7CCC8;border:2px solid #5D4037;border-radius:14px;padding:3px 10px;font-weight:900;color:#3E2723;font-size:.85rem}
.mode-pill{display:flex;gap:3px;background:#EFEBE9;border:2px solid #8D6E63;border-radius:12px;padding:2px}
.mode-btn{border:0;background:transparent;padding:4px 10px;border-radius:8px;font-weight:800;font-size:.7rem;cursor:pointer}
.mode-btn.active{background:#5D4037;color:#fff}
.font-pill{display:flex;gap:2px;background:#EFEBE9;border:2px solid #8D6E63;border-radius:10px;padding:2px}
.font-btn{border:0;background:#fff;width:30px;height:26px;border-radius:8px;font-weight:900;font-size:.7rem;cursor:pointer;border:1px solid #BCAAA4}
.min-btn{width:38px;height:36px;border-radius:12px;border:2px solid #5D4037;background:#fff;font-weight:900;cursor:pointer}
/* Farm map signboards - small wooden */
.farm-map{position:absolute;inset:0;z-index:5;padding:64px 10px 10px 10px}
.signboard{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;filter:drop-shadow(0 5px 10px rgba(0,0,0,0.3));transition:transform .15s}
.signboard:active{transform:scale(0.93)}
.sign-post{width:7px;height:24px;background:linear-gradient(90deg,#8D6E63,#5D4037);border-radius:2px}
.sign-wood{min-width:84px;padding:6px 10px;background:linear-gradient(135deg,#EFEBE9,#D7CCC8);border:2.5px solid #5D4037;border-radius:8px;box-shadow:0 3px 0 #5D4037;font-weight:900;font-size:.7rem;color:#3E2723;text-align:center;line-height:1.15}
.sign-wood.done{background:linear-gradient(135deg,#A5D6A7,#81C784);border-color:#2E7D32}
.sign-emoji{font-size:20px;background:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:2px solid #5D4037}
#signA{left:6%;top:18%}
#signB{left:26%;top:36%}
#signC{left:50%;top:28%}
#signD{left:70%;top:52%}
#signE{left:42%;top:62%}
#signF{left:82%;top:38%}
/* Butterflies flying */
.butterfly{position:absolute;z-index:6;pointer-events:none;font-size:22px;animation:flyPath 10s linear infinite;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.2))}
@keyframes flyPath{0%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(80px,-30px) rotate(15deg)}50%{transform:translate(160px,10px) rotate(-10deg)}75%{transform:translate(80px,40px) rotate(10deg)}100%{transform:translate(0,0) rotate(0deg)}}
/* Center card modal - S11 big, no blur dark, feels on background */
#cardModal{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,0.12);display:none;align-items:center;justify-content:center;padding:10px}
#cardModal.show{display:flex}
.card-box{position:relative;width:min(1120px,94vw);height:min(760px,82dvh);background:rgba(255,255,255,0.98);border:3px solid #5D4037;border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,0.35);display:flex;flex-direction:column;overflow:hidden}
.card-box.animA{animation:openA .42s cubic-bezier(.16,1,.3,1)}
.card-box.animB{animation:openB .42s cubic-bezier(.16,1,.3,1)}
.card-box.animC{animation:openC .42s cubic-bezier(.16,1,.3,1)}
.card-box.animD{animation:openD .52s cubic-bezier(.16,1,.3,1)}
.card-box.animE{animation:openE .45s cubic-bezier(.16,1,.3,1)}
.card-box.animF{animation:openF .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes openA{from{transform:scale(0.15) translate(-40vw,-30vh);opacity:0}to{transform:scale(1) translate(0,0);opacity:1}}
@keyframes openB{from{transform:translateX(-90vw);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes openC{from{transform:translateX(90vw);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes openD{from{transform:rotateY(90deg) scale(0.7);opacity:0}to{transform:rotateY(0) scale(1);opacity:1}}
@keyframes openE{from{transform:scaleY(0);transform-origin:bottom;opacity:0}to{transform:scaleY(1);opacity:1}}
@keyframes openF{from{transform:scale(0) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.card-box.closingA{animation:closeA .32s ease-in forwards}
.card-box.closingB{animation:closeB .32s ease-in forwards}
.card-box.closingC{animation:closeC .32s ease-in forwards}
.card-box.closingD{animation:closeD .36s ease-in forwards}
.card-box.closingE{animation:closeE .32s ease-in forwards}
.card-box.closingF{animation:closeF .36s ease-in forwards}
@keyframes closeA{to{transform:scale(0.15) translate(-40vw,-30vh);opacity:0}}
@keyframes closeB{to{transform:translateX(-90vw);opacity:0}}
@keyframes closeC{to{transform:translateX(90vw);opacity:0}}
@keyframes closeD{to{transform:rotateY(-90deg) scale(0.7);opacity:0}}
@keyframes closeE{to{transform:scaleY(0);transform-origin:bottom;opacity:0}}
@keyframes closeF{to{transform:scale(0) rotate(15deg);opacity:0}}
.card-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#EFEBE9;border-bottom:2px solid #D7CCC8}
.card-title{font-family:'Fredoka',sans-serif;font-weight:800;color:#3E2723;font-size:.95rem;flex:1}
.close-btn{width:34px;height:34px;border-radius:50%;border:2px solid #5D4037;background:#fff;font-weight:900;cursor:pointer}
.card-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 12px 12px 12px;display:flex;flex-direction:column;gap:8px;position:relative}
/* Girl embossed - FRONT, tall length not width */
.girl-embossed{position:absolute;right:-6px;bottom:-6px;width:auto;height:380px;object-fit:contain;pointer-events:none;z-index:10;filter:drop-shadow(0 10px 18px rgba(0,0,0,0.32));transform:rotate(-1.5deg)}
@media(max-width:900px){.girl-embossed{height:280px;right:-12px}}
.card-content{position:relative;z-index:3;flex:1;padding-right:86px}
@media(max-width:900px){.card-content{padding-right:40px}}
/* Q rows clean - no jargon */
.q-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:9px;border:1.5px dashed #BCAAA4;border-radius:12px;margin-bottom:6px;background:#FFFBF5;line-height:1.45}
.q-num{color:#5D4037;font-weight:900;min-width:18px}
.q-text{font-weight:800;font-size:calc(.86rem * var(--font-scale));flex:1 1 100%}
.s-word{cursor:pointer;border-radius:3px;padding:0 2px;display:inline-block}
.s-word.speaking{background:#C8E6C9;outline:2px solid #4CAF50}
.inline-strip{position:relative;display:inline-flex;vertical-align:middle;width:min(450px,100%);height:58px;border:1.8px solid #A1887F;border-radius:10px;background:#fffffe;overflow:hidden;touch-action:none;margin-top:4px}
.inline-strip::before{content:'';position:absolute;left:12px;top:0;bottom:0;width:1.2px;background:#EF9A9A;opacity:.8;z-index:1}
.inline-strip::after{content:'';position:absolute;left:0;right:34px;top:54%;height:1.2px;background:#C5CAE9;z-index:1}
.inline-strip canvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;touch-action:none}
.strip-tools{position:absolute;right:0;top:0;bottom:0;width:34px;display:flex;flex-direction:column;border-left:1px solid #D7CCC8;background:#EFEBE9;z-index:4}
.tool-btn{flex:1;display:flex;align-items:center;justify-content:center;border:0;background:transparent;cursor:pointer;font-size:.75rem}
.tf-chip{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:34px;padding:0 12px;border:2px solid #BCAAA4;border-radius:999px;font-weight:900;font-size:.76rem;cursor:pointer;background:#fff}
.tf-chip.true{border-color:#5D4037;color:#3E2723}
.tf-chip.false{border-color:#E57373;color:#B71C1C}
.tf-chip.on.true{background:#5D4037;color:#fff}
.tf-chip.on.false{background:#E57373;color:#fff}
.opt-btn{display:inline-flex;align-items:center;justify-content:center;min-width:120px;padding:6px 10px;margin:3px;border:2px solid #BCAAA4;border-radius:10px;background:#fff;font-weight:800;font-size:.74rem;cursor:pointer}
.opt-btn.on{background:#5D4037;color:#fff;border-color:#3E2723}
/* Concept map boxes */
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.map-box{border:2px dashed #A5D6A7;border-radius:12px;padding:6px;background:#F1F8E9;min-height:64px}
.map-box .inline-strip{width:100%;height:52px}
.word-bank{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#fff;border:2px solid #C8E6C9;border-radius:12px;margin-top:6px}
.word-chip{padding:5px 10px;background:#EFEBE9;border:2px solid #8D6E63;border-radius:999px;font-weight:800;font-size:.7rem;cursor:grab;touch-action:none}
.word-chip.dragging{transform:scale(1.1);box-shadow:0 6px 12px rgba(0,0,0,0.2)}
/* Soil clod grid */
.soil-grid-wrap{background:linear-gradient(180deg,#FFF8E1 0%, #D7CCC8 100%);border:2.5px solid #5D4037;border-radius:14px;padding:8px}
.clod-top{display:flex;gap:6px;justify-content:center;align-items:center;padding:6px;background:rgba(255,255,255,0.9);border-radius:10px;margin-bottom:6px;border:1.5px dashed #8D6E63}
.clod-wall{display:grid;grid-template-columns:repeat(17, minmax(0,1fr));gap:3px;background:#5D4037;padding:5px;border-radius:10px;box-shadow:inset 0 2px 8px rgba(0,0,0,0.4)}
.clod-cell{aspect-ratio:1;background:linear-gradient(145deg,#A1887F 0%,#8D6E63 20%,#795548 60%,#6D4C41 100%);border:1.8px solid #3E2723;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(9px,1.5vw,13px);color:#3E2723;cursor:pointer;touch-action:none;box-shadow:0 2px 0 #3E2723, 0 2px 6px rgba(0,0,0,0.2), inset 0 1px 2px rgba(255,255,255,0.25)}
.clod-cell.selected{background:linear-gradient(145deg,#FFF9C4,#FFEB3B);border-color:#F9A825;transform:scale(1.06) translateY(-1px);z-index:2;box-shadow:0 0 0 2px #FFEB3B, 0 4px 10px rgba(0,0,0,0.25)}
.clod-cell.found{background:linear-gradient(145deg,#A5D6A7,#66BB6A);border-color:#2E7D32;opacity:.55}
.clod-cell.pop{animation:clodPop .6s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes clodPop{0%{transform:scale(1)}25%{transform:scale(1.3) rotate(5deg)}50%{transform:scale(1.15) rotate(-5deg)}100%{transform:scale(0) rotate(140deg);opacity:0}}
.clod-cell.hint{animation:clodHint .5s ease infinite}
@keyframes clodHint{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.word-targets{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.word-target{padding:4px 9px;background:#fff;border:2px solid #5D4037;border-radius:999px;font-weight:900;font-size:.68rem;color:#3E2723}
.word-target.done{background:#5D4037;color:#fff;text-decoration:line-through}
.candy-confetti{position:absolute;width:7px;height:7px;border-radius:2px;pointer-events:none;animation:candyConf .75s ease-out forwards;z-index:40}
@keyframes candyConf{0%{transform:translateY(0) scale(0) rotate(0);opacity:1}100%{transform:translateY(-70px) scale(1.4) rotate(300deg);opacity:0}}
/* Try again */
#tryAgainModal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center}
#tryAgainModal.show{display:flex}
.try-box{background:#EFEBE9;border:3px solid #D32F2F;border-radius:18px;padding:14px;width:min(340px,90vw);text-align:center}
.try-hero{width:140px;height:140px;object-fit:contain;margin:0 auto;display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,.25))}
/* Pen bubble - draggable memory */
#penBubble{position:fixed;z-index:50;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#3E2723,#5D4037);box-shadow:0 8px 20px rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;color:#fff;font-size:20px}
#penPanel{position:fixed;z-index:51;width:252px;background:rgba(255,255,255,.98);border:2.5px solid #5D4037;border-radius:16px;padding:9px;box-shadow:0 14px 36px rgba(0,0,0,.24);transform:scale(.9);opacity:0;pointer-events:none;transition:all .2s cubic-bezier(.34,1.56,.64,1)}
#penPanel.open{transform:scale(1);opacity:1;pointer-events:auto}
.pen-row{display:flex;gap:5px;margin-bottom:7px;flex-wrap:wrap;align-items:center}
.pen-tool{width:38px;height:38px;border-radius:10px;border:2px solid #D7CCC8;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;position:relative}
.pen-tool.on{border-color:#5D4037;background:#EFEBE9;box-shadow:0 0 0 2px rgba(93,64,55,.18)}
.pen-submenu{position:absolute;bottom:42px;left:0;background:#fff;border:2px solid #5D4037;border-radius:10px;padding:5px;display:none;flex-direction:column;gap:4px;box-shadow:0 8px 18px rgba(0,0,0,.18);z-index:10}
.pen-submenu.show{display:flex}
.pen-sub{width:34px;height:34px;border-radius:8px;border:1.5px solid #D7CCC8;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.pen-sub.on{border-color:#5D4037;background:#EFEBE9}
.color-dot{width:26px;height:26px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1px #BCAAA4;cursor:pointer}
.color-dot.on{box-shadow:0 0 0 2.3px #5D4037}
.size-slider{width:100%;accent-color:#5D4037}
#pinModal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center}
#pinModal.show{display:flex}
.pin-box{background:#fff;border:3px solid #5D4037;border-radius:16px;padding:16px;width:min(300px,90vw);text-align:center}
.pin-input{width:100%;padding:10px;border:2px solid #BCAAA4;border-radius:10px;font-size:1.1rem;font-weight:800;text-align:center;margin:8px 0;letter-spacing:5px}
#dimLayer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:25;transition:opacity .25s}
</style>
</head>
<body>
<div id="dimLayer"></div>
<div id="tryAgainModal"><div class="try-box"><img src="assets/soil-girl-hero.png" class="try-hero" alt=""/><div style="font-weight:800;color:#D32F2F" id="tryTitle">Try Again</div><div style="font-size:.75rem;color:#5D4037;margin-top:4px" id="trySub"></div><button type="button" onclick="document.getElementById('tryAgainModal').classList.remove('show')" style="margin-top:10px;background:#D32F2F;color:#fff;border:2px solid #B71C1C;border-radius:10px;padding:8px 18px;font-weight:800;cursor:pointer">Try Again</button></div></div>
<div id="pinModal"><div class="pin-box"><div style="font-weight:900;color:#3E2723">Enter PIN</div><div style="font-size:.7rem;color:#757575">PIN is 1995</div><input type="password" id="pinInput" class="pin-input" placeholder="••••" inputmode="numeric"/><div id="pinError" style="display:none;color:#D32F2F;font-size:.7rem;font-weight:800">Wrong PIN</div><div style="display:flex;gap:8px;margin-top:8px"><button class="hub-btn" type="button" onclick="closePin()" style="flex:1">Cancel</button><button class="hub-btn" type="button" onclick="checkPin()" style="flex:1;background:#5D4037;color:#fff">OK</button></div></div></div>
<div class="master-farm" id="masterFarm">
<div class="hud" id="hud">
<button class="hub-btn" type="button" onclick="goHub()">←</button>
<div class="zaina-pill">Zaina <span style="font-size:18px">🌍</span></div>
<div class="mode-pill"><button class="mode-btn active" id="btnPractice" type="button" onclick="requestMode('practice')">Practice</button><button class="mode-btn" id="btnWrite" type="button" onclick="requestMode('write')">Write</button></div>
<div class="font-pill"><button class="font-btn" type="button" onclick="changeFont(-1)">A-</button><button class="font-btn" type="button" onclick="changeFont(1)">A+</button></div>
<button class="min-btn" type="button" onclick="toggleHud()">—</button>
</div>
<div class="farm-map" id="farmMap">
<div class="butterfly" style="left:12%;top:22%;animation-delay:0s">🦋</div>
<div class="butterfly" style="left:65%;top:18%;animation-delay:2s">🦋</div>
<div class="butterfly" style="left:78%;top:42%;animation-delay:4s">🦋</div>
<div class="signboard" id="signA" onclick="openSection('A', this)"><div class="sign-emoji">🌻</div><div class="sign-post"></div><div class="sign-wood" id="woodA">A<br/>Objective</div></div>
<div class="signboard" id="signB" onclick="openSection('B', this)"><div class="sign-emoji">🌷</div><div class="sign-post"></div><div class="sign-wood" id="woodB">B<br/>Fill Blanks</div></div>
<div class="signboard" id="signC" onclick="openSection('C', this)"><div class="sign-emoji">💧</div><div class="sign-post"></div><div class="sign-wood" id="woodC">C<br/>True / False</div></div>
<div class="signboard" id="signD" onclick="openSection('D', this)"><div class="sign-emoji">🌾</div><div class="sign-post"></div><div class="sign-wood" id="woodD">D<br/>Causes Map</div></div>
<div class="signboard" id="signE" onclick="openSection('E', this)"><div class="sign-emoji">🌿</div><div class="sign-post"></div><div class="sign-wood" id="woodE">E<br/>Conservation</div></div>
<div class="signboard" id="signF" onclick="openSection('F', this)"><div class="sign-emoji">🧱</div><div class="sign-post"></div><div class="sign-wood" id="woodF">F<br/>Word Grid</div></div>
</div>
<div id="cardModal" onclick="if(event.target===this) closeCard()"><div class="card-box" id="cardBox"><div class="card-header"><div class="card-title" id="cardTitle">A</div><button class="close-btn" type="button" onclick="closeCard()">✕</button></div><div class="card-scroll" id="cardScroll"></div></div></div>
</div>
<div id="penBubble">✏️</div>
<div id="penPanel">
<div class="pen-row">
<div class="pen-tool on" id="penMain" onclick="togglePenSub()"><span id="penIcon">✏️</span><div class="pen-submenu" id="penSub"><button class="pen-sub on" data-pen="pen" type="button" onclick="setPen('pen','✏️')">✏️</button><button class="pen-sub" data-pen="cursive" type="button" onclick="setPen('cursive','🖋️')">🖋️</button><button class="pen-sub" data-pen="rainbow" type="button" onclick="setPen('rainbow','🌈')">🌈</button><button class="pen-sub" data-pen="glitter" type="button" onclick="setPen('glitter','✨')">✨</button></div></div>
<button class="pen-tool" id="eraserTool" type="button" onclick="setPen('eraser','🧽')">🧽</button>
<button class="pen-tool" type="button" onclick="doUndo()">↩️</button>
<button class="pen-tool" type="button" onclick="doRedo()">↪️</button>
<button class="pen-tool" type="button" onclick="doClear()">🧹</button>
</div>
<div class="pen-row"><div class="color-dot on" style="background:#3E2723" data-color="#3E2723"></div><div class="color-dot" style="background:#2E7D32" data-color="#2E7D32"></div><div class="color-dot" style="background:#1565C0" data-color="#1565C0"></div><div class="color-dot" style="background:#C62828" data-color="#C62828"></div><div class="color-dot" style="background:#F9A825" data-color="#F9A825"></div></div>
<div class="pen-row"><input type="range" min="1" max="8" value="2.6" step="0.5" class="size-slider" id="sizeSlider"/></div>
<div class="pen-row"><button class="pen-tool" type="button" onclick="toggleStamps()" style="width:auto;padding:0 10px;font-size:.75rem">🎨</button></div>
<div class="pen-row" id="stickerRow" style="display:none"><button class="pen-tool" data-sticker="🌻" type="button">🌻</button><button class="pen-tool" data-sticker="🌷" type="button">🌷</button><button class="pen-tool" data-sticker="💧" type="button">💧</button><button class="pen-tool" data-sticker="🦋" type="button">🦋</button><button class="pen-tool" data-sticker="🐝" type="button">🐝</button><button class="pen-tool" data-sticker="🌾" type="button">🌾</button><button class="pen-tool" data-sticker="🌱" type="button">🌱</button></div>
</div>
<script>

 h+=`</div><div class="word-bank" id="bankE">`; CONS.forEach(w=>{h+=`<div class="word-chip" data-word="${w}">${makeSpeakable(w)}</div>`;}); h+=`</div>`;

function renderF(){
 let h=`<div class="q-row">`; CLUES.forEach((c,i)=>{h+=`<div class="q-text" style="margin-bottom:3px">${makeSpeakable(c)}</div>`;}); h+=`</div><div class="soil-grid-wrap"><div class="clod-top"><div style="font-weight:900;font-size:.7rem">${found.length}/${TARGETS.length}</div></div><div class="clod-wall" id="clodWall">`;
 for(let r=0;r<GRID.length;r++){for(let c=0;c<GRID[r].length;c++){const letter=GRID[r][c]; const isFound=isFoundCell(r,c); const isSel=selected.some(sc=>sc.r===r&&sc.c===c); let cls='clod-cell'; if(isFound) cls+=' found'; if(isSel) cls+=' selected'; h+=`<div class="${cls}" data-r="${r}" data-c="${c}">${letter}</div>`;}}
 h+=`</div><div class="word-targets">`; TARGETS.forEach(w=>{const done=found.includes(w); h+=`<div class="word-target ${done?'done':''}"><span class="s-word" data-speak="${w}">${done?'✅ ':''}${w}</span></div>`;}); h+=`</div><div style="margin-top:6px;display:flex;gap:6px"><button class="hub-btn" type="button" onclick="clearSel()" style="width:auto;padding:4px 10px;font-size:.7rem">Clear</button><button class="hub-btn" type="button" onclick="hintClod()" style="width:auto;padding:4px 10px;font-size:.7rem">Hint</button></div></div>`;
 return h;

function isFoundCell(r,c){for(let w of found){const key=STORE+'pos_'+w; const saved=localStorage.getItem(key); if(!saved) continue; try{const arr=JSON.parse(saved); if(arr.some(p=>p.r===r&&p.c===c)) return true;}catch(_){}} return false;}
function getWord(){return selected.map(sc=>GRID[sc.r][sc.c]).join('');}
function checkSel(){const w=getWord(); const rev=w.split('').reverse().join(''); if(TARGETS.includes(w)&&!found.includes(w)) foundWord(w); else if(TARGETS.includes(rev)&&!found.includes(rev)) foundWord(rev); else if(w.length>2){selected.forEach(sc=>{const el=document.querySelector(`.clod-cell[data-r="${sc.r}"][data-c="${sc.c}"]`); if(el){el.classList.add('hint'); setTimeout(()=>el.classList.remove('hint'),500);}}); setTimeout(()=>clearSel(),500);}}
function foundWord(word){found.push(word); localStorage.setItem(STORE+'found', JSON.stringify(found)); localStorage.setItem(STORE+'pos_'+word, JSON.stringify(selected.slice())); selected.forEach(sc=>{const el=document.querySelector(`.clod-cell[data-r="${sc.r}"][data-c="${sc.c}"]`); if(el){el.classList.add('pop'); for(let i=0;i<5;i++){const conf=document.createElement('div'); conf.className='candy-confetti'; conf.style.left=(el.offsetLeft+Math.random()*el.offsetWidth)+'px'; conf.style.top=el.offsetTop+'px'; conf.style.background=['#A1887F','#A5D6A7','#FFEB3B','#81C784'][Math.floor(Math.random()*4)]; document.getElementById('clodWall').appendChild(conf); setTimeout(()=>conf.remove(),700);}}}); playCandy(); setTimeout(()=>{selected=[]; renderSec();},600);}

function hintClod(){const rem=TARGETS.filter(w=>!found.includes(w)); if(!rem.length) return; const word=rem[0]; for(let r=0;r<GRID.length;r++){for(let c=0;c<=GRID[r].length-word.length;c++){let m=true; for(let k=0;k<word.length;k++) if(GRID[r][c+k]!==word[k]){m=false;break;} if(m){for(let k=0;k<word.length;k++){const el=document.querySelector(`.clod-cell[data-r="${r}"][data-c="${c+k}"]`); if(el){el.classList.add('hint'); setTimeout(()=>el.classList.remove('hint'),1000);}} return;}}}}
function initClod(){

}

(function(){

 function pos(e,c){const r=c.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top];}

  if(currentPen.type==='cursive') ctx.lineWidth=currentPen.size*1.6;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+0.01,y); ctx.stroke();
 },{passive:false});
 document.addEventListener('pointermove', e=>{
  if(!drawing||!active) return; e.preventDefault(); const [x,y]=pos(e,active); const ctx=active.getContext('2d');
  if(currentPen.type==='rainbow'){rainbowHue=(rainbowHue+2)%360; ctx.strokeStyle=`hsl(${rainbowHue},100%,50%)`;}
  ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(x,y); ctx.stroke(); lx=x; ly=y;
 },{passive:false});
 function end(){if(!drawing||!active) return; drawing=false; if(started){if(!historyMap[active.dataset.inkId]) historyMap[active.dataset.inkId]=[]; try{historyMap[active.dataset.inkId].push(active.toDataURL('image/png')); if(historyMap[active.dataset.inkId].length>24) historyMap[active.dataset.inkId].shift(); localStorage.setItem(inkKey(active.dataset.inkId), active.toDataURL('image/png'));}catch(_){}} started=false; active=null;}
 document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
})();
document.querySelectorAll('.color-dot').forEach(d=>{d.addEventListener('click',()=>{currentPen.color=d.dataset.color; document.querySelectorAll('.color-dot').forEach(x=>x.classList.remove('on')); d.classList.add('on');});});
document.getElementById('sizeSlider').addEventListener('input', e=>{currentPen.size=parseFloat(e.target.value);});
document.querySelectorAll('[data-sticker]').forEach(b=>{b.addEventListener('click',()=>{const emoji=b.dataset.sticker; const layer=document.getElementById('farmMap'); const el=document.createElement('div'); el.style.position='absolute'; el.style.left=(120+Math.random()*200)+'px'; el.style.top=(100+Math.random()*200)+'px'; el.style.fontSize='32px'; el.style.filter='drop-shadow(0 4px 8px rgba(0,0,0,.3))'; el.textContent=emoji; el.style.cursor='grab'; layer.appendChild(el); let drag=false,sx=0,sy=0,dx=0,dy=0; el.addEventListener('pointerdown', ev=>{ev.preventDefault(); el.setPointerCapture(ev.pointerId); drag=true; sx=ev.clientX; sy=ev.clientY; dx=parseFloat(el.style.left); dy=parseFloat(el.style.top);}); el.addEventListener('pointermove', ev=>{if(!drag) return; el.style.left=(dx+ev.clientX-sx)+'px'; el.style.top=(dy+ev.clientY-sy)+'px';}); el.addEventListener('pointerup', ()=>drag=false);});});
setMode('practice');
</script>
