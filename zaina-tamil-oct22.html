<style>
:root{--gold:#D97706;--gold2:#B45309;--ink:#1E3A8A;--paper:#FFFEFB;--ruled:#93C5FD;--ruledRed:#EF4444;--tamil:'Mukta Malar',sans-serif;--ui:'Nunito',sans-serif;--scale:1}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--ui)}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:#0C0603;color:#3C1904}
body{display:flex;flex-direction:column;padding:6px 10px;gap:6px}
.top{height:46px;display:flex;align-items:center;justify-content:space-between;z-index:50;flex-shrink:0}
.hg{display:flex;gap:7px;align-items:center}
.hb{background:rgba(255,255,255,.96);border:2px solid #FBBF24;width:42px;height:38px;border-radius:12px;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.hb.on{background:#DCFCE7;border-color:#16A34A}

.seg button{border:none;background:transparent;padding:4px 18px;border-radius:18px;font-size:1.15rem;cursor:pointer}
.seg button.active{background:linear-gradient(180deg,#F59E0B,#D97706);box-shadow:0 2px 8px rgba(217,119,6,.4)}
.stage{flex:1;display:grid;grid-template-columns:280px 1fr;gap:12px;padding:10px 14px;border:4px solid #5A3C22;border-radius:22px;overflow:hidden;background:#110B07 url('assets/village-bg.webp') center/cover no-repeat;box-shadow:0 16px 45px rgba(0,0,0,.85);min-height:0;transition:grid-template-columns .3s}
.stage.collapsed{grid-template-columns:72px 1fr}
.left{display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.coll{ align-self:flex-end;background:rgba(255,255,255,.9);border:1.5px solid var(--gold);border-radius:8px;padding:2px 8px;font-size:.8rem;font-weight:900;cursor:pointer}
.hero{width:100%;height:150px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;flex-shrink:0}

.chs{display:flex;flex-direction:column;gap:8px}

.ch.active{background:#FEF08A;border-color:var(--gold);box-shadow:0 0 14px rgba(245,158,11,.6);transform:translateX(3px)}
.ct{font-family:var(--tamil);font-size:1.02rem;font-weight:800;line-height:1.25;color:#451A03;text-align:left}
.stage.collapsed .ct{display:none}
.right{display:flex;flex-direction:column;gap:8px;min-height:0;height:100%;z-index:15}
.banner{width:100%;height:70px;margin-top:34px;background:url('assets/palm-scroll-banner.webp') center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;padding:0 90px 0 50px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));flex-shrink:0;position:relative}
.bt{font-family:var(--tamil);font-size:clamp(1.15rem,1.6vw,1.45rem);font-weight:900;color:#351804;text-align:center;flex:1;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.parrot{width:100px;height:160px;position:absolute;right:-8px;top:-36px;background:transparent;border:none;cursor:pointer;filter:drop-shadow(0 8px 12px rgba(0,0,0,.4));z-index:20}

.body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;min-height:0;height:100%;width:100%;overflow:hidden}

#penBar{position:fixed;z-index:99991;background:rgba(255,255,255,.98);border:2px solid #E7D5B0;border-radius:18px;padding:8px;box-shadow:0 16px 40px rgba(0,0,0,.22);transform:scale(.9);opacity:0;pointer-events:none;transition:all .22s;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 20px)}

.pb{width:36px;height:36px;border-radius:10px;border:2px solid #E7D5B0;background:#FFF;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:.12s;position:relative}

.pr{display:flex;gap:6px;align-items:center;margin-bottom:6px}.pr:last-child{margin-bottom:0}
.pm{width:32px;height:32px;border-radius:8px;border:2px solid #E7D5B0;background:#FFF;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}

.pd{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid #FFF;box-shadow:0 0 0 2px #E7D5B0}

#snd{position:fixed;bottom:16px;left:12px;z-index:99990;width:42px;height:42px;border-radius:50%;background:#FFF;border:2px solid #8B5A2B;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.15)}

#finaleC{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
</style>

// SAFE STORE WRAPPER - USES shared/safe-storage.js if present
const Store = {
  db:null,
  async init(){
    if(this.db) return;
    if(window.SafeStorage && window.SafeStorage.init){ try{ await window.SafeStorage.init(); }catch{} }
    return new Promise(res=>{
      try{
        const req=indexedDB.open('zaina_final_v1',1);
        req.onupgradeneeded=e=>{ try{ e.target.result.createObjectStore('kv'); }catch{} };
        req.onsuccess=e=>{ this.db=e.target.result; res(); };
        req.onerror=()=>res();
      }catch{ res(); }
    });
  },
  async set(k,v){
    await this.init();
    try{ if(window.SafeStorage && window.SafeStorage.setItem){ await window.SafeStorage.setItem(k,v); return; } }catch{}
    if(this.db){ return new Promise(r=>{ try{ const tx=this.db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>r(); tx.onerror=()=>{ try{localStorage.setItem(k,v)}catch{}; r(); }; }catch{ try{localStorage.setItem(k,v)}catch{}; r(); } }); }
    else{ try{localStorage.setItem(k,v)}catch{} }
  },
  async get(k){
    await this.init();
    try{ if(window.SafeStorage && window.SafeStorage.getItem){ const v=await window.SafeStorage.getItem(k); if(v!=null) return v; } }catch{}
    if(this.db){ return new Promise(r=>{ try{ const tx=this.db.transaction('kv','readonly'); const req=tx.objectStore('kv').get(k); req.onsuccess=()=>r(req.result||localStorage.getItem(k)); req.onerror=()=>r(localStorage.getItem(k)); }catch{ r(localStorage.getItem(k)); } }); }
    else return localStorage.getItem(k);
  },
  async del(k){
    await this.init();
    try{ if(window.SafeStorage && window.SafeStorage.removeItem){ await window.SafeStorage.removeItem(k); } }catch{}
    if(this.db){ try{ const tx=this.db.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); }catch{} }
    try{ localStorage.removeItem(k); }catch{}
  }
};

    document.body.appendChild(bubble); document.body.appendChild(eBubble); document.body.appendChild(bar); document.body.appendChild(sound);

    colors.forEach(c=>{ const d=document.createElement('div'); d.className='pd'+(c===Pen.color?' on':''); d.style.background=c; d.onclick=()=>{ Pen.color=c; upd(); closeP(); }; colRow.appendChild(d); });
    document.getElementById('pSize').oninput=e=>{ Pen.size=parseFloat(e.target.value); document.getElementById('pSizeL').textContent=Pen.size; };
    function upd(){ document.getElementById('penB').classList.toggle('on',Pen.tool==='pen'); document.getElementById('erasB').classList.toggle('on',Pen.tool==='eraser'); document.querySelectorAll('.pd').forEach((d,i)=>d.classList.toggle('on',colors[i]===Pen.color)); }
    function closeP(){ document.querySelectorAll('.pop').forEach(p=>p.classList.remove('open')); }
    function posBar(bub){ const r=bub.getBoundingClientRect(); const br=bar.getBoundingClientRect(); const isTop=r.top<innerHeight/2; if(isTop){ bar.style.top=(r.bottom+8)+'px'; bar.style.bottom='auto'; } else { bar.style.bottom=(innerHeight-r.top+8)+'px'; bar.style.top='auto'; } bar.style.left=Math.max(8,Math.min(innerWidth-br.width-8,r.left+r.width/2-br.width/2))+'px'; }
    let open=false;
    bubble.onclick=e=>{ e.stopPropagation(); Pen.tool='pen'; upd(); open=!open; bar.classList.toggle('open',open); if(open) posBar(bubble); closeP(); };
    eBubble.onclick=e=>{ e.stopPropagation(); Pen.tool='eraser'; upd(); bar.classList.remove('open'); open=false; closeP(); };
    bar.querySelector('[data-tool="pen"]').onclick=e=>{ e.stopPropagation(); document.getElementById('penPop').classList.toggle('open'); };
    bar.querySelectorAll('[data-pt]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); Pen.penType=b.dataset.pt; Pen.tool='pen'; upd(); });
    bar.querySelector('[data-act="line"]').onclick=e=>{ e.stopPropagation(); Pen.tool='line'; upd(); bar.classList.remove('open'); open=false; };
    bar.querySelector('[data-act="undo"]').onclick=e=>{ e.stopPropagation(); if(Pen.active) undoStrip(Pen.active.dataset.id); };
    bar.querySelector('[data-act="clear"]').onclick=e=>{ e.stopPropagation(); if(Pen.active && confirm('அழிக்கவா?')) clearStrip(Pen.active.dataset.id); };
    const colBtn=bar.querySelector('#colPop').parentElement; colBtn.onclick=e=>{ e.stopPropagation(); document.getElementById('colPop').classList.toggle('open'); };
    sound.onclick=()=>{ fx.init(); sound.textContent='🔊'; };
    document.addEventListener('click',e=>{ if(!bar.contains(e.target)&&!bubble.contains(e.target)&&!eBubble.contains(e.target)){ bar.classList.remove('open'); open=false; closeP(); } });
    function drag(el){ el.addEventListener('pointerdown',e=>{ e.preventDefault(); let sx=e.clientX,sy=e.clientY; const mm=ev=>{ const dx=ev.clientX-sx,dy=ev.clientY-sy; [bubble,eBubble].forEach(b=>{ if(!b) return; b.style.left=(b.offsetLeft+dx)+'px'; b.style.top=(b.offsetTop+dy)+'px'; b.style.bottom=b.style.right='auto'; }); sx=ev.clientX; sy=ev.clientY; if(bar.classList.contains('open')) posBar(bubble); }; const mu=()=>{ document.removeEventListener('pointermove',mm); document.removeEventListener('pointerup',mu); }; document.addEventListener('pointermove',mm); document.addEventListener('pointerup',mu); }); } drag(bubble); drag(eBubble);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',build); else build();
})();
window.onload=async()=>{ await loadSel(); renderChTabs(); switchCh(0); };
window.addEventListener('beforeunload',()=>{ document.querySelectorAll('.ink').forEach(c=>saveInk(c)); saveSel(); });
</script>
</body>
