<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ஹுமாயூன் - தமிழ் பயிற்சி (பாடம் 1)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arima:wght@600;700;800&family=Mukta+Malar:wght@600;700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FFF7ED;
      --card-bg: #FFFFFF;
      --text: #7C2D12;
      --subtext: #9A3412;
      --border: #FED7AA;
      --gold-primary: #EA580C;
      --gold-deep: #C2410C;
      --purple: #7C3AED;
      --purple-dark: #6D28D9;
      --accent: #F59E0B;
      --success: #16A34A;
      --wrong: #DC2626;
      --ruled-guide: #93C5FD;
      --ruled-base: #EF4444;
      --shadow: 0 6px 18px rgba(124, 45, 18, 0.08);
      --font-tamil: 'Mukta Malar', 'Arima', sans-serif;
      --font-ui: 'Nunito', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: var(--font-tamil);
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #0C0603;
      color: var(--text);
    }

    body {
      background: linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 50%, #FEF3C7 100%);
      display: flex;
      flex-direction: column;
      padding: 6px 12px;
      gap: 6px;
      position: relative;
    }

    /* SCREEN DIMMER (PERSISTENT & TOUCH-THROUGH) */
    #screenDimOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      pointer-events: none;
      z-index: 999999;
      display: none;
      transition: opacity 0.2s ease;
    }

    /* TOP HUD */
    .top-hud-bar {
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 50;
    }

    .hud-group-left, .hud-group-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      font-family: var(--font-ui);
    }
    .hud-btn:active { transform: translateY(1px); }

    .mode-switch-segmented {
      display: flex;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid var(--border);
      border-radius: 25px;
      padding: 3px;
      gap: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .mode-tab-pill {
      background: transparent;
      border: none;
      color: var(--subtext);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-tab-pill.active {
      background: linear-gradient(180deg, #EA580C 0%, #C2410C 100%);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(194, 65, 12, 0.4);
    }
    body.test-mode .mode-tab-pill.active {
      background: linear-gradient(180deg, #7C3AED 0%, #6D28D9 100%);
      box-shadow: 0 2px 6px rgba(109, 40, 217, 0.4);
    }

    .pen-toggle-btn {
      background: rgba(255, 255, 255, 0.94);
      border: 2px solid var(--border);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-ui);
    }
    .pen-toggle-btn.pen-active {
      background: #DCFCE7;
      border-color: #16A34A;
      color: #15803D;
    }

    /* MAIN STAGE */
    .master-stage-wrapper {
      flex: 1;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 12px;
      min-height: 0;
      transition: grid-template-columns 0.25s ease;
    }
    .master-stage-wrapper.collapsed {
      grid-template-columns: 68px 1fr;
    }

    /* SIDEBAR */
    .sections-sidebar {
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      box-shadow: var(--shadow);
    }

    .sidebar-collapse-btn {
      align-self: flex-end;
      background: #FFF7ED;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 0.8rem;
      font-weight: 900;
      cursor: pointer;
      color: var(--text);
    }

    .section-tab-item {
      background: #FFF7ED;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      transition: all 0.12s;
    }
    .section-tab-item.active {
      background: #FEF08A;
      border-color: #EAB308;
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.5);
      transform: translateX(2px);
    }
    .master-stage-wrapper.collapsed .section-tab-title {
      display: none;
    }

    /* WORKSPACE */
    .workspace-pane {
      background: rgba(255, 255, 255, 0.95);
      border: 2.5px solid var(--border);
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      min-height: 0;
      box-shadow: var(--shadow);
      position: relative;
    }

    .exercise-scroll-box {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 6px;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }

    /* SCAFFOLDED MEMORIZATION CARDS */
    .memorize-card {
      background: #FFF7ED;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .card-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .word-cue-text {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--text);
    }
    body.test-mode .word-cue-text {
      display: none;
    }

    .audio-play-pill {
      background: #FEF3C7;
      border: 2px solid #FCD34D;
      color: #92400E;
      font-size: 0.95rem;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .audio-play-pill:active { transform: scale(0.96); }

    /* SYLLABLE MEDALLIONS RACK */
    .syllable-rack-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .target-slots-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-height: 48px;
      background: #FFFFFF;
      padding: 6px 12px;
      border-radius: 12px;
      border: 1.5px dashed var(--gold-primary);
    }

    .slot-cell {
      min-width: 48px;
      height: 44px;
      border: 1.5px dashed #CBD5E1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--gold-deep);
    }

    .syllable-dock {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .syllable-token-btn {
      min-width: 48px;
      height: 44px;
      padding: 0 10px;
      border-radius: 12px;
      background: linear-gradient(135deg, #FFFBEB 0%, #FDE68A 100%);
      border: 2px solid var(--gold-primary);
      color: var(--text);
      font-size: 1.25rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: transform 0.1s;
    }
    .syllable-token-btn:active { transform: scale(0.92); }
    .syllable-token-btn.placed {
      background: #E2E8F0;
      border-color: #CBD5E1;
      color: #94A3B8;
      pointer-events: none;
      box-shadow: none;
    }

    /* HARDWARE-ACCELERATED DUAL-LINE INK CANVAS */
    .ink-blank-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ink-canvas-frame {
      position: relative;
      height: 72px;
      background: #FFFFFF;
      border: 2px solid #CBD5E1;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      flex-shrink: 0;
    }

    .dual-lines-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-color: #FFFFFF;
      background-image: repeating-linear-gradient(
        #FFFFFF 0px,
        #FFFFFF 21px,
        var(--ruled-guide) 22px,
        #FFFFFF 23px,
        #FFFFFF 46px,
        var(--ruled-guide) 47px,
        #FFFFFF 48px,
        #FFFFFF 72px
      );
      opacity: 0.85;
      z-index: 1;
    }
    .dual-lines-bg::after {
      content: '';
      position: absolute;
      top: 0;
      left: 18px;
      width: 2px;
      height: 100%;
      background: var(--ruled-base);
      opacity: 0.75;
    }

    .ghost-trace-overlay {
      position: absolute;
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.8rem;
      font-weight: 900;
      color: rgba(148, 163, 184, 0.45);
      pointer-events: none;
      z-index: 2;
      letter-spacing: 2px;
    }
    body.test-mode .ghost-trace-overlay {
      display: none !important;
    }

    .paint-canvas {
      position: absolute;
      inset: 0;
      cursor: crosshair;
      touch-action: none;
      z-index: 5;
    }

    .canvas-clear-icon {
      background: #F8FAFC;
      border: 2px solid #CBD5E1;
      height: 72px;
      padding: 0 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748B;
    }
    .canvas-clear-icon:active { background: #E2E8F0; }

    /* FOOTER BAR */
    .workspace-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 2px dashed var(--border);
      padding-top: 8px;
      flex-shrink: 0;
    }

    .btn-verify-main {
      background: linear-gradient(180deg, #16A34A 0%, #15803D 100%);
      border: 2px solid #86EFAC;
      color: #FFFFFF;
      font-size: 1.15rem;
      font-weight: 900;
      padding: 6px 28px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.35);
    }
    .btn-verify-main:active { transform: scale(0.96); }

    /* SUCCESS TOAST */
    .toast-popup {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #15803D;
      color: #FFFFFF;
      font-size: 1.15rem;
      font-weight: 900;
      padding: 10px 24px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      z-index: 99999;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .toast-popup.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="screenDimOverlay"></div>
  <div class="toast-popup" id="toastNotice">✨ அற்புதம் ஹுமாயூன்! மிகச் சரியாக முடித்தாய்!</div>

  <!-- TOP HUD -->
  <header class="top-hud-bar">
    <div class="hud-group-left">
      <button type="button" class="hud-btn" onclick="goToHub()">🪷 Hub</button>
      <button type="button" class="hud-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
      <button type="button" class="pen-toggle-btn pen-active" id="btnPenOnly" onclick="togglePenOnly()">🖊️ Pen Only</button>
    </div>

    <div class="mode-switch-segmented">
      <button type="button" class="mode-tab-pill active" id="tabLearn" onclick="switchAppMode('learn')">📖 படி &amp; மனனம்</button>
      <button type="button" class="mode-tab-pill" id="tabTest" onclick="switchAppMode('test')">🔒 பயிற்சித் தேர்வு</button>
    </div>

    <div class="hud-group-right">
      <button type="button" class="hud-btn" id="btnDimmer" onclick="toggleDimmer()">💡 Dim Screen</button>
      <button type="button" class="hud-btn" onclick="resetActiveTab()">🔄 Reset</button>
    </div>
  </header>

  <!-- MASTER VIEW -->
  <div class="master-stage-wrapper" id="masterStage">
    
    <!-- RETRACTABLE SECTIONS SIDEBAR -->
    <aside class="sections-sidebar">
      <button type="button" class="sidebar-collapse-btn" onclick="toggleSidebar()">◀</button>
      <button type="button" class="section-tab-item active" onclick="selectSection(0)">
        <span>📝</span><span class="section-tab-title">1. சொல்வதை எழுதுக</span>
      </button>
      <button type="button" class="section-tab-item" onclick="selectSection(1)">
        <span>❓</span><span class="section-tab-title">2. வினா விடை</span>
      </button>
      <button type="button" class="section-tab-item" onclick="selectSection(2)">
        <span>🧩</span><span class="section-tab-title">3. பொருத்துக</span>
      </button>
      <button type="button" class="section-tab-item" onclick="selectSection(3)">
        <span>🎯</span><span class="section-tab-title">4. சரியான விடை</span>
      </button>
      <button type="button" class="section-tab-item" onclick="selectSection(4)">
        <span>🎨</span><span class="section-tab-title">5. எழுத்துச் சேர்க்கை</span>
      </button>
      <button type="button" class="section-tab-item" onclick="selectSection(5)">
        <span>🔍</span><span class="section-tab-title">6. ஒலி வேறுபாடு</span>
      </button>
    </aside>

    <!-- WORKSPACE -->
    <main class="workspace-pane">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="sectionHeading" style="font-size:1.3rem; font-weight:900; color:var(--text);">சொல்வதை எழுதுக</h2>
        <span id="instructionBadge" style="font-size:0.95rem; font-weight:800; color:var(--subtext);">எழுத்துகளை வரிசைப்படுத்தி எழுதுக!</span>
      </div>

      <div class="exercise-scroll-box" id="exerciseContainer"></div>

      <div class="workspace-footer">
        <span style="font-size:0.95rem; font-weight:800; color:var(--subtext);" id="footerCounter">7 சொற்கள்</span>
        <button type="button" class="btn-verify-main" onclick="verifyCurrentSection()">சரிபார் ✨</button>
      </div>
    </main>
  </div>

  <script>
    /* 1. AUDIO ENGINE */
    function speakTamil(txt) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = 'ta-IN';
      u.rate = 0.80;
      window.speechSynthesis.speak(u);
    }

    function playSyllableChant(word, syllables) {
      speakTamil(word);
      let step = 0;
      function nextSyllable() {
        if (step < syllables.length) {
          setTimeout(() => {
            speakTamil(syllables[step]);
            step++;
            nextSyllable();
          }, 650);
        }
      }
      setTimeout(nextSyllable, 700);
    }

    /* 2. SCREEN DIMMER (SAVED IN LOCALSTORAGE) */
    let isDimmed = localStorage.getItem('humayun_dim_state') === 'true';
    function applyDimState() {
      const el = document.getElementById('screenDimOverlay');
      const btn = document.getElementById('btnDimmer');
      el.style.display = isDimmed ? 'block' : 'none';
      btn.textContent = isDimmed ? '☀️ Bright' : '💡 Dim Screen';
    }
    function toggleDimmer() {
      isDimmed = !isDimmed;
      localStorage.setItem('humayun_dim_state', isDimmed);
      applyDimState();
    }

    /* 3. HARDWARE PALM REJECTION & FULLSCREEN */
    let penOnlyMode = true;
    function togglePenOnly() {
      penOnlyMode = !penOnlyMode;
      const btn = document.getElementById('btnPenOnly');
      btn.className = `pen-toggle-btn ${penOnlyMode ? 'pen-active' : ''}`;
      btn.textContent = penOnlyMode ? '🖊️ Pen Only' : '👆 Any Touch';
    }

    function toggleFullscreen() {
      const el = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      }
    }

    function toggleSidebar() {
      const stage = document.getElementById('masterStage');
      const btn = document.querySelector('.sidebar-collapse-btn');
      const isCollapsed = stage.classList.toggle('collapsed');
      btn.textContent = isCollapsed ? '▶' : '◀';
    }

    function goToHub() {
      saveAllInk();
      if (window.parent && window.parent !== window) {
        window.parent.postMessage("close-lesson-to-hub", "*");
      } else {
        window.location.href = "index.html";
      }
    }

    /* 4. EXACT CURRICULUM DATA (NOTEBOOK-ALIGNED) */
    const DICTATION_WORDS = [
      { id: 'd1', word: 'விலங்குகள்', syllables: ['வி', 'லங்', 'கு', 'கள்'] },
      { id: 'd2', word: 'ஒற்றுமை', syllables: ['ஒற்', 'று', 'மை'] },
      { id: 'd3', word: 'மரம்', syllables: ['ம', 'ரம்'] }, // Corrected from மாதம்
      { id: 'd4', word: 'உயர்ந்தவர்', syllables: ['உ', 'யர்ந்', 'த', 'வர்'] },
      { id: 'd5', word: 'வளர்ச்சி', syllables: ['வ', 'ளர்ச்', 'சி'] }, // Corrected from வலிமை[cite: 6, 8]
      { id: 'd6', word: 'ஒப்பந்தம்', syllables: ['ஒப்', 'பந்', 'தம்'] },
      { id: 'd7', word: 'பாலைவனம்', syllables: ['பா', 'லை', 'வ', 'னம்'] }
    ];

    const QA_SENTENCE = {
      q: "மரங்கள் எவற்றுடன் சண்டையிட்டன?",
      a: "மரங்கள் விலங்குகளுடன் சண்டையிட்டன.",
      words: [
        { id: 'qa1', word: 'மரங்கள்', syllables: ['ம', 'ரங்', 'கள்'] },
        { id: 'qa2', word: 'விலங்குகளுடன்', syllables: ['வி', 'லங்', 'கு', 'க', 'ளு', 'டன்'] },
        { id: 'qa3', word: 'சண்டையிட்டன.', syllables: ['சண்', 'டை', 'யிட்', 'ட', 'ன.'] }
      ]
    };

    let activeSectionIdx = 0;
    let appMode = 'learn';
    let assembledState = {};

    /* 5. FAST INK PERSISTENCE ENGINE (DEFERRED BASE64, RETINA-AWARE) */
    const inkMemoryCache = {};

    function getInkKey(id) {
      return `v3_humayun_ink::${appMode}::${id}`;
    }

    function setupCanvases() {
      const dpr = window.devicePixelRatio || 1;
      const canvasList = document.querySelectorAll('.paint-canvas');

      canvasList.forEach(c => {
        const id = c.getAttribute('data-canvas-id');
        const logicalW = parseInt(c.getAttribute('data-w'), 10) || 340;
        const logicalH = 72;

        c.width = Math.round(logicalW * dpr);
        c.height = Math.round(logicalH * dpr);

        const ctx = c.getContext('2d', { desynchronized: true });
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, logicalW, logicalH);

        const storageKey = getInkKey(id);
        const cached = inkMemoryCache[storageKey] || localStorage.getItem(storageKey);

        if (cached) {
          inkMemoryCache[storageKey] = cached;
          const img = new Image();
          img.onload = () => {
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, logicalW, logicalH);
            ctx.drawImage(img, 0, 0, logicalW, logicalH);
          };
          img.src = cached;
        }

        let isDrawing = false;
        let lastX = 0, lastY = 0;

        c.onpointerdown = (e) => {
          if (penOnlyMode && e.pointerType !== 'pen') return;
          isDrawing = true;
          try { c.setPointerCapture(e.pointerId); } catch (_) {}
          const rect = c.getBoundingClientRect();
          lastX = e.clientX - rect.left;
          lastY = e.clientY - rect.top;
          e.preventDefault();
        };

        c.onpointermove = (e) => {
          if (!isDrawing) return;
          if (penOnlyMode && e.pointerType !== 'pen') return;

          const rect = c.getBoundingClientRect();
          const currX = e.clientX - rect.left;
          const currY = e.clientY - rect.top;

          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(currX, currY);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#1E3A8A';

          const pressure = (e.pressure && e.pressure > 0) ? e.pressure : 0.5;
          ctx.lineWidth = 2.0 * (pressure * 1.4 + 0.35); // 2.0px fountain calibrated
          ctx.stroke();

          lastX = currX;
          lastY = currY;
          e.preventDefault();
        };

        const endStroke = () => {
          if (isDrawing) {
            isDrawing = false;
            // Defer Base64 compression to prevent UI micro-stutters
            requestIdleCallback ? requestIdleCallback(() => saveSingleCanvas(c, id)) : setTimeout(() => saveSingleCanvas(c, id), 20);
          }
        };

        c.onpointerup = endStroke;
        c.onpointercancel = endStroke;
      });
    }

    function saveSingleCanvas(c, id) {
      try {
        const data = c.toDataURL('image/png');
        const key = getInkKey(id);
        inkMemoryCache[key] = data;
        localStorage.setItem(key, data);
      } catch (e) {}
    }

    function saveAllInk() {
      document.querySelectorAll('.paint-canvas').forEach(c => {
        const id = c.getAttribute('data-canvas-id');
        saveSingleCanvas(c, id);
      });
    }

    function clearCanvas(id) {
      const c = document.querySelector(`.paint-canvas[data-canvas-id="${id}"]`);
      if (c) {
        const ctx = c.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, c.width / dpr, c.height / dpr);
        const key = getInkKey(id);
        delete inkMemoryCache[key];
        localStorage.removeItem(key);
      }
    }

    /* 6. SECTION RENDERERS */
    function selectSection(idx) {
      saveAllInk();
      activeSectionIdx = idx;
      document.querySelectorAll('.section-tab-item').forEach((b, i) => b.classList.toggle('active', i === idx));
      renderCurrentSection();
    }

    function switchAppMode(m) {
      saveAllInk();
      appMode = m;
      document.body.className = (m === 'test') ? 'test-mode' : '';
      document.getElementById('tabLearn').classList.toggle('active', m === 'learn');
      document.getElementById('tabTest').classList.toggle('active', m === 'test');
      renderCurrentSection();
    }

    function renderCurrentSection() {
      const container = document.getElementById('exerciseContainer');
      container.innerHTML = '';

      if (activeSectionIdx === 0) {
        document.getElementById('sectionHeading').textContent = "1. சொல்வதை எழுதுக (Classwork)";
        document.getElementById('instructionBadge').textContent = "ஒலியைக்கேட்டு, எழுத்துகளை அடுக்கி, அழகாக எழுதுக!";
        document.getElementById('footerCounter').textContent = "7 சொற்கள்";

        DICTATION_WORDS.forEach((item, idx) => {
          const placed = assembledState[item.id] || [];
          const card = document.createElement('div');
          card.className = 'memorize-card';

          card.innerHTML = `
            <div class="card-top-row">
              <span class="word-cue-text">${idx + 1}. ${item.word}</span>
              <button type="button" class="audio-play-pill" onclick="playSyllableChant('${item.word}', ${JSON.stringify(item.syllables)})">
                🔊 சொல் &amp; எழுத்துகள்
              </button>
            </div>

            <div class="syllable-rack-container">
              <div class="target-slots-row" id="rack_${item.id}">
                ${item.syllables.map((_, sIdx) => `<div class="slot-cell">${placed[sIdx] || '#'}</div>`).join('')}
              </div>
              <div class="syllable-dock">
                ${[...item.syllables].sort().map(syl => {
                  const isPlaced = placed.includes(syl);
                  return `<button type="button" class="syllable-token-btn ${isPlaced ? 'placed' : ''}" onclick="placeSyllable('${item.id}', '${syl}')">${syl}</button>`;
                }).join('')}
                <button type="button" class="hud-btn" style="padding:4px 10px; font-size:0.8rem;" onclick="resetSyllables('${item.id}')">⌫ Reset</button>
              </div>
            </div>

            <div class="ink-blank-row">
              <div class="ink-canvas-frame" style="width:380px;">
                <div class="dual-lines-bg"></div>
                <div class="ghost-trace-overlay">${item.word}</div>
                <canvas class="paint-canvas" data-canvas-id="${item.id}" data-w="380"></canvas>
              </div>
              <button type="button" class="canvas-clear-icon" onclick="clearCanvas('${item.id}')">🧹</button>
            </div>
          `;
          container.appendChild(card);
        });

      } else if (activeSectionIdx === 1) {
        document.getElementById('sectionHeading').textContent = "2. வினா - விடை (Notebook Sentence)";
        document.getElementById('instructionBadge').textContent = "முழு வாக்கியத்தை நினைவுகூர்ந்து எழுதுக!";
        document.getElementById('footerCounter').textContent = "1 வினா விடை";

        const card = document.createElement('div');
        card.className = 'memorize-card';
        card.innerHTML = `
          <div style="font-size:1.25rem; font-weight:900; color:var(--text); display:flex; justify-content:space-between; align-items:center;">
            <span>வினா: ${QA_SENTENCE.q}</span>
            <button type="button" class="audio-play-pill" onclick="speakTamil('${QA_SENTENCE.q}')">🔊 வினா</button>
          </div>
          <div style="font-size:1.15rem; font-weight:800; color:var(--success); margin:4px 0;">
            <span class="word-cue-text">விடை: ${QA_SENTENCE.a}</span>
          </div>

          <div style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">
            ${QA_SENTENCE.words.map(w => `
              <div style="display:flex; align-items:center; justify-content:space-between; background:#FFF; padding:8px 12px; border-radius:12px; border:1.5px solid var(--border);">
                <span style="font-size:1.2rem; font-weight:900; color:var(--text);">${w.word}</span>
                <button type="button" class="audio-play-pill" onclick="playSyllableChant('${w.word}',${JSON.stringify(w.syllables)})">🔊 ஒலி</button>
                <div class="ink-canvas-frame" style="width:340px;">
                  <div class="dual-lines-bg"></div>
                  <div class="ghost-trace-overlay">${w.word}</div>
                  <canvas class="paint-canvas" data-canvas-id="${w.id}" data-w="340"></canvas>
                </div>
                <button type="button" class="canvas-clear-icon" onclick="clearCanvas('${w.id}')">🧹</button>
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(card);

      } else {
        // Simple view for matching, mcq, letters, contrast
        renderQuickExercise(activeSectionIdx, container);
      }

      setTimeout(setupCanvases, 40);
    }

    function placeSyllable(wordId, syl) {
      if (!assembledState[wordId]) assembledState[wordId] = [];
      const item = DICTATION_WORDS.find(d => d.id === wordId);
      if (assembledState[wordId].length < item.syllables.length) {
        speakTamil(syl);
        assembledState[wordId].push(syl);
        renderCurrentSection();
      }
    }

    function resetSyllables(wordId) {
      assembledState[wordId] = [];
      renderCurrentSection();
    }

    function renderQuickExercise(idx, container) {
      const card = document.createElement('div');
      card.className = 'memorize-card';

      if (idx === 2) {
        document.getElementById('sectionHeading').textContent = "3. பேச்சு வழக்கு ➔ எழுத்து வழக்கு";
        const pairs = [
          ['வேகல', 'வேகவில்லை'], ['பெய்ஞ்சுது', 'பெய்தது'],
          ['எரியல', 'எரியவில்லை'], ['புல்லு', 'புல்'],
          ['பாலு', 'பால்'], ['புத்து', 'புற்று'],
          ['தின்னேன்', 'தின்றேன்'], ['கடிச்சது', 'கடித்தது']
        ];
        card.innerHTML = `
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            ${pairs.map(([col1, col2]) => `
              <div style="background:#FFF; padding:10px 14px; border-radius:12px; border:1.5px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:1.15rem; font-weight:800; cursor:pointer;" onclick="speakTamil('${col1}')">${col1}</span>
                <span>➔</span>
                <span style="font-size:1.15rem; font-weight:900; color:var(--success); cursor:pointer;" onclick="speakTamil('${col2}')">${col2}</span>
              </div>
            `).join('')}
          </div>
        `;
      } else if (idx === 3) {
        document.getElementById('sectionHeading').textContent = "4. சரியான விடையைத் தெரிவு செய்வேன்";
        card.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:12px;">
            <div style="font-size:1.15rem; font-weight:800;">1. வேட்டை + ஆட = <b>வேட்டையாட</b></div>
            <div style="font-size:1.15rem; font-weight:800;">2. உயர்வு எதிர்ச்சொல் = <b>தாழ்வு</b></div>
            <div style="font-size:1.15rem; font-weight:800;">3. 'ஏற்றுக்கொள்கிறோம்' என்றது = <b>பறவைகள்</b></div>
            <div style="font-size:1.15rem; font-weight:800;">4. 'எந்த உணவும் கிடைக்கவில்லை' என்றது = <b>சிங்கம்</b></div>
          </div>
        `;
      } else if (idx === 4) {
        document.getElementById('sectionHeading').textContent = "5. எழுத்துக்களைச் சேர்ப்போம்";
        card.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:12px;">
            <div style="font-size:1.2rem; font-weight:800;">• பள்ளம் + அரும்பு + பார்த்திபன் ➔ <b>பருத்தி</b></div>
            <div style="font-size:1.2rem; font-weight:800;">• பருந்து + வட்டம் + வண்டு ➔ <b>பட்டு</b></div>
            <div style="font-size:1.2rem; font-weight:800;">• கம்பு + பம்பரம் + தக்காளி ➔ <b>கம்பளி</b></div>
          </div>
        `;
      } else if (idx === 5) {
        document.getElementById('sectionHeading').textContent = "6. ஒலி வேறுபாடு (உரிய சொல்)";
        card.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:12px;">
            <div style="font-size:1.15rem; font-weight:800;">• <b>மழை</b> பெய்தது | <b>மலை</b> உயரமானது</div>
            <div style="font-size:1.15rem; font-weight:800;">• மரத்தை அறுப்பது <b>வாள்</b> | மாட்டுக்கு இருப்பது <b>வால்</b></div>
            <div style="font-size:1.15rem; font-weight:800;">• மரத்தில் காய்ப்பது <b>புளி</b> | காட்டில் வாழ்வது <b>புலி</b></div>
          </div>
        `;
      }
      container.appendChild(card);
    }

    function verifyCurrentSection() {
      saveAllInk();
      speakTamil("அற்புதம் ஹுமாயூன்!");
      const toast = document.getElementById('toastNotice');
      toast.classList.add('visible');
      setTimeout(() => toast.classList.remove('visible'), 2400);
    }

    function resetActiveTab() {
      if (activeSectionIdx === 0) {
        DICTATION_WORDS.forEach(d => {
          assembledState[d.id] = [];
          clearCanvas(d.id);
        });
      } else if (activeSectionIdx === 1) {
        QA_SENTENCE.words.forEach(w => clearCanvas(w.id));
      }
      renderCurrentSection();
    }

    window.onload = () => {
      applyDimState();
      selectSection(0);
    };

    window.addEventListener('beforeunload', saveAllInk);
    window.addEventListener('pagehide', saveAllInk);
  </script>
</body>
</html>
