<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="application-name" content="Zaina's English Trail" />
  <meta name="apple-mobile-web-app-title" content="Zaina's English Trail" />
  <meta name="theme-color" content="#2563EB" />
  <title>Zaina Maryam's English Trail</title>

  <!-- Inline Web App Manifest Data URI for 1-Tap Home Screen Install -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"Zaina Maryam English Trail","short_name":"Zaina English","start_url":".","display":"standalone","background_color":"#F0F6FC","theme_color":"#2563EB","orientation":"landscape"}' />

  <!-- Google Nunito Font (Clean, bold, non-cursive textbook typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F0F6FC;
      --card-bg: #FFFFFF;
      --text: #172B38;
      --subtext: #4A6375;
      --border: #CBDDE9;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --purple: #7C3AED;
      --purple-hover: #6D28D9;
      --reward: #FFB703;
      --success: #059669;
      --hint-bg: #FFF8EB;
      --hint-border: #F6D896;
      --ruled-line: #E1EAF2;
      --ruled-margin: #F8B4B4;
      --toolbar-bg: #F3F7FA;
      --shadow: 0 4px 14px rgba(23, 43, 56, 0.07);
      --font: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body.dark-mode {
      --bg: #0B132B;
      --card-bg: #1C2541;
      --text: #EDF4F9;
      --subtext: #A0B2C6;
      --border: #334460;
      --primary: #60A5FA;
      --primary-hover: #3B82F6;
      --purple: #A78BFA;
      --purple-hover: #8B5CF6;
      --reward: #FBBF24;
      --success: #34D399;
      --hint-bg: #172A45;
      --hint-border: #2563EB;
      --ruled-line: #293D5E;
      --ruled-margin: #EF4444;
      --toolbar-bg: #111C38;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: var(--font) !important;
      letter-spacing: 0.2px;
    }

    /* Tablet Base Anchor: Enlarge text proportionally across tablet viewports */
    html {
      font-size: 17px;
      height: 100%;
      overflow: hidden;
    }

    @media (min-width: 900px) and (orientation: landscape) {
      html {
        font-size: 18px;
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      user-select: none;
      -webkit-user-select: none;
      padding: 8px 12px;
    }

    #screenDimOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      pointer-events: none;
      z-index: 99999;
    }

    .app-wrapper {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 1450px;
      margin: 0 auto;
      width: 100%;
      gap: 8px;
      padding-bottom: max(4px, env(safe-area-inset-bottom));
    }

    /* === HEADER === */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      height: 44px;
    }

    .title-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .title-banner h1 {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-tag {
      background: #FEF3C7;
      color: #92400E;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1.5px solid #FCD34D;
    }

    .header-center {
      display: flex;
      gap: 6px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 14px;
      border: 2px solid var(--border);
    }

    .mode-btn {
      border: none;
      outline: none;
      cursor: pointer;
      font-weight: 800;
      font-size: 0.88rem;
      padding: 6px 14px;
      border-radius: 10px;
      color: var(--subtext);
      background: transparent;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .mode-btn.active-practice {
      background: var(--primary);
      color: #FFF;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }
    .mode-btn.active-write {
      background: var(--purple);
      color: #FFF;
      box-shadow: 0 2px 6px rgba(124, 58, 237, 0.25);
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .action-btn {
      border: 2px solid var(--border);
      outline: none;
      cursor: pointer;
      font-weight: 800;
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--card-bg);
      color: var(--text);
      height: 38px;
      white-space: nowrap;
    }
    .action-btn:active { transform: translateY(1px); }

    /* === ROW 2: SECTION BAR & PROGRESS === */
    .section-bar-wrap {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .section-nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 6px 8px;
      scrollbar-width: none;
    }
    .section-nav::-webkit-scrollbar { display: none; }

    .nav-tab {
      background: transparent;
      border: 2px solid transparent;
      color: var(--subtext);
      padding: 6px 14px;
      white-space: nowrap;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.1s;
    }
    .nav-tab.active {
      background: var(--primary);
      color: #FFFFFF;
    }
    body.write-mode .nav-tab.active {
      background: var(--purple);
    }

    .thin-progress-track {
      height: 5px;
      background: var(--border);
      width: 100%;
    }
    .thin-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10B981, #2563EB);
      transition: width 0.25s ease;
    }
    body.write-mode .thin-progress-fill {
      background: linear-gradient(90deg, #F59E0B, #8B5CF6);
    }

    /* === WORKSPACE LAYOUTS === */
    .main-container {
      display: flex;
      gap: 10px;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    /* Clean Card Layout (Reading in Practice Mode) */
    .main-container.layout-focus {
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .main-container.layout-focus .prompt-card-pane {
      width: 100%;
      max-width: 960px;
      height: 100%;
    }
    .main-container.layout-focus .canvas-card-pane {
      display: none !important;
    }

    /* Split View (MCQs & Verbs in Practice Mode) */
    .main-container.layout-split {
      flex-direction: row;
    }
    .main-container.layout-split .prompt-card-pane {
      flex: 0 0 46%;
      height: 100%;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .main-container.layout-split .canvas-card-pane {
      flex: 1;
      height: 100%;
      min-width: 0;
      display: flex;
    }

    /* Stacked Full-Width View (Meanings, Past Tense, and All Write Mode Cards) */
    .main-container.layout-full {
      flex-direction: column;
    }
    .main-container.layout-full .prompt-card-pane {
      flex: 0 0 auto;
      width: 100%;
      min-height: 0;
    }
    .main-container.layout-full .canvas-card-pane {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
    }

    /* Prompt Pane Card */
    .prompt-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 2px solid var(--border);
      padding: 14px 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      gap: 8px;
      overflow: hidden;
    }
    .main-container.layout-full .prompt-card {
      height: auto;
      padding: 12px 18px;
    }

    .prompt-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Large, Crisp Question Title */
    .word-prompt-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.4;
      flex: 1;
    }
    .word-prompt-title u {
      text-decoration-color: var(--reward);
      text-decoration-thickness: 4px;
      text-underline-offset: 5px;
    }

    .btn-speak {
      background: #FEF08A;
      color: #713F12;
      border: 2px solid #FACC15;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      height: 38px;
    }
    .btn-speak.playing {
      background: #FACC15;
      color: #361B03;
    }

    /* Rule/Clue Box */
    .hint-bubble {
      background: var(--hint-bg);
      border-left: 5px solid var(--reward);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.45;
      border: 1.5px solid var(--hint-border);
      border-left-width: 5px;
      flex-shrink: 0;
    }
    .hint-bubble b {
      font-weight: 800;
      color: #B45309;
    }

    /* Secret Peek Parent Interface */
    .peek-bar-container {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #F5F3FF;
      border: 2px solid #DDD6FE;
      padding: 8px 12px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    body.write-mode .peek-bar-container {
      display: flex;
    }

    .peek-text {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--purple);
    }

    .btn-peek-lock {
      background: var(--card-bg);
      border: 2px solid #C4B5FD;
      color: var(--purple);
      font-weight: 800;
      font-size: 0.88rem;
      padding: 6px 14px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .btn-peek-lock:active { transform: translateY(1px); }

    .unlocked-peek-content {
      display: none;
      background: #ECFDF5;
      border: 2px solid #A7F3D0;
      border-left: 5px solid var(--success);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1.05rem;
      color: #065F46;
      line-height: 1.4;
      flex-shrink: 0;
      font-weight: 700;
    }

    .options-scroll {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 6px;
    }

    /* Large Tap-Target Multiple-Choice Buttons */
    .opt-choice-btn {
      text-align: left;
      background: var(--toolbar-bg);
      border: 2px solid var(--border);
      padding: 12px 16px;
      border-radius: 12px;
      color: var(--text);
      font-weight: 700;
      font-size: 1.1rem;
      line-height: 1.35;
      cursor: pointer;
      transition: all 0.1s;
    }
    .opt-choice-btn:active { transform: translateY(1px); }
    .opt-choice-btn.selected {
      border-color: var(--primary);
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 3px 0 var(--primary-hover);
    }

    /* Canvas Card Pane */
    .canvas-card-pane {
      background: var(--card-bg);
      border-radius: 16px;
      border: 2px solid var(--border);
      padding: 10px 12px;
      box-shadow: var(--shadow);
      flex-direction: column;
      overflow: hidden;
    }

    .pad-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .tool-cluster {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .tool-btn {
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 10px;
      background: var(--toolbar-bg);
      color: var(--text);
      border: 2px solid var(--border);
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 36px;
    }
    .tool-btn:active { transform: translateY(1px); }
    .tool-btn.active {
      background: var(--primary);
      color: #FFF;
      border-color: var(--primary);
    }
    body.write-mode .tool-btn.active {
      background: var(--purple);
      border-color: var(--purple);
    }

    .canvas-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--border);
      background-color: var(--card-bg);
    }

    .ruled-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-color: var(--card-bg);
      background-image: repeating-linear-gradient(
        var(--card-bg) 0px,
        var(--card-bg) 35px,
        var(--ruled-line) 36px
      );
      z-index: 1;
    }

    .ruled-layer::after {
      content: '';
      position: absolute;
      top: 0;
      left: 42px;
      width: 2px;
      height: 100%;
      background: var(--ruled-margin);
    }

    #scratchCanvas {
      position: absolute;
      inset: 0;
      cursor: crosshair;
      touch-action: none;
      z-index: 2;
    }

    /* === BOTTOM BAR === */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      padding: 4px 2px 0 2px;
    }

    .nav-btn {
      border: none;
      border-radius: 12px;
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      color: #FFF;
      background: var(--primary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      transition: all 0.1s;
    }
    .nav-btn:active { transform: translateY(1px); }
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }
    body.write-mode .nav-btn {
      background: var(--purple);
    }

    .card-indicator {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--subtext);
    }

    /* PIN Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100000;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 22px;
      padding: 20px 24px;
      width: 90%;
      max-width: 340px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.25);
      text-align: center;
    }
    .modal-box h3 {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 4px;
    }
    .modal-box p {
      font-size: 0.88rem;
      color: var(--subtext);
      margin-bottom: 12px;
    }

    .pin-display {
      font-size: 1.6rem;
      letter-spacing: 6px;
      padding: 10px;
      background: var(--toolbar-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      margin-bottom: 14px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .pin-num-btn {
      background: var(--toolbar-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px 0;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      color: var(--text);
    }
    .pin-num-btn:active { transform: translateY(2px); }

    .modal-action-row {
      display: flex;
      gap: 8px;
    }
    .modal-action-btn {
      flex: 1;
      padding: 10px 0;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
    }
    .modal-cancel-btn {
      background: var(--toolbar-bg);
      color: var(--text);
      border: 2px solid var(--border);
    }
    .modal-submit-btn {
      background: var(--purple);
      color: #FFF;
    }

    .orientation-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 999999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      padding: 24px;
      text-align: center;
    }
    .orientation-warning .icon { font-size: 3rem; animation: rotatePhone 2s infinite; }
    @keyframes rotatePhone { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
    @media (orientation: portrait) {
      .orientation-warning { display: flex; }
    }
  </style>
</head>
<body>

  <div id="screenDimOverlay"></div>

  <div class="orientation-warning">
    <div class="icon">📱</div>
    <h2>Please rotate your tablet</h2>
    <p>Zaina's English Trail is optimized for landscape mode.</p>
  </div>

  <div class="app-wrapper">
    <!-- ROW 1: HEADER -->
    <header>
      <div class="title-banner">
        <span style="font-size: 1.4rem;">🏔️</span>
        <h1>Zaina's English Trail <span class="user-tag">Grade 5</span></h1>
      </div>

      <div class="header-center">
        <button class="mode-btn active-practice" id="modePracticeBtn" onclick="setAppMode('practice')">📖 Practice (Guided)</button>
        <button class="mode-btn" id="modeWriteBtn" onclick="setAppMode('write')">✍️ Write (Memory Recall)</button>
      </div>

      <div class="header-actions">
        <button class="action-btn" id="btnFullscreen" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        <button class="action-btn" id="toggleDimBtn" onclick="toggleScreenDim()">💡 Dim</button>
        <button class="action-btn" id="toggleThemeBtn" onclick="toggleDarkMode()">🌙 Theme</button>
      </div>
    </header>

    <!-- ROW 2: SECTIONS + SLIM PROGRESS STRIP -->
    <div class="section-bar-wrap">
      <div class="section-nav" id="sectionTabs"></div>
      <div class="thin-progress-track">
        <div class="thin-progress-fill" id="thinProgressFill"></div>
      </div>
    </div>

    <!-- MAIN ADAPTIVE WORKSPACE -->
    <main class="main-container layout-full" id="mainContainer">
      <!-- PROMPT PANE -->
      <div class="prompt-card-pane">
        <div class="prompt-card">
          <div class="prompt-top-row">
            <div class="word-prompt-title" id="promptText">Loading word...</div>
            <button class="btn-speak" id="btnSpeak" onclick="readAloud()">🔊 Read</button>
          </div>

          <!-- Practice Mode Clue Bubble -->
          <div class="hint-bubble" id="hintBubble">Hint appears here</div>

          <!-- Write Mode: Secret Peek Bar -->
          <div class="peek-bar-container" id="peekBar">
            <span class="peek-text">✍️ Write your answer from memory on the ruled sheet below!</span>
            <button type="button" class="btn-peek-lock" onclick="openPeekPinModal()">🔒 Peek Answer (Parent PIN)</button>
          </div>

          <!-- Unlocked Hint Reveal -->
          <div class="unlocked-peek-content" id="unlockedPeekBox"></div>

          <!-- Multiple-Choice Selection Container (Practice Only) -->
          <div class="options-scroll" id="optionsScroll" style="display: none;"></div>
        </div>
      </div>

      <!-- CANVAS PANE -->
      <div class="canvas-card-pane" id="canvasCardPane">
        <div class="pad-toolbar">
          <div class="tool-cluster">
            <button class="tool-btn active" id="penTool" onclick="setTool('pen')">✏️ Pen</button>
            <button class="tool-btn" id="eraserTool" onclick="setTool('eraser')">🧹 Eraser</button>
            <button class="tool-btn" onclick="undoCanvasStroke()">↩️ Undo</button>
            <button class="tool-btn" onclick="clearCurrentCanvas()">🗑️ Clear</button>
          </div>
          <div class="tool-cluster">
            <button class="tool-btn active" id="btnPalmRejection" onclick="toggleInputMode()">🖊️ Pen Only</button>
            <button class="tool-btn" id="sizeThin" onclick="setStrokeWidth(2)">Thin</button>
            <button class="tool-btn active" id="sizeMed" onclick="setStrokeWidth(4)">Med</button>
            <button class="tool-btn" id="sizeThick" onclick="setStrokeWidth(7)">Thick</button>
          </div>
        </div>

        <div class="canvas-wrapper" id="canvasWrapper">
          <div class="ruled-layer"></div>
          <canvas id="scratchCanvas"></canvas>
        </div>
      </div>
    </main>

    <!-- ROW 3: BOTTOM DOCKED NAVIGATION -->
    <div class="bottom-bar">
      <button class="nav-btn" id="prevBtn" onclick="navigateCard(-1)">◀ Back</button>

        { id: "g_b4", word: "say", q: "The housekeeper ______________ (say) that Heidi could not read.", writePrompt: "Complete with the past tense of 'say': The housekeeper ______________ that Heidi could not read.", rule: "Recall the irregular past tense of 'say'.", answer: "said" },
        { id: "g_b5", word: "sleep", q: "The shepherd ______________ (sleep) next to his sheep.", writePrompt: "Complete with the past tense of 'sleep': The shepherd ______________ next to his sheep.", rule: "Recall the irregular past tense of 'sleep'.", answer: "slept" }

        { id: "g_c2", q: "Why is 'will' used? 'The ship will reach Aden tomorrow evening.'", writePrompt: "'The ship will reach Aden tomorrow evening.' Write why 'will' is used here:", rule: "Determine if this describes a timetable, a certainty, or a promise.", options: ["Certain fact", "Guess", "Promise", "Quick decision right now"], answer: "Certain fact" },
        { id: "g_c3", q: "Why is 'will' used? 'Study hard. I will give you any book you want to read.'", writePrompt: "'Study hard. I will give you any book you want to read.' Write why 'will' is used here:", rule: "Consider what kind of personal commitment the speaker is making.", options: ["Promise", "Certain fact", "Guess", "Quick decision right now"], answer: "Promise" },
        { id: "g_c4", q: "Why is 'will' used? 'The spaceship will send pictures of the moon once it reaches its orbit.'", writePrompt: "'The spaceship will send pictures of the moon once it reaches its orbit.' Write why 'will' is used here:", rule: "Evaluate whether this is a planned scientific certainty or sudden choice.", options: ["Certain fact", "Guess", "Promise", "Quick decision right now"], answer: "Certain fact" },

        { id: "g_c6", q: "Why is 'will' used? 'Oh Lord! There's been a robbery in the shop. I'll call the police.'", writePrompt: "'Oh Lord! There's been a robbery in the shop. I'll call the police.' Write why 'will' is used here:", rule: "Identify the reaction to an unexpected emergency.", options: ["Quick decision right now", "Certain fact", "Guess", "Promise"], answer: "Quick decision right now" }
      ],
      verbs: [

        { id: "g_d2", q: "'She does not like to play badminton.' Which is the HELPING verb?", writePrompt: "In the sentence 'She does not like to play badminton.', identify and write down the HELPING verb:", rule: "Identify the auxiliary verb that helps specify the tense/negation.", options: ["does", "like", "play", "not"], answer: "does (helping verb)" },
        { id: "g_d3", q: "'She is preparing dinner for us.' Which is the MAIN action verb?", writePrompt: "In the sentence 'She is preparing dinner for us.', identify and write down the MAIN action verb:", rule: "Separate the auxiliary verb from the core activity being performed.", options: ["preparing", "is", "dinner", "for"], answer: "preparing (main verb); is (helping verb)" },
        { id: "g_d4", q: "'They did not meet the minister.' Which is the HELPING verb?", writePrompt: "In the sentence 'They did not meet the minister.', identify and write down the HELPING verb:", rule: "Look for the auxiliary that forms the past negative phrase.", options: ["did", "meet", "minister", "not"], answer: "did (helping verb)" },
        { id: "g_d5", q: "'Did he finish his dinner?' Which is the HELPING verb?", writePrompt: "In the sentence 'Did he finish his dinner?', identify and write down the HELPING verb:", rule: "Look for the fronted auxiliary verb creating the question form.", options: ["Did", "finish", "dinner", "he"], answer: "Did (helping verb)" },
        { id: "g_d6", q: "'I have been listening to your speech.' Which is the MAIN action verb?", writePrompt: "In the sentence 'I have been listening to your speech.', identify and write down the MAIN action verb:", rule: "Find the real ongoing action verb, not the auxiliary helping words.", options: ["listening", "have", "been", "speech"], answer: "listening (main verb); have, been (helping verbs)" }
      ],
      pairs: [
        { id: "h1", q: "The hotel has a ____________ of rooms for very important guests.", writePrompt: "Fill in the blank with the correct word from memory: The hotel has a ____________ of rooms for very important guests.", rule: "Choose between connected luxury rooms vs tasting sugary.", options: ["suite", "sweet"], answer: "suite" },
        { id: "h2", q: "She has a ____________ voice.", writePrompt: "Fill in the blank with the correct word from memory: She has a ____________ voice.", rule: "Choose the word meaning pleasant, delightful, or sugary.", options: ["sweet", "suite"], answer: "sweet" },
        { id: "h3", q: "They live on a remote ____________ in the West Indies.", writePrompt: "Fill in the blank with the correct word from memory: They live on a remote ____________ in the West Indies.", rule: "Choose between a small island vs a walkway between rows.", options: ["isle", "aisle"], answer: "isle" },
        { id: "h4", q: "The ____________ sand hurt his bare feet.", writePrompt: "Fill in the blank with the correct word from memory: The ____________ sand hurt his bare feet.", rule: "Choose between rough in texture vs a path/direction.", options: ["coarse", "course"], answer: "coarse" },
        { id: "h5", q: "Half of these factories now stand ____________.", writePrompt: "Fill in the blank with the correct word from memory: Half of these factories now stand ____________.", rule: "Choose between not active/working vs a worshipped statue.", options: ["idle", "idol"], answer: "idle" },
        { id: "h6", q: "Strawberries and cream ____________ each other perfectly.", writePrompt: "Fill in the blank with the correct word from memory: Strawberries and cream ____________ each other perfectly.", rule: "Choose between making complete/enhancing vs praising someone.", options: ["complement", "compliment"], answer: "complement" }
      ]
    };

    const SECTION_LABELS = {
      meanings: "📖 Meanings",
      reading: "📚 Reading",
      present: "⚡ Present Tense",
      past: "🕰️ Past Tense",
      future: "🚀 Future Tense",
      verbs: "🎯 Verbs",
      pairs: "🔤 Word Pairs"
    };

    /* Storage Manager */
    const StorageMgr = {
      set(key, value) {
        try { localStorage.setItem(key, value); }
        catch (e) {
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith("z_ink_")) { localStorage.removeItem(k); break; }
          }
          try { localStorage.setItem(key, value); } catch (_) {}
        }
      },
      get(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      },
      remove(key) {
        try { localStorage.removeItem(key); } catch (e) {}
      }
    };

    /* App State with Position Auto-Recovery */
    let currentSection = StorageMgr.get("z_last_section") || "meanings";
    let currentLocalIndex = parseInt(StorageMgr.get("z_last_index") || "0", 10);
    let appMode = StorageMgr.get("z_app_mode") || "practice";
    let userAnswers = JSON.parse(StorageMgr.get("z_answers") || "{}");
    let inputRejectionMode = StorageMgr.get("z_palm_mode") || "pen-only";
    let strokeUndoHistory = {};
    let writeShuffleMap = {};

    /* Validate recovered section */
    if (!MASTER_LESSON_CONTENT[currentSection]) {
      currentSection = "meanings";
      currentLocalIndex = 0;
    }

    /* Canvas Drawing State */
    const canvas = document.getElementById("scratchCanvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: false });
    let isDrawing = false;
    let currentTool = "pen";
    let baseLineWidth = 4;
    let lastX = 0, lastY = 0;
    let activePointerId = null;
    let canvasReady = false;

    function saveCurrentPosition() {
      StorageMgr.set("z_last_section", currentSection);
      StorageMgr.set("z_last_index", currentLocalIndex.toString());
    }

    function shuffleArray(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = a[i]; a[i] = a[j]; a[j] = temp;
      }
      return a;
    }

    function getActiveSectionList() {
      const original = MASTER_LESSON_CONTENT[currentSection];
      if (appMode === "write") {
        if (!writeShuffleMap[currentSection]) {
          writeShuffleMap[currentSection] = shuffleArray(original);
        }
        return writeShuffleMap[currentSection];
      }
      return original;
    }

    function getCurrentItem() {
      const list = getActiveSectionList();
      if (currentLocalIndex >= list.length) currentLocalIndex = 0;
      return list[currentLocalIndex] || list[0];
    }

    /* Mode Switching - Strict Canvas Isolation */
    function setAppMode(mode) {
      window.speechSynthesis.cancel();
      
      // Save current ink under the OLD mode first
      saveCurrentInk();
      
      // Clear visual drawing buffer so previous mode ink cannot leak across
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Set new mode and update state
      appMode = mode;
      StorageMgr.set("z_app_mode", mode);

      if (mode === "write") {
        writeShuffleMap = {};
      }

      currentLocalIndex = 0;
      saveCurrentPosition();
      updateAppModeUI();
      renderCurrentCard();
    }

    function updateAppModeUI() {
      document.body.classList.toggle("write-mode", appMode === "write");
      const pracBtn = document.getElementById("modePracticeBtn");
      const writeBtn = document.getElementById("modeWriteBtn");
      if (appMode === "write") {
        pracBtn.className = "mode-btn";
        writeBtn.className = "mode-btn active-write";
      } else {
        pracBtn.className = "mode-btn active-practice";
        writeBtn.className = "mode-btn";
      }
    }

    /* Section Switching */
    function renderSectionTabs() {
      const container = document.getElementById("sectionTabs");
      container.innerHTML = Object.keys(SECTION_LABELS).map(key => {
        const isActive = currentSection === key;
        return `<button class="nav-tab ${isActive ? 'active' : ''}" onclick="switchSection('${key}')">${SECTION_LABELS[key]}</button>`;
      }).join("");
    }

    function switchSection(secKey) {
      if (currentSection === secKey) return;
      window.speechSynthesis.cancel();
      saveCurrentInk();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      currentSection = secKey;
      currentLocalIndex = 0;
      saveCurrentPosition();
      renderSectionTabs();
      renderCurrentCard();
    }

    /* Hi-DPI Dynamic Fit (Preserves Ink Only Within Matching Keys) */
    function fitCanvasToContainer(skipRestore) {
      const wrap = document.getElementById("canvasWrapper");
      if (!wrap || wrap.offsetParent === null) return;
      const rect = wrap.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) return;

      const dpr = window.devicePixelRatio || 1;
      const targetW = Math.floor(rect.width * dpr);
      const targetH = Math.floor(rect.height * dpr);

      if (canvas.width === targetW && canvas.height === targetH) {
        canvasReady = true;
        return;
      }

      canvas.width = targetW;
      canvas.height = targetH;
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      canvasReady = true;
      if (!skipRestore) {
        const item = getCurrentItem();
        if (item) restoreInkForCard(item.id);
      }
    }

    function getInkColor() {
      return document.body.classList.contains("dark-mode") ? "#EDF4F9" : "#172B38";
    }

    function setTool(tool) {
      currentTool = tool;
      document.getElementById("penTool").classList.toggle("active", tool === "pen");
      document.getElementById("eraserTool").classList.toggle("active", tool === "eraser");
    }

    function setStrokeWidth(w) {
      baseLineWidth = w;
      document.getElementById("sizeThin").classList.toggle("active", w === 2);
      document.getElementById("sizeMed").classList.toggle("active", w === 4);
      document.getElementById("sizeThick").classList.toggle("active", w === 7);
    }

    function toggleInputMode() {
      inputRejectionMode = (inputRejectionMode === "pen-only") ? "all" : "pen-only";
      StorageMgr.set("z_palm_mode", inputRejectionMode);
      updateInputModeBtn();
    }

    function updateInputModeBtn() {
      const btn = document.getElementById("btnPalmRejection");
      if (!btn) return;
      if (inputRejectionMode === "pen-only") {
        btn.innerHTML = "🖊️ Pen Only";
        btn.title = "Hardware palm rejection ON: Only stylus draws.";
        btn.classList.add("active");
      } else {
        btn.innerHTML = "👆 Any Touch";
        btn.title = "Touch drawing ON: Can write with fingers.";
        btn.classList.remove("active");
      }
    }

    /* Strictly Isolated Ink Storage Key (Includes exact appMode) */
    function inkStorageKey(id) {
      return `z_ink_${appMode}_${currentSection}_${id}`;
    }

    function saveCurrentInk() {
      if (!canvasReady || canvas.width <= 0) return;
      const item = getCurrentItem();
      if (!item) return;
      const key = inkStorageKey(item.id);
      try {
        const dataUrl = canvas.toDataURL("image/png");
        StorageMgr.set(key, dataUrl);

        if (!strokeUndoHistory[key]) strokeUndoHistory[key] = [];
        const hist = strokeUndoHistory[key];
        if (hist.length === 0 || hist[hist.length - 1] !== dataUrl) {
          hist.push(dataUrl);
        }
        if (hist.length > 25) hist.shift();
      } catch (e) {}
    }

    function restoreInkForCard(id) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const key = inkStorageKey(id);
      const saved = StorageMgr.get(key);
      if (!saved) return;

      const img = new Image();
      img.onload = function() {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        ctx.restore();
        if (!strokeUndoHistory[key]) strokeUndoHistory[key] = [saved];
      };
      img.src = saved;
    }

    function clearCurrentCanvas() {
      const item = getCurrentItem();
      if (!item) return;
      const key = inkStorageKey(item.id);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      StorageMgr.remove(key);
      strokeUndoHistory[key] = [];
      saveCurrentInk();
    }

    function undoCanvasStroke() {
      const item = getCurrentItem();
      if (!item) return;
      const key = inkStorageKey(item.id);
      const hist = strokeUndoHistory[key] || [];

      if (hist.length > 1) {
        hist.pop();
        const prev = hist[hist.length - 1];
        StorageMgr.set(key, prev);
        const img = new Image();
        img.onload = function() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          ctx.restore();
        };
        img.src = prev;
      } else if (hist.length === 1) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        StorageMgr.remove(key);
        strokeUndoHistory[key] = [];
      }
    }

    /* Canvas Pointer Listeners with Hardware Palm Rejection */
    function setupCanvasListeners() {
      canvas.addEventListener("pointerdown", function(e) {
        if (inputRejectionMode === "pen-only") {
          if (e.pointerType !== "pen") {
            e.preventDefault();
            return;
          }
        } else {
          if (e.pointerType === "touch" && (e.width > 35 || e.height > 35)) {
            e.preventDefault();
            return;
          }
        }

        if (isDrawing && activePointerId !== null) return;

        activePointerId = e.pointerId;
        isDrawing = true;
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

        const rect = canvas.getBoundingClientRect();
        lastX = e.clientX - rect.left;
        lastY = e.clientY - rect.top;
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener("pointermove", function(e) {
        if (!isDrawing || e.pointerId !== activePointerId) return;

        const rect = canvas.getBoundingClientRect();
        const currX = e.clientX - rect.left;
        const currY = e.clientY - rect.top;

        const dx = currX - lastX;
        const dy = currY - lastY;
        if ((dx * dx + dy * dy) < 4) return;

        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(currX, currY);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        if (currentTool === "eraser") {
          ctx.globalCompositeOperation = "destination-out";
          ctx.lineWidth = baseLineWidth * 6;
        } else {
          ctx.globalCompositeOperation = "source-over";
          ctx.strokeStyle = getInkColor();
          const pressure = (e.pressure && e.pressure > 0) ? e.pressure : 0.5;
          ctx.lineWidth = baseLineWidth * (pressure * 1.5 + 0.35);
        }
        ctx.stroke();

        lastX = currX;
        lastY = currY;
        e.preventDefault();
      }, { passive: false });

      const stopStroke = function(e) {
        if (isDrawing && (e.pointerId === activePointerId || activePointerId === null)) {
          isDrawing = false;
          activePointerId = null;
          try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
          saveCurrentInk();
        }
      };

      canvas.addEventListener("pointerup", stopStroke);
      canvas.addEventListener("pointercancel", stopStroke);
      canvas.addEventListener("pointerleave", stopStroke);
    }

    /* Native Fullscreen API */
    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    function updateFullscreenBtn() {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      const btn = document.getElementById("btnFullscreen");
      if (btn) btn.innerHTML = isFs ? "↩ Exit" : "⛶ Fullscreen";
    }

    document.addEventListener("fullscreenchange", () => {
      updateFullscreenBtn();
      setTimeout(() => {
        fitCanvasToContainer();
      }, 100);
    });

    /* Eye Comfort Dim & Theme */
    function toggleScreenDim() {
      window.speechSynthesis.cancel();
      const overlay = document.getElementById("screenDimOverlay");
      const btn = document.getElementById("toggleDimBtn");
      const isDimmed = window.getComputedStyle(overlay).display === "block";

      if (isDimmed) {
        overlay.style.display = "none";
        btn.textContent = "💡 Dim";
        StorageMgr.set("z_dim", "off");
      } else {
        overlay.style.display = "block";
        btn.textContent = "☀️ Bright";
        StorageMgr.set("z_dim", "on");
      }
    }

    function loadDimPreference() {
      if (StorageMgr.get("z_dim") === "on") {
        document.getElementById("screenDimOverlay").style.display = "block";
        document.getElementById("toggleDimBtn").textContent = "☀️ Bright";
      }
    }

    function toggleDarkMode() {
      window.speechSynthesis.cancel();
      document.body.classList.toggle("dark-mode");
      const isDark = document.body.classList.contains("dark-mode");
      StorageMgr.set("z_theme", isDark ? "dark" : "light");
      document.getElementById("toggleThemeBtn").textContent = isDark ? "☀️️ Light" : "🌙 Dark";
      const item = getCurrentItem();
      if (item) restoreInkForCard(item.id);
    }

    function loadTheme() {
      if (StorageMgr.get("z_theme") === "dark") {
        document.body.classList.add("dark-mode");
        document.getElementById("toggleThemeBtn").textContent = "☀️ Light";
      }
    }

    /* Audio TTS */
    function readAloud() {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const btn = document.getElementById("btnSpeak");
      const item = getCurrentItem();
      if (!item) return;

      let textToRead = "";
      if (currentSection === "meanings") {
        textToRead = item.word;
        if (appMode === "practice") textToRead += `. Meaning: ${item.rule}`;
      } else {
        textToRead = (appMode === "write" && item.writePrompt) ? item.writePrompt : item.q;
        if (appMode === "practice") textToRead += `. Clue: ${item.rule}`;
      }

      const utterance = new SpeechSynthesisUtterance(textToRead);
      utterance.rate = 0.9;
      utterance.pitch = 1.0;
      utterance.onstart = () => btn.classList.add("playing");
      utterance.onend = () => btn.classList.remove("playing");
      utterance.onerror = () => btn.classList.remove("playing");

      window.speechSynthesis.speak(utterance);
    }

    /* PIN / PEEK MODAL HANDLERS (Code: 1995) */
    function openPeekPinModal() {
      enteredPin = "";
      updatePinDisplay();
      document.getElementById("pinModal").classList.add("open");
    }

    function closePeekPinModal() {
      document.getElementById("pinModal").classList.remove("open");
      enteredPin = "";
    }

    function pressPin(num) {
      if (enteredPin.length < 4) {
        enteredPin += num;
        updatePinDisplay();
        if (enteredPin.length === 4) {
          setTimeout(submitPin, 150);
        }
      }
    }

    function clearPin() {
      enteredPin = "";
      updatePinDisplay();
    }

    function backspacePin() {
      enteredPin = enteredPin.slice(0, -1);
      updatePinDisplay();
    }

    function updatePinDisplay() {
      const disp = document.getElementById("pinDisplay");
      let str = "";
      for (let i = 0; i < 4; i++) {
        str += (i < enteredPin.length) ? "● " : "- ";
      }
      disp.textContent = str.trim();
    }

    function submitPin() {
      if (enteredPin === PARENT_SECRET_PIN) {
        const item = getCurrentItem();
        if (item) {
          peekUnlockedMap[item.id] = true;
          renderPeekContent(item);
        }
        closePeekPinModal();
      } else {
        alert("Incorrect Parent PIN. Please try again.");
        clearPin();
      }
    }

    function renderPeekContent(item) {
      const peekBox = document.getElementById("unlockedPeekBox");
      const peekBar = document.getElementById("peekBar");

      if (appMode === "write" && peekUnlockedMap[item.id]) {
        let answerText = item.answer || item.rule || "No answer provided";
        peekBox.innerHTML = `🔑 <b>Parent Answer:</b> ${answerText}`;
        peekBox.style.display = "block";
        peekBar.style.display = "none";
      } else {
        peekBox.style.display = "none";
        peekBar.style.display = (appMode === "write") ? "flex" : "none";
      }
    }

    /* Core Render Engine */
    function renderCurrentCard() {
      const list = getActiveSectionList();
      const item = list[currentLocalIndex];
      if (!item) return;

      const mainContainer = document.getElementById("mainContainer");
      const promptEl = document.getElementById("promptText");
      const hintBubble = document.getElementById("hintBubble");
      const optionsScroll = document.getElementById("optionsScroll");

      // Dynamic Layout Orchestration
      if (appMode === "practice") {
        if (currentSection === "reading") {
          mainContainer.className = "main-container layout-focus";
        } else if (currentSection === "meanings" || currentSection === "past") {
          mainContainer.className = "main-container layout-full";
        } else {
          mainContainer.className = "main-container layout-split";
        }
      } else {
        mainContainer.className = "main-container layout-full";
      }

      // Configure Prompt Content Based on Active Mode
      if (currentSection === "meanings") {
        promptEl.innerHTML = `Word: <u>${item.word}</u>`;
        hintBubble.innerHTML = `💡 <b>Meaning:</b> ${item.rule}`;
        optionsScroll.style.display = "none";
        optionsScroll.innerHTML = "";
      } else if (appMode === "practice") {
        promptEl.innerHTML = item.q;
        hintBubble.innerHTML = `💡 <b>Rule / Clue:</b> ${item.rule}`;
        if (item.options || item.type === "tick") {
          optionsScroll.style.display = "flex";
          renderInteractiveOptions(item, optionsScroll);
        } else {
          optionsScroll.style.display = "none";
          optionsScroll.innerHTML = "";
        }
      } else {
        promptEl.innerHTML = item.writePrompt || item.q;
        optionsScroll.style.display = "none";
        optionsScroll.innerHTML = "";
      }

      // Peek Bar vs Hint Bubble
      if (appMode === "write") {
        hintBubble.style.display = "none";
        renderPeekContent(item);
      } else {
        hintBubble.style.display = "block";
        document.getElementById("peekBar").style.display = "none";
        document.getElementById("unlockedPeekBox").style.display = "none";
      }

      // Progress and Navigation Counters
      document.getElementById("cardIndicator").textContent = `Card ${currentLocalIndex + 1} of ${list.length}`;
      const pct = Math.round(((currentLocalIndex + 1) / list.length) * 100);
      document.getElementById("thinProgressFill").style.width = `${pct}%`;

      document.getElementById("prevBtn").disabled = (currentLocalIndex === 0);
      document.getElementById("nextBtn").textContent = (currentLocalIndex === list.length - 1) ? "Section Done 🎉" : "Next ▶";

      setTimeout(() => {
        fitCanvasToContainer(true); // Don't allow old canvas content to be snapshotted
        restoreInkForCard(item.id);
      }, 20);
    }

    function renderInteractiveOptions(item, container) {
      container.innerHTML = "";
      const saved = userAnswers[item.id];

      if (item.options) {
        item.options.forEach((opt, idx) => {
          const btn = document.createElement("button");
          btn.className = `opt-choice-btn ${saved === idx ? 'selected' : ''}`;
          btn.textContent = opt;
          btn.onclick = () => {
            window.speechSynthesis.cancel();
            userAnswers[item.id] = idx;
            StorageMgr.set("z_answers", JSON.stringify(userAnswers));
            renderInteractiveOptions(item, container);
          };
          container.appendChild(btn);
        });
      } else if (item.type === "tick") {
        const yesBtn = document.createElement("button");
        yesBtn.className = `opt-choice-btn ${saved === true ? 'selected' : ''}`;
        yesBtn.innerHTML = `✓ Yes (Simple Present)`;
        yesBtn.onclick = () => {
          window.speechSynthesis.cancel();
          userAnswers[item.id] = true;
          StorageMgr.set("z_answers", JSON.stringify(userAnswers));
          renderInteractiveOptions(item, container);
        };

        const noBtn = document.createElement("button");
        noBtn.className = `opt-choice-btn ${saved === false ? 'selected' : ''}`;
        noBtn.innerHTML = `✗ No (Different Tense)`;
        noBtn.onclick = () => {
          window.speechSynthesis.cancel();
          userAnswers[item.id] = false;
          StorageMgr.set("z_answers", JSON.stringify(userAnswers));
          renderInteractiveOptions(item, container);
        };

        container.appendChild(yesBtn);
        container.appendChild(noBtn);
      }
    }

    function navigateCard(dir) {
      window.speechSynthesis.cancel();
      saveCurrentInk();
      ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear screen before card change
      const list = getActiveSectionList();
      const nextIdx = currentLocalIndex + dir;
      if (nextIdx >= 0 && nextIdx < list.length) {
        currentLocalIndex = nextIdx;
        saveCurrentPosition();
        renderCurrentCard();
      }
    }

    /* Lifecycle & Position Auto-Flush Listeners */
    window.addEventListener("beforeunload", () => {
      window.speechSynthesis.cancel();
      saveCurrentInk();
      saveCurrentPosition();
    });
    window.addEventListener("pagehide", () => {
      window.speechSynthesis.cancel();
      saveCurrentInk();
      saveCurrentPosition();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        window.speechSynthesis.cancel();
        saveCurrentInk();
        saveCurrentPosition();
      }
    });

    window.addEventListener("resize", () => {
      saveCurrentInk();
      fitCanvasToContainer();
    });

    window.addEventListener("orientationchange", () => {
      setTimeout(() => {
        saveCurrentInk();
        fitCanvasToContainer();
      }, 300);
    });

    /* App Boot with Automatic Position Restoration */
    window.onload = function() {
      setupCanvasListeners();
      updateInputModeBtn();
      updateAppModeUI();
      renderSectionTabs();
      loadTheme();
      loadDimPreference();
      updateFullscreenBtn();
      setTimeout(() => {
        renderCurrentCard();
      }, 80);
    };
  </script>
</body>
</html>
