<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Zaina • Eco Guardians — Pollution Patrol</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Kalam:wght@700&display=swap" rel="stylesheet" />
<script src="shared/safe-storage.js"></script>
<style>
:root{--ink:#1e293b;--earth:#15803d;--accent:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;background:#f0fdf4;color:var(--ink)}
body{display:flex;flex-direction:column;position:relative}
.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-layer img{width:100%;height:100%;object-fit:cover;opacity:.35;filter:blur(0px)}
.leaf{position:absolute;width:32px;height:32px;opacity:.4;animation:floatLeaf linear infinite}
@keyframes floatLeaf{0%{transform:translateY(110vh) rotate(0deg) translateX(0)}100%{transform:translateY(-20vh) rotate(360deg) translateX(60px)}}
header,.tabs,main{position:relative;z-index:2}
header{flex-shrink:0;height:62px;background:rgba(255,255,255,.88);border-bottom:2px solid #bbf7d0;display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:8px;backdrop-filter:blur(12px)}
.btn{border:1.5px solid #86efac;background:#fff;color:#166534;font-weight:800;font-size:.78rem;padding:6px 12px;border-radius:11px;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.94)}
.btn.on{background:#15803d;color:#fff;border-color:#15803d}
.mode-btn.on-practice{background:#0ea5e9;border-color:#0ea5e9;color:#fff;animation:pop .3s}
.mode-btn.on-write{background:#7c3aed;border-color:#7c3aed;color:#fff}
@keyframes pop{0%{transform:scale(.9)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.badge{background:linear-gradient(135deg,#22c55e,#0ea5e9);color:#fff;font-weight:900;font-size:.72rem;padding:4px 10px;border-radius:999px}
.tabs{flex-shrink:0;display:flex;gap:6px;padding:8px 12px;background:rgba(255,255,255,.75);border-bottom:1px solid #bbf7d0;overflow-x:auto}
.tab{border:1.5px solid #86efac;background:#fff;color:#166534;font-weight:800;font-size:.78rem;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.2s}
.tab.on{background:#15803d;color:#fff;border-color:#15803d;box-shadow:0 4px 12px rgba(21,128,61,.25);transform:translateY(-1px)}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;perspective:1000px}
.card{background:rgba(255,255,255,.96);border:1.5px solid #e7dcc0;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px rgba(15,118,110,.1);animation:cardIn .5s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) rotateX(8deg)}to{opacity:1;transform:translateY(0) rotateX(0)}}
.hero{display:flex;align-items:center;gap:12px;padding:12px;background:linear-gradient(135deg,#ffffff 0%,#ecfdf5 100%);border:2px solid #86efac;border-radius:20px;margin-bottom:12px;overflow:hidden;position:relative}
.hero::before{content:'';position:absolute;inset:-20px;background:radial-gradient(circle at 20% 30%, rgba(34,197,94,.18), transparent 60%);animation:pulseBg 3s ease infinite}
@keyframes pulseBg{0%,100%{opacity:.6}50%{opacity:1}}
.hero-img{width:84px;height:84px;object-fit:contain;animation:floatHero 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 16px rgba(0,0,0,.15));z-index:1}
@keyframes floatHero{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.hero-globe{width:42px;height:42px;object-fit:contain;animation:spinSlow 12s linear infinite}
@keyframes spinSlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.q-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 10px;border:1.5px dashed #e7dcc0;border-radius:16px;margin-bottom:10px;background:linear-gradient(to bottom,#fffffe,#fefcf3);line-height:1.7;transition:.2s}
.q-row:focus-within{border-color:#86efac;box-shadow:0 0 0 4px rgba(134,239,172,.25);transform:scale(1.01)}
.q-num{color:#c2410c;font-weight:900;font-size:.95rem;min-width:28px}
.q-text{font-weight:800;font-size:1.02rem;color:#1e293b;flex:1 1 auto;min-width:200px}
.q-text .s-word{cursor:pointer;border-radius:6px;padding:0 3px;transition:.15s;display:inline-block}
.q-text .s-word:hover{background:#fef9c3;transform:scale(1.08)}
.q-text .s-word.speaking{background:#fde68a;outline:2px solid #f59e0b;animation:wiggle .35s ease}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(2deg)}75%{transform:rotate(-2deg)}}
/* Inline strip - animated */
.inline-strip{position:relative;display:inline-flex;vertical-align:middle;width:268px;min-width:180px;max-width:100%;height:58px;border:1.8px solid #c9b896;border-radius:14px;background:#fffffe;overflow:hidden;touch-action:none;box-shadow:inset 0 2px 0 rgba(0,0,0,.03),0 2px 8px rgba(0,0,0,.04);transition:.25s}
.inline-strip.medium{width:210px;min-width:170px}
.inline-strip.small{width:92px;min-width:76px;height:58px}
.inline-strip:focus-within{border-color:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.18),inset 0 2px 0 rgba(0,0,0,.03)}
.inline-strip.has-ink{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.inline-strip.has-ink::before{animation:inkShimmer 2s ease infinite}
@keyframes inkShimmer{0%,100%{opacity:.9}50%{opacity:.5}}
.inline-strip::before{content:'';position:absolute;left:14px;top:0;bottom:0;width:1.5px;background:#f87171;opacity:.9;z-index:1}
.inline-strip::after{content:'';position:absolute;left:0;right:38px;top:52%;height:1.5px;background:#c7d2fe;z-index:1}
.inline-strip canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;z-index:2}
.strip-tools{position:absolute;right:0;top:0;bottom:0;width:38px;display:flex;flex-direction:column;border-left:1.2px solid #e7dcc0;background:linear-gradient(to bottom,#fefcf3,#fff7ed);z-index:3}
.tool-btn{flex:1;display:flex;align-items:center;justify-content:center;border:0;background:transparent;cursor:pointer;color:#475569;transition:.15s}
.tool-btn:first-child{border-bottom:1px solid #e7dcc0}
.tool-btn:active{background:#fef3c7;transform:scale(.9)}
.tool-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tool-btn.undo{color:#2563eb}
.tool-btn.clear{color:#b45309}
.match-row{display:grid;grid-template-columns:1fr 1fr 110px;gap:10px;align-items:center;padding:12px 10px;border:1.5px solid #e0f2fe;border-radius:16px;margin-bottom:10px;background:linear-gradient(135deg,#f8fafc,#f0fdfa);transition:.25s;position:relative;overflow:hidden}
.match-row:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(14,116,144,.12)}
.match-row .icon-wrap{position:relative;width:44px;height:44px;flex-shrink:0}
.match-row .icon-wrap img{width:100%;height:100%;object-fit:contain}
.match-row .icon-wrap.air img{animation:smokeDrift 3s ease-in-out infinite}
@keyframes smokeDrift{0%,100%{transform:translateX(0)}50%{transform:translateX(4px) translateY(-2px)}}
.match-row .icon-wrap.water img{animation:ripple 2.5s ease-in-out infinite}
@keyframes ripple{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.match-row .icon-wrap.noise img{animation:shake 0.6s ease infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.match-row .icon-wrap.land img{animation:sprout 3s ease-in-out infinite}
@keyframes sprout{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg) scale(1.05)}}
.a{font-weight:800;color:#0f172a;display:flex;align-items:center;gap:8px}
.b{font-weight:800;color:#0e7490}
@media(max-width:900px){.match-row{grid-template-columns:1fr 100px}.match-row .b{grid-column:1 / span 2}}
.tf-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 10px;border:1.5px dashed #e7dcc0;border-radius:16px;margin-bottom:10px;background:#fffffe;transition:.2s}
.tf-row:focus-within{transform:scale(1.01);border-color:#86efac}
.earth-bar{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;position:relative}
.earth-fill{height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#0ea5e9,#22c55e);background-size:200% 100%;animation:gradientShift 2s linear infinite;transition:width .8s cubic-bezier(.34,1.56,.64,1)}
@keyframes gradientShift{to{background-position:200% 0}}
.confetti{position:absolute;width:8px;height:8px;background:#22c55e;border-radius:50%;pointer-events:none;animation:confettiPop .8s ease-out forwards}
@keyframes confettiPop{0%{transform:translateY(0) scale(0);opacity:1}100%{transform:translateY(-60px) scale(1.4) rotate(180deg);opacity:0}}
#dimLayer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50;transition:opacity .25s}
</style>
</head>
<body>
<div class="bg-layer"><img src="assets/nature-bg.webp" alt="" onerror="this.style.display='none'"/><div id="leafContainer"></div></div>
<div id="dimLayer"></div>
<header>
<div style="display:flex;align-items:center;gap:8px;min-width:0">
<button class="btn" type="button" onclick="goHub()">← Hub</button>
<span class="badge">Zaina</span>
<img src="assets/earth-globe.webp" alt="" class="hero-globe" onerror="this.style.display='none'"/>
<div style="min-width:0"><div style="font-weight:900;font-size:.92rem;line-height:1.1">Eco Guardians</div><div style="font-size:.68rem;font-weight:700;color:#64748b">Pollution Patrol • Tab S11</div></div>
</div>
<div style="display:flex;align-items:center;gap:8px">
<div style="display:flex;gap:6px"><button class="btn mode-btn on-practice" id="btnPractice" type="button" onclick="setMode('practice')">Practice</button><button class="btn mode-btn" id="btnWrite" type="button" onclick="setMode('write')">Write</button></div>
<label style="display:flex;align-items:center;gap:6px;font-size:.68rem;font-weight:800;color:#166534">Dim<input type="range" id="dimSlider" min="0" max="60" value="0" oninput="setDim(this.value)" style="width:64px;accent-color:#15803d"/></label>
</div>
</header>
<div class="tabs">
<button class="tab on" id="tabA" type="button" onclick="setTab('A')">A · Fill in 🌿</button>
<button class="tab" id="tabB" type="button" onclick="setTab('B')">B · Match 🌍</button>
<button class="tab" id="tabC" type="button" onclick="setTab('C')">C · True/False ✅</button>
</div>
<main>
<div class="hero card">
<img src="assets/earth-patrol-hero.webp" class="hero-img" alt="Zaina" onerror="this.src='assets/earth-globe.webp'"/>
<div style="flex:1;z-index:1"><div style="font-weight:900;color:#14532d;font-size:1.05rem" id="heroTitle">Zaina's Pollution Patrol - Practice</div><div style="font-size:.78rem;color:#475569;font-weight:700">Tap any word for British voice 🔊 • Write with S Pen • Palm rejection ON</div><div style="display:flex;align-items:center;gap:10px;margin-top:8px"><div style="font-size:.7rem;font-weight:800;color:#166534">PLANET HEALTH</div><div class="earth-bar" style="width:140px"><div class="earth-fill" id="earthFill"></div></div><span id="healthText" style="font-size:.7rem;font-weight:900;color:#15803d">0%</span></div></div>
<img src="assets/earth-globe.webp" style="width:56px;height:56px;object-fit:contain;animation:spinSlow 14s linear infinite;z-index:1" alt="" onerror="this.style.display='none'"/>
</div>
<div id="panel"></div>
</main>
<script>
const STORE='zaina_evs_pollution_oct21_';
const FILLS=[
{id:'f1', prefix:'', suffix:' damages our environment.', answer:'Pollution'},
{id:'f2', prefix:'Pollutants are of two types: ', mid:' and ', suffix:'.', answers:['natural','human-made'], double:true, id2:'f2b'},
{id:'f3', prefix:'Land pollution is also known as ', suffix:'.', answer:'soil pollution'},
{id:'f4', prefix:'Sound is measured in ', suffix:'.', answer:'decibels'},
{id:'f5', prefix:'Radioactive pollution is caused by ', suffix:' substances.', answer:'radioactive'}
];
const MATCH=[
{a:'Household garbage on streets', b:'Land Pollution', icon:'assets/pollution-land.webp', cls:'land', id:'m1'},
{a:'Uranium leak', b:'Radioactive Pollution', icon:'assets/earth-globe.webp', cls:'radio', id:'m2'},
{a:'Rock concerts', b:'Noise Pollution', icon:'assets/pollution-noise.webp', cls:'noise', id:'m3'},
{a:'Chlorofluorocarbons', b:'Air Pollution', icon:'assets/pollution-air.webp', cls:'air', id:'m4'},
{a:'Oil spill', b:'Water Pollution', icon:'assets/pollution-water.webp', cls:'water', id:'m5'},
];
const TF=[
{id:'t1', text:'Pollution is the contamination of land, water and air by harmful substances.'},
{id:'t2', text:'All pollutants are human-made pollutants.'},
{id:'t3', text:'Land pollution is also known as soil pollution.'},
{id:'t4', text:'The comfortable level of sound for human ears is 200–240 decibels (dB).'},
];
let mode='practice', tab='A';
let fillOrder=FILLS.map((_,i)=>i), matchOrder=MATCH.map((_,i)=>i), tfOrder=TF.map((_,i)=>i);
const historyMap={}; let penActive=false, lastPenTime=0;
let ukVoice=null;
function loadVoice(){const v=speechSynthesis.getVoices(); ukVoice=v.find(x=>x.lang==='en-GB' && x.name.toLowerCase().includes('female'))||v.find(x=>x.lang==='en-GB')||v.find(x=>x.lang.startsWith('en-'))||null;}
speechSynthesis.onvoiceschanged=loadVoice; loadVoice();
function speak(text, el){
 if(!text) return; speechSynthesis.cancel();
 document.querySelectorAll('.s-word.speaking').forEach(e=>e.classList.remove('speaking'));
 if(el) el.classList.add('speaking');
 const u=new SpeechSynthesisUtterance(text); u.lang='en-GB'; u.rate=0.88; u.pitch=1.05; if(ukVoice) u.voice=ukVoice;
 u.onend=()=>{if(el) el.classList.remove('speaking');}; speechSynthesis.speak(u);
}
function makeSpeakable(t){return t.split(/(\s+)/).map(tok=>{if(/^\s+$/.test(tok)) return tok; const clean=tok.replace(/[.,()]/g,''); if(!clean) return tok; return `<span class="s-word" data-speak="${clean}">${tok}</span>`;}).join('');}
function goHub(){try{window.parent.postMessage('close-lesson-to-hub','*');}catch(_){} if(history.length>1) history.back();}
function setDim(v){document.getElementById('dimLayer').style.opacity=(Number(v)/100).toFixed(2); localStorage.setItem(STORE+'dim',v);}
(function(){const s=localStorage.getItem(STORE+'dim'); if(s!=null){document.getElementById('dimSlider').value=s; setDim(s);}})();
function shuffle(a){const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b;}
function setMode(m){flushAllInk(); mode=m; if(m==='write'){fillOrder=shuffle(FILLS.map((_,i)=>i)); matchOrder=shuffle(MATCH.map((_,i)=>i)); tfOrder=shuffle(TF.map((_,i)=>i));} else {fillOrder=FILLS.map((_,i)=>i); matchOrder=MATCH.map((_,i)=>i); tfOrder=TF.map((_,i)=>i);} document.getElementById('btnPractice').className='btn mode-btn'+(m==='practice'?' on-practice':''); document.getElementById('btnWrite').className='btn mode-btn'+(m==='write'?' on-write':''); document.getElementById('heroTitle').textContent=m==='practice'?"Zaina's Pollution Patrol - Practice":"Zaina's Mission - Write Mode"; render();}
function setTab(t){flushAllInk(); tab=t; document.getElementById('tabA').classList.toggle('on',t==='A'); document.getElementById('tabB').classList.toggle('on',t==='B'); document.getElementById('tabC').classList.toggle('on',t==='C'); render();}
function inkKey(id){return STORE+'ink_'+mode+'_'+id;}
function flushAllInk(){document.querySelectorAll('canvas[data-ink-id]').forEach(c=>{try{if(c.width) localStorage.setItem(inkKey(c.dataset.inkId), c.toDataURL('image/png'));}catch(_){}});}
function pushHistory(id,can){if(!historyMap[id]) historyMap[id]=[]; try{historyMap[id].push(can.toDataURL('image/png')); if(historyMap[id].length>28) historyMap[id].shift();}catch(_){}}
function mountStrip(canvas){
 const id=canvas.dataset.inkId; const parent=canvas.parentElement; const dpr=Math.min(window.devicePixelRatio||1,2);
 const rw=parent.clientWidth, rh=parent.clientHeight; canvas.width=Math.round(rw*dpr); canvas.height=Math.round(rh*dpr); canvas.style.width=rw+'px'; canvas.style.height=rh+'px';
 const ctx=canvas.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,rw,rh);
 const raw=localStorage.getItem(inkKey(id)); if(raw){const img=new Image(); img.onload=()=>{ctx.drawImage(img,0,0,rw,rh); parent.classList.add('has-ink'); if(!historyMap[id]||!historyMap[id].length) historyMap[id]=[raw];}; img.src=raw;} else historyMap[id]=[];
}
function clearInk(id){localStorage.removeItem(inkKey(id)); historyMap[id]=[]; const c=document.querySelector(`canvas[data-ink-id="${id}"]`); if(!c) return; c.parentElement.classList.remove('has-ink'); const ctx=c.getContext('2d'); const dpr=Math.min(devicePixelRatio||1,2); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,c.width/dpr,c.height/dpr); updateEarth();}
function undoInk(id){const st=historyMap[id]; if(!st||!st.length){clearInk(id);return;} st.pop(); const c=document.querySelector(`canvas[data-ink-id="${id}"]`); if(!c) return; const ctx=c.getContext('2d'); const dpr=Math.min(devicePixelRatio||1,2); const w=c.width/dpr,h=c.height/dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h); if(!st.length){localStorage.removeItem(inkKey(id)); c.parentElement.classList.remove('has-ink'); updateEarth(); return;} const img=new Image(); img.onload=()=>{ctx.drawImage(img,0,0,w,h); try{localStorage.setItem(inkKey(id),st[st.length-1]);}catch(_){}}; img.src=st[st.length-1];}
function stripHTML(id,size){return `<div class="inline-strip ${size||''}" id="wrap_${id}"><canvas data-ink-id="${id}"></canvas><div class="strip-tools"><button class="tool-btn undo" onclick="undoInk('${id}')"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M20 9H4"/></svg></button><button class="tool-btn clear" onclick="clearInk('${id}')"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button></div></div>`;}
function confettiAt(el){const rect=el.getBoundingClientRect(); for(let i=0;i<6;i++){const d=document.createElement('div'); d.className='confetti'; d.style.left=(rect.left+rect.width/2+ (Math.random()*40-20))+'px'; d.style.top=(rect.top+10)+'px'; d.style.background=['#22c55e','#0ea5e9','#f59e0b','#a78bfa'][i%4]; d.style.animationDelay=(i*0.07)+'s'; document.body.appendChild(d); setTimeout(()=>d.remove(),900);}}
function updateEarth(){
 let total=FILLS.length+1+MATCH.length+TF.length; // +1 for double
 let filled=0; document.querySelectorAll('canvas[data-ink-id]').forEach(c=>{if(localStorage.getItem(inkKey(c.dataset.inkId))) filled++;});
 const pct=Math.min(100,Math.round(filled/total*100)); document.getElementById('earthFill').style.width=pct+'%'; document.getElementById('healthText').textContent=pct+'%';
}
function renderFill(){
 return fillOrder.map(idx=>{
  const q=FILLS[idx];
  let html=`<div class="card"><div style="font-size:.68rem;font-weight:900;color:#92400e;letter-spacing:.06em;margin-bottom:6px">QUESTION ${idx+1} • TAP WORDS 🔊</div><div class="q-row"><span class="q-num">${idx+1}.</span><div class="q-text">`;
  if(q.double){html+=`${makeSpeakable(q.prefix)} ${stripHTML(q.id,'medium')} <span>${makeSpeakable(q.mid)}</span> ${stripHTML(q.id2,'medium')} <span>${makeSpeakable(q.suffix)}</span>`;}
  else {html+=`${q.prefix?makeSpeakable(q.prefix):''} ${stripHTML(q.id,'')} <span>${makeSpeakable(q.suffix)}</span>`;}
  html+=`</div></div>`;
  if(mode==='practice') html+=`<div style="font-size:.78rem;font-weight:800;color:#0369a1;margin-top:6px">💡 Answer: ${q.answer||q.answers?.join(' & ')} • Write with S Pen</div>`;
  html+=`</div>`; return html;
 }).join('');
}
function renderMatch(){
 return `<div class="card"><div style="font-size:.68rem;font-weight:900;color:#0e7490;letter-spacing:.06em;margin-bottom:8px">MATCH THE POLLUTION - WRITE a/b/c/d/e</div>`+
 matchOrder.map(i=>{
  const m=MATCH[i];
  return `<div class="match-row"><div class="a"><div class="icon-wrap ${m.cls}"><img src="${m.icon}" alt="" onerror="this.style.display='none'"/></div><span>${makeSpeakable(m.a)}</span></div><div class="b">${makeSpeakable(m.b)}</div>${stripHTML(m.id,'small')}</div>`;
 }).join('')+`</div>`;
}
function renderTF(){
 return `<div class="card"><div style="font-size:.68rem;font-weight:900;color:#92400e;letter-spacing:.06em;margin-bottom:8px">TRUE / FALSE - WRITE T OR F</div>`+
 tfOrder.map(i=>{
  const q=TF[i]; return `<div class="tf-row"><div class="q-text">${makeSpeakable(q.text)}</div>${stripHTML(q.id,'small')}</div>`;
 }).join('')+`</div>`;
}
function render(){
 const p=document.getElementById('panel');
 if(tab==='A') p.innerHTML=renderFill(); else if(tab==='B') p.innerHTML=renderMatch(); else p.innerHTML=renderTF();
 p.querySelectorAll('.s-word').forEach(el=>{el.addEventListener('click',e=>{e.stopPropagation(); speak(el.dataset.speak, el);});});
 requestAnimationFrame(()=>{document.querySelectorAll('canvas[data-ink-id]').forEach(mountStrip); setTimeout(updateEarth,250);});
}
// floating leaves
(function(){
 const cont=document.getElementById('leafContainer');
 for(let i=0;i<10;i++){const d=document.createElement('div'); d.className='leaf'; d.style.left=(Math.random()*100)+'vw'; d.style.animationDuration=(8+Math.random()*10)+'s'; d.style.animationDelay=(Math.random()*8)+'s'; d.innerHTML='🍃'; d.style.fontSize=(14+Math.random()*14)+'px'; cont.appendChild(d);}
})();
// S Pen drawing + palm rejection
(function(){
 let drawing=false,lx=0,ly=0,active=null,started=false;
 function pos(e,c){const r=c.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top];}
 document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('canvas[data-ink-id]'); if(!c) return;
  if(e.pointerType==='touch' && penActive && Date.now()-lastPenTime<800) return;
  if(e.pointerType==='touch' && e.width>26) return;
  if(e.pointerType==='pen'){penActive=true; lastPenTime=Date.now();}
  e.preventDefault(); c.setPointerCapture(e.pointerId); drawing=true; active=c; started=true;
  const [x,y]=pos(e,c); lx=x; ly=y; const ctx=c.getContext('2d'); ctx.strokeStyle='#0f172a'; ctx.lineWidth=e.pointerType==='pen'?(e.pressure?1+e.pressure*2.6:2.6):2.6; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+0.01,y); ctx.stroke();
 },{passive:false});
 document.addEventListener('pointermove',e=>{
  if(!drawing||!active) return; if(e.pointerType==='touch' && penActive && Date.now()-lastPenTime<800) return; e.preventDefault();
  const [x,y]=pos(e,active); const ctx=active.getContext('2d'); ctx.lineWidth=e.pointerType==='pen'?(e.pressure?1+e.pressure*2.4:2.4):2.4; ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(x,y); ctx.stroke(); lx=x; ly=y;
 },{passive:false});
 function end(e){if(!drawing||!active) return; drawing=false; if(started){pushHistory(active.dataset.inkId, active); try{localStorage.setItem(inkKey(active.dataset.inkId), active.toDataURL('image/png')); active.parentElement.classList.add('has-ink'); confettiAt(active.parentElement); updateEarth();}catch(_){}} started=false; active=null; if(e&&e.pointerType==='pen') lastPenTime=Date.now();}
 document.addEventListener('pointerup',end); document.addEventListener('pointercancel',end);
})();
window.addEventListener('beforeunload',flushAllInk); window.addEventListener('pagehide',flushAllInk);
setMode('practice');
</script>
