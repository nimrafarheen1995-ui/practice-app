<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Humayun's Word Quest</title>
<style>
  :root {
    --bg: #F0F6FC;
    --card: #FFFFFF;
    --ink: #1F3A4B;
    --ink-soft: #5A7A8E;
    --border: #D0E2F0;
    --primary: #4A9FE0;
    --primary-dark: #3A7FB8;
    --reward: #FFC93C;
    --reward-dark: #D4A020;
    --green: #4BCA7A;
    --green-dark: #2E9A5A;
    --orange: #FF8A5C;
    --orange-dark: #D46030;
    --purple: #7C3AED;
    --purple-dark: #6D28D9;
    --ruled-blue: #93C5FD;
    --margin-line: #F87171;
    --shadow: 0 4px 0 #C0D4E4, 0 8px 24px rgba(100, 140, 180, 0.12);
    --radius: 20px;
    --font: 'Nunito', 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-weight: 600;
    user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    padding: 8px 12px;
  }

  .orientation-warning {
    display: none; position: fixed; inset: 0; background: var(--bg);
    z-index: 300; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; padding: 40px; text-align: center;
  }
  .orientation-warning .icon { font-size: 4rem; animation: rotatePhone 2s infinite ease-in-out; }
  @keyframes rotatePhone { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
  .orientation-warning h2 { font-size: 1.4rem; color: var(--ink); }
  .orientation-warning p { font-size: 1rem; color: var(--ink-soft); }
  @media (orientation: portrait) { .orientation-warning { display: flex; } }

  #screenDimOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    pointer-events: none;
    z-index: 99999;
  }

  .app {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    max-width: 1400px; margin: 0 auto; width: 100%;
    gap: 8px;
    padding-bottom: max(6px, env(safe-area-inset-bottom));
  }

  /* HEADER */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px; flex-shrink: 0; }
  .header-title { display: flex; align-items: center; gap: 8px; font-size: 1.25rem; font-weight: 800; color: var(--ink); }
  .header-title .icon { font-size: 1.5rem; line-height: 1; }
  .header-actions { display: flex; align-items: center; gap: 8px; }

  .header-action-btn {
    min-width: 44px;
    height: 38px;
    padding: 0 14px;
    border-radius: 16px;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--ink);
    font-size: 0.85rem;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    box-shadow: 0 2px 0 var(--border);
    white-space: nowrap;
    text-decoration: none;
  }
  .header-action-btn:active { transform: translateY(2px); box-shadow: none; }

  /* MODE TABS */
  .mode-tabs { display: flex; gap: 6px; padding: 0 4px; flex-shrink: 0; }
  .mode-tab {
    flex: 1;
    border: 3px solid var(--border);
    border-radius: 14px;
    padding: 8px;
    font-size: 0.9rem;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 42px;
    background: var(--card);
    color: var(--ink-soft);
    box-shadow: 0 3px 0 var(--border);
    white-space: nowrap;
  }
  .mode-tab:active { transform: translateY(3px); box-shadow: none; }
  .mode-tab.active-practice {
    background: var(--primary); color: #FFF;
    border-color: var(--primary-dark); box-shadow: 0 3px 0 var(--primary-dark);
  }
  .mode-tab.active-write {
    background: var(--purple); color: #FFF;
    border-color: var(--purple-dark); box-shadow: 0 3px 0 var(--purple-dark);
  }
  .mode-tab.active-parent {
    background: #0284C7; color: #FFF;
    border-color: #0369A1; box-shadow: 0 3px 0 #0369A1;
  }

  /* SECTION TABS */
  .section-tabs { display: flex; gap: 6px; padding: 0 4px; flex-shrink: 0; overflow-x: auto; }
  .section-tab {
    flex: 1; background: var(--card); border: 3px solid var(--border);
    border-radius: 14px; padding: 8px 6px; font-size: 0.86rem; font-weight: 800;
    color: var(--ink-soft); cursor: pointer; text-align: center; white-space: nowrap;
    box-shadow: 0 3px 0 var(--border);
    display: flex; align-items: center; justify-content: center; min-height: 40px;
  }
  .section-tab:active { transform: translateY(3px); box-shadow: none; }
  .section-tab.active { background: var(--primary); color: #FFF; border-color: var(--primary-dark); box-shadow: 0 3px 0 var(--primary-dark); }
  body.write-mode .section-tab.active { background: var(--purple); border-color: var(--purple-dark); box-shadow: 0 3px 0 var(--purple-dark); }
  body.parent-mode .section-tab.active { background: #0284C7; border-color: #0369A1; box-shadow: 0 3px 0 #0369A1; }

  /* WORKSPACE */
  .workspace {
    flex: 1;
    display: flex;
    min-height: 0;
    gap: 12px;
  }

  /* LAYOUT 1: SPLIT SCREEN (FOR MEANINGS & OPPOSITES) */
  .split-layout { display: flex; width: 100%; height: 100%; gap: 12px; }
  .split-left { flex: 0 0 38%; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .split-right { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }

  .prompt-card {
    background: var(--card); border: 3px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
  }

  .card-category-row {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 6px; border-bottom: 2px dashed var(--border);
  }
  .card-category { font-size: 0.95rem; font-weight: 800; color: var(--primary); text-transform: uppercase; }

  .speakable { cursor: pointer; border-radius: 6px; padding: 2px 4px; transition: background 0.12s; }
  .speakable:active { background: #FEF08A; color: #000; }

  .prompt-text { font-size: 1.5rem; font-weight: 800; color: var(--ink); line-height: 1.35; min-height: 2.2rem; }
  .prompt-text u { text-decoration-color: var(--reward); text-decoration-thickness: 4px; text-underline-offset: 5px; }
  .prompt-text .blank { color: var(--orange); font-size: 1.8rem; }

  .hint-box {
    background: #FFF8E7; border-left: 6px solid var(--reward);
    padding: 10px 14px; border-radius: 8px 16px 16px 8px;
    font-size: 0.98rem; font-weight: 600; color: #4A3A1A;
    border: 2px solid #F0DCA0; border-left-width: 6px; line-height: 1.45;
  }
  body.write-mode .hint-box { display: none !important; }

  .test-locked-alert {
    display: none;
    background: #F5F3FF; border: 2px solid #DDD6FE; border-left: 6px solid var(--purple);
    padding: 12px 14px; border-radius: 8px 16px 16px 8px;
    font-size: 0.95rem; font-weight: 800; color: var(--purple-dark);
  }
  body.write-mode .test-locked-alert { display: block; }

  .map-card {
    background: var(--card); border: 3px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px;
    box-shadow: var(--shadow); flex-shrink: 0;
  }
  .map-title {
    font-size: 0.8rem; font-weight: 800; color: var(--ink-soft);
    text-transform: uppercase; margin-bottom: 6px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .map-grid { display: flex; gap: 6px; flex-wrap: wrap; }

  .chest {
    width: 38px; height: 38px; border-radius: 10px;
    border: 2px solid var(--border); background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.15rem; cursor: pointer; transition: all 0.15s;
    position: relative; flex-shrink: 0;
  }
  .chest:active { transform: scale(0.9); }
  .chest.current { border-color: var(--primary); border-width: 3px; box-shadow: 0 0 0 2px var(--primary); }
  .chest.done { background: #E8F8F0; border-color: var(--green); }
  .chest.correct { background: #FFF8E0; border-color: var(--reward-dark); }
  .chest.retry { background: #FFF0E8; border-color: var(--orange); }
  .chest .badge { position: absolute; top: -4px; right: -4px; font-size: 0.7rem; line-height: 1; }

  .canvas-card {
    background: var(--card); border: 3px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden;
  }

  .canvas-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 8px 12px; background: var(--bg); border-bottom: 2px solid var(--border);
    flex-shrink: 0; flex-wrap: wrap;
  }
  .tool-group { display: flex; align-items: center; gap: 6px; }
  .tool-btn {
    background: var(--card); border: 2px solid var(--border); border-radius: 10px;
    padding: 6px 12px; font-size: 0.82rem; font-weight: 800; cursor: pointer;
    color: var(--ink); box-shadow: 0 2px 0 var(--border); height: 36px;
  }
  .tool-btn:active { transform: translateY(2px); box-shadow: none; }
  .tool-btn.active { background: var(--primary); color: #FFF; border-color: var(--primary-dark); box-shadow: 0 2px 0 var(--primary-dark); }
  body.write-mode .tool-btn.active { background: var(--purple); border-color: var(--purple-dark); box-shadow: 0 2px 0 var(--purple-dark); }

  .canvas-wrap { flex: 1; min-height: 0; position: relative; overflow: hidden; background: #FFFFFF; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; position: relative; z-index: 2; }

  /* 2-LINE BLUE RULED TEXTURE */
  .dual-ruled-lines {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background-color: #FFFFFF;
    background-image: repeating-linear-gradient(
      #FFFFFF 0px,
      #FFFFFF 28px,
      var(--ruled-blue) 29px,
      #FFFFFF 30px,
      #FFFFFF 56px,
      var(--ruled-blue) 57px,
      #FFFFFF 58px,
      #FFFFFF 84px
    );
    opacity: 0.65;
  }
  .dual-ruled-lines::after {
    content: ''; position: absolute; top: 0; left: 36px;
    width: 2px; height: 100%; background: var(--margin-line);
  }

  /* LAYOUT 2: FULL-WIDTH NOTEPAD (SENTENCES, SHORT Q&A, LONG Q&A) */
  .notepad-layout {
    display: flex; flex-direction: column; width: 100%; height: 100%; gap: 8px; min-height: 0;
  }

  .subtabs-bar {
    display: flex; gap: 6px; flex-shrink: 0; overflow-x: auto;
  }
  .subtab-btn {
    background: var(--card); border: 2px solid var(--border);
    border-radius: 12px; padding: 6px 14px; font-size: 0.88rem; font-weight: 800;
    color: var(--ink-soft); cursor: pointer; white-space: nowrap;
    box-shadow: 0 2px 0 var(--border);
  }
  .subtab-btn.active {
    background: var(--primary); color: #FFF; border-color: var(--primary-dark);
    box-shadow: 0 2px 0 var(--primary-dark);
  }
  body.write-mode .subtab-btn.active {
    background: var(--purple); border-color: var(--purple-dark);
    box-shadow: 0 2px 0 var(--purple-dark);
  }
  body.parent-mode .subtab-btn.active {
    background: #0284C7; border-color: #0369A1;
    box-shadow: 0 2px 0 #0369A1;
  }

  .notepad-prompt-bar {
    background: var(--card); border: 2px solid var(--border);
    border-radius: 14px; padding: 10px 14px; font-size: 1.15rem; font-weight: 800;
    color: var(--ink); flex-shrink: 0; display: flex; flex-direction: column; gap: 4px;
    box-shadow: 0 2px 0 var(--border);
  }
  .notepad-model-ans {
    font-size: 0.95rem; font-weight: 700; color: #15803D;
  }
  body.write-mode .notepad-model-ans { display: none !important; }

  /* PARENT REVIEW STRIP */
  .parent-review-strip {
    display: none; background: #F0F9FF; border: 2px solid #BAE6FD;
    border-radius: 14px; padding: 10px 14px;
    align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0;
  }
  body.parent-mode .parent-review-strip { display: flex; }
  .parent-ans-text { font-size: 0.95rem; font-weight: 700; color: #0369A1; line-height: 1.4; max-height: 58px; overflow-y: auto; }
  .grade-row { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .grade-btn {
    border: none; padding: 8px 16px; border-radius: 10px;
    font-weight: 800; font-size: 0.85rem; cursor: pointer;
  }
  .grade-btn.pass { background: var(--green); color: #FFF; }
  .grade-btn.retry { background: var(--orange); color: #FFF; }

  /* BOTTOM CONTROLS */
  .bottom-bar {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    flex-shrink: 0; padding: 2px 4px;
  }
  .bottom-left, .bottom-right { display: flex; gap: 8px; align-items: center; }

  .btn {
    border: none; border-radius: 14px; padding: 10px 18px;
    font-size: 0.88rem; font-weight: 800; cursor: pointer;
    transition: all 0.1s; min-height: 42px;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.15); white-space: nowrap;
  }
  .btn:active { transform: translateY(3px); box-shadow: none; }
  .btn-primary { background: var(--primary); color: #FFF; box-shadow: 0 3px 0 var(--primary-dark); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-green { background: var(--green); color: #FFF; box-shadow: 0 3px 0 var(--green-dark); }

  /* PIN MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(30, 40, 50, 0.5);
    backdrop-filter: blur(4px); display: none; align-items: center;
    justify-content: center; z-index: 100000;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--card); border-radius: 20px; padding: 22px;
    max-width: 320px; width: 90%; text-align: center;
    border: 3px solid var(--border); box-shadow: 0 12px 36px rgba(0,0,0,0.2);
  }
  .pin-dots {
    font-size: 1.8rem; letter-spacing: 6px; background: #F1F5F9;
    padding: 10px; border-radius: 12px; margin: 14px 0; font-weight: 900;
  }
  .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .key-btn {
    padding: 12px; font-size: 1.25rem; font-weight: 800; border-radius: 12px;
    border: 2px solid #E2E8F0; background: #F8FAFC; cursor: pointer;
  }
</style>
</head>
<body>

<div id="screenDimOverlay"></div>

<div class="orientation-warning">
  <div class="icon">📱</div>
  <h2>Please Rotate Tablet to Landscape</h2>
  <p>Humayun's Word Quest works best in tablet landscape mode.</p>
</div>

<div class="app">

  <div class="header">
    <div class="header-title" id="headerTitle">
      <a href="javascript:void(0)" onclick="goToHub()" class="header-action-btn">🏠 Hub</a>
      <span class="icon">🗺️</span>
      <span>Humayun's Word Quest</span>
    </div>
    <div class="header-actions">
      <button type="button" class="header-action-btn" id="btnInputMode" onclick="toggleInputMode()">🖊️ Pen Only</button>
      <button type="button" class="header-action-btn" id="btnFullscreen" onclick="toggleFullscreen()">⛶ Fullscreen</button>
      <button type="button" class="header-action-btn" id="dimBtn" onclick="toggleScreenDim()">💡 Dim</button>
    </div>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab active-practice" id="mode-practice" onclick="setMode('study')">📖 Practice</button>
    <button class="mode-tab" id="mode-write" onclick="setMode('write')">✍️ Write (Test)</button>
    <button class="mode-tab" id="mode-parent" onclick="openPinModal()">🔒 Parent Review</button>
  </div>

  <div class="section-tabs">
    <button class="section-tab active" id="tab-meanings" onclick="selectSection('meanings')">📖 Meanings</button>
    <button class="section-tab" id="tab-opposites" onclick="selectSection('opposites')">🔄 Opposites</button>
    <button class="section-tab" id="tab-sentences" onclick="selectSection('sentences')">✏️ Sentences</button>
    <button class="section-tab" id="tab-qa" onclick="selectSection('qa')">❓ Short Q&amp;A</button>
    <button class="section-tab" id="tab-long_qa" onclick="selectSection('long_qa')">📝 Long Q&amp;A</button>
  </div>

  <!-- WORKSPACE -->
  <main class="workspace" id="mainWorkspace"></main>

  <!-- BOTTOM BAR (SHOWN IN SPLIT VIEW) -->
  <div class="bottom-bar" id="bottomBar">
    <div class="bottom-left">
      <button class="btn btn-primary" id="btnPrev" onclick="navigateStep(-1)">◀ Back</button>
      <button class="btn btn-primary" id="btnNext" onclick="navigateStep(1)">Next ▶</button>
      <span id="splitPager" style="font-size:0.9rem; font-weight:800; color:var(--ink-soft); margin-left:6px;">1 / 8</span>
    </div>
    <div class="bottom-right">
      <button class="btn btn-green" id="btnDoneCard" onclick="markCardDone()">✅ Done &amp; Save</button>
    </div>
  </div>

</div>

<!-- PARENT PIN MODAL -->
<div id="modalPin" class="modal-overlay">
  <div class="modal-box">
    <h3 style="font-weight:900; color:var(--ink);">Parent Access</h3>
    <p style="font-size:0.85rem; color:var(--ink-soft); margin-top:4px;">Enter 4-digit PIN</p>
    <div class="pin-dots" id="pinDots">----</div>
    <div class="keypad-grid">
      <button class="key-btn" onclick="pressPin('1')">1</button>
      <button class="key-btn" onclick="pressPin('2')">2</button>
      <button class="key-btn" onclick="pressPin('3')">3</button>
      <button class="key-btn" onclick="pressPin('4')">4</button>
      <button class="key-btn" onclick="pressPin('5')">5</button>
      <button class="key-btn" onclick="pressPin('6')">6</button>
      <button class="key-btn" onclick="pressPin('7')">7</button>
      <button class="key-btn" onclick="pressPin('8')">8</button>
      <button class="key-btn" onclick="pressPin('9')">9</button>
      <button class="key-btn" onclick="clearPin()">C</button>
      <button class="key-btn" onclick="pressPin('0')">0</button>
      <button class="key-btn" onclick="closePinModal()">✕</button>
    </div>
  </div>
</div>

<script>
const PARENT_PIN = "1995";
let enteredPin = "";
let inputRejectionMode = "pen-only"; // 'pen-only' | 'all'

const MASTER_LESSON_CONTENT = {
  meanings: [
    { id: "m1", word: "encyclopaedia", answer: "a book with facts on many subjects" },
    { id: "m2", word: "stack", answer: "arrange one on top of the other" },
    { id: "m3", word: "topple", answer: "overbalance and fall" },
    { id: "m4", word: "scatter", answer: "to throw things all over" },
    { id: "m5", word: "troll", answer: "an ugly giant" },
    { id: "m6", word: "nibble", answer: "a small quick bite" },
    { id: "m7", word: "wriggle", answer: "twist and turn with quick movement" },
    { id: "m8", word: "nervous", answer: "feeling worry" }
  ],
  opposites: [
    { id: "o1", word: "top", answer: "bottom" },
    { id: "o2", word: "up", answer: "down" },
    { id: "o3", word: "found", answer: "lost" },
    { id: "o4", word: "begin", answer: "end" },
    { id: "o5", word: "loud", answer: "quiet" },
    { id: "o6", word: "hard", answer: "soft" },
    { id: "o7", word: "under", answer: "over" }
  ],
  sentences: [
    { id: "s1", tab: "1. rescue", word: "rescue", answer: "the fireman came to rescue the kitten from the tree." },
    { id: "s2", tab: "2. grab", word: "grab", answer: "the monkey tried to grab the banana from my hand." },
    { id: "s3", tab: "3. strange", word: "strange", answer: "the dog made a strange noise at night" },
    { id: "s4", tab: "4. anxious", word: "anxious", answer: "I felt anxious before my test results" }
  ],
  qa: [
    { id: "q1", tab: "Q1: Annoyed", word: "Why was Meena annoyed at the sight of books?", answer: "Meena was annoyed because in her house her parents were always reading and buying more books." },
    { id: "q2", tab: "Q2: Book Locations", word: "Where were books kept in her house?", answer: "Books were kept in drawers desks, cupboards, chests on the sofa, on the stairs, in the fireplace, and stacked on chairs." },
    { id: "q3", tab: "Q3: Rescue Max", word: "What did Meena do to rescue Max?", answer: "Meena climbed the tall stack to rescue Max who was stuck on top." },
    { id: "q4", tab: "Q4: Books Fell Down", word: "What began to happen when the books fell down?", answer: "When the books fell down all the characters from the book came out princes, princesses, fairies, elephants, monkeys, rabbits and many more." }
  ],
  long_qa: [
    { id: "lq1", tab: "Q1: Meena Read", word: "What made Meena read the books and how did it help her?", answer: "All the characters from the books came out and made noise in her room. To make them go back, Meena started enjoying the stories and she began to love reading stories every single day." },
    { id: "lq2", tab: "Q2: Animal Feelings", word: "How did the animals feel when they were out of their books?", answer: "When the animals were out of their books they felt confused and scared. They did not know where they belonged and wanted to go back to their own stories because they felt safe inside their books." }
  ]
};

let activeLessonContent = JSON.parse(JSON.stringify(MASTER_LESSON_CONTENT));
let currentSectionKey = "meanings";
let currentIndex = 0; // Card index (for split layout) or Sub-tab index (for notepad layout)
let appMode = "study"; // 'study' | 'write' | 'parent'

let activeTool = "pen";
let activeBaseSize = 4;
let isDrawing = false;
let lastX = 0, lastY = 0;
let activePointerId = null;

let canvas = null;
let ctx = null;

function speakText(txt) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = "en-US";
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

function goToHub() {
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
  saveCurrentDrawing();
  if (window.parent && window.parent !== window) {
    window.parent.postMessage("close-lesson-to-hub", "*");
  } else {
    window.location.href = "index.html";
  }
}

function toggleFullscreen() {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}

function toggleScreenDim() {
  const el = document.getElementById("screenDimOverlay");
  const btn = document.getElementById("dimBtn");
  const isDim = el.style.display === "block";
  el.style.display = isDim ? "none" : "block";
  btn.textContent = isDim ? "💡 Dim" : "☀️ Bright";
}

function toggleInputMode() {
  inputRejectionMode = (inputRejectionMode === "pen-only") ? "all" : "pen-only";
  const btn = document.getElementById("btnInputMode");
  btn.innerHTML = (inputRejectionMode === "pen-only") ? "🖊️ Pen Only" : "👆 Any Touch";
}

function isNotepadSection() {
  return currentSectionKey === "sentences" || currentSectionKey === "qa" || currentSectionKey === "long_qa";
}

function getCurrentList() { return activeLessonContent[currentSectionKey]; }
function getCurrentItem() { return getCurrentList()[currentIndex]; }

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function applyOrderForMode() {
  if (appMode === "write") {
    activeLessonContent = {
      meanings: shuffleArray(MASTER_LESSON_CONTENT.meanings),
      opposites: shuffleArray(MASTER_LESSON_CONTENT.opposites),
      sentences: MASTER_LESSON_CONTENT.sentences,
      qa: MASTER_LESSON_CONTENT.qa,
      long_qa: MASTER_LESSON_CONTENT.long_qa
    };
  } else {
    activeLessonContent = JSON.parse(JSON.stringify(MASTER_LESSON_CONTENT));
  }
}

function setMode(mode) {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  saveCurrentDrawing();
  appMode = mode;
  document.body.className = (mode === "write") ? "write-mode" : (mode === "parent" ? "parent-mode" : "");

  document.getElementById("mode-practice").className = "mode-tab" + (mode === "study" ? " active-practice" : "");
  document.getElementById("mode-write").className = "mode-tab" + (mode === "write" ? " active-write" : "");
  document.getElementById("mode-parent").className = "mode-tab" + (mode === "parent" ? " active-parent" : "");

  applyOrderForMode();
  currentIndex = 0;
  renderWorkspace();
}

function selectSection(secKey) {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  saveCurrentDrawing();
  currentSectionKey = secKey;
  currentIndex = 0;
  updateSectionTabs();
  renderWorkspace();
}

function updateSectionTabs() {
  document.querySelectorAll(".section-tab").forEach(t => {
    t.classList.toggle("active", t.id === "tab-" + currentSectionKey);
  });
}

function navigateStep(dir) {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  saveCurrentDrawing();
  const list = getCurrentList();
  const next = currentIndex + dir;
  if (next >= 0 && next < list.length) {
    currentIndex = next;
    renderWorkspace();
  }
}

function jumpToCard(idx) {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  saveCurrentDrawing();
  if (idx >= 0 && idx < getCurrentList().length) {
    currentIndex = idx;
    renderWorkspace();
  }
}

function switchSubTab(idx) {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  saveCurrentDrawing();
  currentIndex = idx;
  renderWorkspace();
}

/* WORKSPACE RENDERER */
function renderWorkspace() {
  const container = document.getElementById("mainWorkspace");
  const bottomBar = document.getElementById("bottomBar");

  if (isNotepadSection()) {
    bottomBar.style.display = "none";
    renderNotepadLayout(container);
  } else {
    bottomBar.style.display = "flex";
    renderSplitLayout(container);
  }
}

/* 1. SPLIT VIEW (MEANINGS & OPPOSITES) */
function renderSplitLayout(container) {
  const list = getCurrentList();
  const item = getCurrentItem();
  if (!item) return;

  document.getElementById("btnPrev").disabled = (currentIndex === 0);
  document.getElementById("btnNext").disabled = (currentIndex === list.length - 1);
  document.getElementById("splitPager").innerText = `${currentIndex + 1} / ${list.length}`;

  let promptHtml = "";
  let hintHtml = "";
  if (currentSectionKey === "meanings") {
    promptHtml = `Word: <u>${item.word}</u>`;
    hintHtml = `<b>Meaning:</b> ${item.answer}`;
  } else {
    promptHtml = `Opposite of <u>${item.word}</u> = <span class="blank">?</span>`;
    hintHtml = `<b>Opposite:</b> ${item.word} &times; <b>${item.answer}</b>`;
  }

  container.innerHTML = `
    <div class="split-layout">
      <div class="split-left">
        <div class="prompt-card">
          <div class="card-category-row">
            <div class="card-category">${currentSectionKey === "meanings" ? "📖 Meanings" : "🔄 Opposites"}</div>
            <span style="font-size:0.85rem; font-weight:800; color:var(--ink-soft);">${currentIndex + 1} / ${list.length}</span>
          </div>
          <div class="prompt-text speakable" onclick="speakText('${item.word}')">${promptHtml}</div>
          <div class="hint-box speakable" onclick="speakText('${item.answer}')">${hintHtml}</div>
          <div class="test-locked-alert">Write from memory on the dual-line pad.</div>
        </div>

        <div class="map-card">
          <div class="map-title">
            <span>🗺️ Quest Map</span>
            <span id="mapProgress">0 / ${list.length} ⭐</span>
          </div>
          <div class="map-grid" id="mapGrid"></div>
        </div>

        <div class="parent-review-strip" style="${appMode === 'parent' ? 'display:flex;' : 'display:none;'}">
          <div class="parent-ans-text"><b>Answer:</b> ${item.answer}</div>
          <div class="grade-row">
            <button class="grade-btn pass" onclick="saveGrade('correct')">⭐ Correct</button>
            <button class="grade-btn retry" onclick="saveGrade('retry')">🔄 Try Again</button>
          </div>
        </div>
      </div>

      <div class="split-right">
        <div class="canvas-card">
          <div class="canvas-toolbar">
            <div class="tool-group">
              <button class="tool-btn active" id="toolPen" onclick="selectTool('pen')">✏️ Pen</button>
              <button class="tool-btn" id="toolEraser" onclick="selectTool('eraser')">🧹 Eraser</button>
              <button class="tool-btn" onclick="clearActiveCanvas()">🗑️ Clear</button>
            </div>
            <div class="tool-group">
              <button class="tool-btn" id="sizeThin" onclick="setStrokeSize(2)">Thin</button>
              <button class="tool-btn active" id="sizeMed" onclick="setStrokeSize(4)">Med</button>
              <button class="tool-btn" id="sizeThick" onclick="setStrokeSize(7)">Thick</button>
            </div>
          </div>
          <div class="canvas-wrap" id="canvasWrap">
            <div class="dual-ruled-lines"></div>
            <canvas id="activeCanvas"></canvas>
          </div>
        </div>
      </div>
    </div>
  `;

  renderMap();
  setTimeout(() => {
    initCanvasElement();
  }, 40);
}

/* 2. FULL-WIDTH NOTEPAD (SENTENCES, SHORT Q&A, LONG Q&A) */
function renderNotepadLayout(container) {
  const list = getCurrentList();
  const item = getCurrentItem();
  if (!item) return;

  let promptTitle = "";
  if (currentSectionKey === "sentences") {
    promptTitle = `Frame a sentence with: <u class="speakable" onclick="speakText('${item.word}')">${item.word}</u>`;
  } else {
    promptTitle = `<span class="speakable" onclick="speakText('${item.word}')">${item.word}</span>`;
  }

  container.innerHTML = `
    <div class="notepad-layout">
      <div class="subtabs-bar">
        ${list.map((it, idx) => `
          <button class="subtab-btn ${idx === currentIndex ? 'active' : ''}" onclick="switchSubTab(${idx})">
            ${it.tab || it.word}
          </button>
        `).join("")}
      </div>

      <div class="notepad-prompt-bar">
        <div>${promptTitle}</div>
        <div class="notepad-model-ans speakable" onclick="speakText('${item.answer}')">
          <b>Model Answer:</b> ${item.answer}
        </div>
      </div>

      <div class="parent-review-strip" style="${appMode === 'parent' ? 'display:flex;' : 'display:none;'}">
        <div class="parent-ans-text"><b>Teacher Answer:</b> ${item.answer}</div>
        <div class="grade-row">
          <button class="grade-btn pass" onclick="saveGrade('correct')">⭐ Correct</button>
          <button class="grade-btn retry" onclick="saveGrade('retry')">🔄 Try Again</button>
        </div>
      </div>

      <div class="canvas-card" style="flex:1;">
        <div class="canvas-toolbar">
          <div class="tool-group">
            <button class="tool-btn active" id="toolPen" onclick="selectTool('pen')">✏️ Pen</button>
            <button class="tool-btn" id="toolEraser" onclick="selectTool('eraser')">🧹 Eraser</button>
            <button class="tool-btn" onclick="clearActiveCanvas()">🗑️ Clear</button>
          </div>
          <div class="tool-group">
            <button class="tool-btn" id="sizeThin" onclick="setStrokeSize(2)">Thin</button>
            <button class="tool-btn active" id="sizeMed" onclick="setStrokeSize(4)">Med</button>
            <button class="tool-btn" id="sizeThick" onclick="setStrokeSize(7)">Thick</button>
          </div>
        </div>
        <div class="canvas-wrap" id="canvasWrap">
          <div class="dual-ruled-lines"></div>
          <canvas id="activeCanvas"></canvas>
        </div>
      </div>
    </div>
  `;

  setTimeout(() => {
    initCanvasElement();
  }, 40);
}

/* PERSISTENT CANVAS ENGINE */
function currentStorageKey() {
  const item = getCurrentItem();
  if (!item) return null;
  return `ink::humayun::eng_oct07::${item.id}`;
}

function initCanvasElement() {
  canvas = document.getElementById("activeCanvas");
  if (!canvas) return;
  ctx = canvas.getContext("2d", { willReadFrequently: false });
  fitCanvas();
  restoreCurrentDrawing();
  setupCanvasListeners();
}

function fitCanvas() {
  if (!canvas) return;
  const wrap = document.getElementById("canvasWrap");
  if (!wrap || wrap.offsetParent === null) return;
  const rect = wrap.getBoundingClientRect();
  if (rect.width <= 0 || rect.height <= 0) return;

  const dpr = window.devicePixelRatio || 1;
  const targetW = Math.floor(rect.width * dpr);
  const targetH = Math.floor(rect.height * dpr);

  if (canvas.width === targetW && canvas.height === targetH) return;

  canvas.width = targetW;
  canvas.height = targetH;
  canvas.style.width = rect.width + "px";
  canvas.style.height = rect.height + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function saveCurrentDrawing() {
  if (!canvas || canvas.width <= 0) return;
  const key = currentStorageKey();
  if (!key) return;
  try {
    const data = canvas.toDataURL("image/png");
    localStorage.setItem(key, data);
  } catch (e) {}
}

function restoreCurrentDrawing() {
  if (!canvas || !ctx) return;
  const key = currentStorageKey();
  if (!key) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const saved = localStorage.getItem(key);
  if (!saved) return;
  const img = new Image();
  img.onload = function() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    ctx.restore();
  };
  img.src = saved;
}

function clearActiveCanvas() {
  const key = currentStorageKey();
  if (!key || !canvas || !ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  localStorage.removeItem(key);
}

function selectTool(tool) {
  activeTool = tool;
  const p = document.getElementById("toolPen");
  const e = document.getElementById("toolEraser");
  if (p) p.classList.toggle("active", tool === "pen");
  if (e) e.classList.toggle("active", tool === "eraser");
}

function setStrokeSize(size) {
  activeBaseSize = size;
  const t = document.getElementById("sizeThin");
  const m = document.getElementById("sizeMed");
  const k = document.getElementById("sizeThick");
  if (t) t.classList.toggle("active", size === 2);
  if (m) m.classList.toggle("active", size === 4);
  if (k) k.classList.toggle("active", size === 7);
}

function setupCanvasListeners() {
  if (!canvas) return;

  canvas.onpointerdown = function(e) {
    if (inputRejectionMode === "pen-only") {
      if (e.pointerType !== "pen" && e.pointerType !== "mouse") {
        e.preventDefault();
        return;
      }
    }
    if (isDrawing && activePointerId !== null) return;
    activePointerId = e.pointerId;
    isDrawing = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

    const rect = canvas.getBoundingClientRect();
    lastX = e.clientX - rect.left;
    lastY = e.clientY - rect.top;
    e.preventDefault();
  };

  canvas.onpointermove = function(e) {
    if (!isDrawing || e.pointerId !== activePointerId) return;

    const rect = canvas.getBoundingClientRect();
    const currX = e.clientX - rect.left;
    const currY = e.clientY - rect.top;

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(currX, currY);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (activeTool === "eraser") {
      ctx.globalCompositeOperation = "destination-out";
      ctx.lineWidth = activeBaseSize * 6;
    } else {
      ctx.globalCompositeOperation = "source-over";
      ctx.strokeStyle = "#1F3A4B";
      const pressure = (e.pressure && e.pressure > 0) ? e.pressure : 0.5;
      ctx.lineWidth = activeBaseSize * (pressure * 1.5 + 0.35);
    }
    ctx.stroke();

    lastX = currX;
    lastY = currY;
    e.preventDefault();
  };

  const stopStroke = function(e) {
    if (isDrawing && (e.pointerId === activePointerId || activePointerId === null)) {
      isDrawing = false;
      activePointerId = null;
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
      saveCurrentDrawing();
    }
  };

  canvas.onpointerup = stopStroke;
  canvas.onpointercancel = stopStroke;
  canvas.onpointerleave = stopStroke;
}

/* QUEST MAP */
function renderMap() {
  const grid = document.getElementById("mapGrid");
  if (!grid) return;
  const list = getCurrentList();
  let html = "";
  let correctCount = 0;

  for (let i = 0; i < list.length; i++) {
    const it = list[i];
    const grade = localStorage.getItem(`grade::humayun::eng::${it.id}`);
    const done = localStorage.getItem(`ink::humayun::eng_oct07::${it.id}`);
    let cls = "chest";
    if (i === currentIndex) cls += " current";
    if (grade === "correct") { cls += " correct"; correctCount++; }
    else if (grade === "retry") cls += " retry";
    else if (done) cls += " done";

    let icon = "📦";
    let badge = "";
    if (grade === "correct") badge = "<span class='badge'>⭐</span>";
    else if (grade === "retry") icon = "🔄";

    html += `<div class="${cls}" onclick="jumpToCard(${i})">${icon}${badge}</div>`;
  }
  grid.innerHTML = html;
  const prog = document.getElementById("mapProgress");
  if (prog) prog.innerText = `${correctCount} / ${list.length} ⭐`;
}

function saveGrade(status) {
  const item = getCurrentItem();
  if (!item) return;
  localStorage.setItem(`grade::humayun::eng::${item.id}`, status);
  if (!isNotepadSection()) renderMap();
  alert(status === 'correct' ? "⭐ Marked as Correct!" : "🔄 Marked to Review Later.");
}

function markCardDone() {
  saveCurrentDrawing();
  const item = getCurrentItem();
  if (item && !localStorage.getItem(`grade::humayun::eng::${item.id}`)) {
    localStorage.setItem(`grade::humayun::eng::${item.id}`, "done");
  }
  renderMap();
  const list = getCurrentList();
  if (currentIndex < list.length - 1) {
    navigateStep(1);
  }
}

/* PIN MODAL */
function openPinModal() {
  enteredPin = "";
  updatePinDots();
  document.getElementById("modalPin").classList.add("open");
}
function closePinModal() { document.getElementById("modalPin").classList.remove("open"); }

function pressPin(n) {
  if (enteredPin.length < 4) {
    enteredPin += n;
    updatePinDots();
    if (enteredPin.length === 4) {
      if (enteredPin === PARENT_PIN) {
        closePinModal();
        setMode('parent');
      } else {
        alert("Incorrect PIN");
        clearPin();
      }
    }
  }
}

function clearPin() { enteredPin = ""; updatePinDots(); }
function updatePinDots() {
  let str = "";
  for (let i = 0; i < 4; i++) {
    str += (i < enteredPin.length) ? "● " : "- ";
  }
  document.getElementById("pinDots").textContent = str.trim();
}

window.onload = function() {
  updateSectionTabs();
  renderWorkspace();
};

window.addEventListener("resize", () => {
  saveCurrentDrawing();
  fitCanvas();
  restoreCurrentDrawing();
});

window.addEventListener("beforeunload", saveCurrentDrawing);
window.addEventListener("pagehide", saveCurrentDrawing);
</script>
