<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Zaina's Tamil Temple Quest: திருக்குறள் மனப்பாடப் பகுதி</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Mukta+Malar:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --parchment-border: #8B5A2B;
      --gold-bright: #F59E0B;
      --gold-dark: #B45309;
      --tamil-font: 'Mukta Malar', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Nunito', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0E0702;
      color: #FFF;
    }

    body {
      display: flex;
      flex-direction: column;
      padding: 6px 10px;
      position: relative;
    }

    /* TOP ACADEMY HUD BAR (HUMAYUN STYLE) */
    .academy-hud-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      z-index: 50;
      flex-shrink: 0;
    }

    .hud-controls-left, .hud-controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-btn {
      background: linear-gradient(180deg, #3A2312 0%, #1E110A 100%);
      border: 2px solid #D97706;
      color: #FEEBC8;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.84rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      transition: all 0.15s;
    }
    .hud-btn:active { transform: scale(0.96); }

    .mode-switch-segmented {
      display: flex;
      background: rgba(26, 14, 8, 0.92);
      border: 2px solid #D97706;
      border-radius: 25px;
      padding: 3px;
      gap: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.7);
    }
    .mode-tab-pill {
      background: transparent;
      border: none;
      color: #FDE68A;
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-tab-pill.active {
      background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%);
      color: #1E110A;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.45);
    }

    .pen-toggle-btn {
      background: linear-gradient(180deg, #3A2312 0%, #1E110A 100%);
      border: 2px solid #D97706;
      color: #FEEBC8;
      font-size: 0.8rem;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    .pen-toggle-btn.spen-active {
      background: #14532D;
      border-color: #22C55E;
      color: #DCFCE7;
    }

    /* MAIN STAGE WRAPPER WITH VILLAGE BACKGROUND (MATCHING HUMAYUN) */
    .academy-stage-wrapper {
      flex: 1;
      position: relative;
      border: 4px solid var(--parchment-border);
      border-radius: 20px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 12px;
      padding: 10px;
      min-height: 0;
      box-shadow: 0 16px 45px rgba(0,0,0,0.9);
      background: #111 url('assets/village-bg.png') no-repeat center center;
      background-size: cover;
    }

    /* HUMAYUN'S CONTRAST TINT VEIL */
    .village-tint-wash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(254, 249, 231, 0.42) 0%, rgba(20, 15, 10, 0.72) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* LEFT DECK: SAGE MENTOR (TRANSPARENT PARCHMENT SHELL) */
    .mentor-aside-card {
      position: relative;
      z-index: 10;
      background: rgba(255, 253, 245, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2.5px solid #D97706;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 8px;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      overflow-y: auto;
    }

    .thiruvalluvar-portrait-box {
      width: 100%;
      height: 220px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      flex-shrink: 0;
    }
    .thiruvalluvar-img {
      max-height: 220px;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.45));
    }

    .kural-nav-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .kural-tab-btn {
      background: rgba(255, 253, 247, 0.85);
      border: 2px solid #FCD34D;
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .kural-tab-btn.active {
      background: #FEF3C7;
      border-color: #F59E0B;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }
    .kural-tab-btn.solved {
      background: #DCFCE7;
      border-color: #22C55E;
    }
    .kural-tab-heading {
      font-size: 0.84rem;
      font-weight: 900;
      color: #92400E;
    }
    .kural-tab-snippet {
      font-family: var(--tamil-font);
      font-size: 0.86rem;
      font-weight: 800;
      color: #381A04;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* RIGHT DECK: EXPANSIVE WORKSPACE (TRANSPARENT PARCHMENT SHELL) */
    .workspace-deck-card {
      position: relative;
      z-index: 10;
      background: rgba(255, 253, 245, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2.5px solid #D97706;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 16px;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      overflow: hidden;
    }

    /* PALM LEAF SCROLL BANNER HEADER */
    .palm-scroll-banner-box {
      width: 100%;
      height: 68px;
      background: url('assets/palm-scroll-banner.jpg') no-repeat center center;
      background-size: 100% 100%;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
      flex-shrink: 0;
    }

    .banner-title-tamil {
      font-family: var(--tamil-font);
      font-size: 1.35rem;
      font-weight: 800;
      color: #351804;
      line-height: 1.2;
      text-shadow: 0 1px 0 rgba(255,255,255,0.6);
    }
    .banner-sub-phonetic {
      font-size: 0.88rem;
      font-weight: 800;
      color: #713F12;
    }

    /* PARROT AVATAR AS STANDALONE AUDIO TRIGGER */
    .parrot-avatar-trigger {
      width: 76px;
      height: 76px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 6px 12px rgba(180, 83, 9, 0.45));
    }
    .parrot-avatar-trigger:hover { transform: scale(1.1); }
    .parrot-avatar-trigger:active { transform: scale(0.92); }
    .parrot-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* WORKSPACE BODY */
    .interactive-stage-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 0;
      overflow-y: auto;
      padding: 2px 0;
    }

    /* ASSEMBLY RACKS (4 + 3) */
    .kural-assembly-stage {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 740px;
    }

    .rack-line-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 251, 235, 0.88);
      border: 2px dashed #F59E0B;
      border-radius: 12px;
      padding: 6px 10px;
      min-height: 58px;
    }

    .rack-slot {
      min-width: 90px;
      height: 48px;
      border: 1.5px dashed #D97706;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(254, 243, 199, 0.45);
      color: #B45309;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 0 6px;
      transition: all 0.2s;
    }
    .rack-slot.active-guide {
      border-color: #EA580C;
      background: #FED7AA;
      box-shadow: 0 0 10px rgba(234, 88, 12, 0.6);
      transform: scale(1.04);
    }

    /* LARGE WORD TABLETS (FONT 1.35REM) */
    .word-token-dock {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 740px;
    }

    .kural-word-tablet {
      background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%);
      border: 2px solid #FEF3C7;
      border-radius: 12px;
      padding: 6px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(180, 83, 9, 0.3);
      transition: transform 0.12s;
    }
    .kural-word-tablet:hover { transform: scale(1.06); }
    .kural-word-tablet:active { transform: scale(0.94); }
    .kural-word-tablet.placed {
      opacity: 0.28;
      pointer-events: none;
      filter: grayscale(80%);
    }
    .kural-word-tablet.highlight {
      border-color: #22C55E;
      box-shadow: 0 0 14px #22C55E;
      transform: scale(1.08);
    }

    .tablet-tamil-text {
      font-family: var(--tamil-font);
      font-size: 1.3rem;
      font-weight: 800;
      color: #FFFDF0;
      line-height: 1.1;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
    .tablet-phonetic-sub {
      font-size: 0.72rem;
      font-weight: 900;
      color: #FEF08A;
      letter-spacing: 0.3px;
    }

    /* PRACTICE MODE: 7 INDIVIDUAL WORD BOXES (4 ON L1, 3 ON L2) */
    .practice-multi-box-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 740px;
      background: rgba(255, 251, 235, 0.92);
      border: 2px solid #D97706;
      border-radius: 12px;
      padding: 6px 10px;
    }

    .boxes-tier-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }

    .single-word-writing-unit {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: relative;
    }
    .word-box-label {
      font-family: var(--tamil-font);
      font-size: 0.78rem;
      font-weight: 800;
      color: #92400E;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }

    .word-box-canvas-wrap {
      position: relative;
      width: 100%;
      height: 52px;
      background: #FFFDF7;
      border: 1.5px solid #B45309;
      border-radius: 6px;
      overflow: hidden;
    }

    .ruled-guidelines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .word-box-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
      z-index: 5;
    }

    .mini-clear-btn {
      background: transparent;
      border: none;
      font-size: 0.72rem;
      cursor: pointer;
      opacity: 0.7;
    }
    .mini-clear-btn:hover { opacity: 1; }

    /* WRITE EXAM FULL NOTEBOOK CANVAS */
    .write-exam-stage-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 760px;
    }

    .exam-prompt-banner {
      font-family: var(--tamil-font);
      font-size: 1.25rem;
      font-weight: 800;
      color: #92400E;
      text-align: center;
      background: #FEF3C7;
      border: 2px solid #F59E0B;
      border-radius: 12px;
      padding: 6px 16px;
      width: 100%;
    }

    .notebook-parchment-frame {
      position: relative;
      width: 100%;
      height: 250px;
      background: #FFFDF5;
      border: 3.5px solid #8B5A2B;
      border-radius: 16px;
      box-shadow: 0 8px 22px rgba(139, 90, 43, 0.25), inset 0 2px 8px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .slate-handwriting-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
      z-index: 5;
    }

    .slate-controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .self-check-scroll-curtain {
      display: none;
      width: 100%;
      background: #FEF3C7;
      border: 2.5px solid #16A34A;
      border-radius: 12px;
      padding: 10px 16px;
      text-align: center;
      box-shadow: 0 6px 16px rgba(22, 163, 74, 0.2);
    }
    .self-check-scroll-curtain.revealed { display: block; }
    .correct-verse-text-l1 {
      font-family: var(--tamil-font);
      font-size: 1.25rem;
      font-weight: 800;
      color: #14532D;
    }
    .correct-verse-text-l2 {
      font-family: var(--tamil-font);
      font-size: 1.25rem;
      font-weight: 800;
      color: #14532D;
      margin-top: 4px;
    }

    /* FOOTER DOCK */
    .workspace-footer-dock {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1.5px dashed rgba(245, 158, 11, 0.6);
      padding-top: 6px;
      flex-shrink: 0;
    }
    .btn-verify-seal {
      background: linear-gradient(180deg, #16A34A 0%, #15803D 100%);
      border: 2px solid #86EFAC;
      color: #FFF;
      font-size: 0.95rem;
      font-weight: 800;
      padding: 8px 24px;
      border-radius: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.35);
      transition: all 0.15s;
    }
    .btn-verify-seal:active { transform: scale(0.96); }

    /* ASANA SOARING PARROT CELEBRATION */
    #celebrationFinaleStage {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: none;
      overflow: hidden;
      background: radial-gradient(circle at center, rgba(30, 15, 6, 0.4) 0%, rgba(14, 7, 2, 0.92) 100%);
      backdrop-filter: blur(5px);
    }
    #finaleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    .soaring-parrot-rocket {
      position: absolute;
      width: 140px;
      height: 140px;
      z-index: 20;
      pointer-events: none;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
    }
    .soaring-parrot-rocket img { width: 100%; height: 100%; object-fit: contain; }

    .victory-award-scroll {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.3);
      width: 90%;
      max-width: 540px;
      background: #FFFDF9;
      border: 4px solid #D97706;
      border-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.85);
      z-index: 25;
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
    }
    .victory-award-scroll.impact {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }
    .victory-award-title {
      font-family: var(--tamil-font);
      font-size: 2rem;
      font-weight: 800;
      color: #92400E;
    }
    .btn-finish-celebration {
      background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%);
      border: 2px solid #FEF08A;
      color: #381A04;
      font-size: 1rem;
      font-weight: 800;
      padding: 10px 28px;
      border-radius: 14px;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .academy-stage-wrapper { grid-template-columns: 200px 1fr; }
      .thiruvalluvar-portrait-box { height: 170px; }
      .notebook-parchment-frame { height: 200px; }
      .word-box-canvas-wrap { height: 44px; }
    }
  </style>
</head>
<body>

  <!-- TOP HUD -->
  <header class="academy-hud-bar">
    <div class="hud-controls-left">
      <button type="button" class="hud-btn" onclick="goToHub()">🪷 Hub</button>
      <button type="button" class="hud-btn" id="btnFullscreenToggle" onclick="toggleFullscreen()">⛶ Fullscreen</button>
      <button type="button" class="pen-toggle-btn" id="btnPenMode" onclick="togglePenMode()">👆 Touch Mode</button>
    </div>

    <!-- CLEAN 3-TIER MODE SELECTOR -->
    <div class="mode-switch-segmented">
      <button type="button" class="mode-tab-pill active" id="modePractice" onclick="setAppMode('practice')">🪷 Practice</button>
      <button type="button" class="mode-tab-pill" id="modeTest" onclick="setAppMode('test')">🧩 Test</button>
      <button type="button" class="mode-tab-pill" id="modeWrite" onclick="setAppMode('write')">✍️ Write Exam</button>
    </div>

    <div class="hud-controls-right">
      <button type="button" class="hud-btn" onclick="resetCurrentKural()">🔄 Reset</button>
    </div>
  </header>

  <!-- HUMAYUN-STYLE FRAMED STAGE WRAPPER WITH TINT VEIL -->
  <main class="academy-stage-wrapper">
    <div class="village-tint-wash"></div>

    <!-- LEFT DECK: SAGE MENTOR & CLEAN TAMIL TABS -->
    <aside class="mentor-aside-card">
      <div class="thiruvalluvar-portrait-box">
        <img src="assets/thiruvalluvar.png" class="thiruvalluvar-img" alt="Thiruvalluvar" onerror="handleImageFallback(this)" />
      </div>

      <div style="font-family:var(--tamil-font); font-size:0.95rem; font-weight:800; color:#92400E; text-align:center;">
        அதிகாரம்: பண்புடைமை
      </div>

      <div class="kural-nav-list" id="kuralTabsContainer">
        <!-- Injected via JavaScript -->
      </div>
    </aside>

    <!-- RIGHT DECK: EXPANSIVE WORKSPACE -->
    <section class="workspace-deck-card">

      <!-- PALM LEAF SCROLL BANNER HEADER -->
      <div class="palm-scroll-banner-box">
        <div>
          <div class="banner-title-tamil" id="bannerHeaderTamil">குறள் 1</div>
          <div class="banner-sub-phonetic" id="bannerHeaderPhonetic">பண்புடைமை</div>
        </div>

        <!-- 76PX PARROT AVATAR AS AUDIO TRIGGER -->
        <div class="parrot-avatar-trigger" onclick="reciteKaraokeKural()" title="Listen to chant">
          <img src="assets/mentor-parrot.png" class="parrot-avatar-img" alt="Parrot" onerror="handleImageFallback(this)">
        </div>
      </div>

      <!-- WORKSPACE INTERACTIVE BODY -->
      <div class="interactive-stage-body" id="workspaceStageBody"></div>

      <!-- FOOTER DOCK -->
      <div class="workspace-footer-dock">
        <span style="font-size:0.86rem; font-weight:800; color:#92400E;" id="workspaceInstructionNotice">
          Tap the 7 words in order.
        </span>
        <button type="button" class="btn-verify-seal" id="btnVerifyAction" onclick="verifyActiveTask()">
          <span>✨</span> Verify
        </button>
      </div>

    </section>
  </main>

  <!-- ASANA-STYLE SOARING CELEBRATION STAGE -->
  <div id="celebrationFinaleStage">
    <canvas id="finaleCanvas"></canvas>

    <div class="soaring-parrot-rocket" id="soaringParrot">
      <img src="assets/mentor-parrot.png" alt="Parrot" onerror="handleImageFallback(this)">
    </div>

    <div class="victory-award-scroll" id="victoryAwardScroll">
      <div style="font-size:3rem;">🪷</div>
      <div class="victory-award-title">அற்புதம் ஜைனா!</div>
      <div style="font-size:0.95rem; font-weight:800; color:#451A03; line-height:1.5;">
        You have mastered all 3 couplets from memory!<br/>
        நகையுள்ளும் இன்னாது • நயனொடு நன்றி • பண்புடையார்ப் பட்டுண்டு
      </div>
      <button type="button" class="btn-finish-celebration" onclick="closeCelebrationStage()">

      const exitFs = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (requestFs) {
          requestFs.call(docEl).then(() => {
            document.getElementById('btnFullscreenToggle').textContent = "✖ Exit Full";

    /* PROCEDURAL AUDIO */
    class TempleAudioEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playVeenaPluck(freq = 440) {
        this.init();
        const t0 = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t0);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.98, t0 + 0.28);
        gain.gain.setValueAtTime(0.35, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.38);
      }
      playBell() {
        this.init();
        const t0 = this.ctx.currentTime;
        [523.25, 783.99, 1046.50].forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t0 + i * 0.05);
          gain.gain.setValueAtTime(0.2, t0 + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.05 + 1.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t0 + i * 0.05);
          osc.stop(t0 + i * 0.05 + 1.15);
        });
      }
    }

      }
    }

    /* UNIFIED INLINE & NOTEBOOK CANVAS HANDLER WITH PEN TIP CONTROL */
    function initCanvasInstance(key, strokeWidth = 1.8) {
      const cvs = document.getElementById(`canvas_${key}`);
      if (!cvs) return;
      const ctx = cvs.getContext('2d');

      canvasInstances[key] = {
        canvas: cvs,
        ctx: ctx,
        history: [],
        drawing: false,
        tipWidth: strokeWidth
      };

      const saved = localStorage.getItem(`z_kural_ink_${key}`);
      if (saved) {
        const img = new Image();
        img.onload = () => ctx.drawImage(img, 0, 0);
        img.src = saved;
      }

      function getPos(e) {
        const rect = cvs.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (cvs.width / rect.width),
          y: (e.clientY - rect.top) * (cvs.height / rect.height)
        };
      }

      function startDraw(e) {
        if (sPenOnlyMode && e.pointerType !== 'pen') return;

        const inst = canvasInstances[key];
        inst.drawing = true;
        inst.history.push(ctx.getImageData(0, 0, cvs.width, cvs.height));
        if (inst.history.length > 20) inst.history.shift();

        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.strokeStyle = '#1E3A8A';
        ctx.lineWidth = inst.tipWidth;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        e.preventDefault();
      }

      function moveDraw(e) {
        const inst = canvasInstances[key];
        if (!inst.drawing) return;
        if (sPenOnlyMode && e.pointerType !== 'pen') return;

        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        e.preventDefault();
      }

      function stopDraw() {
        const inst = canvasInstances[key];
        if (inst && inst.drawing) {
          inst.drawing = false;
          localStorage.setItem(`z_kural_ink_${key}`, cvs.toDataURL());
        }
      }

      cvs.addEventListener('pointerdown', startDraw);
      cvs.addEventListener('pointermove', moveDraw);
      cvs.addEventListener('pointerup', stopDraw);
      cvs.addEventListener('pointercancel', stopDraw);
    }

    function undoCanvas(key) {
      const inst = canvasInstances[key];
      if (inst && inst.history.length > 0) {
        inst.ctx.putImageData(inst.history.pop(), 0, 0);
        localStorage.setItem(`z_kural_ink_${key}`, inst.canvas.toDataURL());
      }
    }

    function clearCanvas(key) {
      const inst = canvasInstances[key];
      if (inst) {
        inst.ctx.clearRect(0, 0, inst.canvas.width, inst.canvas.height);
        inst.history = [];
        localStorage.removeItem(`z_kural_ink_${key}`);
      }
    }

    function resetCurrentKural() {
      if (currentAppMode === 'practice') {
        placedWords[activeKuralIdx] = [];
        for (let i = 0; i < 7; i++) {
          clearCanvas(`p_k${activeKuralIdx}_w${i}`);
        }
        renderPracticePlayground(activeKuralIdx);
      } else if (currentAppMode === 'test') {
        placedTestWords[activeKuralIdx] = [];
        renderTestPlayground(activeKuralIdx);
      } else {
        clearCanvas(`slate_${activeKuralIdx}`);
      }
    }

    /* KARAOKE RECITATION TRIGGERED VIA PARROT AVATAR */
    function reciteKaraokeKural() {
      const k = KURALS_DATA[activeKuralIdx];
      let step = 0;

      function chantNext() {
        if (step >= k.words.length) {
          audio.playBell();
          return;
        }
        const w = k.words[step];
        audio.playVeenaPluck(w.f);
        speakWord(w.s, w.p);

        const tab = document.getElementById(`tablet_${w.p}`);
        if (tab) {
          tab.classList.add('highlight');
          setTimeout(() => tab.classList.remove('highlight'), 550);
        }

        step++;
        setTimeout(chantNext, 620);
      }
      chantNext();
    }

    /* VERIFY AND CELEBRATION */
    function verifyActiveTask() {
      const k = KURALS_DATA[activeKuralIdx];

      if (currentAppMode === 'write') {
        audio.playBell();
        revealSelfCheck(activeKuralIdx);
        solvedKurals[activeKuralIdx] = true;
        renderKuralTabs();

        if (solvedKurals.every(v => v === true)) {
          triggerAsanaCelebration();
        }
        return;
      }

      const activeList = currentAppMode === 'practice' ? placedWords[activeKuralIdx] : placedTestWords[activeKuralIdx];

      if (activeList.length === 7) {
        const matched = activeList.every((item, i) => item.s === k.words[i].s);
        if (matched) {
          audio.playBell();
          solvedKurals[activeKuralIdx] = true;
          renderKuralTabs();

          if (solvedKurals.every(v => v === true)) {
            triggerAsanaCelebration();
          } else {
            speakWord("அற்புதம்! அடுத்த குறள்!", "Wonderful! Next Kural!");
            setTimeout(() => switchKural((activeKuralIdx + 1) % 3), 650);
          }
          return;
        }
      }

      audio.playVeenaPluck(260);
      speakWord("மீண்டும் முயற்சி செய்!", "Try again Zaina!");
      alert("Assemble all 7 words in order!");
    }

    /* ASANA CELEBRATION ENGINE */
    const finaleStage = document.getElementById('celebrationFinaleStage');
    const finaleCanvas = document.getElementById('finaleCanvas');
    const finaleCtx = finaleCanvas.getContext('2d', { alpha: true });
    const soaringParrot = document.getElementById('soaringParrot');
    const victoryAwardScroll = document.getElementById('victoryAwardScroll');

    let finaleRunning = false;
    let petals = [];
    let flightStartTime = 0;

    function resizeFinaleCanvas() {
      finaleCanvas.width = window.innerWidth;
      finaleCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeFinaleCanvas);

    class DriftingPetal {
      constructor() {
        this.x = Math.random() * window.innerWidth;
        this.y = -30 - Math.random() * 200;
        this.size = Math.random() * 12 + 8;
        this.vx = (Math.random() - 0.5) * 1.5;
        this.vy = Math.random() * 2.2 + 1.8;
        this.rot = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.05;
        const colors = ['#F472B6', '#FBCFE8', '#F59E0B', '#FEF08A', '#34D399'];
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.rot += this.rotSpeed;
        if (this.y > window.innerHeight + 40) {
          this.y = -20;
          this.x = Math.random() * window.innerWidth;
        }
      }
      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.rotate(this.rot);
        c.fillStyle = this.color;
        c.beginPath();
        c.ellipse(0, 0, this.size, this.size * 0.6, 0, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    function triggerAsanaCelebration() {
      resizeFinaleCanvas();
      finaleStage.style.display = 'block';
      finaleRunning = true;

      audio.playBell();
      speakWord("அற்புதம் ஜைனா! மூன்று குறள்களையும் மனனம் செய்துவிட்டாய்!", "Congratulations Zaina! You have mastered all 3 Kurals!");

      petals = [];
      for (let i = 0; i < 60; i++) petals.push(new DriftingPetal());

      flightStartTime = performance.now();
      animateSoaringFlight();

      setTimeout(() => {
        victoryAwardScroll.classList.add('impact');
      }, 1900);

      requestAnimationFrame(renderPetalLoop);
    }

    function animateSoaringFlight() {
      const dur = 2600;
      const w = window.innerWidth;
      const h = window.innerHeight;

      function step(now) {
        const elapsed = now - flightStartTime;
        const p = Math.min(1, elapsed / dur);
        const ease = 1 - Math.pow(1 - p, 3);

        const curX = -120 + (w + 240) * ease;
        const curY = h * 0.75 - Math.sin(ease * Math.PI) * (h * 0.55);

        soaringParrot.style.left = `${curX}px`;
        soaringParrot.style.top = `${curY}px`;

        if (p < 1 && finaleRunning) {
          requestAnimationFrame(step);
        }
      }
      requestAnimationFrame(step);
    }

    function renderPetalLoop() {
      if (!finaleRunning) return;
      finaleCtx.clearRect(0, 0, finaleCanvas.width, finaleCanvas.height);
      for (let p of petals) {
        p.update();
        p.draw(finaleCtx);
      }
      requestAnimationFrame(renderPetalLoop);
    }

    function closeCelebrationStage() {
      finaleRunning = false;
      finaleStage.style.display = 'none';
      victoryAwardScroll.classList.remove('impact');
      goToHub();
    }

    window.onload = () => {
      renderKuralTabs();
      switchKural(0);
    };
  </script>
</body>
