<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Humayun - Islamiyath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #fbf9f4;
      --card-bg: #ffffff;
      --card-border: #d4af37;
      --green-dark: #0b4f35;
      --green-deep: #063322;
      --gold: #d4af37;
      --gold-soft: #f7e7b4;
      --text-main: #14281d;
      --text-muted: #536b5c;
      --canvas-bg: #fffdf9;
      --line-color: #eadfbc;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      background-color: var(--bg-cream);
      color: var(--text-main);
      overflow-x: hidden;
      position: relative;
    }

    /* Dim Screen Overlay (0 to 50%) */
    #dimOverlay {
      position: fixed;
      inset: 0;
      background: #000000;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.15s ease;
    }

    /* Ambient Background Texture */
    night.oasis-bg {
      position: fixed;
      inset: 0;
      background: url('assets/night-oasis-bg.webp') center center / cover no-repeat;
      opacity: 0.22;
      pointer-events: none;
      z-index: 0;
    }

    .main-layout {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Floating Pill Header & Toggle Trigger */
    .top-controls {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      position: relative;
      min-height: 52px;
    }

    .header-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid var(--gold);
      border-radius: 50px;
      padding: 6px 14px;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
      backdrop-filter: blur(8px);
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.3s ease;
    }

    .header-pill.hidden {
      transform: translateY(-80px) scale(0.9);
      opacity: 0;
      pointer-events: none;
    }

    .pill-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      transition: transform 0.2s, background 0.2s;
    }

    .pill-btn:hover {
      transform: scale(1.08);
      background: var(--gold-soft);
    }

    .pill-btn.active {
      background: var(--green-dark);
      border-color: var(--gold);
    }

    .pill-btn img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .pill-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      overflow: hidden;
      background: #fff;
    }

    .pill-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Floating Pill Reveal Toggle */
    .pill-toggle-trigger {
      position: fixed;
      top: 12px;
      right: 16px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--green-dark);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      z-index: 100;
      color: #fff;
      font-size: 1.2rem;
    }

    /* Slider Container inside Pill */
    .dim-slider-box {
      display: none;
      align-items: center;
      gap: 6px;
      padding-left: 4px;
    }

    .dim-slider-box.show {
      display: flex;
    }

    .dim-slider-box input[type="range"] {
      width: 80px;
      accent-color: var(--gold);
      cursor: pointer;
    }

    .dim-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--green-dark);
      min-width: 32px;
    }

    /* Arch Center Header */
    .arch-banner {
      width: 100%;
      height: 52px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: -6px 0 2px;
    }

    .arch-banner img.arch-img {
      position: absolute;
      width: 100%;
      max-width: 520px;
      height: 100%;
      object-fit: contain;
      opacity: 0.88;
      pointer-events: none;
    }

    .arch-banner img.star-img {
      width: 36px;
      height: 36px;
      z-index: 1;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2));
    }

    /* Question Tabs */
    .tab-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar { display: none; }

    .tab-button {
      flex: 1;
      min-width: 135px;
      padding: 9px 12px;
      border-radius: 12px;
      border: 1.5px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.85rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .tab-button.active {
      background: linear-gradient(135deg, var(--green-dark), var(--green-deep));
      color: #fff;
      border-color: var(--gold);
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.3);
    }

    /* Workspace Section */
    .workspace-area {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      position: relative;
      transition: all 0.3s ease;
    }

    @media (min-width: 900px) {
      .workspace-area {
        grid-template-columns: 1.05fr 1fr;
      }
    }

    /* Practice Mode Layout */
    .practice-deck {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .unit-heading {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      color: #92751c;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .question-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--green-dark);
      line-height: 1.35;
    }

    .reading-content {
      background: var(--bg-cream);
      border: 1.5px dashed var(--gold);
      border-radius: 14px;
      padding: 16px;
      font-size: 1.15rem;
      line-height: 1.75;
    }

    /* Tap-to-Read Words */
    .read-word {
      display: inline-block;
      cursor: pointer;
      padding: 1px 3px;
      border-radius: 4px;
      transition: background 0.15s, transform 0.15s;
    }

    .read-word:hover {
      background: var(--gold-soft);
      transform: scale(1.05);
    }

    .read-word.speaking {
      background: var(--gold);
      color: #000;
      font-weight: 700;
    }

    /* Syllable-break Special Words */
    .syl-break-word {
      display: inline-flex;
      align-items: center;
      background: rgba(212, 175, 55, 0.18);
      border: 1px solid var(--gold);
      padding: 2px 7px;
      border-radius: 6px;
      margin: 1px 2px;
      cursor: pointer;
      font-weight: 700;
      color: var(--green-dark);
      transition: all 0.2s ease;
    }

    .syl-break-word:hover {
      background: rgba(212, 175, 55, 0.35);
      transform: scale(1.04);
    }

    .syl-break-word.pressed {
      background: var(--gold);
      color: #000;
    }

    .point-line {
      margin: 8px 0;
      padding-left: 16px;
      position: relative;
    }

    .point-line::before {
      content: '✦';
      position: absolute;
      left: 0;
      color: var(--gold);
      font-size: 0.8rem;
      top: 3px;
    }

    .hadith-quote {
      background: rgba(11, 79, 53, 0.08);
      border-left: 4px solid var(--green-dark);
      padding: 12px 14px;
      border-radius: 0 12px 12px 0;
      margin-top: 8px;
      font-style: italic;
    }

    /* Binder Canvas Container */
    .canvas-binder {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      padding: 16px 16px 16px 36px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 480px;
      transition: all 0.35s ease;
    }

    /* Leather Spine & Rings */
    .binder-spine {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 24px;
      background: var(--green-deep);
      border-radius: 16px 0 0 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 18px 0;
    }

    .ring-hole {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 2.5px solid var(--gold);
    }

    /* Full-Screen Binder Cover for Write Mode */
    .workspace-area.full-write-mode {
      grid-template-columns: 1fr;
    }

    .workspace-area.full-write-mode .practice-deck {
      display: none !important;
    }

    .workspace-area.full-write-mode .canvas-binder {
      min-height: 78vh;
    }

    /* Binder Cover Overlay Banner (Displayed in Write Mode) */
    .binder-cover-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: linear-gradient(135deg, var(--green-dark), var(--green-deep));
      color: #fff;
      border-radius: 12px;
      border: 1.5px solid var(--gold);
    }

    .workspace-area.full-write-mode .binder-cover-header {
      display: flex;
    }

    .binder-cover-title {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Single Integrated Writing Tool Palette */
    .canvas-tool-bar {
      display: flex;
      align-items: center;
      position: relative;
      gap: 8px;
    }

    .tool-palette-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 25px;
      background: #fff;
      border: 1.5px solid var(--gold);
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .tool-drawer {
      display: none;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1.5px solid var(--gold);
      border-radius: 30px;
      padding: 4px 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      animation: fadeInDrawer 0.2s ease forwards;
    }

    .tool-drawer.open {
      display: flex;
    }

    @keyframes fadeInDrawer {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .draw-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid var(--card-border);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .draw-btn.active {
      background: var(--green-dark);
      color: #fff;
      border-color: var(--gold);
    }

    .color-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #ccc;
      cursor: pointer;
    }

    .color-dot.active {
      transform: scale(1.2);
      box-shadow: 0 0 0 2px var(--gold);
    }

    /* Lined Writing Surface */
    .lined-sheet {
      flex: 1;
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background-color: var(--canvas-bg);
      background-image: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 31px,
        var(--line-color) 31px,
        var(--line-color) 32px
      );
      position: relative;
      touch-action: none;
      min-height: 380px;
    }

    canvas#writingCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 12px;
    }

    /* Syllable Floating Pop Badge */
    .syllable-flyer {
      position: fixed;
      pointer-events: none;
      z-index: 10000;
      background: linear-gradient(135deg, var(--gold), #faebc2);
      color: #07261a;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 2px;
      padding: 8px 20px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      border: 2px solid #fff;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      transition: transform 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.22s ease;
    }

    .syllable-flyer.active {
      transform: translate(-50%, -50%) scale(1.05);
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- Full Screen Dimmer Layer -->
  <div id="dimOverlay"></div>

  <div class="oasis-bg"></div>

  <!-- Hidden Header Reveal Trigger -->
  <button class="pill-toggle-trigger" id="pillRevealBtn" title="Toggle Menu" style="display:none;">✦</button>

  <div class="main-layout">
    <!-- Top Floating Header Pill (Icon-Only Mode) -->
    <div class="top-controls">
      <header class="header-pill" id="headerPill">
        <div class="pill-avatar" title="Humayun">
          <img src="assets/humayun-scholar.webp" alt="Humayun" onerror="this.src='https://api.iconify.design/twemoji:boy.svg'">
        </div>

        <!-- Mode Toggle (Practice vs Full Write) -->
        <button class="pill-btn" id="modeBtn" title="Toggle Write / Practice Mode">
          <img src="assets/lantern-gem.webp" alt="Mode">
        </button>

        <!-- Dimming Overlay Tool -->
        <button class="pill-btn" id="dimBtn" title="Dim Screen Overlay (0% to 50%)">
          <img src="assets/badge-crescent-star.webp" alt="Dimmer">
        </button>

        <!-- Dimmer Slider (0% to 50%) -->
        <div class="dim-slider-box" id="dimSliderBox">
          <input type="range" id="dimRange" min="0" max="50" value="0" step="5">
          <span class="dim-label" id="dimPercent">0%</span>
        </div>

        <!-- Minimize Pill Button -->
        <button class="pill-btn" id="hidePillBtn" title="Hide Header">
          ✕
        </button>
      </header>
    </div>

    <!-- Arch Center Banner -->
    <div class="arch-banner">
      <img src="assets/islamic-banner-arch.webp" class="arch-img" alt="Arch" onerror="this.style.display='none'">
      <img src="assets/badge-crescent-star.webp" class="star-img" alt="Star">
    </div>

    <!-- Question Tabs -->
    <nav class="tab-bar">
      <button class="tab-button active" data-q="0">Q1. Articles of Faith</button>
      <button class="tab-button" data-q="1">Q2. Khadijah (RA)</button>
      <button class="tab-button" data-q="2">Q3. First Woman</button>
      <button class="tab-button" data-q="3">Q4. Good Habits</button>
      <button class="tab-button" data-q="4">Q5. Garment Dua</button>
    </nav>

    <!-- Main Workspace -->
    <main class="workspace-area" id="workspaceArea">
      <!-- Practice Deck -->
      <section class="practice-deck" id="practiceDeck">
        <div class="unit-heading" id="unitHeading">Unit 2 & 10 • Lesson 1 & 3</div>
        <h2 class="question-title" id="questionTitle">1. What are the articles of faith?</h2>
        
        <div class="reading-content" id="readingArea">
          <!-- Filled dynamically with tap-to-read and syllable words -->
        </div>
      </section>

      <!-- Binder Canvas Section -->
      <section class="canvas-binder" id="canvasBinder">
        <div class="binder-spine">
          <div class="ring-hole"></div>
          <div class="ring-hole"></div>
          <div class="ring-hole"></div>
          <div class="ring-hole"></div>
          <div class="ring-hole"></div>
        </div>

        <!-- Write Mode Cover Header -->
        <div class="binder-cover-header" id="binderCoverHeader">
          <div class="binder-cover-title">
            <span>📖</span>
            <span id="binderCoverQText">Question 1 Practice Book</span>
          </div>
          <button class="pill-btn" id="exitWriteBtn" title="Back to Practice Mode" style="width:34px;height:34px;border:none;">
            ✕
          </button>
        </div>

        <!-- Single Integrated Tool Palette -->
        <div class="canvas-tool-bar">
          <button class="tool-palette-toggle" id="paletteToggleBtn">
            <span>✏️ Pen Tools</span>
            <span>▾</span>
          </button>

          <!-- Collapsible Tool Drawer -->
          <div class="tool-drawer" id="toolDrawer">
            <button class="draw-btn active" id="penTool" title="Pen">✏️</button>
            <button class="draw-btn" id="eraserTool" title="Eraser">🧹</button>
            <button class="draw-btn" id="clearBtn" title="Clear Canvas">🗑️</button>

            <div class="color-dot active" data-color="#0b4f35" style="background:#0b4f35;"></div>
            <div class="color-dot" data-color="#14281d" style="background:#14281d;"></div>
            <div class="color-dot" data-color="#92751c" style="background:#92751c;"></div>
            <div class="color-dot" data-color="#7c2d12" style="background:#7c2d12;"></div>
          </div>
        </div>

        <!-- Writing Surface -->
        <div class="lined-sheet" id="sheetWrapper">
          <canvas id="writingCanvas"></canvas>
        </div>
      </section>
    </main>
  </div>

  <div id="flyerBadge" class="syllable-flyer">KHA · DI · JAH</div>

  <script>
    // --- Syllabus Content (Units 2, 5 & 10) ---
    const lessonData = [
      {
        unit: "Unit 2 & 10 • Lesson 1 & 3",
        q: "What are the articles of faith?",
        lead: "The articles of faith are:",
        items: [
          "Believe in Allah (SWT)",
          "His [an·gels|angels]",
          "His books",
          "His [mes·sen·gers|messengers]",
          "The Day of [Re·sur·rec·tion|Resurrection]",
          "[Des·ti·ny|Destiny] (Whatever Allah has [or·dained|ordained])"
        ]
      },
      {
        unit: "Unit 2 & 10 • Lesson 1 & 3",
        q: "Who was Khadijah (RA)?",
        lead: "[Kha·di·jah|Khadijah] (RA) was a noble, kind, [wealth·y|wealthy] lady of Makkah. She was the wife of Prophet [Mu·ham·mad|Muhammad] (SAW).",
        items: []
      },
      {
        unit: "Unit 2 & 10 • Lesson 1 & 3",
        q: "Who was the first woman to accept Islam?",
        lead: "[Kha·di·jah|Khadijah] (RA) was the first woman to [ac·cept|accept] Islam.",
        items: []
      },
      {
        unit: "Unit 5 • Lesson 2 & 3",
        q: "Why is bathing a good practice?",
        lead: "Taking bath daily is a good [prac·tice|practice]. It makes a person clean and [health·y|healthy].",
        items: []
      },
      {
        unit: "Unit 5 • Hadith (Abu Dawood)",
        q: "What did Allah's Messenger (SAW) say about putting on a garment?",
        lead: "Allah's Messenger (SAW) said: He who puts on a [gar·ment|garment] and says:",
        hadith: "\"Praise be to Allah, who clothes me with this and who [pro·vid·ed|provided] me with it without any power or [a·bil·i·ty|ability] from me, his past and present sins are [for·giv·en|forgiven] for him.\" (Abu Dawood)",
        items: []
      }
    ];

    let currentQ = 0;
    let isWriteMode = false;

    // Elements
    const unitHeading = document.getElementById('unitHeading');
    const questionTitle = document.getElementById('questionTitle');
    const readingArea = document.getElementById('readingArea');
    const flyerBadge = document.getElementById('flyerBadge');
    const workspaceArea = document.getElementById('workspaceArea');
    const binderCoverQText = document.getElementById('binderCoverQText');

    // Header Pill Controls
    const headerPill = document.getElementById('headerPill');
    const pillRevealBtn = document.getElementById('pillRevealBtn');
    const hidePillBtn = document.getElementById('hidePillBtn');
    const modeBtn = document.getElementById('modeBtn');
    const exitWriteBtn = document.getElementById('exitWriteBtn');
    const dimBtn = document.getElementById('dimBtn');
    const dimSliderBox = document.getElementById('dimSliderBox');
    const dimRange = document.getElementById('dimRange');
    const dimPercent = document.getElementById('dimPercent');
    const dimOverlay = document.getElementById('dimOverlay');

    // Header Pill Hide & Reveal
    hidePillBtn.addEventListener('click', () => {
      headerPill.classList.add('hidden');
      pillRevealBtn.style.display = 'flex';
    });

    pillRevealBtn.addEventListener('click', () => {
      headerPill.classList.remove('hidden');
      pillRevealBtn.style.display = 'none';
    });

    // Dim Mode Slider (0% to 50%)
    dimBtn.addEventListener('click', () => {
      dimSliderBox.classList.toggle('show');
    });

    dimRange.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      dimPercent.textContent = val + '%';
      dimOverlay.style.opacity = (val / 100);
    });

    // Softer Grounded Syllable Tone Pitch (Matching EVS/English)
    function playSoftSyllableTone() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 320; // Lowered, warm, grounded pitch
        osc.type = 'triangle';
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.16);
      } catch (err) {}
    }

    // Tap-to-Read Single Word Speech
    function speakWord(word, el) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const clean = word.replace(/[(),."?:]/g, '').trim();
        if (!clean) return;

        const utter = new SpeechSynthesisUtterance(clean);
        utter.rate = 0.88;
        utter.pitch = 1.0;

        el.classList.add('speaking');
        utter.onend = () => el.classList.remove('speaking');
        utter.onerror = () => el.classList.remove('speaking');

        window.speechSynthesis.speak(utter);
      }
    }

    // Render Question & Tap-to-Read Words
    function loadQuestion(index) {
      currentQ = index;
      const data = lessonData[index];
      unitHeading.textContent = data.unit;
      questionTitle.textContent = `${index + 1}. ${data.q}`;
      binderCoverQText.textContent = `Question ${index + 1}: Write & Practice`;

      document.querySelectorAll('.tab-button').forEach((b, i) => {
        b.classList.toggle('active', i === index);
      });

      // Parse text into individual interactive words & syllable breaks
      function formatWords(sentence) {
        return sentence.split(' ').map(token => {
          // Check if token has syllable structure [syl|word]
          const sylMatch = token.match(/\[([^\vert{}]+)\Vert{}([^\]]+)\]/);
          if (sylMatch) {
            const syl = sylMatch[1];
            const word = sylMatch[2];
            return `<span class="syl-break-word" data-syl="${syl}" data-word="${word}">${word}</span>`;
          } else {
            return `<span class="read-word">${token}</span>`;
          }
        }).join(' ');
      }

      let contentHtml = '';
      if (data.lead) {
        contentHtml += `<p style="margin-bottom:8px;">${formatWords(data.lead)}</p>`;
      }

      if (data.items && data.items.length > 0) {
        contentHtml += `<div>`;
        data.items.forEach(it => {
          contentHtml += `<div class="point-line">${formatWords(it)}</div>`;
        });
        contentHtml += `</div>`;
      }

      if (data.hadith) {
        contentHtml += `<div class="hadith-quote">${formatWords(data.hadith)}</div>`;
      }

      readingArea.innerHTML = contentHtml;
      attachReadingInteractions();
    }

    // Attach Click and Hold Handlers
    function attachReadingInteractions() {
      // Regular words -> Tap to read aloud
      readingArea.querySelectorAll('.read-word').forEach(span => {
        span.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          speakWord(span.textContent, span);
        });
      });

      // Syllable words -> Show glowing badge + soft tone + speak
      readingArea.querySelectorAll('.syl-break-word').forEach(span => {
        const syl = span.getAttribute('data-syl');
        const word = span.getAttribute('data-word');

        span.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          const rect = span.getBoundingClientRect();
          flyerBadge.textContent = syl.toUpperCase();
          flyerBadge.style.left = `${rect.left + rect.width / 2}px`;
          flyerBadge.style.top = `${rect.top - 24}px`;
          flyerBadge.classList.add('active');

          span.classList.add('pressed');
          playSoftSyllableTone();
          speakWord(word, span);

          setTimeout(() => {
            flyerBadge.classList.remove('active');
            span.classList.remove('pressed');
          }, 850);
        });
      });
    }

    // Mode Toggle (Full Canvas Write vs Practice)
    function setWriteMode(active) {
      isWriteMode = active;
      workspaceArea.classList.toggle('full-write-mode', isWriteMode);
      modeBtn.classList.toggle('active', isWriteMode);
      resizeCanvas();
    }

    modeBtn.addEventListener('click', () => setWriteMode(!isWriteMode));
    exitWriteBtn.addEventListener('click', () => setWriteMode(false));

    // Tab Button Navigation
    document.querySelectorAll('.tab-button').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.getAttribute('data-q'));
        loadQuestion(idx);
        clearCanvas();
      });
    });

    // Single Integrated Tool Palette Toggle
    const paletteToggleBtn = document.getElementById('paletteToggleBtn');
    const toolDrawer = document.getElementById('toolDrawer');
    paletteToggleBtn.addEventListener('click', () => {
      toolDrawer.classList.toggle('open');
    });

    // Canvas Drawing Mechanics
    const canvas = document.getElementById('writingCanvas');
    const ctx = canvas.getContext('2d');
    const sheetWrapper = document.getElementById('sheetWrapper');

    let isDrawing = false;
    let currentColor = '#0b4f35';
    let isEraser = false;

    function resizeCanvas() {
      const rect = sheetWrapper.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }
    window.addEventListener('resize', resizeCanvas);

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      isDrawing = true;
      const { x, y } = getPos(e);
      ctx.beginPath();
      ctx.moveTo(x, y);
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      const { x, y } = getPos(e);
      ctx.strokeStyle = isEraser ? '#fffdf9' : currentColor;
      ctx.lineWidth = isEraser ? 24 : 3.5;
      ctx.lineTo(x, y);
      ctx.stroke();
    });

    function endDrawing() {
      if (isDrawing) {
        isDrawing = false;
        ctx.closePath();
      }
    }
    canvas.addEventListener('pointerup', endDrawing);
    canvas.addEventListener('pointercancel', endDrawing);

    // Tools Inside Drawer
    const penTool = document.getElementById('penTool');
    const eraserTool = document.getElementById('eraserTool');
    const clearBtn = document.getElementById('clearBtn');

    penTool.addEventListener('click', () => {
      isEraser = false;
      penTool.classList.add('active');
      eraserTool.classList.remove('active');
    });

    eraserTool.addEventListener('click', () => {
      isEraser = true;
      eraserTool.classList.add('active');
      penTool.classList.remove('active');
    });

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    clearBtn.addEventListener('click', clearCanvas);

    // Color Swatches Inside Drawer
    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        isEraser = false;
        penTool.classList.add('active');
        eraserTool.classList.remove('active');
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        currentColor = dot.getAttribute('data-color');
      });
    });

    // Start App
    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      loadQuestion(0);
    });
  </script>
</body>
</html>
