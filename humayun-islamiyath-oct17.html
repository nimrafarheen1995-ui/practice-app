<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1128">
<title>Humayun's Islamiyath Notebook</title>
<style>
:root{--gold:#f59e0b;--glow:#fbbf24;--ink:#0f172a;--rule:rgba(74,85,104,.22);--margin:rgba(220,38,38,.35)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html{overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a1128 url('assets/night-oasis-bg.webp') center/cover no-repeat fixed;color:#1e293b;min-height:100dvh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:99999}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:150}
#moon{position:fixed;top:78px;right:5%;width:120px;height:160px;object-fit:contain;pointer-events:none;z-index:11;display:none;filter:drop-shadow(0 0 20px rgba(251,191,36,.85))}
#moon.on{display:block;animation:fl 6s ease-in-out infinite alternate}
@keyframes fl{0%{transform:translate(0,0) rotate(-6deg)}100%{transform:translate(-30px,-16px) rotate(7deg) scale(1.06)}}
/* header pill */
.bar{position:fixed;top:max(12px,env(safe-area-inset-top));right:16px;z-index:1000;display:flex;align-items:center;gap:10px;background:rgba(15,23,42,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:7px 14px;border-radius:999px;border:2px solid rgba(245,158,11,.55);box-shadow:0 10px 30px rgba(0,0,0,.7)}
.bc{display:flex;align-items:center;gap:10px}.bar.min .bc{display:none}
.ib{position:relative;background:rgba(255,255,255,.1);border:1.5px solid rgba(251,191,36,.4);color:#fef08a;height:48px;padding:0 14px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:800;text-decoration:none}
.ib.c{width:48px;padding:0;border-radius:50%;font-size:22px}.ib.on{background:var(--gold);color:#000;border-color:#fff}
.ib:active{transform:scale(.94)}
.ib img{width:28px;height:32px;object-fit:contain;filter:drop-shadow(0 0 6px var(--glow))}
.ib.dn::after{content:'✔';position:absolute;left:-3px;top:-3px;width:18px;height:18px;border-radius:9px;background:#10b981;color:#fff;font-size:11px;display:grid;place-items:center}
.jn{position:absolute;right:-3px;bottom:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#000;font-size:11px;display:grid;place-items:center}
.seg{display:flex;border:1.5px solid rgba(251,191,36,.5);border-radius:999px;overflow:hidden}
.seg button{height:48px;padding:0 14px;border:0;background:transparent;color:#fef08a;font-size:20px;display:flex;align-items:center;gap:6px}
.seg button span{font-size:14px;font-weight:800}.seg button.on{background:var(--gold);color:#000}
.dimbox{display:flex;align-items:center;gap:8px}.dimbox img{width:26px;height:26px;object-fit:contain}.dimbox input{width:90px;accent-color:var(--gold)}
/* hub */
#hub{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:84px 20px 40px;overflow:hidden;position:relative;z-index:10}
.title{background:rgba(11,19,43,.85);border:2px solid rgba(245,158,11,.6);border-radius:22px;padding:16px 28px;text-align:center;color:#fef3c7;box-shadow:0 12px 30px rgba(0,0,0,.7);max-width:600px;width:90%;margin-bottom:26px}
.title h1{font-size:25px;color:var(--glow);margin-bottom:4px}.title p{font-size:14px;color:#cbd5e1}
.stage{position:relative;width:100%;max-width:960px;height:410px;perspective:1300px;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.track{position:relative;width:280px;height:360px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.25,1,.5,1)}
.card{position:absolute;inset:0;background:radial-gradient(circle at 50% 20%,rgba(30,41,59,.94),rgba(15,23,42,.98));border:2px solid rgba(251,191,36,.4);border-radius:26px;padding:24px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-shadow:0 16px 36px rgba(0,0,0,.8);backface-visibility:hidden}
.card.act{border-color:var(--glow);box-shadow:0 0 40px rgba(245,158,11,.7)}
.card.done::after{content:'✔';position:absolute;top:10px;right:14px;font-size:24px;color:#10b981}
.lan{width:100px;height:135px;object-fit:contain;filter:drop-shadow(0 0 16px rgba(251,191,36,.7))}
.ct{font-size:18px;font-weight:700;color:#fef08a;line-height:1.3;margin:8px 0}.tag{font-size:12px;color:#94a3b8;background:rgba(255,255,255,.08);padding:4px 10px;border-radius:999px}
.go,.gold{background:linear-gradient(135deg,var(--glow),var(--gold));color:#000;font-size:14px;font-weight:800;border:0;padding:10px 24px;border-radius:999px;box-shadow:0 4px 14px rgba(245,158,11,.55)}
.arrows{display:flex;gap:24px;margin-top:22px}
.arrow{background:rgba(15,23,42,.85);border:2px solid var(--gold);color:var(--glow);width:50px;height:50px;border-radius:50%;font-size:22px}
/* workspace */
#ws{display:none;position:fixed;inset:0;z-index:100;background:rgba(10,17,40,.45);padding:84px 18px 24px;overflow-y:auto}
.wrap{max-width:1040px;margin:0 auto;background:rgba(11,19,41,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:26px;border:3px solid var(--gold);box-shadow:0 0 45px rgba(245,158,11,.4);overflow:hidden}
.prompt{padding:18px 24px;background:rgba(15,23,42,.8);border-bottom:2px solid rgba(245,158,11,.4);display:flex;flex-direction:column;gap:12px}
.qcard{background:rgba(30,41,59,.88);border:2px solid rgba(251,191,36,.5);border-radius:18px;padding:16px 20px}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px}
.qlabel{font-size:13px;letter-spacing:1px;color:var(--glow);font-weight:800}
.qtext{font-size:19px;font-weight:700;color:#fff;line-height:1.45}
.acard{background:rgba(15,23,42,.85);border:2px solid rgba(16,185,129,.4);border-radius:16px;padding:14px 18px;color:#f1f5f9;font-size:17px;line-height:1.6}
.acard ol{padding-left:22px;margin-top:6px}.acard li{margin-bottom:5px}
.sw{display:inline-block;padding:1px 3px;border-radius:4px;cursor:pointer}.sw:active{background:rgba(245,158,11,.4)}
.sy{font-weight:800;padding:0 2px;border-radius:3px}.s1{color:#f43f5e;background:rgba(244,63,94,.15)}.s2{color:#3b82f6;background:rgba(59,130,246,.15)}.s3{color:#10b981;background:rgba(16,185,129,.15)}.s4{color:#f59e0b;background:rgba(245,158,11,.15)}
.mini{background:rgba(30,41,59,.7);border:1px solid rgba(245,158,11,.3);border-radius:14px;padding:14px;margin-top:10px}
.chip{background:#1e293b;color:#f8fafc;border:1px solid #475569;padding:7px 14px;border-radius:18px;font-size:14px;font-weight:600;display:inline-block;margin:5px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:10px}
.slot{background:rgba(15,23,42,.85);border:2px dashed rgba(251,191,36,.4);border-radius:12px;padding:10px;min-height:46px;font-size:13px;color:#94a3b8;display:flex;align-items:center;gap:8px}
.slot.ok{border-style:solid;border-color:#10b981;background:rgba(6,78,59,.35);color:#6ee7b7}
.slot.bad{border-style:solid;border-color:#f43f5e;background:rgba(244,63,94,.18);color:#fda4af}
.v4{font-size:18px;line-height:2.3;color:#f8fafc}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:120px;height:38px;padding:0 12px;border-bottom:3px solid var(--gold);background:rgba(245,158,11,.12);border-radius:6px;margin:0 4px;vertical-align:middle;font-weight:700;color:var(--glow)}
.blank.sel{outline:3px solid var(--glow);background:rgba(251,191,36,.3)}.blank.fill{background:rgba(16,185,129,.2);border-bottom-color:#10b981;color:#6ee7b7}
.blank.shake{animation:sh .4s}.blank.wb{cursor:default;color:#94a3b8}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* notebook */
.bench{background:#f8fafc}
.spine{height:26px;background:#1e293b;display:flex;align-items:center;justify-content:space-around;padding:0 24px}
.spine i{width:14px;height:20px;background:linear-gradient(135deg,#cbd5e1,#64748b);border-radius:6px}
.vp{position:relative;width:100%;height:clamp(320px,56vh,520px);background-color:#fffefb;background-image:linear-gradient(90deg,transparent 42px,var(--margin) 42px,var(--margin) 44px,transparent 44px),linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 100%,100% 34px;background-position:0 0,0 22px;overflow:hidden}
#ink{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:10}
.pal{position:absolute;top:14px;right:80px;width:85px;height:125px;object-fit:contain;opacity:.5;pointer-events:none;z-index:5}
#cover{position:absolute;inset:0;background:rgba(15,23,42,.78);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-left:7px solid var(--gold);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;transform-origin:left center;transition:transform .75s cubic-bezier(.4,0,.2,1),opacity .5s;box-shadow:10px 0 30px rgba(0,0,0,.65);cursor:pointer}
#cover.open{transform:perspective(1400px) rotateY(-110deg);opacity:0;pointer-events:none}
.arch{position:relative;width:200px;height:230px;display:flex;align-items:center;justify-content:center}
.arch .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 18px rgba(245,158,11,.75))}
.arch .me{position:absolute;bottom:14px;width:110px;height:165px;object-fit:contain}
.ctitle{color:#fef08a;font-size:22px;font-weight:800;margin-top:10px;text-shadow:0 2px 8px #000;text-align:center}.csub{color:#cbd5e1;font-size:14px;margin-top:4px;font-weight:600}
.cbtn{margin-top:14px;font-size:15px;padding:10px 28px}
.pens{position:absolute;top:14px;right:14px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ptog{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--glow),var(--gold));border:2px solid #fff;color:#000;font-size:24px;box-shadow:0 6px 18px rgba(245,158,11,.65)}
.rib{background:rgba(15,23,42,.94);border:2px solid var(--gold);border-radius:18px;padding:8px 12px;display:none;flex-wrap:wrap;align-items:center;gap:8px;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.8)}.rib.open{display:flex}
.col{width:26px;height:26px;border-radius:50%;border:2px solid #fff}.col.on{transform:scale(1.22);box-shadow:0 0 10px #fff}
.pb{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 10px;border-radius:6px;font-size:13px;font-weight:700}.pb.on{background:var(--gold);color:#000}
select.pb{background:#1e293b}
.done-row{text-align:center;padding:14px;background:rgba(11,19,41,.9)}
/* popups */
#pop{display:none;position:fixed;bottom:24px;left:20px;background:rgba(15,23,42,.96);border:2px solid var(--glow);border-radius:20px;padding:14px 18px;z-index:100000;align-items:center;gap:14px;max-width:360px;color:#fef08a;font-weight:700;font-size:14px}
#pop img{width:58px;height:58px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
#cel{display:none;position:fixed;inset:0;background:rgba(2,6,23,.94);z-index:1000000;align-items:center;justify-content:center;text-align:center;padding:20px}
.celbox{background:linear-gradient(135deg,#0f172a,#1e293b);border:3px solid var(--glow);border-radius:26px;padding:32px 26px;max-width:460px;box-shadow:0 0 50px rgba(245,158,11,.6);display:flex;flex-direction:column;align-items:center}
.celbox img{width:140px;height:140px;object-fit:contain}
@media (prefers-reduced-motion:reduce){#moon.on{animation:none}}
</style>
</head>
<body>
<div id="dim"></div><canvas id="fx"></canvas>
<img id="moon" src="assets/humayun-scholar.webp" alt="">
<header class="bar" id="bar">
 <div class="bc">
  <a class="ib" href="index.html" title="All subjects"><img src="assets/islamic-banner-arch.webp" alt=""><span>Hub</span></a>
  <button class="ib c" id="home" title="Oasis lessons">🏠</button>
  <span class="bc" id="jumps"></span>
  <div class="seg" role="group" aria-label="Mode"><button id="mP" class="on" title="Practice: answers shown">📘<span>Practice</span></button><button id="mW" title="Write: answers hidden, check your own">✍️<span>Write</span></button></div>
  <button class="ib c on" id="snd" title="Sound">🔊</button>
  <label class="dimbox" title="Night dimmer"><img src="assets/badge-crescent-star.webp" alt=""><input type="range" id="dimR" min="0" max="0.5" step="0.01" value="0"></label>
 </div>
 <button class="ib c" id="min" title="Minimize or expand">🔼</button>
</header>

<main id="hub">
 <div class="title"><h1>Humayun's Islamiyath Journey</h1><p>Class 3 • Units 2, 5 &amp; 10 | Swipe the lantern cards to choose a lesson</p></div>
 <div class="stage" id="stage"><div class="track" id="track"></div></div>
 <div class="arrows"><button class="arrow" onclick="rot(-1)" aria-label="Previous">◀</button><button class="arrow" onclick="rot(1)" aria-label="Next">▶</button></div>
</main>

<section id="ws"><div class="wrap">
 <div class="prompt">
  <div class="qcard">
   <div class="qhead"><div class="qlabel" id="qlabel"></div><button class="gold" id="bind" onclick="toggleCover()"></button></div>
   <div class="qtext" id="qtext"></div>
  </div>
  <div class="acard" id="acard"><div id="atext"></div>
   <div id="p1" class="mini" style="display:none"><div style="font-size:14px;font-weight:700;color:var(--glow);margin-bottom:8px">Arrange in order: the 6 articles of faith</div><div id="bank"></div><div class="slots" id="slots"></div></div>
   <div id="p4" style="display:none"></div>
  </div>
 </div>
 <div class="bench">
  <div class="spine"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="vp" id="vp">
   <canvas id="ink"></canvas>
   <img class="pal" src="assets/humayun-scholar.webp" alt="">
   <div id="cover" onclick="openCover()">
    <div class="arch"><img class="bg" src="assets/islamic-banner-arch.webp" alt=""><img class="me" src="assets/humayun-scholar.webp" alt=""></div>
    <div class="ctitle">Humayun's Writing Canvas</div><div class="csub">Class 3 • Islamiyath Notebook</div>
    <button class="gold cbtn" onclick="openCover();event.stopPropagation()">📖 Flip open to write</button>
   </div>
   <div class="pens">
    <button class="ptog" onclick="$('rib').classList.toggle('open')" title="Writing tools" aria-label="Writing tools">✏️</button>
    <div class="rib" id="rib">
     <span id="cols"></span>
     <button class="pb" id="tHl" onclick="setTool('hl')">🖍️ High</button>
     <button class="pb" id="tEr" onclick="setTool('eraser')">🧹 Erase</button>
     <select class="pb" onchange="size=+this.value"><option value="3">Fine</option><option value="6" selected>Medium</option><option value="12">Bold</option></select>
     <button class="pb" onclick="undo()" title="Undo">↩️</button><button class="pb" onclick="clearInk()" title="Clear">🗑️</button>
    </div>
   </div>
  </div>
 </div>
 <div class="done-row"><button class="go" onclick="markDone(cur)">✔ Mark lesson done</button></div>
</div></section>

<div id="pop"><img src="assets/humayun-scholar.webp" alt=""><div id="popt"></div></div>
<div id="cel"><div class="celbox"><img src="assets/badge-crescent-star.webp" alt=""><div style="font-size:26px;font-weight:800;color:var(--glow);margin-top:14px">MashaAllah!</div><p style="color:#cbd5e1;font-size:16px;margin:12px 0 20px;line-height:1.5">Humayun has completed all Islamiyath lessons with excellence!</p><button class="go" onclick="closeCel()">🌟 Return to Oasis</button></div></div>

<script>
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===== DATA ===== */
const ST=[
 {id:1,title:'Articles of Faith',tag:'Unit 2 & 10 • Articles of faith',q:'What are the articles of faith?',
  pillars:['Believe in Allah (SWT)','His angels','His books','His messengers','The Day of Resurrection','Destiny (Whatever Allah has ordained)']},
 {id:2,title:'Sayyidah Khadijah (RA)',tag:'Unit 2 • Lady of Makkah',q:'Who was Khadijah (RA) and what was her honor in Islam?',
  a:'Khadijah (RA) was a noble, kind, wealthy lady of Makkah. She was the wife of Prophet Muhammad (SAW). Khadijah (RA) was the first woman to accept Islam.'},
 {id:3,title:'Cleanliness & Bathing',tag:'Unit 5 • Health & Sunnah',q:'Why is bathing daily a good practice?',
  a:'Taking bath daily is a good practice. It makes a person clean and healthy.'},
 {id:4,title:'Dua for Garment',tag:'Unit 5 • Abu Dawood',q:'Fill in the blanks with the Hadith on wearing a garment:',
  words:['garment','clothes','without','power','ability','forgiven']}];
const S4=["<strong>Allah's messenger (SAW) said:</strong> He who puts on a ",0," and says: Praise be to Allah, who ",1," me with this and who provides me with it ",2," any ",3," or ",4," from me, his past and present sins are ",5," for him. (Abu Dawood)"];
const SYL={resurrection:['Re','sur','rec','tion'],messengers:['Mes','sen','gers'],ordained:['Or','dained'],destiny:['Des','ti','ny'],khadijah:['Kha','di','jah'],makkah:['Mak','kah'],cleanliness:['Clean','li','ness'],practice:['Prac','tice'],garment:['Gar','ment'],ability:['A','bil','i','ty'],forgiven:['For','giv','en'],healthy:['Health','y']};
const stById=id=>ST.find(s=>s.id===id);
const answerHTML=id=>{const d=stById(id);return id===1?`<div>The articles of faith are:</div><ol>${d.pillars.map(p=>`<li>${p}</li>`).join('')}</ol>`:id===4?`<div>The missing words are:</div><ol>${d.words.map(w=>`<li>${w}</li>`).join('')}</ol>`:d.a};

/* ===== STATE ===== */
let cur=1,idx=0,write=false,sound=true,done=(()=>{try{return new Set(JSON.parse(store.get('isl::done')||'[]'))}catch(e){return new Set()}})();
const save=()=>store.set('isl::done',JSON.stringify([...done]));

/* ===== AUDIO (pen + eraser noise, one loop at a time) ===== */
let actx=null,nbuf=null,node=null;
function audio(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx}
function noise(kind){if(!sound)return;stop();try{const c=audio(),er=kind==='eraser';
 if(!nbuf){nbuf=c.createBuffer(1,c.sampleRate*2,c.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 const s=c.createBufferSource();s.buffer=nbuf;s.loop=true;const f=c.createBiquadFilter(),g=c.createGain();
 f.type=er?'lowpass':'bandpass';f.frequency.value=er?400:2400;f.Q.value=.9;g.gain.value=er?.09:.04;
 s.connect(f);f.connect(g);g.connect(c.destination);s.start();node={s,g}}catch(e){}}
function stop(){const n=node;node=null;if(!n)return;try{const t=audio().currentTime;n.g.gain.setTargetAtTime(0,t,.03);n.s.stop(t+.12)}catch(e){}}

/* ===== SHOOTING STARS ===== */
const fx=$('fx'),fc=fx.getContext('2d');let stars=[],raf=0;
function fxSize(){fx.width=innerWidth;fx.height=innerHeight}addEventListener('resize',fxSize);fxSize();
function showStars(){if(RM)return;stars=Array.from({length:6},()=>({x:Math.random()*fx.width*.8,y:Math.random()*fx.height*.35,l:120+Math.random()*100,v:12+Math.random()*9,a:1,d:.012+Math.random()*.01}));if(!raf)loop()}
function loop(){fc.clearRect(0,0,fx.width,fx.height);let on=0;
 stars.forEach(s=>{if(s.a<=0)return;on=1;const ex=s.x-Math.cos(.785)*s.l,ey=s.y-Math.sin(.785)*s.l,g=fc.createLinearGradient(s.x,s.y,ex,ey);
  g.addColorStop(0,`rgba(255,255,255,${s.a})`);g.addColorStop(1,'rgba(251,191,36,0)');fc.strokeStyle=g;fc.lineWidth=2.5;fc.beginPath();fc.moveTo(s.x,s.y);fc.lineTo(ex,ey);fc.stroke();
  s.x+=Math.cos(.785)*s.v;s.y+=Math.sin(.785)*s.v;s.a-=s.d});
 raf=on?requestAnimationFrame(loop):0}

/* ===== SPEECH + SYLLABLES ===== */
const HON={SWT:"Subhanahu wa Ta'ala",SAW:'sallallahu alayhi wasallam',RA:'radi Allahu anha'};
const sayable=t=>/^\(.*\)\W*$/.test(t.trim())&&HON[t.replace(/[^A-Za-z]/g,'').toUpperCase()]||t;
function speak(t,pitch=1,rate=.9){if(!sound||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(sayable(t));u.pitch=pitch;u.rate=rate;u.lang='en-IN';speechSynthesis.speak(u)}
let held=false,lp=null;
function wordSpan(w){const k=w.toLowerCase().replace(/[^a-z]/g,''),s=document.createElement('span');s.className='sw';s.textContent=w+' ';
 s.addEventListener('click',e=>{e.stopPropagation();if(held){held=false;return}speak(w)});
 s.addEventListener('pointerdown',()=>{held=false;if(!SYL[k])return;clearTimeout(lp);lp=setTimeout(()=>{held=true;split(s,k)},450)});
 ['pointerup','pointercancel','pointerleave'].forEach(n=>s.addEventListener(n,()=>clearTimeout(lp)));return s}
function split(el,k){const p=SYL[k];el.innerHTML='';p.forEach((x,i)=>{const s=document.createElement('span');s.className='sy s'+((i%4)+1);s.textContent=x+(i<p.length-1?'·':' ');el.appendChild(s)});speak(p.join(' '),.7,.75)}
function words(box,text){box.innerHTML='';text.split(/\s+/).forEach(w=>box.appendChild(wordSpan(w)))}
function wrapWords(root){const wk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false),ns=[];while(wk.nextNode())ns.push(wk.currentNode);
 ns.forEach(n=>{if(!n.nodeValue.trim()||n.parentElement.closest('.blank,button'))return;const fr=document.createDocumentFragment();
  n.nodeValue.split(/(\s+)/).forEach(p=>fr.appendChild(p.trim()?wordSpan(p):document.createTextNode(p)));n.parentNode.replaceChild(fr,n)})}

/* ===== HEADER ===== */
$('jumps').innerHTML=ST.map(s=>`<button class="ib c" data-j="${s.id}" title="Station ${s.id}: ${s.title}"><img src="assets/lantern-gem.webp" alt=""><b class="jn">${s.id}</b></button>`).join('');
$('jumps').onclick=e=>{const b=e.target.closest('[data-j]');if(b)openStation(+b.dataset.j)};
$('home').onclick=()=>{saveInk();$('moon').classList.remove('on');$('ws').style.display='none';$('hub').style.display='flex';place()};
$('dimR').oninput=e=>{$('dim').style.opacity=e.target.value;store.set('isl::dim',e.target.value)};
$('dimR').value=store.get('isl::dim')||0;$('dim').style.opacity=$('dimR').value;
$('min').onclick=()=>{const m=$('bar').classList.toggle('min');$('min').textContent=m?'🔽':'🔼'};
$('snd').onclick=()=>{sound=!sound;$('snd').classList.toggle('on',sound);$('snd').textContent=sound?'🔊':'🔇';if(!sound){stop();speechSynthesis&&speechSynthesis.cancel()}};
$('mP').onclick=()=>setMode(false);$('mW').onclick=()=>setMode(true);
function setMode(w){write=w;$('mP').classList.toggle('on',!w);$('mW').classList.toggle('on',w);store.set('isl::mode',w?'w':'p');if($('ws').style.display==='block')body()}

/* ===== CAROUSEL ===== */
$('track').innerHTML=ST.map((s,i)=>`<div class="card" id="c${i}" onclick="cardTap(${i})"><img class="lan" src="assets/lantern-gem.webp" alt=""><div><div class="ct">${s.title}</div><div class="tag">${s.tag}</div></div><button class="go" onclick="openStation(${s.id});event.stopPropagation()">Start Quest</button></div>`).join('');
function syncLanterns(){document.querySelectorAll('#jumps [data-j]').forEach(b=>{const n=+b.dataset.j;b.classList.toggle('dn',done.has(n));b.classList.toggle('on',$('ws').style.display==='block'&&n===cur)})}
function place(){syncLanterns();$('track').style.transform=`rotateY(${-idx*90}deg)`;const n=((idx%4)+4)%4;
 ST.forEach((s,i)=>{const c=$('c'+i);c.style.transform=`rotateY(${i*90}deg) translateZ(250px)`;c.classList.toggle('act',i===n);c.classList.toggle('done',done.has(s.id))})}
function rot(d){idx+=d;place()}
function cardTap(i){const n=((idx%4)+4)%4;if(i===n)openStation(i+1);else{idx+=i-n;place()}}
let sx=0;$('stage').addEventListener('pointerdown',e=>sx=e.clientX);
$('stage').addEventListener('pointerup',e=>{const d=e.clientX-sx;if(Math.abs(d)>40)rot(d>0?-1:1)});

/* ===== STATIONS ===== */
function openStation(id){saveInk();cur=id;const d=stById(id);setTimeout(syncLanterns,0);
 $('hub').style.display='none';$('ws').style.display='block';$('ws').scrollTop=0;
 $('moon').classList.add('on');showStars();
 $('qlabel').textContent='STATION '+id+': '+d.title.toUpperCase();words($('qtext'),d.q);
 closeCover();body();resizeInk()}
function body(){const id=cur,a=$('atext');
 a.innerHTML='';$('p1').style.display='none';$('p4').style.display='none';$('acard').style.display='block';
 if(id===4){$('p4').style.display='block';buildS4()}
 if(write){a.innerHTML=`<button class="go" onclick="$('chk').style.display='block';this.remove()">🔍 Check my answer</button><div id="chk" style="display:none"><div>${answerHTML(id)}</div><div style="display:flex;gap:10px;margin-top:10px"><button class="go" onclick="markDone(${id})">✔ I got it right</button><button class="pb" onclick="body()">✘ Practise again</button></div></div>`}
 else if(id===1){$('p1').style.display='block';pillars();a.innerHTML=`<button class="pb" onclick="this.nextElementSibling.innerHTML=answerHTML(1);wrapWords(this.nextElementSibling);this.remove()">💡 Show answer</button><div></div>`}
 else if(id!==4){words(a,answerHTML(id))}}
function markDone(id){const had=done.size===ST.length;done.add(id);save();place();syncLanterns();
 if(done.size===ST.length&&!had)setTimeout(()=>$('cel').style.display='flex',1000);else pop('MashaAllah, Humayun!')}
let popT=0;function pop(t){$('popt').textContent=t;$('pop').style.display='flex';speak(t);clearTimeout(popT);popT=setTimeout(()=>$('pop').style.display='none',3400)}
function closeCel(){$('cel').style.display='none';$('home').click()}

/* Station 1: put the six articles in order. Tap a placed card to take it back. */
let up=[];
function pillars(){const P=stById(1).pillars,order=shuf(P,true);up=Array(6).fill(null);
 const draw=()=>{const used=new Set(up.filter(Boolean));$('bank').innerHTML='';$('slots').innerHTML='';
  order.filter(p=>!used.has(p)).forEach(p=>{const c=document.createElement('span');c.className='chip';c.textContent=p;
   c.onclick=()=>{const i=up.indexOf(null);if(i<0)return;up[i]=p;draw();if(up.every((v,j)=>v===P[j]))markDone(1)};$('bank').appendChild(c)});
  up.forEach((p,i)=>{const s=document.createElement('div');s.className='slot'+(p===P[i]?' ok':p?' bad':'');s.innerHTML=`<strong>${i+1}.</strong> <span>${p||'[Tap a card to place]'}</span>`;
   if(p)s.onclick=()=>{up[i]=null;draw()};$('slots').appendChild(s)})};draw()}

/* Station 4: Practice = tap a numbered blank, then the word that fits. Write = write the words in the notebook. */
function shuf(a,notSame){let r;do{r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}}while(notSame&&r.every((v,i)=>v===a[i]));return r}
let s4={sel:0,placed:new Set(),order:[]};
function buildS4(){const W=stById(4).words;s4={sel:0,placed:new Set(),order:shuf(W)};
 const t=S4.map(p=>typeof p==='string'?p:write?`<span class="blank wb" id="b${p}">${p+1}</span>`:`<span class="blank" id="b${p}" onclick="pick(${p})">${p+1}</span>`).join('');
 $('p4').innerHTML=`<div class="v4" id="v4">${t}</div>`+(write?`<p style="margin-top:10px;color:#cbd5e1">✍️ Write the 6 missing words in your notebook. Number them 1 to 6.</p>`:`<div id="s4b" style="margin-top:12px"></div>`);
 wrapWords($('v4'));if(!write){bank4();pick(0)}}
function pick(k){if(s4.placed.has(stById(4).words[k]))return;s4.sel=k;document.querySelectorAll('.blank').forEach(e=>e.classList.remove('sel'));$('b'+k).classList.add('sel')}
function bank4(){$('s4b').innerHTML=s4.order.filter(w=>!s4.placed.has(w)).map(w=>`<span class="chip" onclick="place4('${w}')">${w}</span>`).join('')}
function place4(w){const W=stById(4).words,sl=$('b'+s4.sel);
 if(W[s4.sel]!==w){sl.classList.add('shake');setTimeout(()=>sl.classList.remove('shake'),400);speak('Try again');return}
 sl.textContent=w;sl.classList.remove('sel');sl.classList.add('fill');s4.placed.add(w);speak(w);bank4();
 const n=W.findIndex(x=>!s4.placed.has(x));if(n<0)markDone(4);else pick(n)}

/* ===== NOTEBOOK COVER ===== */
const cover=$('cover');
function openCover(){cover.classList.add('open');$('bind').textContent='📕 Close binder'}
function closeCover(){cover.classList.remove('open');$('bind').textContent='📖 Open binder'}
function toggleCover(){cover.classList.contains('open')?closeCover():openCover()}

/* ===== INK ===== */
const cv=$('ink'),ctx=cv.getContext('2d'),DPR=Math.min(devicePixelRatio||1,2),KEY='isl::ink::',cache={};
let color='#0f172a',size=6,tool='pen',stroke=null,ustack=[],penSeen=0,inkFor=null,dirty=false;
const COLS=['#0f172a','#1d4ed8','#059669','#d97706'];
$('cols').innerHTML=COLS.map((c,i)=>`<button class="col ${i?'':'on'}" style="background:${c}" data-c="${c}" aria-label="Ink colour"></button>`).join('');
$('cols').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;color=b.dataset.c;setTool('pen');document.querySelectorAll('.col').forEach(x=>x.classList.toggle('on',x===b))};
function setTool(t){tool=t;$('tHl').classList.toggle('on',t==='hl');$('tEr').classList.toggle('on',t==='eraser');if(t==='hl')color='#fde047'}
function wipe(){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore()}
function saveInk(){if(cv.width<2||inkFor===null||!dirty)return;try{const d=cv.toDataURL('image/webp',.7);cache[inkFor]=d;store.set(KEY+inkFor,d);dirty=false}catch(e){}}
function loadInk(id){wipe();inkFor=id;dirty=false;const d=cache[id]||store.get(KEY+id);if(!d)return;const im=new Image();
 im.onload=()=>{if(inkFor!==id)return;const k=Math.min(cv.width/im.width,cv.height/im.height);ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.drawImage(im,0,0,im.width*k,im.height*k);ctx.restore()};im.src=d}
function resizeInk(){const v=$('vp'),w=v.clientWidth,h=v.clientHeight;if(w<2||h<2)return;saveInk();cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);ustack=[];loadInk(cur)}
addEventListener('resize',resizeInk);
document.addEventListener('pointerdown',e=>{if(e.pointerType==='pen')penSeen=performance.now()},true);
const palm=e=>e.pointerType==='touch'&&(performance.now()-penSeen<1800||Math.max(e.width||0,e.height||0)>34);
const pt=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure>0?e.pressure:.5}};
function snap(){ustack.push(ctx.getImageData(0,0,cv.width,cv.height));if(ustack.length>8)ustack.shift();return ustack[ustack.length-1]}
let fp=null;
function beginStroke(e){const p=pt(e);stroke={id:e.pointerId,pts:[p],last:p,base:snap()};noise(tool==='eraser'?'eraser':'pen')}
cv.addEventListener('pointerdown',e=>{if(!cover.classList.contains('open')||stroke||fp||palm(e))return;e.preventDefault();
 try{cv.setPointerCapture(e.pointerId)}catch(_){}
 if(e.pointerType==='touch')fp={id:e.pointerId,x:e.clientX,y:e.clientY,my:e.clientY,mode:null,ev:e};else beginStroke(e)});
function fingerMove(e){if(!fp||e.pointerId!==fp.id)return false;
 if(!fp.mode){const dx=e.clientX-fp.x,dy=e.clientY-fp.y;if(Math.hypot(dx,dy)<8)return true;const ws=$('ws');
  if(Math.abs(dy)>Math.abs(dx)*1.2&&ws.scrollHeight>ws.clientHeight+2){fp.mode='scroll';fp.my=e.clientY}else{fp.mode='draw';beginStroke(fp.ev);fp=Object.assign(fp,{});return false}}
 if(fp.mode==='scroll'){$('ws').scrollTop-=e.clientY-fp.my;fp.my=e.clientY;return true}return false}
cv.addEventListener('pointermove',e=>{if(fingerMove(e))return;if(!stroke||e.pointerId!==stroke.id)return;e.preventDefault();
 const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
 for(const v of evs){const p=pt(v);stroke.pts.push(p);ctx.save();ctx.lineCap=ctx.lineJoin='round';
  if(tool==='hl'){ctx.putImageData(stroke.base,0,0);ctx.globalAlpha=.4;ctx.strokeStyle=color;ctx.lineWidth=size*2.5;ctx.beginPath();stroke.pts.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.stroke()}
  else{ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.strokeStyle=color;ctx.lineWidth=tool==='eraser'?size*4+8:size*(p.p*1.4+.4);ctx.beginPath();ctx.moveTo(stroke.last.x,stroke.last.y);ctx.lineTo(p.x,p.y);ctx.stroke()}
  ctx.restore();stroke.last=p}});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cv.addEventListener(n,e=>{if(fp&&e.pointerId===fp.id){const tap=!fp.mode&&n==='pointerup';const ev=fp.ev;fp=null;if(tap){beginStroke(ev);stroke.pts.push(pt(e));stroke=null;stop();ctx.save();ctx.fillStyle=tool==='hl'?'rgba(253,224,71,.4)':color;ctx.beginPath();ctx.arc(pt(e).x,pt(e).y,size/2,0,7);ctx.fill();ctx.restore();dirty=true;saveInk();return}if(!stroke)return}
 if(!stroke||e.pointerId!==stroke.id)return;stroke=null;stop();dirty=true;saveInk()}));
function undo(){const s=ustack.pop();if(!s)return;ctx.putImageData(s,0,0);dirty=true;saveInk()}
function clearInk(){snap();wipe();dirty=true;saveInk();noise('eraser');setTimeout(stop,250)}
addEventListener('pagehide',saveInk);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveInk()});

/* ===== START ===== */
if(store.get('isl::mode')==='w')setMode(true);
place();
</script>
</body>
